/* =========================================================
   NORMALIZATION
   ========================================================= */

function N(value){

    return String(value??'')
        .toLowerCase()

        .replace(/doesn['’]?t\b/g,'does not')
        .replace(/doesnt\b/g,'does not')
        .replace(/isn['’]?t\b/g,'is not')
        .replace(/isnt\b/g,'is not')
        .replace(/aren['’]?t\b/g,'are not')
        .replace(/arent\b/g,'are not')
        .replace(/wasn['’]?t\b/g,'was not')
        .replace(/wasnt\b/g,'was not')
        .replace(/weren['’]?t\b/g,'were not')
        .replace(/werent\b/g,'were not')
        .replace(/won['’]?t\b/g,'will not')
        .replace(/wont\b/g,'will not')
        .replace(/can['’]?t\b/g,'cannot')
        .replace(/cant\b/g,'cannot')
        .replace(/couldn['’]?t\b/g,'could not')
        .replace(/couldnt\b/g,'could not')
        .replace(/wouldn['’]?t\b/g,'would not')
        .replace(/wouldnt\b/g,'would not')
        .replace(/shouldn['’]?t\b/g,'should not')
        .replace(/shouldnt\b/g,'should not')
        .replace(/didn['’]?t\b/g,'did not')
        .replace(/didnt\b/g,'did not')
        .replace(/don['’]?t\b/g,'do not')
        .replace(/dont\b/g,'do not')
        .replace(/ain['’]?t\b/g,'is not')

        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')

        .replace(/[^a-z0-9\u00c0-\u024f]+/gi,' ')
        .replace(/\s+/g,' ')
        .trim();
}


/* =========================================================
   TEXT HELPERS
   ========================================================= */

function localizedValue(value){

    if(value==null) return '';

    if(typeof value==='string'){
        return value;
    }

    if(typeof value==='number' || typeof value==='boolean'){
        return String(value);
    }

    if(Array.isArray(value)){
        return value
            .map(localizedValue)
            .filter(Boolean)
            .join(', ');
    }

    if(typeof value==='object'){

        const selected =
            value[L] ??
            value.en ??
            value.ro ??
            value.de ??
            value.fr ??
            value.es ??
            value.it ??
            value.nl;

        if(selected!=null){

            if(Array.isArray(selected)){
                return selected
                    .map(localizedValue)
                    .filter(Boolean)
                    .join(', ');
            }

            if(typeof selected==='object'){
                return localizedValue(selected);
            }

            return String(selected);
        }

        for(const v of Object.values(value)){

            const result=localizedValue(v);

            if(result) return result;
        }
    }

    return String(value);
}


function valueArray(value){

    if(value==null) return [];

    if(Array.isArray(value)){
        return value
            .map(localizedValue)
            .filter(Boolean);
    }

    if(typeof value==='object'){

        const selected =
            value[L] ??
            value.en ??
            value.ro ??
            value.de ??
            value.fr ??
            value.es ??
            value.it ??
            value.nl;

        return valueArray(selected);
    }

    return [String(value)];
}


function words(text){

    return new Set(
        N(text)
            .split(' ')
            .filter(w=>w.length>1)
    );
}


function cleanText(value){

    if(value==null) return '';

    if(Array.isArray(value)){
        return value.map(cleanText).filter(Boolean).join(' ');
    }

    if(typeof value==='object'){
        return Object.values(value)
            .map(cleanText)
            .filter(Boolean)
            .join(' ');
    }

    return String(value);
}

/* =========================================================
   CONCEPT DETECTION
   ========================================================= */

function phraseMatch(text,phrase){

    const t=N(text);
    const p=N(phrase);

    if(!p) return false;

    if(t.includes(p)) return true;

    const pw=p.split(' ');

    if(pw.length===1){

        return t
            .split(' ')
            .some(w=>{
                if(w===p) return true;

                if(p.length>=5 &&
                   w.length>=5 &&
                   (
                       w.startsWith(p.slice(0,5)) ||
                       p.startsWith(w.slice(0,5))
                   )
                ){
                    return true;
                }

                return false;
            });
    }

    return false;
}


function concepts(text){

    const n=N(text);
    const result=[];

    for(const [concept,aliases] of Object.entries(A)){

        if(
            aliases.some(alias=>
                phraseMatch(n,alias)
            )
        ){
            result.push(concept);
        }
    }

    /* Generic semantic concepts not represented in A */

    for(const [concept,aliases] of Object.entries(SEM)){

        if(
            aliases.some(alias=>
                phraseMatch(n,alias)
            )
        ){
            if(!result.includes(concept)){
                result.push(concept);
            }
        }
    }

    return [...new Set(result)];
}


function expanded(list){

    const out=new Set(list);

    for(const c of list){

        for(const related of E[c]||[]){
            out.add(related);
        }
    }

    return [...out];
}


/* =========================================================
   WORD SIMILARITY
   ========================================================= */

function lexicalSimilarity(input,text){

    const a=words(input);
    const b=words(text);

    if(!a.size || !b.size) return 0;

    let hit=0;

    for(const w of a){

        if(w.length<3) continue;

        if(b.has(w)){
            hit++;
            continue;
        }

        if(w.length>=6){

            let matched=false;

            for(const x of b){

                if(x.length<6) continue;

                const min=Math.min(w.length,x.length);

                if(
                    min>=6 &&
                    (
                        w.slice(0,6)===x.slice(0,6) ||
                        w.slice(0,7)===x.slice(0,7)
                    )
                ){
                    hit+=.65;
                    matched=true;
                    break;
                }
            }

            if(matched) continue;
        }
    }

    return Math.min(1,hit/a.size);
}

function diagnosticText(r){

    const fields=[
        r.id,
        r.category,
        r.system,
        r.subsystem,
        r.title,
        r.name,
        r.description,
        r.problem,
        r.symptom,
        r.symptoms,
        r.keywords,
        r.possible_causes,
        r.causes,
        r.diagnostic_steps,
        r.steps,
        r.related_dtcs,
        r.dtcs,
        r.conditions,
        r.notes,
        r.references
    ];

    return cleanText(fields);
}


/* =========================================================
   CONTEXT
   ========================================================= */

function contextBoost(q,r){

    const n=N(q);
    const text=N(diagnosticText(r));

    let boost=0;

    if(
        phraseMatch(n,'low rpm') &&
        (
            text.includes('low rpm') ||
            text.includes('low rev') ||
            text.includes('low speed')
        )
    ){
        boost+=12;
    }

    if(
        phraseMatch(n,'when accelerating') &&
        (
            text.includes('accelerat') ||
            text.includes('throttle')
        )
    ){
        boost+=10;
    }

    if(
        phraseMatch(n,'when hot') &&
        (
            text.includes('hot') ||
            text.includes('warm')
        )
    ){
        boost+=10;
    }

    if(
        phraseMatch(n,'when cold') &&
        (
            text.includes('cold') ||
            text.includes('start')
        )
    ){
        boost+=10;
    }

    if(
        phraseMatch(n,'at idle') &&
        (
            text.includes('idle') ||
            text.includes('ralanti')
        )
    ){
        boost+=10;
    }

    return boost;
}


/* =========================================================
   DTC MATCH
   ========================================================= */

function extractDTCs(q){

    return [
        ...new Set(
            N(q)
                .toUpperCase()
                .match(
                    /\b(?:P|B|C|U)[0-9]{4}\b/g
                )||[]
        )
    ];
}


function dtcBoost(q,r){

    const input=extractDTCs(q);

    if(!input.length) return 0;

    const text=cleanText([
        r.id,
        r.related_dtcs,
        r.dtcs,
        r.dtc,
        r.codes
    ]).toUpperCase();

    let boost=0;

    for(const code of input){

        if(text.includes(code)){
            boost+=70;
        }
    }

    return boost;
}


/* =========================================================
   SCORING
   ========================================================= */

function score(r,conceptList,q){

    const text=diagnosticText(r);

    const n=N(text);

    let s=0;

    const expandedConcepts=expanded(conceptList);

    for(const c of expandedConcepts){

        const aliases=
            A[c] ||
            SEM[c] ||
            [];

        if(
            aliases.some(alias=>
                phraseMatch(n,alias)
            )
        ){
            s+=W[c]||12;
        }
    }

    const lexical=lexicalSimilarity(q,text);

    s+=lexical*45;

    s+=contextBoost(q,r);

    s+=dtcBoost(q,r);

    /*
     * Exact phrase bonus.
     */

    const qn=N(q);

    if(qn.length>5 && n.includes(qn)){
        s+=45;
    }

    /*
     * Individual meaningful words.
     */

    const qwords=
        [...words(q)]
            .filter(w=>w.length>=5);

    let wordHits=0;

    for(const w of qwords){

        if(n.includes(` ${w} `)){
            wordHits++;
        }
    }

    s+=Math.min(20,wordHits*3);

    return Math.round(s);
}


/* =========================================================
   VEHICLE MATCHING
   ========================================================= */

function idValue(value){

    if(value==null) return '';

    if(typeof value==='string'){
        return value;
    }

    if(typeof value==='object'){

        return String(
            value.id ??
            value.name ??
            ''
        );
    }

    return String(value);
}


function matchesValue(selected,value){

    if(value==null) return true;

    if(value==='all') return true;

    if(Array.isArray(value)){

        if(!value.length) return true;

        return value.some(x=>
            N(idValue(x))===N(selected.id) ||
            N(idValue(x))===N(selected.name)
        );
    }

    return (
        N(idValue(value))===N(selected.id) ||
        N(idValue(value))===N(selected.name)
    );
}


function vehicleMatch(r,v){

    const x=
        r.vehicle &&
        typeof r.vehicle==='object'
            ? r.vehicle
            : r;

    return (

        matchesValue(
            v.m,
            x.models
        )

        &&

        matchesValue(
            v.g,
            x.generations
        )

        &&

        matchesValue(
            v.e,
            x.engines
        )
    );
}


/* =========================================================
   TITLES
   ========================================================= */

function title(r){

    const value=

        localizedValue(r.title) ||

        localizedValue(r.name) ||

        localizedValue(r.description) ||

        localizedValue(r.symptom) ||

        localizedValue(r.problem) ||

        localizedValue(r.issue);

    if(value) return value;

    if(r.id){

        return String(r.id)
            .replace(/^ford_/i,'')
            .replace(/[_-]+/g,' ')
            .replace(/\s+/g,' ')
            .trim()
            .replace(/\b\w/g,c=>c.toUpperCase());
    }

    return 'Diagnostic information';
}


/* =========================================================
   YAML
   ========================================================= */

async function yaml(path){

    const response=await fetch(
        path,
        {
            cache:'no-store',
            headers:{
                Accept:
                    'text/yaml,text/plain,application/x-yaml,*/*'
            }
        }
    );

    if(!response.ok){
        throw new Error(
            `${path}: HTTP ${response.status}`
        );
    }

    const text=await response.text();

    return jsyaml.load(text);
}

function manufacturerName(m){

    return localizedValue(
        m.name
    ) || m.id;
}


function resetSelect(id,placeholder,disabled=true){

    const el=$(id);

    el.innerHTML='';

    const option=
        document.createElement('option');

    option.value='';
    option.textContent=placeholder;

    el.appendChild(option);

    el.disabled=disabled;
}


function option(id,name){

    const o=
        document.createElement('option');

    o.value=id;
    o.textContent=name;

    return o;
}


function setVehicle(){

    const m=
        makers.find(
            x=>x.id===$('make').value
        );

    if(!m){

        $('vehicle').hidden=true;
        return;
    }

    const model=
        (vehicles?.models||[])
            .find(
                x=>x.id===$('model').value
            );

    const generation=
        model?.generations
            ?.find(
                x=>x.id===$('generation').value
            );

    const engine=
        generation?.engines
            ?.find(
                x=>String(x.id)===$('engine').value
            );

    if(!model || !generation || !engine){
        $('vehicle').hidden=true;
        return;
    }

    $('vehicle').hidden=false;

    $('vehicle').textContent=
        `${I[L].vehicle}: `+
        `${manufacturerName(m)} · `+
        `${localizedValue(model.name)} · `+
        `${localizedValue(generation.name)} · `+
        `${localizedValue(engine.name)}`;
}


function updateFind(){

    $('find').disabled=!(
        $('make').value &&
        $('model').value &&
        $('generation').value &&
        $('engine').value
    );
}


function loadModels(){

    const modelSelect=$('model');

    resetSelect(
        'model',
        I[L].smod,
        true
    );

    resetSelect(
        'generation',
        I[L].sg,
        true
    );

    resetSelect(
        'year',
        I[L].sy,
        true
    );

    resetSelect(
        'engine',
        I[L].se,
        true
    );

    const makeId=$('make').value;

    currentManufacturer=
        makers.find(
            x=>x.id===makeId
        )||null;

    if(!currentManufacturer) return;

    const list=
        Array.isArray(vehicles?.models)
            ? vehicles.models
            : [];

    for(const model of list){

        modelSelect.appendChild(
            option(
                model.id,
                localizedValue(model.name)||model.id
            )
        );
    }

    modelSelect.disabled=!list.length;

    setVehicle();
    updateFind();
}


function loadGenerations(){

    resetSelect(
        'generation',
        I[L].sg,
        true
    );

    resetSelect(
        'year',
        I[L].sy,
        true
    );

    resetSelect(
        'engine',
        I[L].se,
        true
    );

    const model=
        (vehicles?.models||[])
            .find(
                x=>x.id===$('model').value
            );

    const generations=
        Array.isArray(model?.generations)
            ? model.generations
            : [];

    for(const generation of generations){

        $('generation').appendChild(
            option(
                generation.id,
                localizedValue(generation.name)||
                generation.id
            )
        );
    }

    $('generation').disabled=
        !generations.length;

    setVehicle();
    updateFind();
}


function loadYearsAndEngines(){

    resetSelect(
        'year',
        I[L].sy,
        true
    );

    resetSelect(
        'engine',
        I[L].se,
        true
    );

    const model=
        (vehicles?.models||[])
            .find(
                x=>x.id===$('model').value
            );

    const generation=
        model?.generations
            ?.find(
                x=>x.id===$('generation').value
            );

    if(!generation){
        updateFind();
        return;
    }

    const from=
        Number(generation.production?.from);

    const to=
        Number(generation.production?.to);

    if(
        Number.isFinite(from) &&
        Number.isFinite(to)
    ){

        for(let y=from;y<=to;y++){

            $('year').appendChild(
                option(
                    String(y),
                    String(y)
                )
            );
        }

        $('year').disabled=false;
    }

    const engines=
        Array.isArray(generation.engines)
            ? generation.engines
            : [];

    for(const engine of engines){

        let name=
            localizedValue(engine.name)||
            engine.id;

        if(engine.fuel){
            name+=` · ${engine.fuel}`;
        }

        $('engine').appendChild(
            option(
                String(engine.id),
                name
            )
        );
    }

    $('engine').disabled=
        !engines.length;

    setVehicle();
    updateFind();
}

   RENDERING
   ========================================================= */

function renderList(rows){

    $('results').hidden=false;

    $('list').innerHTML='';

    if(!rows.length){

        $('count').textContent='';

        $('list').innerHTML=
            `<div class="empty">${I[L].none}</div>`;

        return;
    }

    $('count').textContent=
        rows.length===1
            ? I[L].one
            : I[L].many.replace(
                '{n}',
                rows.length
            );

    for(const item of rows){

        const r=item.r;

        const card=
            document.createElement('article');

        card.className='card';

        const top=
            document.createElement('div');

        top.className='top';

        const left=
            document.createElement('div');

        const h=
            document.createElement('h3');

        h.className='title';
        h.textContent=title(r);

        left.appendChild(h);

        if(r.system || r.category){

            const system=
                document.createElement('div');

            system.className='system';

            system.textContent=
                [
                    localizedValue(r.system),
                    localizedValue(r.category)
                ]
                .filter(Boolean)
                .join(' · ');

            left.appendChild(system);
        }

        if(
            r.description ||
            r.problem ||
            r.issue
        ){

            const desc=
                document.createElement('p');

            desc.className='desc';

            desc.textContent=
                localizedValue(
                    r.description ||
                    r.problem ||
                    r.issue
                );

            left.appendChild(desc);
        }

        if(r.symptoms){

            const tags=
                document.createElement('div');

            tags.className='tags';

            for(
                const symptom of
                valueArray(r.symptoms).slice(0,12)
            ){

                const tag=
                    document.createElement('span');

                tag.className='tag';
                tag.textContent=symptom;

                tags.appendChild(tag);
            }

            if(tags.children.length){
                left.appendChild(tags);
            }
        }

        const score=
            document.createElement('div');

        score.className='score';

        score.textContent=
            `${I[L].rel}: ${item.s}`;

        top.appendChild(left);
        top.appendChild(score);

        card.appendChild(top);

        const causes=
            valueArray(
                r.possible_causes ??
                r.causes
            );

        if(causes.length){

            card.appendChild(
                section(
                    I[L].causes,
                    causes
                )
            );
        }

        const steps=
            valueArray(
                r.diagnostic_steps ??
                r.steps
            );

        if(steps.length){

            card.appendChild(
                section(
                    I[L].steps,
                    steps
                )
            );
        }

        const dtcs=
            valueArray(
                r.related_dtcs ??
                r.dtcs ??
                r.dtc
            );

        if(dtcs.length){

            card.appendChild(
                section(
                    I[L].dtcs,
                    dtcs
                )
            );
        }

        $('list').appendChild(card);
    }
}


function section(heading,items){

    const div=
        document.createElement('div');

    div.className='section';

    const h=
        document.createElement('h4');

    h.textContent=heading;

    const ul=
        document.createElement('ul');

    for(const item of items){

        const li=
            document.createElement('li');

        li.textContent=item;

        ul.appendChild(li);
    }

    div.appendChild(h);
    div.appendChild(ul);

    return div;
}


/* =========================================================
   SEARCH
   ========================================================= */

async function search(){

    const q=$('problem').value.trim();

    if(
        !$('make').value ||
        !$('model').value ||
        !$('generation').value ||
        !$('engine').value
    ){

        $('status').textContent=
            I[L].complete;

        $('status').className='status error';

        return;
    }

    if(!q){

        $('status').textContent=
            I[L].describe;

        $('status').className='status error';

        return;
    }

    $('status').textContent=
        I[L].search;

    $('status').className='status';

    $('results').hidden=true;

    try{

        await loadTech();

        const model=
            (vehicles?.models||[])
                .find(
                    x=>x.id===$('model').value
                );

        const generation=
            model?.generations
                ?.find(
                    x=>x.id===$('generation').value
                );

        const engine=
            generation?.engines
                ?.find(
                    x=>String(x.id)===$('engine').value
                );

        if(!model || !generation || !engine){

            throw new Error(
                'Vehicle selection is incomplete'
            );
        }

        const v={
            m:{
                id:$('make').value,
                name:currentManufacturer?.name
            },
            g:{
                id:generation.id,
                name:generation.name
            },
            e:{
                id:engine.id,
                name:engine.name
            }
        };

        const p=
            concepts(q);

        const vehicleRows=
            tdb.filter(
                r=>vehicleMatch(r,v)
            );

        /*
         * Important:
         * We DO NOT stop when p is empty.
         * Every vehicle-specific YAML record is still
         * searched lexically.
         */

        let rows=
            vehicleRows
                .map(
                    r=>({
                        r,
                        s:score(r,p,q)
                    })
                )
                .filter(
                    x=>x.s>=6
                )
                .sort(
                    (a,b)=>b.s-a.s
                )
                .slice(0,20);

        /*
         * If there are no strong matches, return the
         * best lexical candidates rather than a dead end.
         */

        if(!rows.length && vehicleRows.length){

            rows=
                vehicleRows
                    .map(
                        r=>({
                            r,
                            s:Math.max(
                                1,
                                Math.round(
                                    lexicalSimilarity(
                                        q,
                                        diagnosticText(r)
                                    )*100
                                )
                            )
                        })
                    )
                    .sort(
                        (a,b)=>b.s-a.s
                    )
                    .slice(0,10);
        }

        renderList(rows);

        $('status').textContent=
            I[L].ready;

        $('status').className=
            'status success';

    }catch(error){

        console.error(error);

        $('status').textContent=
            I[L].error;

        $('status').className=
            'status error';

        $('results').hidden=false;

        $('count').textContent='';

        $('list').innerHTML=
            `<div class="empty">${I[L].error}</div>`;
    }
}


/* =========================================================
   INITIALIZATION
   ========================================================= */

async function init(){

    $('fy').textContent=
        new Date().getFullYear();

    $('langbtn').addEventListener(
        'click',
        ()=>{
            $('langmenu')
                .classList.toggle('open');
        }
    );

    document
        .querySelectorAll('[data-l]')
        .forEach(el=>{

            el.addEventListener(
                'click',
                ()=>{

                    setLang(
                        el.dataset.l
                    );

                    $('langmenu')
                        .classList.remove('open');
                }
            );
        });

    document.addEventListener(
        'click',
        event=>{

            if(
                !event.target.closest('.langs')
            ){
                $('langmenu')
                    .classList.remove('open');
            }
        }
    );

    $('make').addEventListener(
        'change',
        async ()=>{

            const id=
                $('make').value;

            vehicles=null;

            if(!id){
                updateFind();
                return;
            }

            $('status').textContent=
                I[L].loading;

            try{

                vehicles=
                    await yaml(
                        `data/vehicles/${id}.yaml`
                    );

                loadModels();

                await loadTech();

                $('status').textContent=
                    I[L].ready;

                $('status').className=
                    'status success';

            }catch(error){

                console.error(error);

                $('status').textContent=
                    I[L].error;

                $('status').className=
                    'status error';
            }
        }
    );

    $('model').addEventListener(
        'change',
        loadGenerations
    );

    $('generation').addEventListener(
        'change',
        loadYearsAndEngines
    );

    $('year').addEventListener(
        'change',
        ()=>{
            setVehicle();
            updateFind();
        }
    );

    $('engine').addEventListener(
        'change',
        ()=>{
            setVehicle();
            updateFind();
        }
    );

    $('problem').addEventListener(
        'input',
        ()=>{
            $('results').hidden=true;
        }
    );

    $('find').addEventListener(
        'click',
        search
    );

    try{

        const d=
            await yaml(
                'data/vehicles/manufacturers.yaml'
            );

        if(
            !d ||
            !Array.isArray(
                d.manufacturers
            )
        ){
            throw new Error(
                'Invalid manufacturers database structure'
            );
        }

        makers=
            d.manufacturers.filter(Boolean);

        setLang(L);

        $('status').textContent=
            I[L].ready;

        $('status').className=
            'status success';

    }catch(error){

        console.error(error);

        setLang(L);

        $('status').textContent=
            I[L].error;

        $('status').className=
            'status error';
    }
}


init();

</script>

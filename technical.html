<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoDecode – Repair & Technical</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0f14;
    color: #e8edf3;
}

body {
    min-height: 100vh;
}

header {
    height: 72px;
    background: #111720;
    border-bottom: 1px solid #26303b;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
}

.logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    white-space: nowrap;
}

.logo span {
    color: #4da3ff;
}

.home-link {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 14px;
    padding: 9px 13px;
    border: 1px solid #34404d;
    border-radius: 7px;
    transition: .2s;
}

.home-link:hover {
    color: #fff;
    border-color: #4da3ff;
}

.language-selector {
    margin-left: auto;
    position: relative;
}

.language-button {
    background: #18202a;
    color: #e8edf3;
    border: 1px solid #34404d;
    border-radius: 7px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 14px;
}

.language-menu {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 7px);
    background: #151c25;
    border: 1px solid #34404d;
    border-radius: 8px;
    min-width: 145px;
    overflow: hidden;
    z-index: 1000;
}

.language-menu.active {
    display: block;
}

.language-option {
    padding: 10px 12px;
    cursor: pointer;
    color: #dbe4ee;
    font-size: 14px;
}

.language-option:hover {
    background: #202b37;
}

main {
    width: min(1050px, calc(100% - 32px));
    margin: 0 auto;
    padding: 48px 0 70px;
}

.hero {
    margin-bottom: 34px;
}

.hero h1 {
    margin: 0 0 10px;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.1;
}

.hero h1 span {
    color: #4da3ff;
}

.hero p {
    margin: 0;
    color: #8f9baa;
    font-size: 16px;
    line-height: 1.6;
    max-width: 760px;
}

.panel {
    background: #111720;
    border: 1px solid #26303b;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,.18);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    color: #aeb9c6;
    font-weight: 600;
}

select,
textarea {
    width: 100%;
    background: #0c1219;
    color: #e8edf3;
    border: 1px solid #303b48;
    border-radius: 8px;
    padding: 12px 13px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
}

select {
    min-height: 46px;
}

select:focus,
textarea:focus {
    border-color: #4da3ff;
    box-shadow: 0 0 0 3px rgba(77,163,255,.08);
}

select:disabled {
    opacity: .45;
    cursor: not-allowed;
}

textarea {
    min-height: 125px;
    resize: vertical;
    line-height: 1.5;
}

.actions {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.find-button {
    background: #4da3ff;
    color: #06101b;
    border: 0;
    border-radius: 8px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

.find-button:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
}

.find-button:disabled {
    opacity: .5;
    cursor: wait;
    transform: none;
}

.status {
    font-size: 13px;
    color: #8f9baa;
}

.status.error {
    color: #ff7b7b;
}

.status.success {
    color: #77d69b;
}

.results {
    margin-top: 28px;
}

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 14px;
}

.results-header h2 {
    margin: 0;
    font-size: 20px;
}

.result-count {
    color: #8995a3;
    font-size: 13px;
}

.result-card {
    background: #0c1219;
    border: 1px solid #293542;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 12px;
}

.result-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 15px;
}

.result-title {
    margin: 0 0 7px;
    font-size: 17px;
    line-height: 1.3;
}

.result-category {
    color: #8f9baa;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.score {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 700;
    color: #4da3ff;
    background: rgba(77,163,255,.08);
    border: 1px solid rgba(77,163,255,.2);
    border-radius: 7px;
    padding: 7px 9px;
}

.result-description {
    margin: 13px 0 0;
    color: #aeb9c6;
    font-size: 14px;
    line-height: 1.55;
}

.match-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 13px;
}

.match-tag {
    font-size: 11px;
    color: #b9c7d6;
    border: 1px solid #303c49;
    background: #141c25;
    padding: 5px 7px;
    border-radius: 5px;
}

.no-results {
    padding: 24px;
    text-align: center;
    color: #8f9baa;
    border: 1px dashed #303b48;
    border-radius: 9px;
}

footer {
    border-top: 1px solid #202a34;
    padding: 22px 16px;
    text-align: center;
    color: #657180;
    font-size: 12px;
}

@media (max-width: 700px) {
    header {
        height: auto;
        min-height: 72px;
        padding: 12px 14px;
        gap: 10px;
        flex-wrap: wrap;
    }

    .logo {
        font-size: 21px;
    }

    .home-link {
        font-size: 13px;
        padding: 8px 10px;
    }

    .language-selector {
        margin-left: auto;
    }

    main {
        width: min(100% - 22px, 1050px);
        padding-top: 30px;
    }

    .panel {
        padding: 17px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .field.full {
        grid-column: auto;
    }

    .result-top {
        flex-direction: column;
    }

    .score {
        align-self: flex-start;
    }
}
</style>
</head>

<header>
    <div class="logo">Auto<span>Decode</span></div>

    <a href="index.html" class="home-link" data-i18n="home">
        ← Home
    </a>

    <div class="language-selector">
        <button class="language-button" id="languageButton">🇬🇧 EN ▾</button>

        <div class="language-menu" id="languageMenu">
            <div class="language-option" data-lang="en">🇬🇧 English</div>
            <div class="language-option" data-lang="de">🇩🇪 Deutsch</div>
            <div class="language-option" data-lang="ro">🇷🇴 Română</div>
            <div class="language-option" data-lang="fr">🇫🇷 Français</div>
            <div class="language-option" data-lang="es">🇪🇸 Español</div>
            <div class="language-option" data-lang="it">🇮🇹 Italiano</div>
            <div class="language-option" data-lang="nl">🇳🇱 Nederlands</div>
        </div>
    </div>
</header>


<main>

    <section class="hero">
        <h1><span>Repair</span> & Technical</h1>

        <p data-i18n="intro">
            Select your vehicle and describe the problem. AutoDecode will search
            the technical database and rank the most relevant diagnostic information.
        </p>
    </section>


    <section class="panel">

        <div class="form-grid">

            <div class="field">
                <label for="manufacturer" data-i18n="make">Make</label>

                <select id="manufacturer">
                    <option value="" data-i18n="select_make">
                        Select make
                    </option>
                </select>
            </div>


            <div class="field">
                <label for="model" data-i18n="model">Model</label>

                <select id="model" disabled>
                    <option value="" data-i18n="select_model">
                        Select model
                    </option>
                </select>
            </div>


            <div class="field">
                <label for="generation" data-i18n="generation">
                    Generation / Platform
                </label>

                <select id="generation" disabled>
                    <option value="" data-i18n="select_generation">
                        Select generation
                    </option>
                </select>
            </div>


            <div class="field">
                <label for="year" data-i18n="year">Year</label>

                <select id="year" disabled>
                    <option value="" data-i18n="select_year">
                        Select year
                    </option>
                </select>
            </div>


            <div class="field">
                <label for="engine" data-i18n="engine">Engine</label>

                <select id="engine" disabled>
                    <option value="" data-i18n="select_engine">
                        Select engine
                    </option>
                </select>
            </div>


            <div class="field full">
                <label for="problem" data-i18n="problem">
                    Describe the problem
                </label>

                <textarea
                    id="problem"
                    data-i18n-placeholder="problem_placeholder"
                    placeholder="Example: The engine has very little power at low RPM and sometimes enters limp mode."></textarea>
            </div>

        </div>


        <div class="actions">

            <button class="find-button" id="findButton" disabled data-i18n="find_solution">
                FIND SOLUTION
            </button>

            <div class="status" id="status"></div>

        </div>


        <section class="results" id="results" hidden>

            <div class="results-header">
                <h2 data-i18n="diagnostic_results">
                    Diagnostic Results
                </h2>

                <div class="result-count" id="resultCount"></div>
            </div>

            <div id="resultList"></div>

        </section>

    </section>

</main>


<footer>
    © <span id="yearFooter"></span> AutoDecode
</footer>

async function loadManufacturers() {

    setStatus(t("database_loading"));

    try {

        const response =
            await fetch("data/vehicles/manufacturers.yaml", {
                cache: "no-cache"
            });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const yamlText = await response.text();

        const data = jsyaml.load(yamlText);

        if (!Array.isArray(data)) {
            throw new Error("Invalid manufacturers YAML structure");
        }

        manufacturersData = data;

        resetSelect(manufacturerSelect, "select_make");

        populateSelect(manufacturerSelect, manufacturersData);

        setStatus(t("database_ready"), "success");

    } catch (error) {

        console.error("Manufacturer database error:", error);

        setStatus(t("database_error"), "error");

    }

}


async function loadManufacturerData(manufacturerId) {

    if (manufacturerDataCache[manufacturerId]) {
        return manufacturerDataCache[manufacturerId];
    }

    const response =
        await fetch(`data/vehicles/${manufacturerId}.yaml`, {
            cache: "no-cache"
        });

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
    }

    const yamlText = await response.text();

    const data = jsyaml.load(yamlText);

    manufacturerDataCache[manufacturerId] = data;

    return data;

}


async function loadTechnicalDatabase(manufacturerId) {

    setStatus(t("technical_loading"));

    try {

        const response =
            await fetch(`data/technical/diagnostics/${manufacturerId}.yaml`, {
                cache: "no-cache"
            });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const yamlText = await response.text();

        const data = jsyaml.load(yamlText);

        if (!data) {
            throw new Error("Technical YAML is empty");
        }

        if (Array.isArray(data)) {

            technicalDatabase = data;

        } else if (Array.isArray(data.technical_data)) {

            technicalDatabase = data.technical_data;

        } else if (Array.isArray(data.diagnostics)) {

            technicalDatabase = data.diagnostics;

        } else {

            throw new Error("Unknown technical YAML structure");

        }

        setStatus(t("technical_ready"), "success");

        return technicalDatabase;

    } catch (error) {

        console.error("Technical database error:", error);

        technicalDatabase = [];

        setStatus(t("technical_error"), "error");

        return [];

    }

}

/*
============================================================
TEXT NORMALIZATION
============================================================
*/

function normalizeText(text) {

    return String(text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s.-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


function tokenize(text) {

    return normalizeText(text)
        .split(/\s+/)
        .filter(token => token.length >= 2);

}


/*
============================================================
DTC DETECTION
============================================================
*/

function extractDTCs(text) {

    const matches =
        String(text || "")
            .toUpperCase()
            .match(
                /\b(?:P|B|C|U)\d{4}\b/g
            );

    return [...new Set(matches || [])];

}

function detectSymptomGroups(problem) {

    const normalized =
        normalizeText(problem);

    const detected = [];

    for (const [group, phrases] of Object.entries(symptomGroups)) {

        for (const phrase of phrases) {

            if (normalized.includes(normalizeText(phrase))) {

                detected.push(group);
                break;

            }

        }

    }

    return [...new Set(detected)];

}


/*
============================================================
VEHICLE MATCH
============================================================
*/

function calculateVehicleMatch(item, vehicle) {

    const itemVehicle =
        item.vehicle || {};

    let score = 0;
    let maximum = 4;

    const manufacturerMatch =
        !itemVehicle.manufacturer ||
        itemVehicle.manufacturer === vehicle.manufacturer;

    if (manufacturerMatch) {
        score++;
    }


    const models =
        itemVehicle.models === "all"
            ? ["all"]
            : Array.isArray(itemVehicle.models)
                ? itemVehicle.models
                : [];


    if (
        models.includes("all") ||
        models.includes(vehicle.model)
    ) {
        score++;
    }


    const generations =
        itemVehicle.generations === "all"
            ? ["all"]
            : Array.isArray(itemVehicle.generations)
                ? itemVehicle.generations
                : [];


    if (
        generations.includes("all") ||
        generations.includes(vehicle.generation)
    ) {
        score++;
    }


    const engines =
        itemVehicle.engines === "all"
            ? ["all"]
            : Array.isArray(itemVehicle.engines)
                ? itemVehicle.engines
                : [];


    if (
        engines.includes("all") ||
        engines.includes(vehicle.engine)
    ) {
        score++;
    }


    return Math.round((score / maximum) * 100);

}


/*
============================================================
YEAR MATCH
============================================================
*/

function calculateYearMatch(item, year) {

    const production =
        item.vehicle?.production;

    if (!production) {
        return 100;
    }

    const from = Number(production.from || 0);
    const to = Number(production.to || 9999);

    if (year >= from && year <= to) {
        return 100;
    }

    return 0;

}


/*
============================================================
KEYWORD MATCH
============================================================
*/

function calculateKeywordMatch(item, problem) {

    const normalizedProblem =
        normalizeText(problem);

    const problemTokens =
        tokenize(problem);

    const keywordSources = [

        ...(Array.isArray(item.keywords)
            ? item.keywords
            : []),

        ...(Array.isArray(item.symptoms)
            ? item.symptoms
            : []),

        ...(Array.isArray(item.possible_causes)
            ? item.possible_causes
            : []),

        item.title?.en || "",
        item.title?.ro || "",
        item.title?.de || ""

    ];


    let exactPhraseHits = 0;
    let tokenHits = 0;


    for (const keyword of keywordSources) {

        const normalizedKeyword =
            normalizeText(keyword);

        if (!normalizedKeyword) {
            continue;
        }

        if (normalizedProblem.includes(normalizedKeyword)) {
            exactPhraseHits++;
            continue;
        }

        const keywordTokens =
            tokenize(normalizedKeyword);

        if (!keywordTokens.length) {
            continue;
        }

        for (const token of keywordTokens) {

            if (problemTokens.includes(token)) {
                tokenHits++;
            }

        }

    }


    const detectedGroups =
        detectSymptomGroups(problem);


    let groupBonus = 0;


    const itemText =
        normalizeText(
            keywordSources.join(" ")
        );


    for (const group of detectedGroups) {

        const phrases =
            symptomGroups[group];

        if (
            phrases.some(
                phrase =>
                    itemText.includes(
                        normalizeText(phrase)
                    )
            )
        ) {
            groupBonus += 8;
        }

    }


    let score =
        exactPhraseHits * 18 +
        tokenHits * 4 +
        groupBonus;


    return Math.min(100, score);

}


/*
============================================================
DTC MATCH
============================================================
*/

function calculateDTCMatch(item, dtcs) {

    if (!dtcs.length) {
        return 0;
    }

    const itemDtcs =
        Array.isArray(item.related_dtcs)
            ? item.related_dtcs.map(dtc => dtc.toUpperCase())
            : [];


    if (!itemDtcs.length) {
        return 0;
    }


    let matches = 0;

    for (const dtc of dtcs) {

        if (itemDtcs.includes(dtc)) {
            matches++;
        }

    }


    if (!matches) {
        return 0;
    }


    return Math.min(
        100,
        70 + matches * 15
    );

}


/*
============================================================
SYSTEM MATCH
============================================================
*/

function calculateSystemMatch(item, problem) {

    const groups =
        detectSymptomGroups(problem);

    const system =
        normalizeText(item.system || "");


    const category =
        normalizeText(item.category || "");


    let score = 0;


    const systemMap = {

        turbocharger: ["turbo", "boost"],
        charge_air: ["turbo", "boost"],
        boost_pressure: ["turbo", "boost", "map"],
        egr: ["egr"],
        air_metering: ["maf"],
        dpf: ["dpf"],
        fuel_system: ["injector"],
        fuel_injection: ["injector"],
        ignition: ["misfire"],
        cooling: ["coolant", "overheating"],
        electrical: ["battery"],
        charging: ["battery"],
        abs_esp: ["abs"],
        air_conditioning: ["ac"],
        transmission: ["transmission"]
    };


    const relevantGroups =
        systemMap[system] || [];


    for (const group of relevantGroups) {

        if (groups.includes(group)) {
            score += 45;
        }

    }


    if (groups.includes(system)) {
        score += 50;
    }


    if (category === "diagnostics") {
        score += 5;
    }


    return Math.min(100, score);

}


/*
============================================================
OVERALL SCORE
============================================================
*/

function calculateOverallScore(
    vehicleMatch,
    yearMatch,
    symptomMatch,
    dtcMatch,
    systemMatch
) {

    /*
       Vehicle: 25%
       Year:      5%
       Symptoms:  35%
       DTC:       25%
       System:    10%

       If no DTC was entered, its weight is
       redistributed to symptoms/system.
    */

    if (dtcMatch === 0) {

        return Math.round(
            vehicleMatch * 0.28 +
            yearMatch * 0.05 +
            symptomMatch * 0.47 +
            systemMatch * 0.20
        );

    }


    return Math.round(
        vehicleMatch * 0.25 +
        yearMatch * 0.05 +
        symptomMatch * 0.25 +
        dtcMatch * 0.35 +
        systemMatch * 0.10
    );

}

function getLocalizedValue(value) {

    if (!value) {
        return "";
    }

    if (typeof value === "string") {
        return value;
    }

    return (
        value[currentLanguage] ||
        value.en ||
        value.ro ||
        value.de ||
        Object.values(value)[0] ||
        ""
    );

}


/*
============================================================
RESULT RENDERING
============================================================
*/

function renderResults(results) {

    resultList.innerHTML = "";

    resultsElement.hidden = false;


    if (!results.length) {

        resultCount.textContent = "";

        const empty =
            document.createElement("div");

        empty.className = "no-results";

        empty.textContent =
            t("no_results");

        resultList.appendChild(empty);

        return;

    }


    resultCount.textContent =
        results.length === 1
            ? t("result_count_one")
            : t("result_count_many")
                .replace("{n}", results.length);


    results.forEach(result => {

        const item = result.item;

        const card =
            document.createElement("article");

        card.className = "result-card";


        const top =
            document.createElement("div");

        top.className = "result-top";


        const titleContainer =
            document.createElement("div");


        const title =
            document.createElement("h3");

        title.className = "result-title";

        title.textContent =
            getLocalizedValue(item.title) ||
            item.id;


        const category =
            document.createElement("div");

        category.className = "result-category";

        category.textContent =
            item.system ||
            item.category ||
            "Diagnostics";


        titleContainer.appendChild(title);
        titleContainer.appendChild(category);


        const score =
            document.createElement("div");

        score.className = "score";

        score.textContent =
            `${result.score}%`;


        top.appendChild(titleContainer);
        top.appendChild(score);


        card.appendChild(top);


        const descriptionText =
            getLocalizedValue(item.description);


        if (descriptionText) {

            const description =
                document.createElement("p");

            description.className =
                "result-description";

            description.textContent =
                descriptionText;

            card.appendChild(description);

        }


        const tags =
            document.createElement("div");

        tags.className = "match-tags";


        addTag(
            tags,
            `${t("vehicle_match")}: ${result.vehicleMatch}%`
        );

        addTag(
            tags,
            `${t("symptom_match")}: ${result.symptomMatch}%`
        );


        if (result.dtcMatch > 0) {

            addTag(
                tags,
                `${t("dtc_match")}: ${result.dtcMatch}%`
            );

        }


        if (result.systemMatch > 0) {

            addTag(
                tags,
                `${t("system_match")}: ${result.systemMatch}%`
            );

        }


        if (item.difficulty) {

            addTag(
                tags,
                `${t("difficulty")}: ${item.difficulty}`
            );

        }


        card.appendChild(tags);

        resultList.appendChild(card);

    });

}


function addTag(parent, text) {

    const tag =
        document.createElement("span");

    tag.className = "match-tag";

    tag.textContent = text;

    parent.appendChild(tag);

}


/*
============================================================
SEARCH
============================================================
*/

function performSearch() {

    if (
        !manufacturerSelect.value ||
        !modelSelect.value ||
        !generationSelect.value ||
        !yearSelect.value ||
        !engineSelect.value
    ) {

        setStatus(
            t("complete_vehicle"),
            "error"
        );

        return;

    }


    const problem =
        problemInput.value.trim();


    if (!problem) {

        setStatus(
            t("describe_problem"),
            "error"
        );

        return;

    }


    if (!technicalDatabase.length) {

        setStatus(
            t("technical_error"),
            "error"
        );

        return;

    }


    findButton.disabled = true;

    setStatus(
        t("searching")
    );


    const model =
        (selectedManufacturerData.models || [])
            .find(item => item.id === modelSelect.value);


    const generation =
        (model?.generations || [])
            .find(item => item.id === generationSelect.value);


    const engine =
        (generation?.engines || [])
            .find(item => item.id === engineSelect.value);


    const vehicle = {

        manufacturer:
            manufacturerSelect.value,

        model:
            modelSelect.value,

        generation:
            generationSelect.value,

        year:
            Number(yearSelect.value),

        engine:
            engineSelect.value,

        engineCodes:
            Array.isArray(engine?.engine_codes)
                ? engine.engine_codes
                : [],

        fuel:
            engine?.fuel || null

    };


    const dtcs =
        extractDTCs(problem);


    const results = [];


    for (const item of technicalDatabase) {

        const vehicleMatch =
            calculateVehicleMatch(
                item,
                vehicle
            );


        if (vehicleMatch === 0) {
            continue;
        }


        const yearMatch =
            calculateYearMatch(
                item,
                vehicle.year
            );


        const symptomMatch =
            calculateKeywordMatch(
                item,
                problem
            );


        const dtcMatch =
            calculateDTCMatch(
                item,
                dtcs
            );


        const systemMatch =
            calculateSystemMatch(
                item,
                problem
            );


        const score =
            calculateOverallScore(
                vehicleMatch,
                yearMatch,
                symptomMatch,
                dtcMatch,
                systemMatch
            );


        if (score < 15) {
            continue;
        }


        results.push({

            item,

            score,

            vehicleMatch,

            yearMatch,

            symptomMatch,

            dtcMatch,

            systemMatch

        });

    }


    results.sort(
        (a, b) => b.score - a.score
    );


    renderResults(
        results.slice(0, 10)
    );


    if (results.length) {

        setStatus(
            `${results.length} ${results.length === 1 ? "result" : "results"}`,
            "success"
        );

    } else {

        setStatus(
            t("no_results")
        );

    }


    findButton.disabled = false;

}


findButton.addEventListener(
    "click",
    performSearch
);

    document.getElementById("languageButton");

const languageMenu =
    document.getElementById("languageMenu");


languageButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        languageMenu.classList.toggle("active");

    }
);


document.querySelectorAll(".language-option")
    .forEach(option => {

        option.addEventListener(
            "click",
            async () => {

                currentLanguage =
                    option.dataset.lang;

                localStorage.setItem(
                    "autodecode_language",
                    currentLanguage
                );

                languageMenu.classList.remove(
                    "active"
                );

                localizePage();

                resetSelect(
                    manufacturerSelect,
                    "select_make"
                );

                populateSelect(
                    manufacturerSelect,
                    manufacturersData
                );


                if (
                    manufacturerSelect.value &&
                    selectedManufacturerData
                ) {

                    resetSelect(
                        modelSelect,
                        "select_model"
                    );

                    populateSelect(
                        modelSelect,
                        selectedManufacturerData.models || []
                    );

                }

            }
        );

    });


document.addEventListener(
    "click",
    () => {
        languageMenu.classList.remove("active");
    }
);


/*
============================================================
INITIALIZATION
============================================================
*/

document.getElementById("yearFooter").textContent =
    new Date().getFullYear();


localizePage();

loadManufacturers();

</script>

</body>
</html>

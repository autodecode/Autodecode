<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDecode – Repair & Technical</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0f14;
    color:#e8edf3
}
body{min-height:100vh}

header{
    min-height:72px;
    background:#111720;
    border-bottom:1px solid #26303b;
    display:flex;
    align-items:center;
    padding:12px 24px;
    gap:20px
}

.logo{
    font-size:24px;
    font-weight:700;
    letter-spacing:-.5px;
    white-space:nowrap
}

.logo span,.hero h1 span{color:#4da3ff}

.home-link{
    color:#cbd5e1;
    text-decoration:none;
    font-size:14px;
    padding:9px 13px;
    border:1px solid #34404d;
    border-radius:7px
}

.home-link:hover{
    color:#fff;
    border-color:#4da3ff
}

.language-selector{
    margin-left:auto;
    position:relative
}

.language-button{
    background:#18202a;
    color:#e8edf3;
    border:1px solid #34404d;
    border-radius:7px;
    padding:8px 10px;
    cursor:pointer;
    font-size:14px
}

.language-menu{
    display:none;
    position:absolute;
    right:0;
    top:calc(100% + 7px);
    background:#151c25;
    border:1px solid #34404d;
    border-radius:8px;
    min-width:145px;
    overflow:hidden;
    z-index:1000
}

.language-menu.active{display:block}

.language-option{
    padding:10px 12px;
    cursor:pointer;
    color:#dbe4ee;
    font-size:14px
}

.language-option:hover{background:#202b37}

main{
    width:min(1050px,calc(100% - 32px));
    margin:0 auto;
    padding:48px 0 70px
}

.hero{margin-bottom:34px}

.hero h1{
    margin:0 0 10px;
    font-size:clamp(30px,5vw,46px);
    line-height:1.1
}

.hero p{
    margin:0;
    color:#8f9baa;
    font-size:16px;
    line-height:1.6;
    max-width:800px
}

.panel{
    background:#111720;
    border:1px solid #26303b;
    border-radius:12px;
    padding:24px
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px
}

.field.full{grid-column:1/-1}

label{
    font-size:13px;
    color:#aeb9c6;
    font-weight:600
}

select,textarea{
    width:100%;
    background:#0c1219;
    color:#e8edf3;
    border:1px solid #303b48;
    border-radius:8px;
    padding:12px 13px;
    font-size:15px;
    outline:none
}

select{min-height:46px}

select:focus,textarea:focus{
    border-color:#4da3ff
}

select:disabled{opacity:.45}

textarea{
    min-height:125px;
    resize:vertical;
    line-height:1.5
}

.actions{
    margin-top:22px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap
}

.find-button{
    background:#4da3ff;
    color:#06101b;
    border:0;
    border-radius:8px;
    padding:13px 22px;
    font-size:15px;
    font-weight:700;
    cursor:pointer
}

.find-button:hover{filter:brightness(1.08)}
.find-button:disabled{opacity:.5;cursor:not-allowed}

.status{
    font-size:13px;
    color:#8f9baa
}

.status.error{color:#ff7777}
.status.success{color:#72d79a}

.results{margin-top:30px}

.results-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px
}

.results-header h2{
    margin:0;
    font-size:21px
}

.result-count{
    color:#8995a3;
    font-size:13px
}

.result-card{
    background:#0c1219;
    border:1px solid #293542;
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden
}

.result-main{padding:19px}

.result-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px
}

.result-title{
    margin:0 0 7px;
    font-size:18px;
    line-height:1.35
}

.result-system{
    color:#8995a3;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px
}

.score{
    flex:0 0 auto;
    font-size:15px;
    font-weight:700;
    color:#4da3ff;
    background:rgba(77,163,255,.08);
    border:1px solid rgba(77,163,255,.2);
    border-radius:7px;
    padding:7px 9px
}

.result-description{
    color:#aeb9c6;
    font-size:14px;
    line-height:1.6;
    margin:14px 0 0
}

.match-tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:14px
}

.match-tag{
    font-size:11px;
    color:#b9c7d6;
    border:1px solid #303c49;
    background:#141c25;
    padding:5px 8px;
    border-radius:5px
}

.result-section{
    border-top:1px solid #202b36;
    padding:16px 19px
}

.result-section h4{
    margin:0 0 10px;
    font-size:13px;
    color:#dbe4ee
}

.result-section ul{
    margin:0;
    padding-left:20px;
    color:#aeb9c6;
    font-size:13px;
    line-height:1.65
}

.result-section li{margin-bottom:4px}

.no-results{
    padding:25px;
    text-align:center;
    color:#8f9baa;
    border:1px dashed #303b48;
    border-radius:9px
}

.selected-vehicle{
    margin-top:18px;
    padding:12px 14px;
    background:#0c1219;
    border:1px solid #26303b;
    border-radius:8px;
    color:#9ca8b6;
    font-size:13px
}

.selected-vehicle strong{color:#dce5ee}

footer{
    border-top:1px solid #202a34;
    padding:22px 16px;
    text-align:center;
    color:#657180;
    font-size:12px
}

@media(max-width:700px){
    header{
        padding:12px 14px;
        gap:10px;
        flex-wrap:wrap
    }

    .logo{font-size:21px}

    .home-link{
        font-size:13px;
        padding:8px 10px
    }

    .language-selector{margin-left:auto}

    main{
        width:calc(100% - 22px);
        padding-top:30px
    }

    .panel{padding:17px}

    .form-grid{grid-template-columns:1fr}
    .field.full{grid-column:auto}

    .result-top{flex-direction:column}
    .score{align-self:flex-start}
}
</style>
</head>

<header>
    <div class="logo">Auto<span>Decode</span></div>

    <a href="index.html" class="home-link" data-i18n="home">
        ← Home
    </a>

    <div class="language-selector">
        <button class="language-button" id="languageButton">
            🇬🇧 EN ▾
        </button>

        <div class="language-menu" id="languageMenu">

            <div class="language-option" data-lang="de">🇩🇪 Deutsch</div>
            <div class="language-option" data-lang="ro">🇷🇴 Română</div>
            <div class="language-option" data-lang="fr">🇫🇷 Français</div>
            <div class="language-option" data-lang="es">🇪🇸 Español</div>
            <div class="language-option" data-lang="it">🇮🇹 Italiano</div>
            <div class="language-option" data-lang="nl">🇳🇱 Nederlands</div>

    </div>
</header>

<main>

<section class="hero">
    <h1><span>Repair</span> & Technical</h1>

    <p data-i18n="intro">
        Select your vehicle and describe the problem. AutoDecode will search the technical database and rank the most relevant diagnostic information.
    </p>
</section>

<section class="panel">

<div class="form-grid">

    <div class="field">
        <label for="manufacturer" data-i18n="make">Make</label>
        <select id="manufacturer">
            <option value="" data-i18n="select_make">Select make</option>
        </select>
    </div>

    <div class="field">
        <label for="model" data-i18n="model">Model</label>
        <select id="model" disabled>
            <option value="" data-i18n="select_model">Select model</option>
        </select>
    </div>

    <div class="field">
        <label for="generation" data-i18n="generation">Generation / Platform</label>
        <select id="generation" disabled>
            <option value="" data-i18n="select_generation">Select generation</option>
        </select>
    </div>

    <div class="field">
        <label for="year" data-i18n="year">Year</label>
        <select id="year" disabled>
            <option value="" data-i18n="select_year">Select year</option>
        </select>
    </div>

    <div class="field">
        <label for="engine" data-i18n="engine">Engine</label>
        <select id="engine" disabled>
            <option value="" data-i18n="select_engine">Select engine</option>
        </select>
    </div>

    <div class="field full">
        <label for="problem" data-i18n="problem">
            Describe the problem
        </label>

        <textarea
            id="problem"
            data-i18n-placeholder="problem_placeholder"
            placeholder="Example: The engine has very little power at low RPM and sometimes enters limp mode."
        ></textarea>
    </div>

</div>

<div class="selected-vehicle" id="selectedVehicle" hidden></div>

<div class="actions">
    <button class="find-button" id="findButton" disabled data-i18n="find_solution">
        FIND SOLUTION
    </button>

    <div class="status" id="status"></div>
</div>

<section class="results" id="results" hidden>

    <div class="results-header">

            Diagnostic Results

        <div class="result-count" id="resultCount"></div>
    </div>

    <div id="resultList"></div>

</section>

</section>
</main>

<footer>
    © <span id="yearFooter"></span> AutoDecode
</footer>

function t(k){
    return translations[currentLanguage]?.[k] ||
           translations.en[k] ||
           k;
}


function localizePage(){

    document.documentElement.lang=currentLanguage;

    document.querySelectorAll("[data-i18n]").forEach(e=>{
        e.textContent=t(e.getAttribute("data-i18n"));
    });

    document.querySelectorAll("[data-i18n-placeholder]").forEach(e=>{
        e.placeholder=t(e.getAttribute("data-i18n-placeholder"));
    });

    document.getElementById("languageButton").textContent=
        `${flags[currentLanguage]} ${currentLanguage.toUpperCase()} ▾`;
}


function setStatus(message,type=""){

    statusElement.textContent=message;
    statusElement.className="status";

    if(type)
        statusElement.classList.add(type);
}


function resetSelect(select,key){

    select.innerHTML="";

    const option=document.createElement("option");

    option.value="";
    option.textContent=t(key);

    select.appendChild(option);
}


function populateSelect(select,items){

    for(const item of items||[]){

        if(!item?.id)
            continue;

        const option=document.createElement("option");

        option.value=item.id;
        option.textContent=item.name||item.id;

        select.appendChild(option);
    }
}


/* ============================================================
   TEXT NORMALIZATION
============================================================ */

function normalizeText(value){

    return String(value??"")
        .toLowerCase()
        .replace(/[’‘`´]/g,"'")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]+/g," ")
        .replace(/\s+/g," ")
        .trim();
}


function tokenize(value){

    return new Set(
        normalizeText(value)
        .split(" ")
        .filter(Boolean)
    );
}


function escapeRegex(value){

    return String(value)
        .replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}


/*
   Exact phrase matching using word boundaries.
   This prevents things like "air" matching "repair".
*/

function phraseMatches(text,phrase){

    const a=normalizeText(text);
    const p=normalizeText(phrase);

    if(!a||!p)
        return false;

    return (` ${a} `).includes(` ${p} `);
}


/*
   Handles natural word-order variations.

   Example:
   "pression carburant trop basse"
   "pression trop basse du carburant"
*/

function tokenWindowMatches(text,phrase){

    const a=normalizeText(text)
        .split(" ")
        .filter(Boolean);

    const p=normalizeText(phrase)
        .split(" ")
        .filter(Boolean);

    if(p.length<2||p.length>6)
        return false;

    for(let i=0;i<a.length;i++){

        let position=i;
        let matched=true;

        for(const word of p){

            let found=-1;

            for(
                let j=position;
                j<Math.min(a.length,position+6);
                j++
            ){

                if(a[j]===word){
                    found=j;
                    break;
                }
            }

            if(found<0){
                matched=false;
                break;
            }

            position=found+1;
        }

        if(matched)
            return true;
    }

    return false;
}


/*
   Controlled fuzzy matching for longer technical words.
   It deliberately does NOT fuzzy-match short generic words.
*/

function fuzzyTokenMatch(text,alias){

    const words=normalizeText(text)
        .split(" ")
        .filter(Boolean);

    const aliasWords=normalizeText(alias)
        .split(" ")
        .filter(Boolean);

    if(aliasWords.length!==1)
        return false;

    const target=aliasWords[0];

    if(target.length<6)
        return false;

    return words.some(word=>
        word===target ||
        word.startsWith(target) ||
        (target.startsWith(word)&&word.length>=5)
    );
}


function matchesAlias(text,alias){

    return phraseMatches(text,alias) ||
           tokenWindowMatches(text,alias) ||
           fuzzyTokenMatch(text,alias);
}

/* ============================================================
   CANONICALIZATION

   Several concepts intentionally map to an existing canonical
   concept so existing YAML records remain compatible.
============================================================ */

const canonicalAlias={

fuel_pressure_low:"fuel_pressure",
rail_pressure:"fuel_pressure",
rail_pressure_low:"fuel_pressure",

boost:"turbo",
boost_low:"turbo",
boost_high:"turbo",

dpf_blocked:"dpf",
dpf_regeneration:"dpf",

esp:"abs",
esc:"abs",

androidauto:"android_auto",
carplay_connection:"carplay",

phone:"phone_connection"

};


function canonical(id){
    return canonicalAlias[id]||id;
}


/* ============================================================
   USER SEMANTIC DETECTION
============================================================ */

function detectUserSymptoms(problem){

    const text=normalizeText(problem);

    const found=new Set();

    for(
        const [semanticId,aliases]
        of Object.entries(symptomAliases)
    ){

        for(const alias of aliases){

            if(matchesAlias(text,alias)){

                found.add(canonical(semanticId));
                break;
            }
        }
    }

    /*
       Crank-no-start logically implies no-start.
    */

    if(found.has("crank_no_start"))
        found.add("no_start");


    /*
       If the engine stalled and now does not start,
       this is a particularly strong diagnostic scenario.
    */

    if(
        found.has("engine_stall") &&
        found.has("crank_no_start")
    ){
        found.add("no_start");
    }

    return [...found];
}

============================================================ */

function getItemText(item){

    const parts=[];

    for(
        const key of [
            "id",
            "system",
            "category",
            "title",
            "description",
            "symptoms",
            "keywords",
            "possible_causes",
            "diagnostic_steps",
            "related_dtcs"
        ]
    ){

        const value=item?.[key];

        if(value==null)
            continue;

        if(typeof value==="object")
            parts.push(JSON.stringify(value));
        else
            parts.push(String(value));
    }

    return parts.join(" ");
}

function getItemSymptoms(item){

    const output=new Set();

    const raw=item?.symptoms||[];

    for(
        const symptom
        of Array.isArray(raw)?raw:[raw]
    ){

        const id=normalizeSymptomId(
            typeof symptom==="string"
                ? symptom
                : symptom?.id
        );

        if(id)
            output.add(id);
    }


    /*
       Also inspect the textual content of the item.
       This allows an English-only YAML record to be found
       from a French/German/Romanian query.
    */

    const text=getItemText(item);

    for(
        const [id,aliases]
        of Object.entries(symptomAliases)
    ){

        if(
            aliases.some(alias=>matchesAlias(text,alias))
        ){
            output.add(canonical(id));
        }
    }


    const system=normalizeSymptomId(item?.system||"");

    if(system)
        output.add(system);

    return [...output];
}


function getLocalizedValue(value){

    if(!value)
        return "";

    if(typeof value==="string")
        return value;

    return value[currentLanguage] ||
           value.en ||
           value.ro ||
           value.de ||
           Object.values(value)[0] ||
           "";
}

============================================================ */

async function loadManufacturers(){

    setStatus(t("database_loading"));

    try{

        const response=await fetch(
            "data/vehicles/manufacturers.yaml",
            {cache:"no-cache"}
        );

        if(!response.ok)
            throw Error(`HTTP ${response.status}`);

        const data=jsyaml.load(await response.text());

        manufacturersData=
            Array.isArray(data?.manufacturers)
                ? data.manufacturers
                : Array.isArray(data)
                    ? data
                    : [];

        if(!manufacturersData.length)
            throw Error("Invalid manufacturers structure");

        resetSelect(
            manufacturerSelect,
            "select_make"
        );

        populateSelect(
            manufacturerSelect,
            manufacturersData
        );

        setStatus(
            t("database_ready"),
            "success"
        );

    }catch(error){

        console.error(error);

        setStatus(
            t("database_error"),
            "error"
        );
    }
}


async function loadManufacturerData(id){

    if(manufacturerDataCache[id])
        return manufacturerDataCache[id];

    const response=await fetch(
        `data/vehicles/${id}.yaml`,
        {cache:"no-cache"}
    );

    if(!response.ok)
        throw Error(
            `Vehicle database HTTP ${response.status}`
        );

    const data=jsyaml.load(
        await response.text()
    );

    manufacturerDataCache[id]=data;

    return data;
}


async function loadTechnicalDatabase(id){

    setStatus(t("technical_loading"));

    try{

        const response=await fetch(
            `data/technical/diagnostics/${id}.yaml`,
            {cache:"no-cache"}
        );

        if(!response.ok){

            technicalDatabase=[];

            setStatus(
                t("technical_error"),
                "error"
            );

            return false;
        }

        const data=jsyaml.load(
            await response.text()
        );

        technicalDatabase=
            Array.isArray(data?.technical_data)
                ? data.technical_data
                : Array.isArray(data)
                    ? data
                    : [];

        if(!technicalDatabase.length)
            throw Error(
                "Invalid technical database structure"
            );

        console.log(
            "Loaded technical records:",
            technicalDatabase.length
        );

        setStatus(
            t("technical_ready"),
            "success"
        );

        return true;

    }catch(error){

        console.error(error);

        technicalDatabase=[];

        setStatus(
            t("technical_error"),
            "error"
        );

        return false;
    }
}

            console.error(error);

            setStatus(

                "error"

        }
    }
);

/* ============================================================
   VEHICLE MATCH
============================================================ */

function valueMatches(values,target){

    if(values==null)
        return true;

    const array=
        Array.isArray(values)
            ? values
            : [values];

    if(!array.length)
        return true;

    const normalizedTarget=
        normalizeText(target);

    return array.some(value=>{

        if(value==null)
            return false;

        if(typeof value==="object"){

            return valueMatches(
                value.id||value.name,
                target
            );
        }

        const normalizedValue=
            normalizeText(value);

        return(
            normalizedValue==="all" ||
            normalizedValue==="*" ||
            normalizedValue===normalizedTarget ||
            normalizedTarget===normalizedValue
        );
    });
}


function calculateVehicleMatch(item,vehicle){

    const iv=item.vehicle||item;

    const score=100;

    if(
        iv.manufacturer &&
        !valueMatches(
            iv.manufacturer,
            vehicle.manufacturer
        ) &&
        !valueMatches(
            iv.manufacturer_id,
            vehicle.manufacturer
        )
    ){
        return 0;
    }


    if(
        iv.make &&
        !valueMatches(
            iv.make,
            vehicle.manufacturer
        )
    ){
        return 0;
    }


    if(
        iv.models &&
        !valueMatches(
            iv.models,
            vehicle.model
        ) &&
        !valueMatches(
            iv.model,
            vehicle.model
        )
    ){
        return 0;
    }


    if(
        iv.model &&
        !valueMatches(
            iv.model,
            vehicle.model
        )
    ){
        return 0;
    }


    if(
        iv.generations &&
        !valueMatches(
            iv.generations,
            vehicle.generation
        )
    ){
        return 0;
    }


    if(
        iv.generation &&
        !valueMatches(
            iv.generation,
            vehicle.generation
        )
    ){
        return 0;
    }


    if(
        iv.engines &&
        !valueMatches(
            iv.engines,
            vehicle.engine
        ) &&
        !valueMatches(
            iv.engines,
            vehicle.engineCodes
        )
    ){
        return 0;
    }


    if(
        iv.engine &&
        !valueMatches(
            iv.engine,
            vehicle.engine
        )
    ){
        return 0;
    }


    return score;
}


function calculateYearMatch(item,year){

    const production=
        item.vehicle?.production ||
        item.production;

    if(!production)
        return 100;

    const from=
        Number(production.from||0);

    const to=
        Number(production.to||9999);

    return(
        year>=from &&
        year<=to
    )
        ? 100
        : 0;
}


/* ============================================================
   DTC
============================================================ */

function extractDTCs(problem){

    return[
        ...new Set(
            (
                String(problem||"")
                .toUpperCase()
                .match(/\b[PCBU]\d{4}\b/g)
                ||[]
            )
        )
    ];
}


function calculateDTCMatch(item,dtcs){

    if(!dtcs.length)
        return 0;

    const related=
        Array.isArray(item.related_dtcs)
            ? item.related_dtcs
            : [];

    const keywords=
        Array.isArray(item.keywords)
            ? item.keywords
            : [];

    let matches=0;

    for(const dtc of dtcs){

        if(
            related.some(
                value=>
                    String(value)
                    .toUpperCase()
                    .trim()===dtc
            )
        ){
            matches++;
        }

        if(
            keywords.some(
                value=>
                    String(value)
                    .toUpperCase()
                    .trim()===dtc
            )
        ){
            matches++;
        }
    }

    return matches
        ? Math.min(
            100,
            75+(matches*15)
        )
        : 0;
}

function calculateSystemRelevance(
    item,

        getSystemGroups(item);

    let score=0;

    for(const group of groups){

        if(userSymptoms.includes(group))
            score+=35;
    }

    return Math.min(100,score);
}

function calculateSemanticSymptomScore(
    item,
    problem,
    userSymptoms
){

    const itemSymptoms=
        getItemSymptoms(item);

    const text=
        normalizeText(problem);

    let score=0;


    /*
       Main semantic concept matches.
    */

    for(const symptom of userSymptoms){

        if(itemSymptoms.includes(symptom)){

            score+=
                symptomWeights[symptom] ||
                symptomWeights.default;
        }
    }


    /*
       Relationship bonuses.
    */

    for(const relationship of relationships){

        const userMatches=
            relationship.required.every(
                symptom=>
                    userSymptoms.includes(symptom)
            );

        const itemMatches=
            relationship.required.every(
                symptom=>
                    itemSymptoms.includes(symptom)
            );

        if(userMatches&&itemMatches)
            score+=relationship.bonus;
    }


    /*
       Keyword support.

       This is deliberately a secondary signal.
    */

    const keywords=
        Array.isArray(item.keywords)
            ? item.keywords
            : [];

    let keywordMatches=0;

    for(const keyword of keywords){

        const normalizedKeyword=
            normalizeText(keyword);

        if(
            normalizedKeyword.length>=3 &&
            matchesAlias(
                text,
                normalizedKeyword
            )
        ){
            keywordMatches++;
        }
    }

    score+=Math.min(
        18,
        keywordMatches*5
    );


    return Math.min(
        100,
        score
    );
}


function calculateSymptomCoverage(
    item,
    userSymptoms
){

    if(!userSymptoms.length)
        return 0;

    const itemSymptoms=
        getItemSymptoms(item);

    let matches=0;

    for(const symptom of userSymptoms){

        if(itemSymptoms.includes(symptom))
            matches++;
    }

    return Math.round(
        matches /
        userSymptoms.length *
        100
    );
}


/* ============================================================
   TEXT FALLBACK
============================================================ */

function calculateTextFallback(
    item,
    problem
){

    const text=
        normalizeText(problem);

    const itemText=
        normalizeText(
            getItemText(item)
        );

    if(!text||!itemText)
        return 0;

    const ignoredWords=
        /^(this|that|with|from|does|have|very|mais|plus|avec|para|pero|della|delle|naar|de|het|der|die|das|si|nu|mai|este|un|une|the|and|not)$/;

    const tokens=
        [...tokenize(text)]
        .filter(
            word=>
                word.length>=4 &&
                !ignoredWords.test(word)
        );

    let hits=0;

    for(const word of tokens){

        if(
            (` ${itemText} `)
            .includes(` ${word} `)
        ){
            hits++;
        }
    }

    return tokens.length
        ? Math.min(
            25,
            Math.round(
                hits /
                tokens.length *
                25
            )
        )
        : 0;
}


/* ============================================================
   FINAL SCORE
============================================================ */

function calculateFinalScore({

    vehicleMatch,
    yearMatch,
    semanticScore,
    coverage,
    dtcMatch,
    systemMatch,
    userSymptoms,
    item

}){

    /*
       DTC searches receive a dedicated high-priority path.
    */

    if(dtcMatch>0){

        return Math.min(
            100,
            Math.round(

                vehicleMatch*.20 +
                yearMatch*.05 +
                semanticScore*.25 +
                coverage*.10 +
                dtcMatch*.35 +
                systemMatch*.05

            )
        );
    }


    let score=

        vehicleMatch*.20 +
        yearMatch*.05 +
        semanticScore*.45 +
        coverage*.20 +
        systemMatch*.10;


    const itemSymptoms=
        getItemSymptoms(item);


    /*
       Extremely strong scenario:

       Engine stopped while driving
       +
       Cranks but does not start
    */

    if(
        userSymptoms.includes("engine_stall") &&
        userSymptoms.includes("crank_no_start") &&
        itemSymptoms.includes("engine_stall") &&
        itemSymptoms.includes("crank_no_start")
    ){

        score+=20;
    }


    /*
       Strong negative penalty for irrelevant systems
       when the user clearly has a no-start condition.
    */

    const noStartContext=
        userSymptoms.includes("no_start") ||
        userSymptoms.includes("crank_no_start") ||
        userSymptoms.includes("engine_stall");


    if(
        noStartContext &&
        !itemSymptoms.includes("no_start") &&
        !itemSymptoms.includes("crank_no_start") &&
        !itemSymptoms.includes("engine_stall")
    ){

        const systemGroups=
            getSystemGroups(item);

        const relevantNoStartSystem=
            systemGroups.some(
                system=>[
                    "no_start",
                    "crank_no_start",
                    "engine_stall",
                    "starter",
                    "fuel_pressure",
                    "crankshaft",
                    "camshaft",
                    "immobilizer",
                    "pats"
                ].includes(system)
            );

        if(!relevantNoStartSystem)
            score-=35;
    }


    if(
        systemMatch===0 &&
        item.system
    ){
        score-=3;
    }


    return Math.max(
        0,
        Math.min(
            100,
            Math.round(score)
        )
    );
}


/* ============================================================
   SEARCH
============================================================ */

function performSearch(){

    resultsElement.hidden=false;


    if(!vehicleIsReady()){

        setStatus(
            t("complete_vehicle"),
            "error"
        );

        return;
    }


    const problem=
        problemInput.value.trim();


    if(!problem){

        setStatus(
            t("describe_problem"),
            "error"
        );

        return;
    }


    if(!technicalDatabase.length){

        setStatus(
            t("technical_error"),
            "error"
        );

        renderResults([]);

        return;
    }


    setStatus(t("searching"));


    const vehicle=
        getSelectedVehicle();

    const userSymptoms=
        detectUserSymptoms(problem);

    const dtcs=
        extractDTCs(problem);


    console.log(
        "Detected semantic concepts:",
        userSymptoms
    );

    console.log(
        "Detected DTCs:",
        dtcs
    );


    const results=[];


    for(
        const item
        of technicalDatabase
    ){

        const vehicleMatch=
            calculateVehicleMatch(
                item,
                vehicle
            );

        if(!vehicleMatch)
            continue;


        const yearMatch=
            calculateYearMatch(
                item,
                vehicle.year
            );

        if(!yearMatch)
            continue;


        let semanticScore=
            calculateSemanticSymptomScore(
                item,
                problem,
                userSymptoms
            );


        const coverage=
            calculateSymptomCoverage(
                item,
                userSymptoms
            );


        const dtcMatch=
            calculateDTCMatch(
                item,
                dtcs
            );


        const systemMatch=
            calculateSystemRelevance(
                item,
                userSymptoms
            );


        /*
           If semantic concepts are detected,
           use text fallback only as a secondary signal.
        */

        if(!userSymptoms.length){

            semanticScore=
                Math.max(
                    semanticScore,
                    calculateTextFallback(
                        item,
                        problem
                    )
                );

        }else if(
            semanticScore===0 &&
            coverage===0 &&
            dtcMatch===0
        ){

            semanticScore=
                calculateTextFallback(
                    item,
                    problem
                )*.6;
        }


        const score=
            calculateFinalScore({

                vehicleMatch,
                yearMatch,
                semanticScore,
                coverage,
                dtcMatch,
                systemMatch,
                userSymptoms,
                item

            });


        const evidence=
            semanticScore>0 ||
            coverage>0 ||
            dtcMatch>0 ||
            systemMatch>0;


        if(!evidence||score<10)
            continue;


        results.push({

            item,
            score,
            vehicleMatch,
            yearMatch,
            semanticScore,
            coverage,
            dtcMatch,
            systemMatch

        });
    }


    /*
       Ranking priority:

       1. Exact DTC
       2. Symptom coverage
       3. Semantic relevance
       4. System relevance
       5. Final score
    */

    results.sort(
        (a,b)=>{

            if(
                a.dtcMatch>0 &&
                b.dtcMatch===0
            )
                return -1;

            if(
                a.dtcMatch===0 &&
                b.dtcMatch>0
            )
                return 1;


            if(
                b.coverage!==a.coverage
            )
                return b.coverage-a.coverage;


            if(
                b.semanticScore!==a.semanticScore
            )
                return b.semanticScore-a.semanticScore;


            if(
                b.systemMatch!==a.systemMatch
            )
                return b.systemMatch-a.systemMatch;


            return b.score-a.score;
        }
    );


    renderResults(
        results.slice(0,10)
    );


    setStatus(
        results.length
            ? ""
            : "",
        results.length
            ? "success"
            : ""
    );
}


findButton.addEventListener(
    "click",
    performSearch
);


problemInput.addEventListener(
    "keydown",
    event=>{

        if(
            (event.ctrlKey||event.metaKey) &&
            event.key==="Enter"
        ){
            performSearch();
        }
    }
);


/* ============================================================
   RENDERING
============================================================ */

function addTag(container,text){

    const span=
        document.createElement("span");

    span.className="match-tag";

    span.textContent=text;

    container.appendChild(span);
}


function createListSection(
    heading,
    items
){

    const section=
        document.createElement("div");

    section.className="result-section";


    const headingElement=
        document.createElement("h4");

    headingElement.textContent=heading;


    const list=
        document.createElement("ul");


    for(const value of items){

        const li=
            document.createElement("li");

        li.textContent=
            getLocalizedValue(value);

        list.appendChild(li);
    }


    section.append(
        headingElement,
        list
    );


    return section;
}


function renderResults(results){

    resultList.innerHTML="";


    if(!results.length){

        resultCount.textContent="";


        const empty=
            document.createElement("div");

        empty.className="no-results";

        empty.textContent=
            t("no_results");

        resultList.appendChild(empty);

        return;
    }


    resultCount.textContent=
        results.length===1
            ? t("result_count_one")
            : t("result_count_many")
                .replace(
                    "{n}",
                    results.length
                );


    for(const result of results){

        const item=result.item;


        const card=
            document.createElement("article");

        card.className="result-card";


        const main=
            document.createElement("div");

        main.className="result-main";


        const top=
            document.createElement("div");

        top.className="result-top";


        const titleContainer=
            document.createElement("div");


        const title=
            document.createElement("h3");

        title.className="result-title";

        title.textContent=
            getLocalizedValue(
                item.title
            ) ||
            item.id ||
            "Diagnostic result";


        const system=
            document.createElement("div");

        system.className="result-system";

        system.textContent=
            item.system ||
            item.category ||
            "";


        titleContainer.append(
            title,
            system
        );


        const score=
            document.createElement("div");

        score.className="score";

        score.textContent=
            `${result.score}%`;


        top.append(
            titleContainer,
            score
        );


        main.appendChild(top);


        const tags=
            document.createElement("div");

        tags.className="match-tags";


        if(result.coverage>0){

            addTag(
                tags,
                `${t("relevance")}: ${result.coverage}%`
            );
        }


        if(result.dtcMatch>0)
            addTag(
                tags,
                "DTC match"
            );


        if(result.semanticScore>0)
            addTag(
                tags,
                "Semantic match"
            );


        if(result.systemMatch>0)
            addTag(
                tags,
                "System match"
            );


        if(tags.children.length)
            main.appendChild(tags);


        if(item.description){

            const paragraph=
                document.createElement("p");

            paragraph.className=
                "result-description";

            paragraph.textContent=
                getLocalizedValue(
                    item.description
                );

            main.appendChild(paragraph);
        }


        card.appendChild(main);


        if(
            Array.isArray(item.possible_causes) &&
            item.possible_causes.length
        ){

            card.appendChild(
                createListSection(
                    t("possible_causes"),
                    item.possible_causes
                )
            );
        }


        if(
            Array.isArray(item.diagnostic_steps) &&
            item.diagnostic_steps.length
        ){

            card.appendChild(
                createListSection(
                    t("diagnostic_steps"),
                    item.diagnostic_steps
                )
            );
        }


        if(
            Array.isArray(item.related_dtcs) &&
            item.related_dtcs.length
        ){

            card.appendChild(
                createListSection(
                    t("related_dtcs"),
                    item.related_dtcs
                )
            );
        }


        if(item.difficulty){

            const section=
                document.createElement("div");

            section.className=
                "result-section";


            const heading=
                document.createElement("h4");

            heading.textContent=
                t("difficulty");


            const value=
                document.createElement("div");

            value.style.color="#aeb9c6";
            value.style.fontSize="13px";

            value.textContent=
                getLocalizedValue(
                    item.difficulty
                );


            section.append(
                heading,
                value
            );


            card.appendChild(section);
        }


        resultList.appendChild(card);
    }
}


/* ============================================================
   HTML ESCAPING
============================================================ */

function escapeHtml(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

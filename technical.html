<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0b0f14;
    color: #e8edf2;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

header {
    height: 72px;
    background: #11161d;
    border-bottom: 1px solid #252c35;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
}

.logo {
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
    white-space: nowrap;
}

.logo span {
    color: #42a5f5;
}

.home-btn {
    color: #cbd5df;
    text-decoration: none;
    font-size: 14px;
    padding: 9px 13px;
    border: 1px solid #303943;
    border-radius: 7px;
    transition: .2s;
    white-space: nowrap;
}

.home-btn:hover {
    color: #ffffff;
    border-color: #42a5f5;
}

.lang-wrap {
    margin-left: auto;
    position: relative;
}

.lang-select {
    background: #171d25;
    color: #ffffff;
    border: 1px solid #303943;
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 14px;
    cursor: pointer;
}

main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 50px 20px 70px;
}

.hero {
    margin-bottom: 35px;
}

.hero h1 {
    margin: 0 0 12px;
    font-size: 38px;
    line-height: 1.15;
}

.hero p {
    margin: 0;
    color: #9ba7b3;
    font-size: 16px;
    line-height: 1.6;
    max-width: 760px;
}

.panel {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 28px;
}

.section-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 22px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    color: #cbd5df;
    font-size: 14px;
    margin-bottom: 8px;
}

select,
textarea {
    width: 100%;
    background: #0b0f14;
    color: #ffffff;
    border: 1px solid #303943;
    border-radius: 8px;
    padding: 12px 13px;
    font-size: 15px;
    outline: none;
    transition: .2s;
}

select:focus,
textarea:focus {
    border-color: #42a5f5;
}

select:disabled {
    opacity: .45;
    cursor: not-allowed;
}

textarea {
    min-height: 125px;
    resize: vertical;
    line-height: 1.5;
}

.button-row {
    margin-top: 25px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.find-btn {
    border: none;
    background: #42a5f5;
    color: #071018;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 22px;
    border-radius: 8px;
    cursor: pointer;
    transition: .2s;
}

.find-btn:hover {
    background: #64b5f6;
}

.find-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.status {
    display: none;
    margin-top: 22px;
    padding: 14px 16px;
    border-radius: 8px;
    background: #171d25;
    border: 1px solid #303943;
    color: #cbd5df;
    line-height: 1.5;
    font-size: 14px;
}

.status.error {
    border-color: #8b3a3a;
    color: #ffb4b4;
}

.status.success {
    border-color: #356b48;
    color: #a9e5bd;
}

.results {
    display: none;
    margin-top: 30px;
}

.result-card {
    background: #0d1218;
    border: 1px solid #252c35;
    border-radius: 9px;
    padding: 18px;
    margin-top: 12px;
}

.result-card h3 {
    margin: 0 0 8px;
    font-size: 17px;
}

.result-meta {
    color: #8e9aa6;
    font-size: 13px;
    line-height: 1.6;
}

footer {
    border-top: 1px solid #252c35;
    color: #6f7a85;
    text-align: center;
    padding: 22px 15px;
    font-size: 13px;
}

/* Mobile */
@media (max-width: 700px) {

    header {
        height: auto;
        min-height: 72px;
        padding: 12px 14px;
        gap: 10px;
        flex-wrap: wrap;
    }

    .logo {
        font-size: 21px;
    }

        font-size: 13px;
        padding: 8px 10px;
    }

    .lang-wrap {
        margin-left: auto;
    }

    .lang-select {
        max-width: 105px;
        font-size: 13px;
        padding: 8px 7px;
    }

    main {
        padding: 35px 14px 55px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .hero p {
        font-size: 15px;
    }

    .panel {
        padding: 20px 15px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .button-row {
        flex-direction: column;
        align-items: stretch;
    }

    .find-btn {
        width: 100%;
    }
}
</style>
</head>

/* =========================================================
   DATABASE
   ========================================================= */

let manufacturers = [];
let manufacturerDatabase = null;


/*
 * IMPORTANT:
 *
 * The Worker serves:
 *
 * /technical
 *
 * while the YAML files are stored in:
 *
 * /data/vehicles/
 *
 * We therefore try the root-relative path first.
 *
 * If the Worker uses another route internally,
 * the fallback paths are also attempted.
 */

const BASE_PATHS = [
    "/data/vehicles/",
    "./data/vehicles/",
    "../data/vehicles/"
];


async function fetchTextWithFallback(fileName) {

    let lastError = null;

    for (const basePath of BASE_PATHS) {

        const url = basePath + fileName;

        try {

            const response = await fetch(
                url,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status} ${response.statusText}`
                );
            }

            const text = await response.text();

            if (!text.trim()) {
                throw new Error("Empty response");
            }

            return {
                text,
                url
            };

        } catch (error) {

            lastError = error;

            console.warn(
                "AutoDecode failed to load:",
                url,
                error
            );
        }
    }

    throw lastError ||
        new Error("Unable to load " + fileName);
}


async function loadManufacturers() {

    showStatus(
        t("loading"),
        false
    );

    try {

        const result =
            await fetchTextWithFallback(
                "manufacturers.yaml"
            );

        console.log(
            "AutoDecode manufacturers loaded from:",
            result.url
        );

        const data =
            jsyaml.load(result.text);

        /*
         * Current manufacturers.yaml structure:
         *
         * schema_version: 1
         *
         * manufacturers:
         *   - id: audi
         *     name: Audi
         */

        if (
            !data ||
            !Array.isArray(data.manufacturers)
        ) {

            throw new Error(
                "Invalid manufacturers.yaml structure. Expected 'manufacturers:' array."
            );
        }

        manufacturers =
            data.manufacturers;

        manufacturerSelect.innerHTML =
            `<option value="">${escapeHtml(t("makePlaceholder"))}</option>`;

        manufacturers
            .slice()
            .sort((a, b) =>
                String(a.name || "")
                    .localeCompare(
                        String(b.name || "")
                    )
            )
            .forEach(manufacturer => {

                if (!manufacturer.id) {
                    return;
                }

                const option =
                    document.createElement("option");

                option.value =
                    manufacturer.id;

                option.textContent =
                    manufacturer.name ||
                    manufacturer.id;

                manufacturerSelect.appendChild(
                    option
                );
            });

        manufacturerSelect.disabled = false;

        showStatus(
            t("databaseLoaded"),
            false,
            true
        );

    } catch (error) {

        console.error(
            "AutoDecode database error:",
            error
        );

        showStatus(
            `${t("databaseError")}<br><br>
             <small>
             ${escapeHtml(error.message)}
             </small>`,
            true
        );
    }
}


/* =========================================================
   LOAD MANUFACTURER FILE
   ========================================================= */

async function loadManufacturerDatabase(manufacturerId) {

    const fileName =
        `${manufacturerId}.yaml`;

    const result =
        await fetchTextWithFallback(fileName);

    const data =
        jsyaml.load(result.text);

    return data;
}

   MANUFACTURER CHANGE
   ========================================================= */

    "change",
    async () => {

        resetSelect(
            modelSelect,
            t("modelPlaceholder")
        );

        resetSelect(
            generationSelect,
            t("generationPlaceholder")
        );

        resetSelect(
            yearSelect,
            t("yearPlaceholder")
        );

        resetSelect(
            engineSelect,
            t("enginePlaceholder")
        );

        modelSelect.disabled = true;
        generationSelect.disabled = true;
        yearSelect.disabled = true;
        engineSelect.disabled = true;

        manufacturerDatabase = null;

        const manufacturerId =
            manufacturerSelect.value;

        if (!manufacturerId) {
            return;
        }

        showStatus(
            t("loadingManufacturer"),
            false
        );

        try {

            manufacturerDatabase =
                await loadManufacturerDatabase(
                    manufacturerId
                );

            if (
                !manufacturerDatabase ||
                !Array.isArray(
                    manufacturerDatabase.models

                    `Invalid ${manufacturerId}.yaml structure. Expected 'models:' array.`
                );
            }

            populateModels(
                manufacturerDatabase.models
            );

            hideStatus();

        } catch (error) {

            console.error(
                "Manufacturer database error:",
                error
            );

            showStatus(
                `${t("manufacturerError")}<br><br>
                 <small>${escapeHtml(error.message)}</small>`,
                true
            );
        }
    }
);


/* =========================================================
   MODELS
   ========================================================= */

function populateModels(models) {

    resetSelect(
        modelSelect,
        t("modelPlaceholder")
    );

    models
        .slice()
        .sort((a, b) =>
            String(a.name || "")
                .localeCompare(
                    String(b.name || "")
                )
        )
        .forEach(model => {

            if (!model.id) {
                return;
            }

            const option =
                document.createElement("option");

            option.value =
                model.id;

            option.textContent =
                model.name ||
                model.id;

            modelSelect.appendChild(
                option
            );
        });

    modelSelect.disabled =
        models.length === 0;

    if (models.length === 0) {

        modelSelect.options[0].textContent =
            t("noModels");
    }
}


/* =========================================================
   MODEL CHANGE
   ========================================================= */

modelSelect.addEventListener(
    "change",
    () => {

        resetSelect(
            generationSelect,
            t("generationPlaceholder")
        );

        resetSelect(
            yearSelect,
            t("yearPlaceholder")
        );

        resetSelect(
            engineSelect,
            t("enginePlaceholder")
        );

        generationSelect.disabled = true;
        yearSelect.disabled = true;
        engineSelect.disabled = true;

        const modelId =
            modelSelect.value;

        if (!modelId ||
            !manufacturerDatabase) {
            return;
        }

        const model =
            manufacturerDatabase.models
                .find(
                    item =>
                        item.id === modelId
                );

        if (!model) {
            return;
        }

        populateGenerations(
            model.generations || []
        );
    }
);


/* =========================================================
   GENERATIONS
   ========================================================= */

function populateGenerations(generations) {

    resetSelect(
        generationSelect,
        t("generationPlaceholder")
    );

    generations
        .slice()
        .sort((a, b) =>
            String(a.name || "")
                .localeCompare(
                    String(b.name || "")
                )
        )
        .forEach(generation => {

            if (!generation.id) {
                return;
            }

            const option =
                document.createElement("option");

            option.value =
                generation.id;

            option.textContent =
                generation.name ||
                generation.id;

            generationSelect.appendChild(
                option
            );
        });

    generationSelect.disabled =

    if (generations.length === 0) {

        generationSelect.options[0].textContent =

    }
}


/* =========================================================
   GENERATION CHANGE
   ========================================================= */

generationSelect.addEventListener(
    "change",
    () => {

        resetSelect(
            yearSelect,
            t("yearPlaceholder")
        );

        resetSelect(
            engineSelect,
            t("enginePlaceholder")
        );

        yearSelect.disabled = true;
        engineSelect.disabled = true;

        const modelId =
            modelSelect.value;

        const generationId =
            generationSelect.value;

        if (
            !modelId ||
            !generationId ||
            !manufacturerDatabase
        ) {
            return;
        }

        const model =
            manufacturerDatabase.models
                .find(
                    item =>
                        item.id === modelId
                );

        if (!model) {
            return;
        }

        const generation =
            (model.generations || [])
                .find(
                    item =>
                        item.id === generationId
                );

        if (!generation) {
            return;
        }

        populateYears(
            generation
        );
    }
);


/* =========================================================
   YEARS
   ========================================================= */

function populateYears(generation) {

    resetSelect(
        yearSelect,
        t("yearPlaceholder")
    );

    const from =
        Number(
            generation.production?.from
        );

    const to =
        Number(
            generation.production?.to
        );

    if (
        !Number.isFinite(from) ||
        !Number.isFinite(to)
    ) {

        /*
         * If production years aren't available,
         * derive years from engine data.
         */

        const years = new Set();

        (generation.engines || [])
            .forEach(engine => {

                if (
                    Number.isFinite(
                        Number(engine.year_from)
                    )
                ) {
                    years.add(
                        Number(engine.year_from)
                    );
                }

                if (
                    Number.isFinite(
                        Number(engine.year_to)
                    )
                ) {
                    years.add(
                        Number(engine.year_to)
                    );
                }
            });

        [...years]
            .sort((a, b) => a - b)
            .forEach(year => addOption(
                yearSelect,
                year,
                year
            ));

    } else {

        for (
            let year = from;
            year <= to;
            year++
        ) {

            addOption(
                yearSelect,
                year,
                year
            );
        }
    }

    yearSelect.disabled =
        yearSelect.options.length <= 1;

    if (
        yearSelect.options.length <= 1
    ) {

        yearSelect.options[0].textContent =
            t("noYears");
    }
}


/* =========================================================
   YEAR CHANGE
   ========================================================= */

yearSelect.addEventListener(
    "change",
    () => {

        resetSelect(
            engineSelect,
            t("enginePlaceholder")
        );

        engineSelect.disabled = true;

        const modelId =
            modelSelect.value;

        const generationId =
            generationSelect.value;

        const selectedYear =
            Number(
                yearSelect.value
            );

        if (
            !modelId ||
            !generationId ||
            !Number.isFinite(selectedYear) ||
            !manufacturerDatabase
        ) {
            return;
        }

        const model =
            manufacturerDatabase.models
                .find(
                    item =>
                        item.id === modelId
                );

        if (!model) {
            return;
        }

        const generation =
            (model.generations || [])
                .find(
                    item =>
                        item.id === generationId
                );

        if (!generation) {
            return;
        }

        populateEngines(
            generation.engines || [],
            selectedYear
        );
    }
);


/* =========================================================
   ENGINES
   ========================================================= */

function populateEngines(
    engines,
    selectedYear
) {

    resetSelect(
        engineSelect,
        t("enginePlaceholder")
    );

    const validEngines =
        engines.filter(engine => {

            const yearFrom =
                engine.year_from != null
                    ? Number(engine.year_from)
                    : null;

            const yearTo =
                engine.year_to != null
                    ? Number(engine.year_to)
                    : null;

            if (
                yearFrom === null &&
                yearTo === null
            ) {
                return true;
            }

            if (
                yearFrom !== null &&
                selectedYear < yearFrom
            ) {
                return false;
            }

            if (
                yearTo !== null &&
                selectedYear > yearTo
            ) {
                return false;
            }

            return true;
        });

    validEngines.forEach(engine => {

        if (!engine.id) {
            return;
        }

        const option =
            document.createElement("option");

        option.value =
            engine.id;

        option.textContent =
            formatEngineName(
                engine
            );

        engineSelect.appendChild(
            option
        );
    });

    engineSelect.disabled =
        validEngines.length === 0;

    if (
        validEngines.length === 0
    ) {

        engineSelect.options[0].textContent =
            t("noEngines");
    }
}


function formatEngineName(engine) {

    let name =
        engine.name ||
        engine.id;

    const details = [];

    if (engine.power_kw != null) {
        details.push(
            `${engine.power_kw} kW`
        );
    }

    if (engine.power_hp != null) {
        details.push(
            `${engine.power_hp} hp`
        );
    }

    if (
        Array.isArray(engine.engine_codes) &&
        engine.engine_codes.length
    ) {
        details.push(
            engine.engine_codes.join(", ")
        );
    }

    if (details.length) {

        name +=
            ` — ${details.join(" / ")}`;
    }

    return name;
}


/* =========================================================
   FIND SOLUTION
   ========================================================= */

findButton.addEventListener(
    "click",
    () => {

        const manufacturerId =
            manufacturerSelect.value;

        const modelId =
            modelSelect.value;

        const generationId =
            generationSelect.value;

        const year =
            Number(yearSelect.value);

        const engineId =
            engineSelect.value;

        const problem =
            problemInput.value.trim();

        if (
            !manufacturerId ||
            !modelId ||
            !generationId ||
            !Number.isFinite(year) ||
            !engineId
        ) {

            showStatus(
                t("selectVehicle"),
                true
            );

            return;
        }

        if (!problem) {

            showStatus(
                t("describeProblem"),
                true
            );

            problemInput.focus();

            return;
        }

        const manufacturer =
            manufacturers.find(
                item =>
                    item.id === manufacturerId
            );

        const model =
            manufacturerDatabase.models
                .find(
                    item =>
                        item.id === modelId
                );

        const generation =
            model.generations
                .find(
                    item =>
                        item.id === generationId
                );

        const engine =
            generation.engines
                .find(
                    item =>
                        item.id === engineId
                );

        const vehicleSelection = {

            manufacturer:
                manufacturer?.id || null,

            manufacturer_name:
                manufacturer?.name || null,

            model:
                model?.id || null,

            model_name:
                model?.name || null,

            generation:
                generation?.id || null,

            generation_name:
                generation?.name || null,

            year,

            engine:
                engine?.id || null,

            engine_name:
                engine?.name || null,

            engine_code:
                Array.isArray(
                    engine?.engine_codes
                )
                    ? engine.engine_codes
                    : [],

            fuel:
                engine?.fuel || null,

            power_kw:
                engine?.power_kw ?? null,

            power_hp:
                engine?.power_hp ?? null,

            displacement_cc:
                engine?.displacement_cc ?? null,

            problem
        };

        console.log(
            "AutoDecode vehicle selection:",
            vehicleSelection
        );

        displaySelectedVehicle(
            vehicleSelection
        );

        showStatus(
            t("solutionReady"),
            false,
            true
        );
    }
);


/* =========================================================
   RESULT DISPLAY
   ========================================================= */

function displaySelectedVehicle(
    vehicle
) {

    resultsContainer.innerHTML = "";

    const card =
        document.createElement("div");

    card.className =
        "result-card";

    const title =
        document.createElement("h3");

    title.textContent =
        `${vehicle.manufacturer_name} ${vehicle.model_name}`;

    const meta =
        document.createElement("div");

    meta.className =
        "result-meta";

    const engineCodes =
        vehicle.engine_code?.length
            ? vehicle.engine_code.join(", ")
            : "—";

    meta.innerHTML = `
        <strong>${escapeHtml(t("technicalDetails"))}</strong><br>
        ${escapeHtml(vehicle.manufacturer_name || "—")}
        ${escapeHtml(vehicle.model_name || "")}<br>
        ${escapeHtml(vehicle.generation_name || "—")} ·
        ${escapeHtml(String(vehicle.year))}<br>
        ${escapeHtml(vehicle.engine_name || "—")}<br>
        Engine code: ${escapeHtml(engineCodes)}<br>
        Fuel: ${escapeHtml(vehicle.fuel || "—")}<br>
        Power:
        ${escapeHtml(
            vehicle.power_kw != null
                ? vehicle.power_kw + " kW"
                : "—"
        )}
        /
        ${escapeHtml(
            vehicle.power_hp != null
                ? vehicle.power_hp + " hp"
                : "—"
        )}
        <br><br>
        <strong>Problem:</strong><br>
        ${escapeHtml(vehicle.problem)}
    `;

    card.appendChild(title);
    card.appendChild(meta);

    resultsContainer.appendChild(card);

    resultsBox.style.display =
        "block";
}


/* =========================================================
   HELPERS
   ========================================================= */

function resetSelect(
    select,
    placeholder
) {

    select.innerHTML = "";

    const option =
        document.createElement("option");

    option.value = "";
    option.textContent = placeholder;

    select.appendChild(option);
}


function addOption(
    select,
    value,
    text
) {

    const option =
        document.createElement("option");

    option.value =
        String(value);

    option.textContent =
        String(text);

    select.appendChild(option);
}


function showStatus(
    message,
    error = false,
    success = false
) {

    statusBox.innerHTML =
        message;

    statusBox.className =
        "status";

    if (error) {
        statusBox.classList.add("error");
    }

    if (success) {
        statusBox.classList.add("success");
    }

    statusBox.style.display =
        "block";
}


function hideStatus() {

    statusBox.style.display =
        "none";
}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

   INITIALIZATION
   ========================================================= */

updateLanguage();

loadManufacturers();

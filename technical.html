<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AutoDecode – Repair & Technical</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    background:#0b0f14;
    color:#e8edf3;
    font:15px Arial,sans-serif
}

header{
    min-height:72px;
    background:#111720;
    border-bottom:1px solid #26303b;
    display:flex;
    align-items:center;
    padding:12px 24px;
    gap:20px
}

.logo{
    font-size:24px;
    font-weight:700
}

.logo span,
h1 span{
    color:#4da3ff
}

.home{
    color:#cbd5e1;
    text-decoration:none;
    border:1px solid #34404d;
    border-radius:7px;
    padding:9px 13px
}

.langs{
    margin-left:auto;
    position:relative
}

.langbtn,
select,
textarea{
    background:#0c1219;
    color:#e8edf3;
    border:1px solid #303b48;
    border-radius:8px
}

.langbtn{
    padding:8px 10px;
    cursor:pointer
}

.langmenu{
    display:none;
    position:absolute;
    right:0;
    top:43px;
    background:#151c25;
    border:1px solid #34404d;
    border-radius:8px;
    overflow:hidden;
    z-index:20
}

.langmenu.open{
    display:block
}

.langmenu div{
    padding:9px 12px;
    white-space:nowrap;
    cursor:pointer
}

.langmenu div:hover{
    background:#202b37
}

main{
    width:min(1050px,calc(100% - 22px));
    margin:auto;
    padding:44px 0 70px
}

.hero{
    margin-bottom:30px
}

.hero h1{
    font-size:clamp(30px,5vw,46px);
    margin:0 0 10px
}

.hero p{
    color:#8f9baa;
    line-height:1.6;
    max-width:800px
}

.panel{
    background:#111720;
    border:1px solid #26303b;
    border-radius:12px;
    padding:24px
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px
}

.full{
    grid-column:1/-1
}

label{
    font-size:13px;
    color:#aeb9c6;
    font-weight:600
}

select{
    min-height:46px;
    padding:11px 13px
}

textarea{
    min-height:125px;
    padding:12px 13px;
    resize:vertical;
    line-height:1.5;
    outline:0
}

select:focus,
textarea:focus{
    border-color:#4da3ff
}

select:disabled{
    opacity:.45
}

.vehicle{
    margin-top:17px;
    padding:12px 14px;
    background:#0c1219;
    border:1px solid #26303b;
    border-radius:8px;
    color:#9ca8b6;
    font-size:13px
}

.actions{
    margin-top:20px;
    display:flex;
    gap:14px;
    align-items:center;
    flex-wrap:wrap
}

.find{
    background:#4da3ff;
    color:#06101b;
    border:0;
    border-radius:8px;
    padding:13px 22px;
    font-weight:700;
    cursor:pointer
}

.find:disabled{
    opacity:.5;
    cursor:not-allowed
}

.status{
    font-size:13px;
    color:#8f9baa
}

.success{
    color:#72d79a
}

.error{
    color:#ff7777
}

.results{
    margin-top:30px
}

.rhead{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    gap:15px
}

.rhead h2{
    margin:0;
    font-size:21px
}

.count{
    color:#8995a3;
    font-size:13px
}

.card{
    background:#0c1219;
    border:1px solid #293542;
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden
}

.top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:19px
}

.title{
    font-size:18px;
    margin:0 0 7px
}

.system{
    font-size:12px;
    color:#8995a3;
    text-transform:uppercase
}

.score{
    color:#4da3ff;
    border:1px solid #29425d;
    background:#141d27;
    border-radius:7px;
    padding:7px 9px;
    height:max-content;
    white-space:nowrap;
    font-weight:700
}

.desc{
    color:#aeb9c6;
    line-height:1.6;
    margin:13px 0 0
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px
}

.tag{
    font-size:11px;
    color:#b9c7d6;
    border:1px solid #303c49;
    background:#141c25;
    padding:5px 8px;
    border-radius:5px
}

.section{
    border-top:1px solid #202b36;
    padding:15px 19px
}

.section h4{
    margin:0 0 9px;
    font-size:13px
}

.section ul{
    margin:0;
    padding-left:20px;
    color:#aeb9c6;
    font-size:13px;
    line-height:1.6
}

.empty{
    padding:25px;
    text-align:center;
    color:#8f9baa;
    border:1px dashed #303b48;
    border-radius:9px
}

.debug{
    margin-top:8px;
    font-size:11px;
    color:#687585;
    word-break:break-word
}

footer{
    text-align:center;
    border-top:1px solid #202a34;
    padding:22px;
    color:#657180;
    font-size:12px
}

@media(max-width:700px){

    header{
        padding:12px 14px;
        gap:10px
    }

    .logo{
        font-size:21px
    }

    .home{
        padding:8px 10px
    }

    .grid{
        grid-template-columns:1fr
    }

    .full{
        grid-column:auto
    }

    .panel{
        padding:17px
    }

    .top{
        flex-direction:column
    }

    .rhead{
        flex-direction:column
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a
        class="home"

    ></a>

    <div class="langs">

        <button

        <div

        >

            <div data-l="fr">🇫🇷 Français</div>

            <div data-l="it">🇮🇹 Italiano</div>
            <div data-l="nl">🇳🇱 Nederlands</div>
        </div>

    </div>

</header>

<main>

<section class="hero">

    <h1>
        <span>Repair</span> & Technical
    </h1>

    <p id="intro"></p>

</section>

<section class="panel">

<div class="grid">

    <div class="field">

        <label id="lm"></label>

        <select id="make">
            <option value=""></option>
        </select>

    </div>

    <div class="field">

        <label id="lmodel"></label>

        <select
            id="model"
            disabled
        >
            <option value=""></option>
        </select>

    </div>

    <div class="field">

        <label id="lg"></label>

        <select
            id="generation"
            disabled
        >
            <option value=""></option>
        </select>

    </div>

    <div class="field">

        <label id="ly"></label>

        <select
            id="year"
            disabled
        >
            <option value=""></option>
        </select>

    </div>

    <div class="field">

        <label id="le"></label>

        <select
            id="engine"
            disabled
        >
            <option value=""></option>
        </select>

    </div>

    <div class="field full">

        <label id="lp"></label>

        <textarea id="problem"></textarea>

    </div>

</div>

<div
    class="vehicle"
    id="vehicle"
    hidden
></div>

<div class="actions">

    <button
        class="find"
        id="find"
        disabled
    ></button>

    <div
        class="status"
        id="status"
    ></div>

</div>

<section
    class="results"
    id="results"
    hidden
>

    <div class="rhead">

        <h2 id="rh"></h2>

        <div
            class="count"
            id="count"
        ></div>

    </div>

    <div id="list"></div>

</section>

</section>

</main>

<footer>
    © <span id="fy"></span> AutoDecode
</footer>

        'camshaft',
        'injector'
    ]

};


const W={

    poor_power:25,
    low_rpm_power_loss:28,
    limp_mode:30,
    turbo:28,
    egr:24,
    dpf:24,
    maf:24,
    map:24,
    injector:23,
    fuel_pressure:31,
    crankshaft:31,
    camshaft:29,
    synchronization:30,
    engine_stall:40,
    no_start:34,
    hard_start:25,
    rough_idle:24,
    misfire:26,
    coolant:20,
    overheating:30,
    oil_pressure:30,
    battery:20,
    alternator:20,
    voltage:20

};


/* =========================================================
   DOM / NORMALIZATION HELPERS
   ========================================================= */

const $=x=>document.getElementById(x);


const N=s=>
    String(s??'')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .replace(/[^\p{L}\p{N} ]+/gu,' ')
        .replace(/\s+/g,' ')
        .trim();


const C=s=>
    N(s).replace(/ /g,'_');


const esc=s=>
    String(s??'').replace(
        /[&<>"']/g,
        m=>({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
        }[m])
    );


/* =========================================================
   GENERIC YAML VALUE HELPERS
   ========================================================= */

function localizedValue(value){

    if(value==null){
        return '';
    }

    if(typeof value==='string'){
        return value;
    }

    if(Array.isArray(value)){
        return value.join(', ');
    }

    if(typeof value==='object'){

        return (
            value[L] ??
            value.en ??
            value.ro ??
            Object.values(value)[0] ??
            ''
        );
    }

    return String(value);
}


function localizedArray(value){

    if(value==null){
        return [];
    }

    if(Array.isArray(value)){
        return value
            .filter(x=>x!=null)
            .map(x=>String(x));
    }

    if(typeof value==='object'){

        let selected=
            value[L] ??
            value.en ??
            value.ro;

        if(Array.isArray(selected)){
            return selected
                .filter(x=>x!=null)
                .map(x=>String(x));
        }

        if(selected!=null){
            return [String(selected)];
        }

        return [];
    }

    return [String(value)];
}


function valueArray(value){

    if(value==null){
        return [];
    }

    if(Array.isArray(value)){
        return value;
    }

    return [value];
}


/* =========================================================
   TEXT EXTRACTION
   ========================================================= */

function textValue(value){

    if(value==null){
        return '';
    }

    if(typeof value==='string'){
        return value;
    }

    if(Array.isArray(value)){
        return value
            .map(textValue)
            .filter(Boolean)
            .join(' ');
    }

    if(typeof value==='object'){

        return Object.values(value)
            .map(textValue)
            .filter(Boolean)
            .join(' ');
    }

    return String(value);
}


function txt(x){

    return N([

        x.title,
        x.description,
        x.system,
        x.category,
        x.symptoms,
        x.keywords,
        x.possible_causes,
        x.diagnostic_steps,
        x.related_dtcs

    ]
    .map(textValue)
    .filter(Boolean)
    .join(' '));
}


function has(t,a){

    return a.some(x=>
        t.includes(N(x))
    );
}


/* =========================================================
   DIAGNOSTIC CONCEPT DETECTION
   ========================================================= */

function concepts(q){

    let n=N(q);

    let p=[];

    for(
        let [c,a]
        of Object.entries(A)
    ){

        if(has(n,a)){
            p.push(c);
        }

    }

    return [...new Set(p)];
}


function expanded(p){

    return [
        ...new Set([
            ...p,
            ...p.flatMap(c=>E[c]||[])
        ])
    ];
}


/* =========================================================
   TITLE / SYSTEM
   ========================================================= */

function title(r){

    return localizedValue(r.title) ||
           r.id ||
           'Diagnostic information';
}


function systemName(r){

    if(Array.isArray(r.system)){
        return r.system.join(' / ');
    }

    return localizedValue(r.system) ||
           localizedValue(r.category) ||
           'diagnostics';
}


/* =========================================================
   VEHICLE MATCHING
   ========================================================= */

function matchesValue(selected,value){

    if(
        value==null ||
        value==='all'
    ){
        return true;
    }

    if(Array.isArray(value)){

        return value.some(x=>
            N(x)===N(selected)
        );
    }

    return N(value)===N(selected);
}


function vehicleMatch(r,v){

    let x=r.vehicle||{};

    return (

        matchesValue(
            v.m.id,
            x.models
        )

        &&

        matchesValue(
            v.g.id,
            x.generations
        )

        &&

        matchesValue(
            v.e.id,
            x.engines
        )

    );
}


/* =========================================================
   DIAGNOSTIC SCORING
   ========================================================= */

function score(r,p,q){

    let t=txt(r);

    let symptoms=
        localizedArray(r.symptoms)
        .map(C);

    let s=new Set(symptoms);

    let keywords=
        localizedArray(r.keywords)
        .map(N);

    let z=0;

    let m=[];


    for(const c of p){

        let a=
            A[c]||
            [c.replaceAll('_',' ')];


        let direct=s.has(c);


        let key=keywords.some(x=>
            a.some(y=>
                x===N(y) ||
                x.includes(N(y)) ||
                N(y).includes(x)
            )
        );


        let phrase=has(t,a);


        if(direct){

            z+=W[c]||20;
            m.push(c);

        }

        else if(key){

            z+=(W[c]||20)*.72;
            m.push(c);

        }

        else if(phrase){

            z+=(W[c]||20)*.42;
            m.push(c);

        }

    }


    /* Derived concepts are hints only. */

    for(
        const c of expanded(p)
            .filter(x=>!p.includes(x))
    ){

        if(
            has(
                t,
                A[c]||
                [c.replaceAll('_',' ')]
            )
        ){

            z+=4;

        }

    }


    let dtcs=
        localizedArray(r.related_dtcs);


    if(
        dtcs.some(x=>
            N(q).includes(N(x))
        )
    ){

        z+=35;

    }


    if(
        p.length>=2 &&
        p.every(c=>
            has(
                t,
                A[c]||
                [c.replaceAll('_',' ')]
            )
        )
    ){

        z+=18;

    }


    let spec=N([

        r.id,
        r.system,
        r.keywords,
        r.related_dtcs

    ]
    .map(textValue)
    .join(' '));


    if(
        p.includes('low_rpm_power_loss') &&
        has(
            spec,
            [
                'p0299',
                'underboost',
                'turbo',
                'boost'
            ]
        )
    ){

        z+=24;

    }


    if(
        p.includes('limp_mode') &&
        has(
            spec,
            [
                'underboost',
                'overboost',
                'turbo',
                'egr',
                'dpf',
                'fuel pressure'
            ]
        )
    ){

        z+=16;

    }


    if(
        p.includes('poor_power') &&
        p.includes('limp_mode') &&
        has(
            spec,
            [
                'injector circuit',
                'coolant',
                'coolant temperature',
                'system voltage'
            ]
        )
    ){

        z-=20;

    }


    return{

        r,

        s:
            Math.max(
                0,
                Math.min(
                    100,
                    z
                )
            ),

        m:[
            ...new Set(m)
        ]

    };

}

/* =========================================================
   YAML FETCH
   ========================================================= */

async function yaml(u){

    let r=await fetch(

        u+
        (u.includes('?')?'&':'?')+
        'v='+Date.now(),

        {

            cache:'no-store',

            headers:{
                Accept:
                    'text/yaml,text/plain,application/x-yaml,*/*'
            }

        }

    );


    if(!r.ok){

        throw Error(
            'HTTP '+r.status+
            ' — '+u
        );

    }


    let text=
        await r.text();


    if(!text.trim()){

        throw Error(
            'Empty response — '+u
        );

    }


    try{

        return jsyaml.load(text);

    }

    catch(e){

        throw Error(
            'YAML parse error in '+u+
            ': '+e.message
        );

    }

}


/* =========================================================
   YEAR GENERATION
   ========================================================= */

function years(g){

    let a=
        Number(
            g?.production?.from
        )||0;


    let b=
        Number(
            g?.production?.to
        )||
        new Date().getFullYear();


    if(
        !a ||
        b<a
    ){

        return [];

    }


    return Array.from(

        {
            length:
                Math.max(
                    0,
                    b-a+1
                )
        },

        (_,i)=>
            String(a+i)

    );

}

/* =========================================================
   TECHNICAL DATABASE
   ========================================================= */

async function loadTech(id){

    if(
        loaded===id &&
        Array.isArray(tdb)
    ){

        return;

    }


    let url=
        'data/technical/diagnostics/'+
        encodeURIComponent(id)+
        '.yaml';


    $('status').textContent=
        (I[L]||I.en).loading;

    $('status').className='status';


    try{

        let r=
            await fetch(

                url+
                '?v='+Date.now(),

                {

                    cache:'no-store',

                    headers:{
                        Accept:
                            'text/yaml,text/plain,application/x-yaml,*/*'
                    }

                }

            );


        if(!r.ok){

            throw Error(
                'HTTP '+r.status+
                ' while loading '+url
            );

        }


        let text=
            await r.text();


        if(!text.trim()){

            throw Error(
                'Empty technical database: '+url
            );

        }


        let d;


        try{

            d=
                jsyaml.load(text);

        }

        catch(e){

            throw Error(
                'YAML parse error in '+url+
                ': '+e.message
            );

        }


        if(
            !d ||
            !Array.isArray(
                d.technical_data
            )
        ){

            throw Error(
                'Invalid technical_data structure in '+url
            );

        }


        tdb=
            d.technical_data
                .filter(
                    x=>
                        x &&
                        typeof x==='object'
                );


        loaded=id;


        console.log(
            'TECH DATABASE LOADED:',
            id,
            tdb.length,
            'entries'
        );


        $('status').textContent=
            (I[L]||I.en).ready;

        $('status').className=
            'status success';


    }

    catch(e){

        console.error(
            'TECH DATABASE ERROR:',
            {
                manufacturer:id,
                url:url,
                error:e
            }
        );


        tdb=[];
        loaded='';


        $('status').textContent=
            (I[L]||I.en).error;

        $('status').className=
            'status error';


        let debug=
            document.getElementById(
                'debug-status'
            );


        if(debug){

            debug.textContent=
                e.message;

        }


        throw e;

    }

}

        steps.length

        ?

        `<div class="section">

            <h4>
                ${esc(u.steps)}
            </h4>

            <ul>

                ${
                    steps
                        .map(
                            a=>
                                `<li>${esc(a)}</li>`
                        )
                        .join('')
                }

            </ul>

        </div>`

        :

        ''
    }


    ${
        dtcs.length

        ?

        `<div class="section">

            <h4>
                ${esc(u.dtcs)}
            </h4>

            <ul>

                ${
                    dtcs
                        .map(
                            a=>
                                `<li>${esc(a)}</li>`
                        )
                        .join('')
                }

            </ul>

        </div>`

        :

        ''
    }


    ${
        r.difficulty

        ?

        `<div class="section">

            <h4>
                ${esc(u.difficulty)}
            </h4>

            <div class="desc">
                ${esc(
                    localizedValue(
                        r.difficulty
                    )
                )}
            </div>

        </div>`

        :

        ''
    }

</article>

`;

                }
            ).join('')

            :

            `<div class="empty">
                ${esc(u.none)}
            </div>`;


        $('status').textContent=
            u.ready;

        $('status').className=
            'status success';


        let debug=
            document.getElementById(
                'debug-status'
            );


        if(debug){

            debug.textContent=
                `${tdb.length} technical entries loaded · ${vehicleRows.length} compatible with selected vehicle · ${rows.length} relevant`;

        }

    }

    catch(e){

        console.error(
            'Diagnostic search error:',
            e
        );


        $('status').textContent=
            u.error;

        $('status').className=
            'status error';


        let debug=
            document.getElementById(
                'debug-status'
            );


        if(debug){

            debug.textContent=
                e.message;

        }

    }


    $('find').disabled=false;

    showVehicle();

};


/* =========================================================
   INITIALIZATION
   ========================================================= */

$('fy').textContent=
    new Date().getFullYear();


setLang();


$('status').textContent=
    I.en.loading;


/*
 * Hidden technical debug line.
 * It becomes useful if a database fails.
 */

let debugStatus=
    document.createElement('div');

debugStatus.id=
    'debug-status';

debugStatus.className=
    'debug';

$('status')
    .parentElement
    .appendChild(
        debugStatus
    );


/* =========================================================
   MANUFACTURERS DATABASE
   ========================================================= */

(async()=>{

    try{

        let d=
            await yaml(
                'data/vehicles/manufacturers.yaml'
            );


        if(
            !d ||
            !Array.isArray(
                d.manufacturers
            )
        ){

            throw Error(
                'Invalid manufacturers database structure'
            );

        }


        makers=
            d.manufacturers;


        fill(
            'make',
            makers,
            'sm'
        );


        $('status').textContent='';

        $('status').className=
            'status';

    }

    catch(e){

        console.error(
            'MANUFACTURERS DATABASE ERROR:',
            e
        );


        $('status').textContent=
            I[L].error;

        $('status').className=
            'status error';


        debugStatus.textContent=
            e.message;

    }

})();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDecode – Repair & Technical</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#0b0f14;color:#e8edf3}
body{min-height:100vh}

header{
min-height:72px;
background:#111720;
border-bottom:1px solid #26303b;
display:flex;
align-items:center;
padding:12px 24px;
gap:20px
}

.logo{
font-size:24px;
font-weight:700;
letter-spacing:-.5px;
white-space:nowrap
}

.logo span,.hero h1 span{color:#4da3ff}

.home-link{
color:#cbd5e1;
text-decoration:none;
font-size:14px;
padding:9px 13px;
border:1px solid #34404d;
border-radius:7px
}

.home-link:hover{
color:#fff;
border-color:#4da3ff
}

.language-selector{
margin-left:auto;
position:relative
}

.language-button{
background:#18202a;
color:#e8edf3;
border:1px solid #34404d;
border-radius:7px;
padding:8px 10px;
cursor:pointer;
font-size:14px
}

.language-menu{
display:none;
position:absolute;
right:0;
top:calc(100% + 7px);
background:#151c25;
border:1px solid #34404d;
border-radius:8px;
min-width:145px;
overflow:hidden;
z-index:1000
}

.language-menu.active{display:block}

.language-option{
padding:10px 12px;
cursor:pointer;
color:#dbe4ee;
font-size:14px
}

.language-option:hover{background:#202b37}

main{
width:min(1050px,calc(100% - 32px));
margin:0 auto;
padding:48px 0 70px
}

.hero{margin-bottom:34px}

.hero h1{
margin:0 0 10px;
font-size:clamp(30px,5vw,46px);
line-height:1.1
}

.hero p{
margin:0;
color:#8f9baa;
font-size:16px;
line-height:1.6;
max-width:800px
}

.panel{
background:#111720;
border:1px solid #26303b;
border-radius:12px;
padding:24px
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:18px
}

.field{
display:flex;
flex-direction:column;
gap:7px
}

.field.full{grid-column:1/-1}

label{
font-size:13px;
color:#aeb9c6;
font-weight:600
}

select,textarea{
width:100%;
background:#0c1219;
color:#e8edf3;
border:1px solid #303b48;
border-radius:8px;
padding:12px 13px;
font-size:15px;
outline:none
}

select{min-height:46px}

select:focus,textarea:focus{border-color:#4da3ff}

select:disabled{opacity:.45}

textarea{
min-height:125px;
resize:vertical;
line-height:1.5
}

.actions{
margin-top:22px;
display:flex;
align-items:center;
gap:14px;
flex-wrap:wrap
}

.find-button{
background:#4da3ff;
color:#06101b;
border:0;
border-radius:8px;
padding:13px 22px;
font-size:15px;
font-weight:700;
cursor:pointer
}

.find-button:hover{filter:brightness(1.08)}

.find-button:disabled{
opacity:.5;
cursor:not-allowed
}

.status{
font-size:13px;
color:#8f9baa
}

.status.error{color:#ff7777}
.status.success{color:#72d79a}

.results{margin-top:30px}

.results-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:15px
}

.results-header h2{
margin:0;
font-size:21px
}

.result-count{
color:#8995a3;
font-size:13px
}

.result-card{
background:#0c1219;
border:1px solid #293542;
border-radius:10px;
margin-bottom:14px;
overflow:hidden
}

.result-main{padding:19px}

.result-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px
}

.result-title{
margin:0 0 7px;
font-size:18px;
line-height:1.35
}

.result-system{
color:#8995a3;
font-size:12px;
text-transform:uppercase;
letter-spacing:.5px
}

.score{
flex:0 0 auto;
font-size:15px;
font-weight:700;
color:#4da3ff;
background:rgba(77,163,255,.08);
border:1px solid rgba(77,163,255,.2);
border-radius:7px;
padding:7px 9px
}

.result-description{
color:#aeb9c6;
font-size:14px;
line-height:1.6;
margin:14px 0 0
}

.match-tags{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:14px
}

.match-tag{
font-size:11px;
color:#b9c7d6;
border:1px solid #303c49;
background:#141c25;
padding:5px 8px;
border-radius:5px
}

.result-section{
border-top:1px solid #202b36;
padding:16px 19px
}

.result-section h4{
margin:0 0 10px;
font-size:13px;
color:#dbe4ee
}

.result-section ul{
margin:0;
padding-left:20px;
color:#aeb9c6;
font-size:13px;
line-height:1.65
}

.result-section li{margin-bottom:4px}

.no-results{
padding:25px;
text-align:center;
color:#8f9baa;
border:1px dashed #303b48;
border-radius:9px
}

.selected-vehicle{
margin-top:18px;
padding:12px 14px;
background:#0c1219;
border:1px solid #26303b;
border-radius:8px;
color:#9ca8b6;
font-size:13px
}

.selected-vehicle strong{color:#dce5ee}

footer{
border-top:1px solid #202a34;
padding:22px 16px;
text-align:center;
color:#657180;
font-size:12px
}

@media(max-width:700px){
header{
padding:12px 14px;
gap:10px;
flex-wrap:wrap

.logo{font-size:21px}

.home-link{
font-size:13px;
padding:8px 10px
}

.language-selector{margin-left:auto}

main{
width:calc(100% - 22px);
padding-top:30px
}

.panel{padding:17px}

.form-grid{grid-template-columns:1fr}

.field.full{grid-column:auto}

.result-top{flex-direction:column}

.score{align-self:flex-start}
}
</style>
</head>

<label for="generation" data-i18n="generation">Generation / Platform</label>

</div>

</div>

<button

</div>

<div id="resultList"></div>

</section>

</section>
</main>

/* ============================================================
   UI HELPERS
============================================================ */

function t(k){
return translations[currentLanguage]?.[k]||
translations.en[k]||
k;
}

function localizePage(){

document.documentElement.lang=currentLanguage;

document
.querySelectorAll("[data-i18n]")
.forEach(e=>{
e.textContent=t(e.getAttribute("data-i18n"));
});

document
.querySelectorAll("[data-i18n-placeholder]")
.forEach(e=>{
e.placeholder=
t(e.getAttribute("data-i18n-placeholder"));
});

document.getElementById("languageButton").textContent=
`${flags[currentLanguage]} ${currentLanguage.toUpperCase()} ▾`;

}

function setStatus(message,type=""){

statusElement.textContent=message;

statusElement.className="status";

if(type)
statusElement.classList.add(type);

}

function resetSelect(select,key){

select.innerHTML="";

const option=
document.createElement("option");

option.value="";
option.textContent=t(key);

select.appendChild(option);

}

function populateSelect(select,items){

for(const item of items||[]){

if(!item?.id)
continue;

const option=
document.createElement("option");

option.value=item.id;
option.textContent=item.name||item.id;

select.appendChild(option);

}

}

function escapeRegex(v){

return String(v)
.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

}

function normalizeText(value){

return String(value??"")
.toLowerCase()
.replace(/[’‘`´]/g,"'")
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g," ")
.replace(/\s+/g," ")
.trim();

}

function tokenize(value){

return new Set(
normalizeText(value)
.split(" ")
.filter(Boolean)
);

}

function phraseMatches(text,phrase){

const a=normalizeText(text);
const p=normalizeText(phrase);

if(!a||!p)
return false;

return (` ${a} `).includes(` ${p} `);

}

function tokenWindowMatches(text,phrase){

const a=
normalizeText(text)
.split(" ")
.filter(Boolean);

const p=
normalizeText(phrase)
.split(" ")
.filter(Boolean);

if(p.length<2||p.length>6)
return false;

for(let i=0;i<a.length;i++){

let pos=i;
let ok=true;

for(const word of p){

let found=-1;

for(
let j=pos;
j<Math.min(a.length,pos+6);
j++
){

if(a[j]===word){

found=j;
break;

}

}

if(found<0){

ok=false;
break;

}

pos=found+1;

}

if(ok)
return true;

}

return false;

}

function fuzzyTokenMatch(text,alias){

const a=
normalizeText(text)
.split(" ")
.filter(Boolean);

const p=
normalizeText(alias)
.split(" ")
.filter(Boolean);

if(p.length!==1||p[0].length<6)
return false;

const target=p[0];

return a.some(w=>
w===target||
w.startsWith(target)||
(target.startsWith(w)&&w.length>=5)
);

}

function matchesAlias(text,alias){

return phraseMatches(text,alias)||
tokenWindowMatches(text,alias)||
fuzzyTokenMatch(text,alias);

}


/* ============================================================
   EXTERNAL SEMANTIC DICTIONARY
============================================================ */

/*
   The old giant inline symptomAliases object has been removed.

   The source of truth is now:

   data/technical/semantic/technical_terms.yaml

   The loader intentionally supports several YAML shapes so the
   semantic database can evolve without requiring changes here.
*/

function canonical(id){

if(id==null)
return "";

const n=
normalizeText(id)
.replace(/ /g,"_");

return canonicalAlias[n]||n;

}


function normalizeAliasList(value){

const result=[];

if(value==null)
return result;


/* aliases: ["a","b"] */

if(Array.isArray(value)){

for(const v of value){

if(typeof v==="string")
result.push(v);

else if(v&&typeof v==="object"){

for(const nested of Object.values(v)){

if(Array.isArray(nested))
result.push(...nested.filter(x=>typeof x==="string"));

else if(typeof nested==="string")
result.push(nested);

}

}

}

return result;

}


/* aliases: "single phrase" */

if(typeof value==="string")
return [value];


/*
   aliases:
     en: [...]
     ro: [...]
*/

if(typeof value==="object"){

for(const nested of Object.values(value)){

if(Array.isArray(nested))
result.push(...nested.filter(x=>typeof x==="string"));

else if(typeof nested==="string")
result.push(nested);

}

}

return result;

}


function registerAlias(conceptId,alias){

const concept=
canonical(conceptId);

if(!concept||!alias)
return;

const clean=
String(alias).trim();

if(!clean)
return;

if(!symptomAliases[concept])
symptomAliases[concept]=[];

if(!symptomAliases[concept].includes(clean))
symptomAliases[concept].push(clean);

}


function buildSemanticIndex(data){

symptomAliases={};
canonicalAlias={};
semanticRelationships=[];
semanticPriority={};
semanticConcepts={};

if(!data||typeof data!=="object")
throw Error("Invalid semantic dictionary structure");


/* ------------------------------------------------------------
   canonical_alias
------------------------------------------------------------ */

if(data.canonical_alias&&typeof data.canonical_alias==="object"){

for(const [from,to] of Object.entries(data.canonical_alias)){

if(typeof to==="string")
canonicalAlias[
normalizeText(from).replace(/ /g,"_")
]=
normalizeText(to).replace(/ /g,"_");

}

}


/* ------------------------------------------------------------
   concepts
------------------------------------------------------------ */

const concepts=
data.concepts&&typeof data.concepts==="object"
?data.concepts
:{};

for(const [conceptId,conceptData] of Object.entries(concepts)){

const canonicalId=
canonical(conceptId);

semanticConcepts[canonicalId]=conceptData;


/*
   aliases can be:

   aliases:
     en: [...]
     ro: [...]

   OR

   aliases:
     - ...
*/

let aliases=[];

if(conceptData&&typeof conceptData==="object"){

aliases=
normalizeAliasList(
conceptData.aliases
);

}


/*
   Some versions may use terms / phrases instead of aliases.
*/

if(conceptData&&typeof conceptData==="object"){

aliases.push(
...normalizeAliasList(conceptData.terms)
);

aliases.push(
...normalizeAliasList(conceptData.phrases)
);

}


/*
   Register the canonical concept ID itself as an alias.
   This allows technical records containing e.g.
   "fuel_pressure" to participate in semantic matching.
*/

aliases.push(canonicalId);


for(const alias of aliases)
registerAlias(canonicalId,alias);

}


/* ------------------------------------------------------------
   relationships
------------------------------------------------------------ */

if(Array.isArray(data.relationships)){

for(const relationship of data.relationships){

if(!relationship||typeof relationship!=="object")
continue;

const required=
Array.isArray(relationship.required)
?relationship.required
:Array.isArray(relationship.concepts)
?relationship.concepts
:[];

if(!required.length)
continue;

semanticRelationships.push({

required:
required
.map(canonical)
.filter(Boolean),

bonus:
Number(relationship.bonus||relationship.weight||0)

});

}

}
else if(data.relationships&&typeof data.relationships==="object"){

/*
   Also support:

   relationships:
     engine_stall:
       - crank_no_start
       - fuel_pressure
*/

for(const [source,targets] of Object.entries(data.relationships)){

const src=canonical(source);

if(Array.isArray(targets)){

for(const target of targets){

if(typeof target==="string"){

semanticRelationships.push({

required:[src,canonical(target)],

bonus:10

});

}

}

}

}

}


/* ------------------------------------------------------------
   priority
------------------------------------------------------------ */

if(data.priority&&typeof data.priority==="object"){

for(const [id,value] of Object.entries(data.priority)){

const n=canonical(id);

if(n)
semanticPriority[n]=Number(value)||0;

}

}


/* ------------------------------------------------------------
   Make aliases case-insensitive / normalized while retaining
   original phrases for matching.
------------------------------------------------------------ */

for(const concept of Object.keys(symptomAliases)){

symptomAliases[concept]=[
...new Set(
symptomAliases[concept]
.filter(Boolean)
)

];

}

semanticDictionary=data;
semanticDictionaryReady=true;

console.log(
"AutoDecode semantic dictionary loaded:",
Object.keys(semanticConcepts).length,
"concepts /",
Object.values(symptomAliases)
.reduce((n,a)=>n+a.length,0),
"aliases"
);

}


async function loadSemanticDictionary(){

try{

const response=
await fetch(
"data/technical/semantic/technical_terms.yaml",
{cache:"no-cache"}
);

if(!response.ok)
throw Error(
`Semantic dictionary HTTP ${response.status}`
);

const text=
await response.text();

const data=
jsyaml.load(text);

buildSemanticIndex(data);

return true;

}
catch(error){

semanticDictionaryReady=false;

console.error(
"Semantic dictionary error:",
error
);

return false;

}

}


/* ============================================================
   USER SYMPTOM DETECTION
============================================================ */

function detectUserSymptoms(problem){

const text=
normalizeText(problem);

const found=
new Set();


for(
const [conceptId,aliases]
of Object.entries(symptomAliases)
){

if(
aliases.some(alias=>
matchesAlias(text,alias)
)
){

found.add(
canonical(conceptId)
);

}

}


/*
   Important diagnostic relationship:

   "engine stalled" +
   "cranks but does not start"

   implies no_start.
*/

if(found.has("crank_no_start"))
found.add("no_start");

if(
found.has("engine_stall")&&
found.has("crank_no_start")
)
found.add("no_start");


/*
   Canonical aliases may themselves resolve to concepts.
*/

return[
...new Set(
[...found].map(canonical)
)
];

}

value.name||
value.concept||
"";

const n=
normalizeText(value)

if(!n)
return "";

return canonical(n);

const itemSemanticCache=

const itemTextCache=

/*

function getRelevantConcepts(userSymptoms){

const set=
new Set(
userSymptoms.map(canonical)
);

for(
const symptom of userSymptoms
){

for(
const expansion of
conceptExpansion[symptom]||[]
){

set.add(
canonical(expansion)
);

}

}


/*
   Add concepts that participate in dictionary relationships
   with detected user concepts.
*/

for(
const relationship of semanticRelationships
){

const required=
relationship.required||[];

if(required.length!==2)
continue;

if(required.some(c=>set.has(c))){

for(const c of required)
set.add(canonical(c));

}

}

return[
...set
];

}


/* ============================================================
   ITEM TEXT / SEMANTIC EXTRACTION
============================================================ */

function getItemText(item){

if(itemTextCache.has(item))
return itemTextCache.get(item);

const parts=[];

for(
const key of [
"id",
"system",
"category",
"title",
"description",
"symptoms",
"keywords",
"possible_causes",
"diagnostic_steps",
"related_dtcs"
]
){

const value=item?.[key];

if(value==null)
continue;

if(typeof value==="object")
parts.push(JSON.stringify(value));

else
parts.push(String(value));

}

const text=
parts.join(" ");

itemTextCache.set(item,text);

return text;

}


function getItemSymptoms(item,relevantConcepts=null){

if(!item||typeof item!=="object")
return[];


/*
   Cache only full extraction.
   Contextual extraction depends on user concepts.
*/

if(
!relevantConcepts&&
itemSemanticCache.has(item)
){

return itemSemanticCache.get(item);

}

const out=
new Set();


/* Explicit symptoms from YAML */

const raw=
item?.symptoms||[];

for(
const symptom of
Array.isArray(raw)
?raw
:[raw]
){

const id=
normalizeSymptomId(
symptom
);

if(id)
out.add(id);

}


/* System */

const system=
normalizeSymptomId(
item?.system||""
);

if(system)
out.add(system);


/* Search aliases in record text */

const text=
getItemText(item);


const conceptsToSearch=
relevantConcepts&&relevantConcepts.length
?relevantConcepts
:Object.keys(symptomAliases);


for(
const conceptId of conceptsToSearch
){

const canonicalId=
canonical(conceptId);

const aliases=
symptomAliases[canonicalId]||[];


if(
aliases.some(alias=>
matchesAlias(text,alias)
)
){

out.add(canonicalId);

}

}


const result=[
...out
].map(canonical);


if(!relevantConcepts){

itemSemanticCache.set(
item,
[...new Set(result)]
);

}

return[
...new Set(result)
];

}


function getLocalizedValue(value){

if(!value)
return"";

if(typeof value==="string")
return value;

return(
value[currentLanguage]||
value.en||
value.ro||
value.de||
Object.values(value)[0]||
""
);

}

/* ============================================================
   VEHICLE MATCH
============================================================ */

function valueMatches(values,target){

if(values==null)
return true;

const array=
Array.isArray(values)
?values
:[values];

if(!array.length)
return true;

const normalizedTarget=
normalizeText(target);

return array.some(value=>{

if(value==null)
return false;

if(typeof value==="object")
return valueMatches(
value.id||value.name,
target
);

const normalized=
normalizeText(value);

return(
normalized==="all"||
normalized==="*"||
normalized===normalizedTarget||
normalizedTarget===normalized
);

});

}


function calculateVehicleMatch(item,vehicle){

const iv=
item.vehicle||item;

const score=100;

if(
iv.manufacturer&&
!valueMatches(
iv.manufacturer,
vehicle.manufacturer
)&&
!valueMatches(
iv.manufacturer_id,
vehicle.manufacturer
)
)
return 0;


if(
iv.make&&
!valueMatches(
iv.make,
vehicle.manufacturer
)
)
return 0;


if(
iv.models&&
!valueMatches(iv.models,vehicle.model)&&
!valueMatches(iv.model,vehicle.model)
)
return 0;


if(
iv.model&&
!valueMatches(iv.model,vehicle.model)
)
return 0;


if(
iv.generations&&
!valueMatches(
iv.generations,
vehicle.generation
)
)
return 0;


if(
iv.generation&&
!valueMatches(
iv.generation,
vehicle.generation
)
)
return 0;


if(
iv.engines&&
!valueMatches(
iv.engines,
vehicle.engine
)&&
!valueMatches(
iv.engines,
vehicle.engineCodes
)
)
return 0;


if(
iv.engine&&
!valueMatches(
iv.engine,
vehicle.engine
)
)
return 0;


return score;

}


function calculateYearMatch(item,year){

const production=
item.vehicle?.production||
item.production;

if(!production)
return 100;

const from=
Number(production.from||0);

const to=
Number(production.to||9999);

return(
year>=from&&
year<=to
)
?100
:0;

}


/* ============================================================
   DTC
============================================================ */

function extractDTCs(problem){

return[
...new Set(
String(problem||"")
.toUpperCase()
.match(/\b[PCBU]\d{4}\b/g)||[]
)
];

}


function calculateDTCMatch(item,dtcs){

if(!dtcs.length)
return 0;

const related=
Array.isArray(item.related_dtcs)
?item.related_dtcs
:[];

const keywords=
Array.isArray(item.keywords)
?item.keywords
:[];

let matches=0;

for(const dtc of dtcs){

if(
related.some(
value=>
String(value)
.toUpperCase()
.trim()===dtc
)
)
matches++;

if(
keywords.some(
value=>
String(value)
.toUpperCase()
.trim()===dtc
)
)
matches++;

}

return matches
?Math.min(
100,
75+matches*15
)
:0;

}

function getSystemGroups(item){

const system=
normalizeSymptomId(
item?.system||""
);

return systemMap[system]||[];

}


function calculateSystemRelevance(item,userSymptoms){

const groups=
getSystemGroups(item);

if(!groups.length)
return 0;

let score=0;

for(const group of groups){

if(userSymptoms.includes(group))
score+=35;

}

return Math.min(
100,
score
);

}


/* ============================================================
   SEMANTIC RANKING
============================================================ */

const symptomWeights={

crank_no_start:42,
engine_stall:40,
no_start:32,

fuel_pressure:34,
crankshaft:32,
camshaft:30,
synchronization:30,
starter:28,

immobilizer:28,

limp_mode:26,

   Hard diagnostic relationships.

*/

function getAllRelationships(){

...semanticRelationships

function calculateSemanticSymptomScore(
item,
problem,
userSymptoms,
itemSymptoms
){

itemSymptoms=
itemSymptoms||
getItemSymptoms(
item,
getRelevantConcepts(userSymptoms)
);

const text=
normalizeText(problem);

let score=0;


/* Direct semantic concept matches */

for(const symptom of userSymptoms){

if(itemSymptoms.includes(symptom)){

score+=
symptomWeights[symptom]||
symptomWeights.default;

}

}


/* Relationship bonuses */

for(
const relationship
of getAllRelationships()
){

const required=
relationship.required||[];

if(!required.length)
continue;

if(
required.every(
concept=>
userSymptoms.includes(
canonical(concept)
)
)&&
required.every(
concept=>
itemSymptoms.includes(
canonical(concept)
)
)
){

score+=
Number(
relationship.bonus||0
);

}

}


/* Keyword matches */

const keywords=
Array.isArray(item.keywords)
?item.keywords
:[];

let keywordMatches=0;

for(const keyword of keywords){

const normalized=
normalizeText(keyword);

if(
normalized.length>=3&&
matchesAlias(
text,
normalized
)
)
keywordMatches++;

}

score+=
Math.min(
18,
keywordMatches*5
);


/*
   Priority from the semantic YAML.

   Priority is deliberately a secondary signal.
*/

for(const concept of userSymptoms){

const priority=
Number(
semanticPriority[
canonical(concept)
]||0
);

if(priority>0){

score+=
Math.min(
12,
priority
);

}

}


return Math.min(
100,
score
);

}


function calculateSymptomCoverage(
item,
userSymptoms,
itemSymptoms
){

if(!userSymptoms.length)
return 0;

const symptoms=
itemSymptoms||
getItemSymptoms(
item,
getRelevantConcepts(userSymptoms)
);

let matches=0;

for(const symptom of userSymptoms){

if(symptoms.includes(symptom))
matches++;

}

return Math.round(
matches/
userSymptoms.length*
100
);

}


function calculateTextFallback(
item,
problem
){

const text=
normalizeText(problem);

const itemText=
normalizeText(
getItemText(item)
);

if(!text||!itemText)
return 0;

const stopWords=new Set([

"this",
"that",
"with",
"from",
"does",
"have",
"very",
"mais",
"plus",
"avec",
"para",
"pero",
"della",
"delle",
"naar",
"de",
"het",
"der",
"die",
"das",
"si",
"nu",
"mai",
"este",
"un",
"une",
"the",
"and",
"not"

]);

const tokens=
[...tokenize(text)]
.filter(
token=>
token.length>=4&&
!stopWords.has(token)
);

let hits=0;

for(const token of tokens){

if(
(` ${itemText} `)
.includes(
` ${token} `
)
)
hits++;

}

return tokens.length
?Math.min(
25,
Math.round(
hits/
tokens.length*
25
)
)
:0;

}


/* ============================================================
   FINAL SCORE
============================================================ */

function calculateFinalScore({

vehicleMatch,
yearMatch,
semanticScore,
coverage,
dtcMatch,
systemMatch,
userSymptoms,
item,
itemSymptoms

}){

/*
   Exact DTC is always extremely strong.
*/

if(dtcMatch>0){

return Math.min(
100,
Math.round(
vehicleMatch*.20+
yearMatch*.05+
semanticScore*.25+
coverage*.10+
dtcMatch*.35+
systemMatch*.05
)
);

}


let score=
vehicleMatch*.20+
yearMatch*.05+
semanticScore*.45+
coverage*.20+
systemMatch*.10;


/*
   Critical no-start protection.

   A generic SCR/AdBlue or unrelated system record must not
   outrank a genuine starting/fuel/crankshaft diagnosis when
   the user explicitly says the vehicle stalled and will not
   restart.
*/

const symptoms=
itemSymptoms||
getItemSymptoms(
item,
getRelevantConcepts(userSymptoms)
);

const noStart=
userSymptoms.includes("no_start")||
userSymptoms.includes("crank_no_start")||
userSymptoms.includes("engine_stall");


if(
userSymptoms.includes("engine_stall")&&
userSymptoms.includes("crank_no_start")&&
symptoms.includes("engine_stall")&&
symptoms.includes("crank_no_start")
){

score+=20;

}


if(
noStart&&
!symptoms.includes("no_start")&&
!symptoms.includes("crank_no_start")&&
!symptoms.includes("engine_stall")
){

const systems=
getSystemGroups(item);

const relevantStartingSystem=
systems.some(
system=>
[
"no_start",
"crank_no_start",
"engine_stall",
"starter",
"fuel_pressure",
"crankshaft",
"camshaft",
"immobilizer",
"pats"
].includes(system)
);

if(!relevantStartingSystem)
score-=35;

}


if(
systemMatch===0&&
item.system
)
score-=3;


return Math.max(
0,
Math.min(
100,
Math.round(score)
)
);

}


/* ============================================================
   SEARCH
============================================================ */

function performSearch(){

resultsElement.hidden=false;


if(!vehicleIsReady()){

setStatus(
t("complete_vehicle"),
"error"
);

return;

}


const problem=
problemInput.value.trim();


if(!problem){

setStatus(
t("describe_problem"),
"error"
);

return;

}


/*
   The semantic dictionary is now mandatory for semantic search.
*/

if(!semanticDictionaryReady){

setStatus(
"Semantic dictionary is still loading. Please try again in a moment.",
"error"
);

return;

}


if(!technicalDatabase.length){

setStatus(
t("technical_error"),
"error"
);

renderResults([]);

return;

}


setStatus(
t("searching")
);


const vehicle=
getSelectedVehicle();

const userSymptoms=
detectUserSymptoms(problem);

const dtcs=
extractDTCs(problem);

const relevantConcepts=
getRelevantConcepts(userSymptoms);


console.log(
"Detected semantic concepts:",
userSymptoms
);

console.log(
"Expanded semantic concepts:",
relevantConcepts
);

console.log(
"Detected DTCs:",
dtcs
);


const results=[];


for(
const item
of technicalDatabase
){

const vehicleMatch=
calculateVehicleMatch(
item,
vehicle
);

if(!vehicleMatch)
continue;


const yearMatch=
calculateYearMatch(
item,
vehicle.year
);

if(!yearMatch)
continue;


const itemSymptoms=
getItemSymptoms(
item,
relevantConcepts
);


let semanticScore=
calculateSemanticSymptomScore(
item,
problem,
userSymptoms,
itemSymptoms
);


const coverage=
calculateSymptomCoverage(
item,
userSymptoms,
itemSymptoms
);


const dtcMatch=
calculateDTCMatch(
item,
dtcs
);


const systemMatch=
calculateSystemRelevance(
item,
userSymptoms
);


/*
   If no semantic concept was detected, fall back to
   conventional text matching.
*/

if(!userSymptoms.length){

semanticScore=
Math.max(
semanticScore,
calculateTextFallback(
item,
problem
)
);

}
else if(
semanticScore===0&&
coverage===0&&
dtcMatch===0
){

semanticScore=
calculateTextFallback(
item,
problem
)*.6;

}


const score=
calculateFinalScore({

vehicleMatch,
yearMatch,
semanticScore,
coverage,
dtcMatch,
systemMatch,
userSymptoms,
item,
itemSymptoms

});


const evidence=
semanticScore>0||
coverage>0||
dtcMatch>0||
systemMatch>0;


if(
!evidence||
score<10
)
continue;


results.push({

item,
score,
vehicleMatch,
yearMatch,
semanticScore,
coverage,
dtcMatch,
systemMatch

});

}


/* ============================================================
   SORTING
============================================================ */

results.sort(
(a,b)=>{

/*
   1. Exact DTC match
*/

if(
a.dtcMatch>0&&
b.dtcMatch===0
)
return-1;

if(
a.dtcMatch===0&&
b.dtcMatch>0
)
return 1;


/*
   2. Symptom coverage
*/

if(
b.coverage!==a.coverage
)
return b.coverage-a.coverage;


/*
   3. Semantic score
*/

if(
b.semanticScore!==a.semanticScore
)
return b.semanticScore-a.semanticScore;


/*
   4. System relevance
*/

if(
b.systemMatch!==a.systemMatch
)
return b.systemMatch-a.systemMatch;


/*
   5. Final score
*/

return b.score-a.score;

}
);


console.log(
"Top diagnostic results:",
results
.slice(0,10)
.map(result=>({

id:result.item?.id,
title:getLocalizedValue(
result.item?.title
),
score:result.score,
coverage:result.coverage,
semantic:result.semanticScore,
system:result.systemMatch,
dtc:result.dtcMatch

}))
);


renderResults(
results.slice(0,10)
);

setStatus(
"",
""
);

}


findButton.addEventListener(
"click",
performSearch
);


problemInput.addEventListener(
"keydown",
event=>{

if(
(event.ctrlKey||event.metaKey)&&
event.key==="Enter"
){

performSearch();

}

}
);


/* ============================================================
   RENDERING
============================================================ */

function addTag(container,text){

const span=
document.createElement("span");

span.className="match-tag";

span.textContent=text;

container.appendChild(span);

}


function createListSection(
heading,
items
){

const section=
document.createElement("div");

section.className="result-section";


const h=
document.createElement("h4");

h.textContent=heading;


const ul=
document.createElement("ul");


for(const value of items){

const li=
document.createElement("li");

li.textContent=
getLocalizedValue(value);

ul.appendChild(li);

}


section.append(
h,
ul
);

return section;

}


function renderResults(results){

resultList.innerHTML="";


if(!results.length){

resultCount.textContent="";


const noResults=
document.createElement("div");

noResults.className="no-results";

noResults.textContent=
t("no_results");

resultList.appendChild(
noResults
);

return;

}


resultCount.textContent=
results.length===1
?t("result_count_one")
:t("result_count_many")
.replace(
"{n}",
results.length
);


for(
const result
of results
){

const item=
result.item;


const card=
document.createElement("article");

card.className="result-card";


const main=
document.createElement("div");

main.className="result-main";


const top=
document.createElement("div");

top.className="result-top";


const titleContainer=
document.createElement("div");


const title=
document.createElement("h3");

title.className="result-title";

title.textContent=
getLocalizedValue(
item.title
)||
item.id||
"Diagnostic result";


const system=
document.createElement("div");

system.className="result-system";

system.textContent=
item.system||
item.category||
"";


titleContainer.append(
title,
system
);


const score=
document.createElement("div");

score.className="score";

score.textContent=
`${result.score}%`;


top.append(
titleContainer,
score
);

main.appendChild(top);


/* Match tags */

const tags=
document.createElement("div");

tags.className="match-tags";


if(result.coverage>0){

addTag(
tags,
`${t("relevance")}: ${result.coverage}%`
);

}


if(result.dtcMatch>0)
addTag(tags,"DTC match");


if(result.semanticScore>0)
addTag(tags,"Semantic match");


if(result.systemMatch>0)
addTag(tags,"System match");


if(tags.children.length)
main.appendChild(tags);


/* Description */

if(item.description){

const description=
document.createElement("p");

description.className=
"result-description";

description.textContent=
getLocalizedValue(
item.description
);

main.appendChild(
description
);

}


card.appendChild(main);


/* Possible causes */

if(
Array.isArray(
item.possible_causes
)&&
item.possible_causes.length
){

card.appendChild(
createListSection(
t("possible_causes"),
item.possible_causes
)
);

}


/* Diagnostic steps */

if(
Array.isArray(
item.diagnostic_steps
)&&
item.diagnostic_steps.length
){

card.appendChild(
createListSection(
t("diagnostic_steps"),
item.diagnostic_steps
)
);

}


/* Related DTCs */

if(
Array.isArray(
item.related_dtcs
)&&
item.related_dtcs.length
){

card.appendChild(
createListSection(
t("related_dtcs"),
item.related_dtcs
)
);

}


/* Difficulty */

if(item.difficulty){

const section=
document.createElement("div");

section.className=
"result-section";


const heading=
document.createElement("h4");

heading.textContent=
t("difficulty");


const value=
document.createElement("div");

value.style.color="#aeb9c6";
value.style.fontSize="13px";

value.textContent=
getLocalizedValue(
item.difficulty
);

section.append(
heading,
value
);

card.appendChild(
section
);

}


resultList.appendChild(
card
);

}

}


/* ============================================================
   INIT
============================================================ */

document.getElementById(
"yearFooter"
).textContent=
new Date().getFullYear();

localizePage();


/*
   Load both global databases at startup.

   The semantic dictionary is completely independent from the
   vehicle manufacturer and diagnostic manufacturer files.
*/

Promise.allSettled([

loadSemanticDictionary(),
loadManufacturers()

]).then(results=>{

const semanticResult=
results[0];

if(
semanticResult.status==="rejected"||
!semanticDictionaryReady
){

console.error(
"AutoDecode semantic dictionary failed to initialize."
);

}

updateFindButton();

});

html,body{margin:0;background:#0b0f14;color:#e8edf3;font:15px Arial,sans-serif}
header{min-height:72px;background:#111720;border-bottom:1px solid #26303b;display:flex;align-items:center;padding:12px 24px;gap:20px}
.logo{font-size:24px;font-weight:700}
.logo span,h1 span{color:#4da3ff}
.home{color:#cbd5e1;text-decoration:none;border:1px solid #34404d;border-radius:7px;padding:9px 13px}
.langs{margin-left:auto;position:relative}
.langbtn,select,textarea{background:#0c1219;color:#e8edf3;border:1px solid #303b48;border-radius:8px}
.langbtn{padding:8px 10px;cursor:pointer}
.langmenu{display:none;position:absolute;right:0;top:43px;background:#151c25;border:1px solid #34404d;border-radius:8px;overflow:hidden;z-index:20}
.langmenu.open{display:block}
.langmenu div{padding:9px 12px;white-space:nowrap;cursor:pointer}
.langmenu div:hover{background:#202b37}
main{width:min(1050px,calc(100% - 22px));margin:auto;padding:44px 0 70px}
.hero{margin-bottom:30px}
.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 10px}
.hero p{color:#8f9baa;line-height:1.6;max-width:800px}
.panel{background:#111720;border:1px solid #26303b;border-radius:12px;padding:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.field{display:flex;flex-direction:column;gap:7px}
.full{grid-column:1/-1}
label{font-size:13px;color:#aeb9c6;font-weight:600}
select{min-height:46px;padding:11px 13px}
textarea{min-height:125px;padding:12px 13px;resize:vertical;line-height:1.5;outline:0}
select:focus,textarea:focus{border-color:#4da3ff}
select:disabled{opacity:.45}
.vehicle{margin-top:17px;padding:12px 14px;background:#0c1219;border:1px solid #26303b;border-radius:8px;color:#9ca8b6;font-size:13px}
.actions{margin-top:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.find{background:#4da3ff;color:#06101b;border:0;border-radius:8px;padding:13px 22px;font-weight:700;cursor:pointer}
.find:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:13px;color:#8f9baa}
.success{color:#72d79a}
.error{color:#ff7777}
.results{margin-top:30px}
.rhead{display:flex;justify-content:space-between;margin-bottom:15px;gap:15px}
.rhead h2{margin:0;font-size:21px}
.count{color:#8995a3;font-size:13px}
.card{background:#0c1219;border:1px solid #293542;border-radius:10px;margin-bottom:14px;overflow:hidden}
.top{display:flex;justify-content:space-between;gap:15px;padding:19px}
.title{font-size:18px;margin:0 0 7px}
.system{font-size:12px;color:#8995a3;text-transform:uppercase}
.score{color:#4da3ff;border:1px solid #29425d;background:#141d27;border-radius:7px;padding:7px 9px;height:max-content;white-space:nowrap;font-weight:700}
.desc{color:#aeb9c6;line-height:1.6;margin:13px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tag{font-size:11px;color:#b9c7d6;border:1px solid #303c49;background:#141c25;padding:5px 8px;border-radius:5px}
.section{border-top:1px solid #202b36;padding:15px 19px}
.section h4{margin:0 0 9px;font-size:13px}
.section ul{margin:0;padding-left:20px;color:#aeb9c6;font-size:13px;line-height:1.6}
.empty{padding:25px;text-align:center;color:#8f9baa;border:1px dashed #303b48;border-radius:9px}
.debug{margin-top:8px;font-size:11px;color:#687585;word-break:break-word}
footer{text-align:center;border-top:1px solid #202a34;padding:22px;color:#657180;font-size:12px}
@media(max-width:700px){
header{padding:12px 14px;gap:10px}
.logo{font-size:21px}
.home{padding:8px 10px}
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
.panel{padding:17px}
.top{flex-direction:column}
.rhead{flex-direction:column}

const N=s=>String(s??'')
.toLowerCase()
.normalize('NFD')
.replace(/[\u0300-\u036f]/g,'')
.replace(/[^\p{L}\p{N} ]+/gu,' ')
.replace(/\s+/g,' ')
.trim();

const C=s=>N(s).replace(/ /g,'_');

}[m]));

function localizedValue(value){
if(value==null)return '';
if(typeof value==='string')return value.trim();
if(Array.isArray(value))return value.filter(x=>x!=null).map(textValue).filter(Boolean).join(', ');
if(typeof value==='object'){
let v=value[L]??value.en??value.ro;
if(v!=null){
let s=textValue(v).trim();
if(s)return s;
}
for(const v of Object.values(value)){
let s=textValue(v).trim();
if(s)return s;
}
}
return String(value).trim();
}

function localizedArray(value){
if(value==null)return [];
if(Array.isArray(value))return value.filter(x=>x!=null).map(textValue).filter(Boolean);
if(typeof value==='object'){
let selected=value[L]??value.en??value.ro;
if(Array.isArray(selected))return selected.filter(x=>x!=null).map(textValue).filter(Boolean);
if(selected!=null)return [textValue(selected)];
return Object.values(value)
.flatMap(x=>Array.isArray(x)?x:[x])
.filter(x=>x!=null)
.map(textValue)
.filter(Boolean);
}
return [String(value)];
}

function valueArray(value){
if(value==null)return [];
return Array.isArray(value)?value:[value];
}

function textValue(value){
if(value==null)return '';
if(typeof value==='string'||typeof value==='number'||typeof value==='boolean')return String(value);
if(Array.isArray(value))return value.map(textValue).filter(Boolean).join(' ');
if(typeof value==='object')return Object.values(value).map(textValue).filter(Boolean).join(' ');
return String(value);
}

function txt(x){
return N([

].map(textValue).filter(Boolean).join(' '));
}

function has(t,a){
return a.some(x=>t.includes(N(x)));
}

function tokens(s){
return N(s).split(' ').filter(Boolean);
}

function editDistance(a,b){
a=N(a);
b=N(b);
if(a===b)return 0;
if(!a)return b.length;
if(!b)return a.length;
let prev=Array.from({length:b.length+1},(_,i)=>i);
for(let i=1;i<=a.length;i++){
let cur=[i];
for(let j=1;j<=b.length;j++){
cur[j]=Math.min(
cur[j-1]+1,
prev[j]+1,
prev[j-1]+(a[i-1]===b[j-1]?0:1)
);
}
prev=cur;
}
return prev[b.length];
}

function similarity(a,b){
a=N(a);
b=N(b);
if(!a||!b)return 0;
if(a===b)return 1;
if(a.includes(b)||b.includes(a))return Math.min(a.length,b.length)/Math.max(a.length,b.length);
let d=editDistance(a,b);
return 1-d/Math.max(a.length,b.length);
}

function fuzzyPhrase(text,phrase){
let t=tokens(text);
let p=tokens(phrase);
if(!p.length)return 0;
if(p.length===1){
let best=0;
for(const x of t){
let s=similarity(x,p[0]);
if(s>best)best=s;
}
return best;
}
let best=0;
for(let i=0;i<=t.length-p.length;i++){
let sum=0;
for(let j=0;j<p.length;j++)sum+=similarity(t[i+j],p[j]);
best=Math.max(best,sum/p.length);
}
return best;
}

function phrasePresent(text,phrase){
let n=N(text),p=N(phrase);
if(!p)return false;
if(n.includes(p))return true;
let s=fuzzyPhrase(n,p);
return p.length<=4?s>=.84:s>=.80;
}

function negated(text,phrase){
let n=N(text);
let p=N(phrase);
let i=n.indexOf(p);
if(i<0)return false;
let before=n.slice(Math.max(0,i-45),i);
return has(before,[

'pas','sans','aucun','aucune',

]);
}

function conceptEvidence(q,c){
let aliases=A[c]||[];
let best=0;
let exact=0;
for(const phrase of aliases){
let p=N(phrase);
if(!p)continue;
if(q.includes(p)){
exact=Math.max(exact,p.length);
best=Math.max(best,1);
}else{
let f=fuzzyPhrase(q,p);
let threshold=p.split(' ').length>2?.79:.84;
if(f>=threshold)best=Math.max(best,f);
}
}
for(const rule of CONCEPT_RULES){
if(rule.c!==c)continue;
for(const phrase of rule.phrases){
let p=N(phrase);
if(q.includes(p)){
best=Math.max(best,1);
}else{
let f=fuzzyPhrase(q,p);
if(f>=.82)best=Math.max(best,f);
}
}
}
return{best,exact};
}

function concepts(q){
let n=N(q);
let found=[];
for(const c of Object.keys(A)){
let e=conceptEvidence(n,c);
if(e.best>=.84){
let negative=A[c].some(p=>negated(n,N(p)));
if(!negative)found.push({c,s:e.best});
}
}
for(const rule of CONCEPT_RULES){
if(found.some(x=>x.c===rule.c))continue;
for(const phrase of rule.phrases){
let p=N(phrase);
if(n.includes(p)){
if(!negated(n,p))found.push({c:rule.c,s:1});
break;
}
let f=fuzzyPhrase(n,p);
if(f>=.84&&!negated(n,p)){
found.push({c:rule.c,s:f});
break;
}
}
}
found.sort((a,b)=>b.s-a.s);
return found.map(x=>x.c);
}

function expanded(p){
return [...new Set([...p,...p.flatMap(c=>E[c]||[])])];
}

function validDisplayText(v){
let s=String(v??'').trim();
if(!s)return '';
if(/^https?:\/\//i.test(s))return '';
if(/^[a-z0-9]+(?:[_-][a-z0-9]+)+$/i.test(s))return '';
return s;
}

function humanizeId(id){
let s=N(String(id??'').replace(/[-_]+/g,' '));
if(!s)return 'Diagnostic information';
s=s.replace(/\babs\b/g,'ABS')
.replace(/\besp\b/g,'ESP')
.replace(/\besc\b/g,'ESC')
.replace(/\bdpf\b/g,'DPF')
.replace(/\begr\b/g,'EGR')
.replace(/\bmaf\b/g,'MAF')
.replace(/\bmap\b/g,'MAP')
.replace(/\bacc\b/g,'ACC')
.replace(/\bcan\b/g,'CAN')
.replace(/\blin\b/g,'LIN')
.replace(/\bbcm\b/g,'BCM')
.replace(/\bgem\b/g,'GEM')
.replace(/\bsrs\b/g,'SRS')
.replace(/\bepb\b/g,'EPB')
.replace(/\beps\b/g,'EPS');
return s.replace(/\b\p{L}/gu,c=>c.toUpperCase());
}

}
return humanizeId(r?.id);
}

function matchesValue(selected,value){
if(value==null)return true;
if(value==='all')return true;
if(Array.isArray(value)){
return value.some(x=>N(x)===N(selected));
}
return N(value)===N(selected);
}

function matchesGeneration(selected,value){
if(value==null||value==='all')return true;
let list=Array.isArray(value)?value:[value];
let n=N(selected);
return list.some(x=>{
let v=N(x);
if(v===n)return true;
return v.split('_').includes(n);
});
}

function vehicleMatch(r,v){
let x=r.vehicle||r.applicable||{};
let models=x.models??x.model;
let generations=x.generations??x.generation;
let engines=x.engines??x.engine;

return(
(models==null||matchesValue(v.m?.id,models))&&
(generations==null||matchesGeneration(v.g?.id,generations))&&
(engines==null||matchesValue(v.e?.id,engines))
);
}

function fieldConceptStrength(r,c){
let aliases=A[c]||[];
let fields=[
...localizedArray(r.symptoms),
...localizedArray(r.keywords),
localizedValue(r.title),
localizedValue(r.name),
localizedValue(r.description),
localizedValue(r.system),
localizedValue(r.category),
...localizedArray(r.possible_causes),
...localizedArray(r.diagnostic_steps)
].filter(Boolean);

let best=0;
let direct=false;

for(const field of fields){
let n=N(field);

for(const a of aliases){
let p=N(a);
if(!p)continue;

if(n===p){
direct=true;
best=Math.max(best,1);
continue;
}

if(n.includes(p)||p.includes(n)){
best=Math.max(best,.92);
continue;
}

let f=fuzzyPhrase(n,p);
if(f>=.84)best=Math.max(best,f);
}
}

return{best,direct};
}

function score(r,p,q){
let z=0;
let matched=[];
let t=txt(r);

for(const c of p){
let w=W[c]||20;
let ev=fieldConceptStrength(r,c);

if(ev.direct){
z+=w*1.15;
matched.push(c);
}else if(ev.best>=.92){
z+=w*.92;
matched.push(c);
}else if(ev.best>=.84){
z+=w*.68;
matched.push(c);
}else if(has(t,A[c]||[])){
z+=w*.42;
matched.push(c);
}
}

let derived=expanded(p).filter(c=>!p.includes(c));

for(const c of derived){
let ev=fieldConceptStrength(r,c);
if(ev.best>=.92)z+=(W[c]||20)*.22;
else if(ev.best>=.84)z+=(W[c]||20)*.12;
else if(has(t,A[c]||[]))z+=3;
}

let nq=N(q);

for(const d of dtcs){
let nd=N(d);
if(!nd)continue;

if(nq.includes(nd)){
z+=45;
}else if(nd.length>=3&&fuzzyPhrase(nq,nd)>=.9){
z+=28;
}
}

let titleText=N([
localizedValue(r.title),
localizedValue(r.name),
localizedValue(r.system),
localizedValue(r.category)
].join(' '));

if(
p.includes('low_rpm_power_loss')&&
has(titleText,['underboost','turbo','boost','low rpm'])
){
z+=28;
}

if(
p.includes('limp_mode')&&

}

p.includes('poor_power')&&

){
if(has(titleText,['turbo','boost','underboost','egr','dpf','fuel pressure','throttle'])){
z+=18;
}
}

if(
p.includes('smoke_black')&&
has(t,['injector','maf','map','egr','dpf','turbo','fuel'])
){
z+=16;
}

if(
p.includes('smoke_white')&&
has(t,['coolant','coolant temperature','head gasket','injector','turbo'])
){
z+=16;
}

if(
p.includes('smoke_blue')&&
has(t,['oil','turbo','oil consumption','oil leak'])
){
z+=16;
}

if(
p.includes('no_start')&&
has(t,['crankshaft','camshaft','synchronization','fuel pressure','injector','immobilizer'])
){
z+=15;
}

if(
p.includes('rough_idle')&&
has(t,['injector','maf','egr','fuel pressure','ignition','intake'])
){
z+=12;
}

if(
p.includes('steering')&&
has(t,['steering','eps','power steering','torque sensor','position sensor'])
){
z+=20;
}

if(p.length>=2){
let matchedPrimary=p.filter(c=>matched.includes(c)).length;

if(matchedPrimary>=2)z+=18;
if(matchedPrimary>=3)z+=12;
if(matchedPrimary===p.length)z+=14;
}

let symptomCount=localizedArray(r.symptoms).length;
let keywordCount=localizedArray(r.keywords).length;

if(
symptomCount&&
p.some(c=>localizedArray(r.symptoms).some(x=>C(x)===c))
){
z+=10;
}

if(
keywordCount&&
p.some(c=>localizedArray(r.keywords).some(x=>N(x).includes(N(c.replaceAll('_',' ')))))
){
z+=5;
}

return{
r,
s:Math.max(0,Math.min(100,z)),
m:[...new Set(matched)]
};
}

function dedupe(rows){
let out=new Map();

for(const x of rows){
let r=x.r;

let core=[
N(localizedValue(r.title)||localizedValue(r.name)||humanizeId(r.id)),
N(systemName(r)),
localizedArray(r.symptoms).map(N).sort().join('|'),
localizedArray(r.possible_causes).map(N).sort().join('|'),
localizedArray(r.diagnostic_steps).map(N).sort().join('|'),
localizedArray(r.related_dtcs).map(N).sort().join('|')
].join('||');

let id=N(r.id);
let key=core||id;

if(!out.has(key)||x.s>out.get(key).s){
out.set(key,x);
}
}

return[...out.values()].sort((a,b)=>b.s-a.s);
}

[

$('langbtn').textContent={
en:'🇬🇧 EN',
de:'🇩🇪 DE',
ro:'🇷🇴 RO',
fr:'🇫🇷 FR',
es:'🇪🇸 ES',
it:'🇮🇹 IT',
nl:'🇳🇱 NL'
}[L]+' ▾';

['make','model','generation','year','engine']
.forEach((id,i)=>{
$(id).options[0].textContent=x[['sm','smod','sg','sy','se'][i]];
});
}

function reset(id,k,off=true){
$(id).innerHTML='<option value="">'+esc((I[L]||I.en)[k])+'</option>';
$(id).disabled=off;
}

function fill(id,a,k){
reset(id,k,false);

valueArray(a).forEach(x=>{
if(x==null)return;

if(typeof x==='object'){
let name=localizedValue(x.name)||localizedValue(x.title)||localizedValue(x.description)||x.id;

if(id==='engine'&&x.power_hp!=null){
name+=' — '+x.power_hp+' HP';
}

$(id).add(new Option(name,x.id??name));
}else{
$(id).add(new Option(x,x));
}
});
}

function current(){
let m=vdb?.models?.find(x=>String(x.id)===$('model').value);
let g=m?.generations?.find(x=>String(x.id)===$('generation').value);
let e=g?.engines?.find(x=>String(x.id)===$('engine').value);
let mk=makers.find(x=>String(x.id)===$('make').value);

return{mk,m,g,e,y:$('year').value};
}

async function yaml(u){
let r=await fetch(
u+(u.includes('?')?'&':'?')+'v='+Date.now(),
{
cache:'no-store',
headers:{
Accept:'text/yaml,text/plain,application/x-yaml,*/*'
}
}
);

if(!r.ok)throw Error('HTTP '+r.status+' — '+u);

let text=await r.text();

if(!text.trim())throw Error('Empty response — '+u);

try{
return jsyaml.load(text);
}catch(e){
throw Error('YAML parse error in '+u+': '+e.message);
}
}

function years(g){
let a=Number(g?.production?.from)||0;
let b=Number(g?.production?.to)||new Date().getFullYear();

if(!a||b<a)return[];

return Array.from(
{length:Math.max(0,b-a+1)},
(_,i)=>String(a+i)
);
}

function showVehicle(){
let v=current();

if(!v.mk||!v.m||!v.g||!v.e||!v.y){
$('vehicle').hidden=true;
$('find').disabled=true;
return;
}

$('vehicle').hidden=false;

let codes=Array.isArray(v.e.engine_codes)?v.e.engine_codes:[];

$('vehicle').innerHTML=
'<strong>'+
esc((I[L]||I.en).vehicle)+
':</strong> '+
esc(localizedValue(v.mk.name))+' '+
esc(localizedValue(v.m.name))+' '+
esc(localizedValue(v.g.name))+
' · '+
esc(v.y)+
' · '+
esc(localizedValue(v.e.name))+
(codes.length?' · '+esc(codes.join(', ')):'');

$('find').disabled=false;
}

async function loadTech(id){
if(loaded===id&&Array.isArray(tdb)&&tdb.length)return;

let url='data/technical/diagnostics/'+encodeURIComponent(id)+'.yaml';

$('status').textContent=(I[L]||I.en).loading;
$('status').className='status';

try{

let r=await fetch(
url+'?v='+Date.now(),
{
cache:'no-store',
headers:{
Accept:'text/yaml,text/plain,application/x-yaml,*/*'
}
}
);

if(!r.ok)throw Error('HTTP '+r.status+' while loading '+url);

let text=await r.text();

if(!text.trim())throw Error('Empty technical database: '+url);

let d;

try{
d=jsyaml.load(text);
}catch(e){
throw Error('YAML parse error in '+url+': '+e.message);
}

if(!d||!Array.isArray(d.technical_data)){
throw Error('Invalid technical_data structure in '+url);
}

tdb=d.technical_data.filter(x=>x&&typeof x==='object');
loaded=id;

$('status').textContent=(I[L]||I.en).ready;
$('status').className='status success';

}catch(e){

console.error('TECH DATABASE ERROR:',{
manufacturer:id,
url,
error:e
});

tdb=[];
loaded='';

$('status').textContent=(I[L]||I.en).error;
$('status').className='status error';

let debug=document.getElementById('debug-status');
if(debug)debug.textContent=e.message;

throw e;
}
}

loaded='';
tdb=[];

$('find').onclick=async()=>{

let v=current();
let q=$('problem').value.trim();
let u=I[L]||I.en;

if(!v.mk||!v.m||!v.g||!v.e||!v.y){

$('status').textContent=u.complete;
$('status').className='status error';

return;
}

if(!q){

$('status').textContent=u.describe;
$('status').className='status error';

return;
}

$('find').disabled=true;
$('status').textContent=u.search;
$('status').className='status';

try{

await loadTech(v.mk.id);

let normalized=N(q);
let p=concepts(normalized);

let vehicleRows=tdb.filter(
r=>vehicleMatch(r,v)
);

let rows=vehicleRows
.map(r=>score(r,p,normalized))
.filter(x=>x.s>=7);

rows=dedupe(rows).slice(0,20);

$('results').hidden=false;

$('count').textContent=
rows.length===1
?u.one
:u.many.replace(
'{n}',
rows.length
);

$('list').innerHTML=rows.length
?
rows.map(x=>{

let r=x.r;

let causes=
localizedArray(r.possible_causes);

let steps=
localizedArray(r.diagnostic_steps);

let dtcs=
localizedArray(r.related_dtcs);

return`
<article class="card">

<div class="top">

<div>

<h3 class="title">
${esc(title(r))}
</h3>

<div class="system">
${esc(systemName(r))}
</div>

${
r.description
?
`<p class="desc">
${esc(localizedValue(r.description))}
</p>`
:''
}

<div class="tags">

${
x.m.map(a=>
`<span class="tag">
${esc(a.replaceAll('_',' '))}
</span>`
).join('')
}

${
dtcs.map(a=>
`<span class="tag">
${esc(a)}
</span>`
).join('')
}

</div>

</div>

<div class="score">
${esc(u.rel)}: ${Math.round(x.s)}
</div>

</div>

${
causes.length
?
`<div class="section">
<h4>${esc(u.causes)}</h4>
<ul>
${causes.map(a=>`<li>${esc(a)}</li>`).join('')}
</ul>
</div>`
:''
}

${
steps.length
?
`<div class="section">
<h4>${esc(u.steps)}</h4>
<ul>
${steps.map(a=>`<li>${esc(a)}</li>`).join('')}
</ul>
</div>`
:''
}

${
dtcs.length
?
`<div class="section">
<h4>${esc(u.dtcs)}</h4>
<ul>
${dtcs.map(a=>`<li>${esc(a)}</li>`).join('')}
</ul>
</div>`
:''
}

${
r.difficulty
?
`<div class="section">
<h4>${esc(u.difficulty)}</h4>
<div class="desc">
${esc(localizedValue(r.difficulty))}
</div>
</div>`
:''
}

</article>
`;

}).join('')
:
`<div class="empty">
${esc(u.none)}
</div>`;

$('status').textContent=u.ready;
$('status').className='status success';

let debug=document.getElementById('debug-status');

if(debug){

debug.textContent=
`${tdb.length} technical entries loaded · `+
`${vehicleRows.length} compatible · `+
`${p.length} concepts detected · `+
`${rows.length} unique relevant`;

}

}catch(e){

console.error(
'Diagnostic search error:',
e
);

$('status').textContent=u.error;
$('status').className='status error';

let debug=document.getElementById('debug-status');

if(debug)debug.textContent=e.message;

}

$('find').disabled=false;
showVehicle();
};

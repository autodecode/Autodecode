function N(v){
return String(v??'').toLowerCase()
.replace(/doesn['’]?t\b/g,'does not').replace(/doesnt\b/g,'does not')
.replace(/isn['’]?t\b/g,'is not').replace(/isnt\b/g,'is not')
.replace(/aren['’]?t\b/g,'are not').replace(/arent\b/g,'are not')
.replace(/wasn['’]?t\b/g,'was not').replace(/wasnt\b/g,'was not')
.replace(/weren['’]?t\b/g,'were not').replace(/werent\b/g,'were not')
.replace(/won['’]?t\b/g,'will not').replace(/wont\b/g,'will not')
.replace(/can['’]?t\b/g,'cannot').replace(/cant\b/g,'cannot')
.replace(/couldn['’]?t\b/g,'could not').replace(/couldnt\b/g,'could not')
.replace(/wouldn['’]?t\b/g,'would not').replace(/wouldnt\b/g,'would not')
.replace(/shouldn['’]?t\b/g,'should not').replace(/shouldnt\b/g,'should not')
.replace(/didn['’]?t\b/g,'did not').replace(/didnt\b/g,'did not')
.replace(/don['’]?t\b/g,'do not').replace(/dont\b/g,'do not')
.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
.replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}

function localizedValue(v){
if(v==null)return '';
if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return String(v);
if(Array.isArray(v))return v.map(localizedValue).filter(Boolean).join(', ');
if(typeof v==='object'){
let x=v[L]??v.en??v.ro??v.de??v.fr??v.es??v.it??v.nl;
if(x!=null)return localizedValue(x);
for(const z of Object.values(v)){let r=localizedValue(z);if(r)return r}
}
return '';
}

function valueArray(v){
if(v==null)return [];
if(Array.isArray(v))return v.map(localizedValue).filter(Boolean);
if(typeof v==='object')return valueArray(v[L]??v.en??v.ro??v.de??v.fr??v.es??v.it??v.nl);
return [String(v)];
}

function cleanText(v){
if(v==null)return '';
if(Array.isArray(v))return v.map(cleanText).filter(Boolean).join(' ');
if(typeof v==='object')return Object.values(v).map(cleanText).filter(Boolean).join(' ');
return String(v);
}

const STOP=new Set('the a an and or but when while with from into then after before has have had is are was were does did will not cannot can could would should do car vehicle problem my your our their this that it its to of in on at for by as i you he she they we me'.split(' '));

function words(s){
return new Set(N(s).split(' ').filter(x=>x.length>=3&&!STOP.has(x)));
}

function phraseMatch(text,phrase){
let t=N(text),p=N(phrase);
if(!t||!p)return false;
if(t===p||t.includes(' '+p+' ')||t.startsWith(p+' ')||t.endsWith(' '+p))return true;
if(p.length<5||p.includes(' '))return false;
return t.split(' ').some(w=>w===p||w.length>=6&&p.length>=6&&(w.startsWith(p.slice(0,6))||p.startsWith(w.slice(0,6))));
}

function fieldHit(text,concept){
let d=SEM[concept];
return !!d&&d.p.some(p=>phraseMatch(text,p));
}

function detectConcepts(text){
let out=[];
for(const [k,v] of Object.entries(SEM))if(v.p.some(p=>phraseMatch(text,p)))out.push(k);
return [...new Set(out)];
}

function detectDomains(text){
let n=N(text),out=new Set();
for(const [d,terms] of Object.entries(DOMAIN_RULES))
if(terms.some(x=>phraseMatch(n,x)))out.add(d);
return out;
}

function analyseInput(q){
let n=N(q),concepts=detectConcepts(n),domains=detectDomains(n);
for(const c of concepts)if(SEM[c]?.d)domains.add(SEM[c].d);

let context=[];
if(/stopped while running|stopped while driving|died while driving|engine stopped|engine stopped running|motor stopped|motorul s a oprit|s a oprit in mers/.test(n))context.push('stall_running');
if(/stopped and (will not|does not|cannot) (restart|start)|stopped and not restart|stopped.*not.*restart/.test(n))context.push('stall_restart');
if(/when accelerating|while accelerating|during acceleration|accelerating|cand accelerez|la accelerare/.test(n))context.push('acceleration');
if(/low rpm|low rev|low engine speed|turatii mici|turatii joase/.test(n))context.push('low_rpm');
if(/at idle|idling|rough idle|ralanti/.test(n))context.push('idle');

if(concepts.includes('stall')&&concepts.includes('no_start'))concepts.push('stall_restart');
if(concepts.includes('power_loss')&&concepts.includes('limp_mode'))concepts.push('power_limp');

return{raw:q,n,concepts:[...new Set(concepts)],domains:[...domains],context};
}

function resultProfile(r){
let f=profileText(r);
let high=f.primary+' '+f.symptoms+' '+f.keywords;
let domains=new Set(detectDomains(f.system));

for(const c of detectConcepts(high))if(SEM[c]?.d)domains.add(SEM[c].d);

if(!domains.size){
for(const c of detectConcepts(f.primary))if(SEM[c]?.d)domains.add(SEM[c].d);
}

return{...f,high,concepts:detectConcepts(high),domains:[...domains]};
}

function family(d){
if(['engine','air','fuel','exhaust','cooling','lubrication','mechanical'].includes(d))return'powertrain';
return d;
}

function inputFamilies(input){
return new Set(input.domains.map(family));
}

function resultFamilies(result){
return new Set(result.domains.map(family));
}

function compatible(input,result){
let wanted=inputFamilies(input);
let got=resultFamilies(result);
if(!wanted.size)return true;

for(const d of wanted)if(got.has(d))return true;

if(wanted.has('powertrain')&&(input.concepts.includes('stall_restart')||input.concepts.includes('power_limp'))){
if(result.concepts.some(c=>['battery','alternator','voltage','fuel','injector','crankshaft','camshaft','timing','turbo','egr','maf','map','dpf'].includes(c)))return true;
}

return false;
}

function hardGate(input,result){
let h=result.high,c=result.concepts;

if(input.concepts.includes('stall_restart')){
let direct=fieldHit(h,'stall')||fieldHit(h,'no_start')||fieldHit(h,'hard_start');
let relevant=c.some(x=>['fuel','injector','crankshaft','camshaft','timing','battery','alternator'].includes(x));
if(!direct&&!relevant)return false;
}

if(input.concepts.includes('power_limp')){
let direct=fieldHit(h,'power_loss')||fieldHit(h,'limp_mode');
let relevant=c.some(x=>['turbo','egr','maf','map','dpf','fuel','injector'].includes(x));
if(!direct&&!relevant)return false;
}

let smoke=input.concepts.filter(x=>['black_smoke','white_smoke','blue_smoke'].includes(x));
if(smoke.length){
let direct=smoke.some(x=>fieldHit(h,x));
let related=smoke.some(x=>(RELATED[x]||[]).some(y=>fieldHit(h,y)||fieldHit(result.causes,y)));
if(!direct&&!related)return false;
}

return true;
}

function lexical(input,result){
let a=words(input.raw),s=0;
let p=new Set(result.primary.split(' ')),y=new Set(result.symptoms.split(' ')),k=new Set(result.keywords.split(' '));
for(const w of a){
if(p.has(w))s+=8;
else if(y.has(w))s+=6;
else if(k.has(w))s+=5;
}
return Math.min(30,s);
}

function semantic(input,result){
let s=0,h=result.high,sys=result.system,causes=result.causes;

for(const c of input.concepts){
if(c==='stall_restart'||c==='power_limp')continue;
if(fieldHit(h,c))s+=Math.min(55,SEM[c].w*.8);
else if(fieldHit(sys,c))s+=Math.min(20,SEM[c].w*.3);
else if(fieldHit(causes,c))s+=Math.min(12,SEM[c].w*.18);
}

if(input.concepts.includes('stall_restart')){
if(fieldHit(h,'stall'))s+=55;
if(fieldHit(h,'no_start'))s+=55;
if(fieldHit(h,'hard_start'))s+=22;
for(const c of ['fuel','injector','crankshaft','camshaft','timing','battery','alternator'])
if(fieldHit(h,c))s+=9;
}

if(input.concepts.includes('power_limp')){
if(fieldHit(h,'power_loss'))s+=55;
if(fieldHit(h,'limp_mode'))s+=55;
for(const c of ['turbo','egr','maf','map','dpf','fuel','injector'])
if(fieldHit(h,c))s+=9;
}

return s;
}

function contextScore(input,result){
let s=0,t=result.primary+' '+result.symptoms+' '+result.keywords;
if(input.context.includes('acceleration')&&/accelerat|throttle|load|under load/.test(t))s+=18;
if(input.context.includes('low_rpm')&&/low rpm|low rev|low engine speed/.test(t))s+=18;
if(input.context.includes('idle')&&/idle|idling|ralanti/.test(t))s+=18;
if(input.context.includes('stall_running')&&fieldHit(t,'stall'))s+=28;
if(input.context.includes('stall_restart')&&(fieldHit(t,'stall')||fieldHit(t,'no_start')))s+=28;
return s;
}

function domainScore(input,result){
let a=inputFamilies(input),b=resultFamilies(result),s=0;
for(const d of a)if(b.has(d))s+=45;
return s;
}

function extractDTCs(q){
return[...new Set(String(q).toUpperCase().match(/\b[PCBU][0-9]{4}\b/g)||[])];
}

function dtcScore(q,r){
let codes=extractDTCs(q);
if(!codes.length)return 0;
let text=N(fieldText(r,FIELDS.dtc)).toUpperCase(),s=0;
for(const c of codes)if(text.includes(c))s+=120;
return s;
}

function score(r,input){
let result=resultProfile(r);
if(!compatible(input,result))return null;
if(!hardGate(input,result))return null;

let s=domainScore(input,result);
s+=semantic(input,result);
s+=lexical(input,result);
s+=contextScore(input,result);
s+=dtcScore(input.raw,r);

return{r,s:Math.round(s)};
}

function idValue(v){
if(v==null)return '';
if(typeof v==='string'||typeof v==='number')return String(v);
if(typeof v==='object')return String(v.id??v.name??v.code??'');
return String(v);
}

function matchesValue(sel,value){
if(value==null||value==='all')return true;
let wanted=[N(idValue(sel.id)),N(idValue(sel.name))].filter(Boolean);
if(Array.isArray(value))return !value.length||value.some(x=>wanted.includes(N(idValue(x))));
if(typeof value==='object'){
let vals=Object.values(value).flatMap(x=>Array.isArray(x)?x:[x]).map(idValue).map(N);
return vals.some(x=>wanted.includes(x));
}
return wanted.includes(N(idValue(value)));
}

function vehicleMatch(r,v){
let x=r.vehicle&&typeof r.vehicle==='object'?r.vehicle:r;
return matchesValue(v.m,x.models??x.model??x.make_model)&&
matchesValue(v.g,x.generations??x.generation)&&
matchesValue(v.e,x.engines??x.engine);
}

function title(r){
let v=localizedValue(r.title)||localizedValue(r.name)||localizedValue(r.description)||localizedValue(r.symptom)||localizedValue(r.problem)||localizedValue(r.issue);
if(v)return v;
if(r.id)return String(r.id).replace(/^ford_/i,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase());
return 'Diagnostic information';
}

async function yaml(path){
let r=await fetch(path,{cache:'no-store'});
if(!r.ok)throw new Error(`${path}: HTTP ${r.status}`);
return jsyaml.load(await r.text());
}

function resetSelect(id,placeholder,disabled=true){
let e=$(id);e.innerHTML='';
let o=document.createElement('option');o.value='';o.textContent=placeholder;e.appendChild(o);e.disabled=disabled;
}

function option(id,name){
let o=document.createElement('option');o.value=id;o.textContent=name;return o;
}

function manufacturerName(m){return localizedValue(m.name)||m.id}

function setVehicle(){
let m=makers.find(x=>x.id===$('make').value);
if(!m){$('vehicle').hidden=true;return}
let model=(vehicles?.models||[]).find(x=>x.id===$('model').value);
let generation=model?.generations?.find(x=>x.id===$('generation').value);
let engine=generation?.engines?.find(x=>String(x.id)===$('engine').value);
if(!model||!generation||!engine){$('vehicle').hidden=true;return}
$('vehicle').hidden=false;
$('vehicle').textContent=`${I[L].vehicle}: ${manufacturerName(m)} · ${localizedValue(model.name)} · ${localizedValue(generation.name)} · ${localizedValue(engine.name)}`;
}

function updateFind(){
$('find').disabled=!($('make').value&&$('model').value&&$('generation').value&&$('engine').value);
}

function loadModels(){
resetSelect('model',I[L].smod);resetSelect('generation',I[L].sg);resetSelect('year',I[L].sy);resetSelect('engine',I[L].se);
currentManufacturer=makers.find(x=>x.id===$('make').value)||null;
if(!currentManufacturer)return;
let models=Array.isArray(vehicles?.models)?vehicles.models:[];
for(const x of models)$('model').appendChild(option(x.id,localizedValue(x.name)||x.id));
$('model').disabled=!models.length;setVehicle();updateFind();
}

function loadGenerations(){
resetSelect('generation',I[L].sg);resetSelect('year',I[L].sy);resetSelect('engine',I[L].se);
let model=(vehicles?.models||[]).find(x=>x.id===$('model').value),g=Array.isArray(model?.generations)?model.generations:[];
for(const x of g)$('generation').appendChild(option(x.id,localizedValue(x.name)||x.id));
$('generation').disabled=!g.length;setVehicle();updateFind();
}

function loadYearsAndEngines(){
resetSelect('year',I[L].sy);resetSelect('engine',I[L].se);
let model=(vehicles?.models||[]).find(x=>x.id===$('model').value),g=model?.generations?.find(x=>x.id===$('generation').value);
if(!g){updateFind();return}
let from=Number(g.production?.from),to=Number(g.production?.to);
if(Number.isFinite(from)&&Number.isFinite(to)){
for(let y=from;y<=to;y++)$('year').appendChild(option(String(y),String(y)));
$('year').disabled=false;
}
let engines=Array.isArray(g.engines)?g.engines:[];
for(const x of engines){
let n=localizedValue(x.name)||x.id;
if(x.fuel)n+=` · ${x.fuel}`;
$('engine').appendChild(option(String(x.id),n));
}
$('engine').disabled=!engines.length;setVehicle();updateFind();
}

async function loadTech(){
let id=$('make').value;
if(!id){tdb=[];return}
let d=await yaml(`data/technical/diagnostics/${id}.yaml`);
tdb=Array.isArray(d?.technical_data)?d.technical_data.filter(Boolean):[];
}

function setLang(lang){
if(!I[lang])lang='en';
L=lang;
localStorage.setItem('autodecode_language',L);
let T=I[L];
$('home').textContent=T.home;
$('intro').textContent=T.intro;
$('lm').textContent=T.make;
$('lmodel').textContent=T.model;
$('lg').textContent=T.generation;
$('ly').textContent=T.year;
$('le').textContent=T.engine;
$('lp').textContent=T.problem;
$('find').textContent=T.find;
$('rh').textContent=T.rh;
$('problem').placeholder=T.ph;
$('langbtn').textContent={en:'🇬🇧 EN ▾',de:'🇩🇪 DE ▾',ro:'🇷🇴 RO ▾',fr:'🇫🇷 FR ▾',es:'🇪🇸 ES ▾',it:'🇮🇹 IT ▾',nl:'🇳🇱 NL ▾'}[L];
resetSelect('make',T.sm,false);
for(const m of makers)$('make').appendChild(option(m.id,manufacturerName(m)));
resetSelect('model',T.smod);
resetSelect('generation',T.sg);
resetSelect('year',T.sy);
resetSelect('engine',T.se);
$('find').disabled=true;
setVehicle();
}

function section(heading,items){
let d=document.createElement('div');d.className='section';
let h=document.createElement('h4');h.textContent=heading;d.appendChild(h);
let ul=document.createElement('ul');
for(const x of items){
let li=document.createElement('li');li.textContent=x;ul.appendChild(li);
}
d.appendChild(ul);
return d;
}

function renderList(rows){
$('results').hidden=false;
$('list').innerHTML='';
if(!rows.length){
$('count').textContent='';
$('list').innerHTML=`<div class="empty">${I[L].none}</div>`;
return;
}
$('count').textContent=rows.length===1?I[L].one:I[L].many.replace('{n}',rows.length);

for(const item of rows){
let r=item.r,card=document.createElement('article');card.className='card';
let top=document.createElement('div');top.className='top';
let left=document.createElement('div'),h=document.createElement('h3');
h.className='title';h.textContent=title(r);left.appendChild(h);

if(r.system||r.category){
let s=document.createElement('div');s.className='system';
s.textContent=[localizedValue(r.system),localizedValue(r.category)].filter(Boolean).join(' · ');
left.appendChild(s);
}

let description=localizedValue(r.description||r.problem||r.issue);
if(description){
let p=document.createElement('p');p.className='desc';p.textContent=description;left.appendChild(p);
}

let symptoms=valueArray(r.symptoms);
if(symptoms.length){
let tags=document.createElement('div');tags.className='tags';
for(const x of symptoms.slice(0,12)){
let t=document.createElement('span');t.className='tag';t.textContent=x;tags.appendChild(t);
}
left.appendChild(tags);
}

let sc=document.createElement('div');sc.className='score';
sc.textContent=`${I[L].rel}: ${item.s}`;
top.appendChild(left);top.appendChild(sc);card.appendChild(top);

let causes=valueArray(r.possible_causes??r.causes);
if(causes.length)card.appendChild(section(I[L].causes,causes));

let steps=valueArray(r.diagnostic_steps??r.steps);
if(steps.length)card.appendChild(section(I[L].steps,steps));

let dtcs=valueArray(r.related_dtcs??r.dtcs??r.dtc);
if(dtcs.length)card.appendChild(section(I[L].dtcs,dtcs));

$('list').appendChild(card);
}
}

async function search(){
let q=$('problem').value.trim();

if(!$('make').value||!$('model').value||!$('generation').value||!$('engine').value){
$('status').textContent=I[L].complete;
$('status').className='status error';
return;
}

if(!q){
$('status').textContent=I[L].describe;
$('status').className='status error';
return;
}

$('status').textContent=I[L].search;
$('status').className='status';
$('results').hidden=true;

try{
await loadTech();

let model=(vehicles?.models||[]).find(x=>x.id===$('model').value);
let generation=model?.generations?.find(x=>x.id===$('generation').value);
let engine=generation?.engines?.find(x=>String(x.id)===$('engine').value);
if(!model||!generation||!engine)throw new Error('Incomplete vehicle selection');

let v={
m:{id:$('make').value,name:currentManufacturer?.name},
g:{id:generation.id,name:generation.name},
e:{id:engine.id,name:engine.name}
};

let input=analyseInput(q);
let vehicleRows=tdb.filter(r=>vehicleMatch(r,v));

let rows=vehicleRows
.map(r=>score(r,input))
.filter(Boolean)
.filter(x=>x.s>=35)
.sort((a,b)=>b.s-a.s)
.slice(0,20);

renderList(rows);

$('status').textContent=I[L].ready;
$('status').className='status success';

}catch(error){
console.error(error);
$('status').textContent=I[L].error;
$('status').className='status error';
$('results').hidden=false;
$('count').textContent='';
$('list').innerHTML=`<div class="empty">${I[L].error}</div>`;
}
}

async function init(){
$('fy').textContent=new Date().getFullYear();

$('langbtn').addEventListener('click',()=>$('langmenu').classList.toggle('open'));

document.querySelectorAll('[data-l]').forEach(el=>el.addEventListener('click',()=>{
setLang(el.dataset.l);
$('langmenu').classList.remove('open');
}));

document.addEventListener('click',e=>{
if(!e.target.closest('.langs'))$('langmenu').classList.remove('open');
});

try{
let d=await yaml('data/vehicles/manufacturers.yaml');
if(!Array.isArray(d?.manufacturers))throw new Error('Invalid manufacturers database');
makers=d.manufacturers.filter(Boolean);
setLang(L);
$('status').textContent=I[L].ready;
$('status').className='status success';
}catch(e){
console.error(e);
setLang(L);
$('status').textContent=I[L].error;
$('status').className='status error';
}

$('make').addEventListener('change',async()=>{
let id=$('make').value;
vehicles=null;
if(!id){updateFind();return}

$('status').textContent=I[L].loading;
$('status').className='status';

try{
vehicles=await yaml(`data/vehicles/${id}.yaml`);
loadModels();
await loadTech();
$('status').textContent=I[L].ready;
$('status').className='status success';
}catch(e){
console.error(e);
$('status').textContent=I[L].error;
$('status').className='status error';
}
});

$('model').addEventListener('change',loadGenerations);
$('generation').addEventListener('change',loadYearsAndEngines);
$('year').addEventListener('change',()=>{setVehicle();updateFind()});
$('engine').addEventListener('change',()=>{setVehicle();updateFind()});
$('problem').addEventListener('input',()=>$('results').hidden=true);
$('find').addEventListener('click',search);
}

init();
</script>
</body>
</html>

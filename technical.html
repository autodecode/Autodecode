<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AutoDecode – Repair & Technical</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    background:#0b0f14;
    color:#e8edf3;
    font:15px Arial,sans-serif
}

header{
    min-height:72px;
    background:#111720;
    border-bottom:1px solid #26303b;
    display:flex;
    align-items:center;
    padding:12px 24px;
    gap:20px
}

.logo{
    font-size:24px;
    font-weight:700
}

.logo span,
h1 span{
    color:#4da3ff
}

.home{
    color:#cbd5e1;
    text-decoration:none;
    border:1px solid #34404d;
    border-radius:7px;
    padding:9px 13px
}

.langs{
    margin-left:auto;
    position:relative
}

.langbtn,
select,
textarea{
    background:#0c1219;
    color:#e8edf3;
    border:1px solid #303b48;
    border-radius:8px
}

.langbtn{
    padding:8px 10px;
    cursor:pointer
}

.langmenu{
    display:none;
    position:absolute;
    right:0;
    top:43px;
    background:#151c25;
    border:1px solid #34404d;
    border-radius:8px;
    overflow:hidden;
    z-index:20
}

.langmenu.open{
    display:block
}

.langmenu div{
    padding:9px 12px;
    white-space:nowrap;
    cursor:pointer
}

.langmenu div:hover{
    background:#202b37
}

main{
    width:min(1050px,calc(100% - 22px));
    margin:auto;
    padding:44px 0 70px
}

.hero{
    margin-bottom:30px
}

.hero h1{
    font-size:clamp(30px,5vw,46px);
    margin:0 0 10px
}

.hero p{
    color:#8f9baa;
    line-height:1.6;
    max-width:800px
}

.panel{
    background:#111720;
    border:1px solid #26303b;
    border-radius:12px;
    padding:24px
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px
}

.full{
    grid-column:1/-1
}

label{
    font-size:13px;
    color:#aeb9c6;
    font-weight:600
}

select{
    min-height:46px;
    padding:11px 13px
}

textarea{
    min-height:125px;
    padding:12px 13px;
    resize:vertical;
    line-height:1.5;
    outline:0
}

select:focus,
textarea:focus{
    border-color:#4da3ff
}

select:disabled{
    opacity:.45
}

.vehicle{
    margin-top:17px;
    padding:12px 14px;
    background:#0c1219;
    border:1px solid #26303b;
    border-radius:8px;
    color:#9ca8b6;
    font-size:13px
}

.actions{
    margin-top:20px;
    display:flex;
    gap:14px;
    align-items:center;
    flex-wrap:wrap
}

.find{
    background:#4da3ff;
    color:#06101b;
    border:0;
    border-radius:8px;
    padding:13px 22px;
    font-weight:700;
    cursor:pointer
}

.find:disabled{
    opacity:.5;
    cursor:not-allowed
}

.status{
    font-size:13px;
    color:#8f9baa
}

.success{
    color:#72d79a
}

.error{
    color:#ff7777
}

.results{
    margin-top:30px
}

.rhead{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    gap:15px
}

.rhead h2{
    margin:0;
    font-size:21px
}

.count{
    color:#8995a3;
    font-size:13px
}

.card{
    background:#0c1219;
    border:1px solid #293542;
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden
}

.top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:19px
}

.title{
    font-size:18px;
    margin:0 0 7px
}

.system{
    font-size:12px;
    color:#8995a3;
    text-transform:uppercase
}

.score{
    color:#4da3ff;
    border:1px solid #29425d;
    background:#141d27;
    border-radius:7px;
    padding:7px 9px;
    height:max-content;
    white-space:nowrap;
    font-weight:700
}

.desc{
    color:#aeb9c6;
    line-height:1.6;
    margin:13px 0 0
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px
}

.tag{
    font-size:11px;
    color:#b9c7d6;
    border:1px solid #303c49;
    background:#141c25;
    padding:5px 8px;
    border-radius:5px
}

.section{
    border-top:1px solid #202b36;
    padding:15px 19px
}

.section h4{
    margin:0 0 9px;
    font-size:13px
}

.section ul{
    margin:0;
    padding-left:20px;
    color:#aeb9c6;
    font-size:13px;
    line-height:1.6
}

.empty{
    padding:25px;
    text-align:center;
    color:#8f9baa;
    border:1px dashed #303b48;
    border-radius:9px
}

.debug{
    margin-top:8px;
    font-size:11px;
    color:#687585;
    word-break:break-word
}

footer{
    text-align:center;
    border-top:1px solid #202a34;
    padding:22px;
    color:#657180;
    font-size:12px
}

@media(max-width:700px){

    header{
        padding:12px 14px;
        gap:10px
    }

    .logo{
        font-size:21px
    }

    .home{
        padding:8px 10px
    }

    .grid{
        grid-template-columns:1fr
    }

    .full{
        grid-column:auto
    }

    .panel{
        padding:17px
    }

    .top{
        flex-direction:column
    }

    .rhead{
        flex-direction:column
    }
}
</style>
</head>

<main>

<section class="panel">

<div class="grid">

    </div>

    <div class="field">

        </select>

    </div>

    <div class="field">

        <label id="lg"></label>

        <select

            disabled
        >
            <option value=""></option>
        </select>

    </div>

    <div class="field">

        <label id="ly"></label>

        <select

            disabled
        >
            <option value=""></option>
        </select>

    </div>

    <div class="field">

        <label id="le"></label>

        <select
            id="engine"
            disabled
        >
            <option value=""></option>
        </select>

    </div>

    <div class="field full">

        <label id="lp"></label>

        <textarea id="problem"></textarea>

    </div>

</div>

<div
    class="vehicle"
    id="vehicle"
    hidden
></div>

<div class="actions">

    <button
        class="find"
        id="find"
        disabled
    ></button>

    <div
        class="status"
        id="status"
    ></div>

</div>

<section
    class="results"

    hidden
>

    <div class="rhead">

        <div
            class="count"
            id="count"
        ></div>

    </div>

    <div id="list"></div>

</section>

</section>

</main>

<footer>
    © <span id="fy"></span> AutoDecode
</footer>

        .replace(/won['’]?t\b/g,'will not')

        .replace(/wouldnt\b/g,'would not')

function localizedValue(value){

    if(value==null){
        return '';
    }

    if(typeof value==='string'){
        return value;
    }

    if(Array.isArray(value)){

        return value
            .map(localizedValue)
            .filter(Boolean)
            .join(', ');

    }

    if(typeof value==='object'){

        let selected =
            value[L] ??
            value.en ??
            value.ro;

        if(selected!=null){

            if(Array.isArray(selected)){

                return selected
                    .map(localizedValue)
                    .filter(Boolean)
                    .join(', ');

            }

            if(typeof selected==='object'){

                return localizedValue(selected);

            }

            return String(selected);

        }

        for(const x of Object.values(value)){

            let result=localizedValue(x);

            if(result){
                return result;
            }

        }

    }

    return String(value);
}


function localizedArray(value){

    if(value==null){
        return [];
    }

    if(Array.isArray(value)){

        return value
            .filter(x=>x!=null)
            .map(x=>localizedValue(x))
            .filter(Boolean);

    }

    if(typeof value==='object'){

        let selected=
            value[L] ??
            value.en ??
            value.ro;

        if(Array.isArray(selected)){

            return selected
                .filter(x=>x!=null)
                .map(x=>localizedValue(x))
                .filter(Boolean);

        }

        if(selected!=null){

            return [localizedValue(selected)]
                .filter(Boolean);

        }

        return [];

    }

    return [String(value)];
}


function valueArray(value){

    if(value==null){
        return [];
    }

    return Array.isArray(value)
        ?value
        :[value];

}


function textValue(value){

    if(value==null){
        return '';
    }

    if(typeof value==='string'){
        return value;
    }

    if(Array.isArray(value)){

        return value
            .map(textValue)
            .filter(Boolean)
            .join(' ');

    }

    if(typeof value==='object'){

        return Object.values(value)
            .map(textValue)
            .filter(Boolean)
            .join(' ');

    }

    return String(value);
}

/* =========================================================
   TOKENIZATION / FUZZY MATCH
   ========================================================= */

function tokens(s){

    return N(s)
        .split(' ')
        .filter(x=>x.length>1);

}


function levenshtein(a,b){

    if(a===b) return 0;

    if(!a.length) return b.length;

    if(!b.length) return a.length;

    let prev=
        Array.from(
            {length:b.length+1},
            (_,i)=>i
        );

    for(let i=1;i<=a.length;i++){

        let cur=[i];

        for(let j=1;j<=b.length;j++){

            cur[j]=Math.min(

                cur[j-1]+1,

                prev[j]+1,

                prev[j-1]+
                (a[i-1]===b[j-1]?0:1)

            );

        }

        prev=cur;

    }

    return prev[b.length];

}


function fuzzyWord(a,b){

    if(a===b){
        return 1;
    }

    if(
        a.length>=5 &&
        b.length>=5 &&
        (
            a.startsWith(b.slice(0,5)) ||
            b.startsWith(a.slice(0,5))
        )
    ){

        return .82;

    }

    let max=
        Math.max(
            a.length,
            b.length
        );

    if(max<5){
        return 0;
    }

    let d=
        levenshtein(a,b);

    return d<=2
        ?Math.max(
            0,
            1-d/max
        )
        :0;

}


/* =========================================================
   GENERIC ALIAS MATCHING
   ========================================================= */

function has(t,a){

    let n=N(t);

    for(const x of a){

        let z=N(x);

        if(!z){
            continue;
        }

        if(n.includes(z)){
            return true;
        }

        /*
         * Single-word semantic stem matching.
         */

        if(!z.includes(' ')){

            if(
                tokens(n).some(
                    w=>
                        fuzzyWord(w,z)>=.82
                )
            ){

                return true;

            }

        }

    }

    return false;

}

    const lowRpm=
        /\b(

            turatii joase|turații joase|
            bas regime|niedrigen drehzahlen|

        )\b/
        .test(n);


    const limp=
        /\b(

            emergency mode|reduced engine power|
            notlauf|mode degrade|modo de emergencia|
            modalita emergenza|noodloop|

        )\b/
        .test(n);


    const rough=
        /\b(
            rough|unstable|erratic|
            shake|shakes|shaking|
            vibrat|tremur|tremura
        )\b/
        .test(n);


    const idle=
        /\b(
            idle|idling|traffic light|
            traffic lights|when stopped|
            at stop|ralanti|semafor|
            stationair|leerlauf|ralenti|
            minimo
        )\b/
        .test(n);


    const hot=
        /\b(
            hot|warm|heated|

            when hot|when warm|
            motor cald|la cald|
            a chaud|bei warmem motor|
            a caldo|met warme motor
        )\b/
        .test(n);


    const cold=
        /\b(
            cold|cold start|cold starting|
            when cold|morning|
            motor rece|la rece|
            a froid|bei kaltem motor|
            a freddo|bij koude motor
        )\b/
        .test(n);

        )\b/
        .test(n);


    /*

    if(

    if(startFail){

    if(limp){

function expanded(p){

    return [
        ...new Set([
            ...p,
            ...p.flatMap(
                c=>E[c]||[]
            )
        ])
    ];

}


/* =========================================================
   YAML FALLBACK RELEVANCE
   ========================================================= */

function yamlRelevance(q,r){

    let input=
        tokens(q);

    let text=
        tokens(txt(r));

    if(
        !input.length ||
        !text.length
    ){

        return 0;

    }


    let score=0;
    let used=0;


    for(const w of input){

        /*
         * Ignore very generic words.
         */

        if(
            w.length<3 ||
            [
                'the','and','when','with','from',
                'this','that','car','vehicle',
                'engine','motor','my','has','have',
                'does','not','will','can','sometimes',
                'este','este','estei','masina','mașina'
            ].includes(w)
        ){

            continue;

        }


        used++;


        let best=0;


        for(const x of text){

            let m=fuzzyWord(w,x);

            if(m>best){
                best=m;
            }

            if(best===1){
                break;
            }

        }


        if(best>=.82){

            score+=
                best>=1
                    ?1
                    :.65;

        }

    }


    if(!used){
        return 0;
    }


    return Math.min(
        1,
        score/Math.min(
            used,
            8
        )
    );

}

/* =========================================================
   VEHICLE MATCHING
   ========================================================= */

function matchesValue(selected,value){

    if(
        value==null ||
        value==='all'
    ){

        return true;

    }


    if(Array.isArray(value)){

        return value.some(
            x=>
                N(x)===
                N(selected)
        );

    }


    return N(value)===
           N(selected);

}


function vehicleMatch(r,v){

    let x=
        r.vehicle &&
        typeof r.vehicle==='object'
            ?r.vehicle
            :r;


    return(

        matchesValue(
            v.m.id,
            x.models
        )

        &&

        matchesValue(
            v.g.id,
            x.generations
        )

        &&

        matchesValue(
            v.e.id,
            x.engines
        )

    );

}


/* =========================================================
   DIAGNOSTIC SCORE
   ========================================================= */

function score(r,p,q){

    let t=txt(r);
    let z=0;
    let matched=[];


    /*
     * 1. Semantic concepts.
     */

    for(const c of p){

        let aliases=
            A[c]||
            [c.replaceAll('_',' ')];


        let weight=
            W[c]||18;


        if(has(t,aliases)){

            z+=weight;
            matched.push(c);

        }

    }


    /*
     * 2. Related technical concepts.
     */

    for(
        const c of expanded(p)
            .filter(x=>!p.includes(x))
    ){

        let aliases=
            A[c]||
            [c.replaceAll('_',' ')];


        if(has(t,aliases)){

            z+=Math.min(
                10,
                (W[c]||18)*.28
            );

            matched.push(c);

        }

    }


    /*
     * 3. YAML fallback.
     *
     * Even when the semantic parser knows nothing,
     * the diagnostic can still be discovered.
     */

    let yr=
        yamlRelevance(
            q,
            r
        );


    z+=yr*38;


    /*
     * 4. Exact phrase matches.
     */

    let nq=N(q);

    let qParts=
        nq
            .split(' ')
            .filter(
                x=>x.length>=4
            );


    let phraseHits=0;


    for(const w of qParts){

        if(t.includes(w)){
            phraseHits++;
        }

    }


    if(qParts.length){

        z+=Math.min(
            18,
            phraseHits/
            qParts.length*
            18
        );

    }


    /*
     * 5. DTC matching.
     */

    let dtcs=[
        ...localizedArray(r.related_dtcs),
        ...localizedArray(r.dtcs)
    ];


    for(const d of dtcs){

        let nd=N(d);

        if(
            nd &&
            nq.includes(nd)
        ){

            z+=40;
            break;

        }

    }


    /*
     * 6. Multi-symptom bonus.
     */

    if(
        p.length>=2
    ){

        let hits=
            p.filter(
                c=>
                    has(
                        t,
                        A[c]||
                        [c.replaceAll('_',' ')]
                    )
            ).length;


        if(hits>=2){

            z+=
                Math.min(
                    18,
                    hits*6
                );

        }

    }


    /*
     * 7. Specific technical combinations.
     */

    let spec=
        N([
            r.id,
            r.title,
            r.name,
            r.system,
            r.keywords,
            r.related_dtcs
        ]
        .map(textValue)
        .join(' '));


    if(
        p.includes('low_rpm_power_loss') &&
        has(
            spec,
            [
                'p0299',
                'underboost',
                'turbo',
                'boost'
            ]
        )
    ){

        z+=20;

    }


    if(
        p.includes('limp_mode') &&
        has(
            spec,
            [
                'underboost',
                'overboost',
                'turbo',
                'egr',
                'dpf',
                'fuel pressure'
            ]
        )
    ){

        z+=14;

    }


    /*
     * A generic "poor power + limp mode"
     * should favor powertrain/emissions causes.
     */

    if(
        p.includes('poor_power') &&
        p.includes('limp_mode') &&
        has(
            spec,
            [
                'turbo',
                'egr',
                'dpf',
                'maf',
                'map',
                'boost',
                'fuel pressure'
            ]
        )
    ){

        z+=10;

    }


    /*
     * 8. Stall + no-start.
     */

    if(
        p.includes('engine_stall') &&
        p.includes('no_start')
    ){

        if(
            has(
                spec,
                [
                    'crankshaft',
                    'crank sensor',
                    'camshaft',
                    'cam sensor',
                    'fuel pressure',
                    'synchronization',
                    'injector'
                ]
            )
        ){

            z+=18;

        }

    }


    return{

        r,

        s:
            Math.max(
                0,
                Math.min(
                    100,
                    z
                )
            ),

        m:[
            ...new Set(matched)
        ]

    };

}

/* =========================================================

   ========================================================= */

function reset(id,k,off=true){

    $(id).innerHTML=
        '<option value="">'+
        esc(
            (I[L]||I.en)[k]
        )+
        '</option>';

    $(id).disabled=off;

}


function fill(id,a,k){

    reset(
        id,
        k,
        false
    );


    valueArray(a).forEach(x=>{

        if(x==null){
            return;
        }


        if(
            typeof x==='object'
        ){

            let name=
                localizedValue(x.name)||
                localizedValue(x.title)||
                x.id;


            let value=
                x.id??name;


            $(id).add(
                new Option(
                    name,
                    value
                )
            );

        }

        else{

            $(id).add(
                new Option(
                    x,
                    x
                )
            );

        }

    });

}

/* =========================================================
   YAML FETCH
   ========================================================= */

async function yaml(u){

    let r=await fetch(

        u+
        (u.includes('?')?'&':'?')+
        'v='+Date.now(),

        {

            cache:'no-store',

            headers:{
                Accept:
                    'text/yaml,text/plain,application/x-yaml,*/*'
            }

        }

    );


    if(!r.ok){

        throw Error(
            'HTTP '+r.status+
            ' — '+u
        );

    }


    let text=
        await r.text();


    if(!text.trim()){

        throw Error(
            'Empty response — '+u
        );

    }


    try{

        return jsyaml.load(text);

    }

    catch(e){

        throw Error(
            'YAML parse error in '+u+
            ': '+e.message
        );

    }

}


/* =========================================================
   YEARS
   ========================================================= */

function years(g){

    let a=
        Number(
            g?.production?.from
        )||0;


    let b=
        Number(
            g?.production?.to
        )||
        new Date().getFullYear();


    if(
        !a ||
        b<a
    ){

        return [];

    }


    return Array.from(

        {
            length:
                Math.max(
                    0,
                    b-a+1
                )
        },

        (_,i)=>
            String(a+i)

    );

}

/* =========================================================
   TECHNICAL DATABASE
   ========================================================= */

async function loadTech(id){

    if(
        loaded===id &&
        Array.isArray(tdb)
    ){

        return;

    }


    let url=
        'data/technical/diagnostics/'+
        encodeURIComponent(id)+
        '.yaml';


    $('status').textContent=
        (I[L]||I.en).loading;

    $('status').className='status';


    try{

        let r=
            await fetch(

                url+
                '?v='+Date.now(),

                {

                    cache:'no-store',

                    headers:{
                        Accept:
                            'text/yaml,text/plain,application/x-yaml,*/*'
                    }

                }

            );


        if(!r.ok){

            throw Error(
                'HTTP '+r.status+
                ' while loading '+url
            );

        }


        let text=
            await r.text();


        if(!text.trim()){

            throw Error(
                'Empty technical database: '+url
            );

        }


        let d;


        try{

            d=
                jsyaml.load(text);

        }

        catch(e){

            throw Error(
                'YAML parse error in '+url+
                ': '+e.message
            );

        }


        if(
            !d ||
            !Array.isArray(
                d.technical_data
            )
        ){

            throw Error(
                'Invalid technical_data structure in '+url
            );

        }


        tdb=
            d.technical_data
                .filter(
                    x=>
                        x &&
                        typeof x==='object'
                );


        loaded=id;


        console.log(
            'TECH DATABASE LOADED:',
            id,
            tdb.length,
            'entries'
        );


        $('status').textContent=
            (I[L]||I.en).ready;

        $('status').className=
            'status success';


    }

    catch(e){

        console.error(
            'TECH DATABASE ERROR:',
            {
                manufacturer:id,
                url:url,
                error:e
            }
        );


        tdb=[];
        loaded='';


        $('status').textContent=
            (I[L]||I.en).error;

        $('status').className=
            'status error';


        let debug=
            document.getElementById(
                'debug-status'
            );


        if(debug){

            debug.textContent=
                e.message;

        }


        throw e;

    }

}

/* =========================================================
   DIAGNOSTIC SEARCH
   ========================================================= */

$('find').onclick=async()=>{

    let v=current();

    let q=
        $('problem')
            .value
            .trim();

    let u=
        I[L]||I.en;


    if(
        !v.mk ||
        !v.m ||
        !v.g ||
        !v.e ||
        !v.y
    ){

        $('status').textContent=
            u.complete;

        $('status').className=
            'status error';

        return;

    }


    if(!q){

        $('status').textContent=
            u.describe;

        $('status').className=
            'status error';

        return;

    }


    $('find').disabled=true;

    $('status').textContent=
        u.search;

    $('status').className=
        'status';


    try{

        await loadTech(
            v.mk.id
        );


        let p=
            concepts(q);


        console.log(
            'Detected concepts:',
            p
        );


        let vehicleRows=
            tdb.filter(
                r=>
                    vehicleMatch(
                        r,
                        v
                    )
            );


        console.log(
            'Vehicle compatible entries:',
            vehicleRows.length,
            '/',
            tdb.length
        );


        /*
         * IMPORTANT:
         *
         * Do not require concepts to exist.
         * YAML fallback can still find relevant
         * diagnostics from completely new wording.
         */

        let rows=
            vehicleRows

                .map(
                    r=>
                        score(
                            r,
                            p,
                            q
                        )
                )

                .filter(
                    x=>
                        x.s>=7
                )

                .sort(
                    (a,b)=>
                        b.s-a.s
                )

                .slice(
                    0,
                    20
                );


        $('results').hidden=false;


        $('count').textContent=

            rows.length===1

            ?

            u.one

            :

            u.many.replace(
                '{n}',
                rows.length
            );


        $('list').innerHTML=

            rows.length

            ?

            rows.map(
                x=>{

                    let r=x.r;


                    let causes=
                        localizedArray(
                            r.possible_causes
                        );


                    let steps=
                        localizedArray(
                            r.diagnostic_steps
                        );


                    let dtcs=[
                        ...localizedArray(
                            r.related_dtcs
                        ),
                        ...localizedArray(
                            r.dtcs
                        )
                    ];


                    let tags=[
                        ...x.m,
                        ...dtcs
                    ];


                    return `

<article class="card">

    <div class="top">

        <div>

            <h3 class="title">
                ${esc(title(r))}
            </h3>

            <div class="system">
                ${esc(systemName(r))}
            </div>

            ${
                r.description
                ?

                `<p class="desc">
                    ${esc(
                        localizedValue(
                            r.description
                        )
                    )}
                </p>`

                :

                ''
            }

            <div class="tags">

                ${
                    tags
                        .filter(
                            (x,i,a)=>
                                x &&
                                a.indexOf(x)===i
                        )
                        .map(
                            a=>
                                `<span class="tag">
                                    ${esc(
                                        String(a)
                                            .replaceAll(
                                                '_',
                                                ' '
                                            )
                                    )}
                                </span>`
                        )
                        .join('')
                }

            </div>

        </div>


        <div class="score">
            ${esc(u.rel)}: ${Math.round(x.s)}
        </div>

    </div>


    ${
        causes.length

        ?

        `<div class="section">

            <h4>
                ${esc(u.causes)}
            </h4>

            <ul>

                ${
                    causes
                        .map(
                            a=>
                                `<li>${esc(a)}</li>`
                        )
                        .join('')
                }

            </ul>

        </div>`

        :

        ''
    }


    ${
        steps.length

        ?

        `<div class="section">

            <h4>
                ${esc(u.steps)}
            </h4>

            <ul>

                ${
                    steps
                        .map(
                            a=>
                                `<li>${esc(a)}</li>`
                        )
                        .join('')
                }

            </ul>

        </div>`

        :

        ''
    }


    ${
        dtcs.length

        ?

        `<div class="section">

            <h4>
                ${esc(u.dtcs)}
            </h4>

            <ul>

                ${
                    dtcs
                        .map(
                            a=>
                                `<li>${esc(a)}</li>`
                        )
                        .join('')
                }

            </ul>

        </div>`

        :

        ''
    }


    ${
        r.difficulty
        ?

        `<div class="section">

            <h4>
                ${esc(u.difficulty)}
            </h4>

            <div class="desc">
                ${esc(
                    localizedValue(
                        r.difficulty
                    )
                )}
            </div>

        </div>`

        :

        ''
    }

</article>

`;

                }
            ).join('')

            :

            `<div class="empty">
                ${esc(u.none)}
            </div>`;


        $('status').textContent=
            u.ready;

        $('status').className=
            'status success';


        let debug=
            document.getElementById(
                'debug-status'
            );


        if(debug){

            debug.textContent=
                `${tdb.length} technical entries loaded · ${vehicleRows.length} compatible with selected vehicle · ${rows.length} relevant · concepts: ${p.join(', ')||'none'} · YAML fallback active`;

        }

    }

    catch(e){

        console.error(
            'Diagnostic search error:',
            e
        );


        $('status').textContent=
            u.error;

        $('status').className=
            'status error';


        let debug=
            document.getElementById(
                'debug-status'
            );


        if(debug){

            debug.textContent=
                e.message;

        }

    }


    $('find').disabled=false;

    showVehicle();

};

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoDecode – Repair & Technical</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0f14;
    color: #e8edf3;
}

body {
    min-height: 100vh;
}

header {
    height: 72px;
    background: #111720;
    border-bottom: 1px solid #26303b;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
}

.logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    white-space: nowrap;
}

.logo span {
    color: #4da3ff;
}

.home-link {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 14px;
    padding: 9px 13px;
    border: 1px solid #34404d;
    border-radius: 7px;
    transition: .2s;
}

.home-link:hover {
    color: #fff;
    border-color: #4da3ff;
}

.language-selector {
    margin-left: auto;
    position: relative;
}

.language-button {
    background: #18202a;
    color: #e8edf3;
    border: 1px solid #34404d;
    border-radius: 7px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 14px;
}

.language-menu {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 7px);
    background: #151c25;
    border: 1px solid #34404d;
    border-radius: 8px;
    min-width: 145px;
    overflow: hidden;
    z-index: 1000;
}

.language-menu.active {
    display: block;
}

.language-option {
    padding: 10px 12px;
    cursor: pointer;
    color: #dbe4ee;
    font-size: 14px;
}

.language-option:hover {
    background: #202b37;
}

main {
    width: min(1050px, calc(100% - 32px));
    margin: 0 auto;
    padding: 48px 0 70px;
}

.hero {
    margin-bottom: 34px;
}

.hero h1 {
    margin: 0 0 10px;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.1;
}

.hero h1 span {
    color: #4da3ff;
}

.hero p {
    margin: 0;
    color: #8f9baa;
    font-size: 16px;
    line-height: 1.6;
    max-width: 800px;
}

.panel {
    background: #111720;
    border: 1px solid #26303b;
    border-radius: 12px;
    padding: 24px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    color: #aeb9c6;
    font-weight: 600;
}

select,
textarea {
    width: 100%;
    background: #0c1219;
    color: #e8edf3;
    border: 1px solid #303b48;
    border-radius: 8px;
    padding: 12px 13px;
    font-size: 15px;
    outline: none;
}

select {
    min-height: 46px;
}

select:focus,
textarea:focus {
    border-color: #4da3ff;
}

select:disabled {
    opacity: .45;
}

textarea {
    min-height: 125px;
    resize: vertical;
    line-height: 1.5;
}

.actions {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.find-button {
    background: #4da3ff;
    color: #06101b;
    border: 0;
    border-radius: 8px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.find-button:hover {
    filter: brightness(1.08);
}

.find-button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    font-size: 13px;
    color: #8f9baa;
}

.status.error {
    color: #ff7777;
}

.status.success {
    color: #72d79a;
}

.results {
    margin-top: 30px;
}

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.results-header h2 {
    margin: 0;
    font-size: 21px;
}

.result-count {
    color: #8995a3;
    font-size: 13px;
}

.result-card {
    background: #0c1219;
    border: 1px solid #293542;
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
}

.result-main {
    padding: 19px;
}

.result-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.result-title {
    margin: 0 0 7px;
    font-size: 18px;
    line-height: 1.35;
}

.result-system {
    color: #8995a3;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.score {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 700;
    color: #4da3ff;
    background: rgba(77,163,255,.08);
    border: 1px solid rgba(77,163,255,.2);
    border-radius: 7px;
    padding: 7px 9px;
}

.result-description {
    color: #aeb9c6;
    font-size: 14px;
    line-height: 1.6;
    margin: 14px 0 0;
}

.match-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 14px;
}

.match-tag {
    font-size: 11px;
    color: #b9c7d6;
    border: 1px solid #303c49;
    background: #141c25;
    padding: 5px 8px;
    border-radius: 5px;
}

.result-section {
    border-top: 1px solid #202b36;
    padding: 16px 19px;
}

.result-section h4 {
    margin: 0 0 10px;
    font-size: 13px;
    color: #dbe4ee;
}

.result-section ul {
    margin: 0;
    padding-left: 20px;
    color: #aeb9c6;
    font-size: 13px;
    line-height: 1.65;
}

.result-section li {
    margin-bottom: 4px;
}

.no-results {
    padding: 25px;
    text-align: center;
    color: #8f9baa;
    border: 1px dashed #303b48;
    border-radius: 9px;
}

.selected-vehicle {
    margin-top: 18px;
    padding: 12px 14px;
    background: #0c1219;
    border: 1px solid #26303b;
    border-radius: 8px;
    color: #9ca8b6;
    font-size: 13px;
}

.selected-vehicle strong {
    color: #dce5ee;
}

footer {
    border-top: 1px solid #202a34;
    padding: 22px 16px;
    text-align: center;
    color: #657180;
    font-size: 12px;
}

@media (max-width: 700px) {

    header {
        height: auto;
        min-height: 72px;
        padding: 12px 14px;
        gap: 10px;
        flex-wrap: wrap;
    }

    .logo {
        font-size: 21px;
    }

    .home-link {
        font-size: 13px;
        padding: 8px 10px;
    }

    .language-selector {
        margin-left: auto;
    }

    main {
        width: calc(100% - 22px);
        padding-top: 30px;
    }

    .panel {
        padding: 17px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .result-top {
        flex-direction: column;
    }

    .score {
        align-self: flex-start;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a href="index.html"
       class="home-link"
       data-i18n="home">
        ← Home
    </a>

    <div class="language-selector">

        <button class="language-button"
                id="languageButton">
            🇬🇧 EN ▾
        </button>

        <div class="language-menu"
             id="languageMenu">

            <div class="language-option" data-lang="en">
                🇬🇧 English
            </div>

            <div class="language-option" data-lang="de">
                🇩🇪 Deutsch
            </div>

            <div class="language-option" data-lang="ro">
                🇷🇴 Română
            </div>

            <div class="language-option" data-lang="fr">
                🇫🇷 Français
            </div>

            <div class="language-option" data-lang="es">
                🇪🇸 Español
            </div>

            <div class="language-option" data-lang="it">
                🇮🇹 Italiano
            </div>

            <div class="language-option" data-lang="nl">
                🇳🇱 Nederlands
            </div>

        </div>
    </div>

</header>


<main>

<section class="hero">

    <h1>
        <span>Repair</span> & Technical
    </h1>

    <p data-i18n="intro">
        Select your vehicle and describe the problem. AutoDecode will search the technical database and rank the most relevant diagnostic information.
    </p>

</section>


<section class="panel">

<div class="form-grid">

    <div class="field">

        <label for="manufacturer"
               data-i18n="make">
            Make
        </label>

        <select id="manufacturer">

            <option value=""
                    data-i18n="select_make">
                Select make
            </option>

        </select>

    </div>


    <div class="field">

        <label for="model"
               data-i18n="model">
            Model
        </label>

        <select id="model"
                disabled>

            <option value=""
                    data-i18n="select_model">
                Select model
            </option>

        </select>

    </div>


    <div class="field">

        <label for="generation"
               data-i18n="generation">
            Generation / Platform
        </label>

        <select id="generation"
                disabled>

            <option value=""
                    data-i18n="select_generation">
                Select generation
            </option>

        </select>

    </div>


    <div class="field">

        <label for="year"
               data-i18n="year">
            Year
        </label>

        <select id="year"
                disabled>

            <option value=""
                    data-i18n="select_year">
                Select year
            </option>

        </select>

    </div>


    <div class="field">

        <label for="engine"
               data-i18n="engine">
            Engine
        </label>

        <select id="engine"
                disabled>

            <option value=""
                    data-i18n="select_engine">
                Select engine
            </option>

        </select>

    </div>


    <div class="field full">

        <label for="problem"
               data-i18n="problem">
            Describe the problem
        </label>

        <textarea
            id="problem"
            data-i18n-placeholder="problem_placeholder"
            placeholder="Example: The engine has very little power at low RPM and sometimes enters limp mode."
        ></textarea>

    </div>

</div>


<div class="selected-vehicle"
     id="selectedVehicle"
     hidden>
</div>


<div class="actions">

    <button
        class="find-button"
        id="findButton"
        disabled
        data-i18n="find_solution">
        FIND SOLUTION
    </button>

    <div class="status"
         id="status">
    </div>

</div>


<section class="results"
         id="results"
         hidden>

    <div class="results-header">

        <h2 data-i18n="diagnostic_results">
            Diagnostic Results
        </h2>

        <div class="result-count"
             id="resultCount">
        </div>

    </div>

    <div id="resultList"></div>

</section>

</section>

</main>


<footer>
    © <span id="yearFooter"></span> AutoDecode
</footer>

/* ============================================================
   BASIC HELPERS
============================================================ */

function t(key) {

    return (
        translations[currentLanguage]?.[key] ||
        translations.en[key] ||
        key
    );

}


function localizePage() {

    document.documentElement.lang =
        currentLanguage;

    document.querySelectorAll("[data-i18n]")
        .forEach(element => {

            const key =
                element.getAttribute("data-i18n");

            element.textContent = t(key);

        });

    document.querySelectorAll("[data-i18n-placeholder]")
        .forEach(element => {

            const key =
                element.getAttribute(
                    "data-i18n-placeholder"
                );

            element.placeholder = t(key);

        });

    document.getElementById(
        "languageButton"
    ).textContent =
        `${flags[currentLanguage]} ${currentLanguage.toUpperCase()} ▾`;

}


function setStatus(message, type = "") {

    statusElement.textContent = message;

    statusElement.className = "status";

    if (type) {
        statusElement.classList.add(type);
    }

}


function resetSelect(select, key) {

    select.innerHTML = "";

    const option =
        document.createElement("option");

    option.value = "";
    option.textContent = t(key);

    select.appendChild(option);

}


function populateSelect(select, items) {

    for (const item of items || []) {

        if (!item || !item.id) {
            continue;
        }

        const option =
            document.createElement("option");

        option.value = item.id;
        option.textContent =
            item.name || item.id;

        select.appendChild(option);
    }

}


function normalizeText(value) {

    return String(value || "")
        .toLowerCase()
        .replace(/[’‘`´]/g, "'")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/['’]/g, " ")
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


function tokenize(value) {

    return new Set(
        normalizeText(value)
            .split(" ")
            .filter(Boolean)
    );

}


function getLocalizedValue(value) {

    if (!value) {
        return "";
    }

    if (typeof value === "string") {
        return value;
    }

    return (
        value[currentLanguage] ||
        value.en ||
        value.ro ||
        value.de ||
        Object.values(value)[0] ||
        ""
    );

}

============================================================ */

async function loadManufacturers() {

    setStatus(
        t("database_loading")
    );

    try {

        const response =
            await fetch(
                "data/vehicles/manufacturers.yaml",
                {
                    cache: "no-cache"
                }
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const yamlText =
            await response.text();

        const data =
            jsyaml.load(yamlText);

        if (
            data &&
            Array.isArray(data.manufacturers)
        ) {

            manufacturersData =
                data.manufacturers;

        } else if (Array.isArray(data)) {

            manufacturersData =
                data;

        } else {

            throw new Error(
                "Invalid manufacturers structure"
            );

        }

        resetSelect(
            manufacturerSelect,
            "select_make"
        );

        populateSelect(
            manufacturerSelect,
            manufacturersData
        );

        setStatus(
            t("database_ready"),
            "success"
        );

    } catch (error) {

        console.error(
            "Manufacturer database:",
            error
        );

        setStatus(
            t("database_error"),
            "error"
        );

    }

}


/* ============================================================
   VEHICLE DATABASE
============================================================ */

async function loadManufacturerData(
    manufacturerId
) {

    if (
        manufacturerDataCache[
            manufacturerId
        ]
    ) {

        return manufacturerDataCache[
            manufacturerId
        ];

    }

    const response =
        await fetch(
            `data/vehicles/${manufacturerId}.yaml`,
            {
                cache: "no-cache"
            }
        );

    if (!response.ok) {

        throw new Error(
            `Vehicle database HTTP ${response.status}`
        );

    }

    const yamlText =
        await response.text();

    const data =
        jsyaml.load(yamlText);

    manufacturerDataCache[
        manufacturerId
    ] = data;

    return data;

}


/* ============================================================
   TECHNICAL DATABASE
============================================================ */

async function loadTechnicalDatabase(
    manufacturerId
) {

    setStatus(
        t("technical_loading")
    );

    try {

        const response =
            await fetch(
                `data/technical/diagnostics/${manufacturerId}.yaml`,
                {
                    cache: "no-cache"
                }
            );

        if (!response.ok) {

            technicalDatabase = [];

            setStatus(
                t("technical_error")
            );

            return false;

        }

        const yamlText =
            await response.text();

        const data =
            jsyaml.load(yamlText);

        if (
            data &&
            Array.isArray(data.technical_data)
        ) {

            technicalDatabase =
                data.technical_data;

        } else if (Array.isArray(data)) {

            technicalDatabase =
                data;

        } else {

            technicalDatabase = [];

            throw new Error(
                "Invalid technical database structure"
            );

        }

        console.log(
            "Loaded technical records:",
            technicalDatabase.length
        );

        setStatus(
            t("technical_ready"),
            "success"
        );

        return true;

    } catch (error) {

        console.error(
            "Technical database:",
            error
        );

        technicalDatabase = [];

        setStatus(
            t("technical_error"),
            "error"
        );

        return false;

    }

}

============================================================ */

manufacturerSelect.addEventListener(
    "change",
    async () => {

        resetAfterManufacturer();

        const manufacturerId =
            manufacturerSelect.value;

        if (!manufacturerId) {
            return;
        }

        try {

            selectedManufacturerData =
                await loadManufacturerData(
                    manufacturerId
                );

            const models =
                selectedManufacturerData.models ||
                [];

            populateSelect(
                modelSelect,
                models
            );

            modelSelect.disabled = false;

            await loadTechnicalDatabase(
                manufacturerId
            );

        } catch (error) {

            console.error(error);

            setStatus(
                t("database_error"),
                "error"
            );

        }

    }
);


modelSelect.addEventListener(
    "change",
    () => {

        resetAfterModel();

        if (!modelSelect.value) {
            return;
        }

        const model =
            (
                selectedManufacturerData.models ||
                []
            ).find(
                item =>
                    item.id === modelSelect.value
            );

        if (!model) {
            return;
        }

        const generations =
            model.generations || [];

        populateSelect(
            generationSelect,
            generations
        );

        generationSelect.disabled = false;

    }
);


generationSelect.addEventListener(
    "change",
    () => {

        resetAfterGeneration();

        if (!generationSelect.value) {
            return;
        }

        const model =
            (
                selectedManufacturerData.models ||
                []
            ).find(
                item =>
                    item.id === modelSelect.value
            );

        const generation =
            (
                model?.generations ||
                []
            ).find(
                item =>
                    item.id === generationSelect.value
            );

        if (!generation) {
            return;
        }

        const from =
            Number(
                generation.production?.from || 0
            );

        const to =
            Number(
                generation.production?.to ||
                new Date().getFullYear()
            );

        const years = [];

        for (
            let year = from;
            year <= to;
            year++
        ) {

            years.push({
                id: String(year),
                name: String(year)
            });

        }

        populateSelect(
            yearSelect,
            years
        );

        yearSelect.disabled = false;

    }
);


yearSelect.addEventListener(
    "change",
    () => {

        resetAfterYear();

        if (!yearSelect.value) {
            return;
        }

        const model =
            (
                selectedManufacturerData.models ||
                []
            ).find(
                item =>
                    item.id === modelSelect.value
            );

        const generation =
            (
                model?.generations ||
                []
            ).find(
                item =>
                    item.id === generationSelect.value
            );

        if (!generation) {
            return;
        }

        const engines =
            generation.engines || [];

        populateSelect(
            engineSelect,
            engines
        );

        engineSelect.disabled = false;

    }
);

============================================================ */

function vehicleIsReady() {

    return Boolean(
        manufacturerSelect.value &&
        modelSelect.value &&
        generationSelect.value &&
        yearSelect.value &&
        engineSelect.value
    );

}


function updateFindButton() {

    findButton.disabled =
        !vehicleIsReady() ||
        !problemInput.value.trim();

}


function getSelectedVehicle() {

    const manufacturer =
        manufacturersData.find(
            item =>
                item.id === manufacturerSelect.value
        );

    const model =
        (
            selectedManufacturerData?.models ||
            []
        ).find(
            item =>
                item.id === modelSelect.value
        );

    const generation =
        (
            model?.generations ||
            []
        ).find(
            item =>
                item.id === generationSelect.value
        );

    const engine =
        (
            generation?.engines ||
            []
        ).find(
            item =>
                item.id === engineSelect.value
        );

    return {

        manufacturer:
            manufacturer?.id ||
            manufacturerSelect.value,

        manufacturerName:
            manufacturer?.name ||
            manufacturerSelect.value,

        model:
            model?.id ||
            modelSelect.value,

        modelName:
            model?.name ||
            modelSelect.value,

        generation:
            generation?.id ||
            generationSelect.value,

        generationName:
            generation?.name ||
            generationSelect.value,

        year:
            Number(yearSelect.value),

        engine:
            engine?.id ||
            engineSelect.value,

        engineName:
            engine?.name ||
            engineSelect.value,

        engineCodes:
            engine?.engine_codes ||
            [],

        fuel:
            engine?.fuel ||
            null

    };

}


function updateSelectedVehicle() {

    if (!vehicleIsReady()) {

        selectedVehicleElement.hidden = true;
        return;

    }

    const vehicle =
        getSelectedVehicle();

    selectedVehicleElement.innerHTML =
        `<strong>${escapeHtml(vehicle.manufacturerName)} ${escapeHtml(vehicle.modelName)}</strong> · ` +
        `${escapeHtml(vehicle.generationName)} · ` +
        `${escapeHtml(String(vehicle.year))} · ` +
        `${escapeHtml(vehicle.engineName)}`;

    selectedVehicleElement.hidden = false;

}


engineSelect.addEventListener(
    "change",
    () => {

        updateFindButton();
        updateSelectedVehicle();

    }
);


problemInput.addEventListener(
    "input",
    updateFindButton

/* ============================================================
   DETECT USER SYMPTOMS
============================================================ */

function detectUserSymptoms(problem) {

    const normalized =
        normalizeText(problem);

    const detected =
        new Set();


    /*
        Phrase matching is done against normalized text.

        Because normalizeText() removes accents and punctuation,
        the same matcher handles:

            démarre
            demarre
            démarré
            demarrage

        as far as the relevant normalized expression allows.
    */

    for (
        const [semanticId, aliases]
        of Object.entries(symptomAliases)
    ) {

        for (const alias of aliases) {

            const normalizedAlias =
                normalizeText(alias);

            if (
                normalizedAlias &&
                normalized.includes(
                    normalizedAlias
                )
            ) {

                detected.add(
                    semanticId
                );

                break;

            }

        }

    }


    /*
        Contextual semantic inference.

        A crank-no-start condition is also a no-start
        condition. We retain both concepts because some
        technical records may explicitly use either one.
    */

    if (
        detected.has("crank_no_start")
    ) {

        detected.add("no_start");

    }


    /*
        If the user explicitly says that the engine stalled
        and then failed to restart, the combination is also
        interpreted as a no-start event.
    */

    if (
        detected.has("engine_stall") &&
        (
            normalized.includes("nu mai porneste") ||
            normalized.includes("nu porneste") ||
            normalized.includes("ne demarre plus") ||
            normalized.includes("ne redemarre plus") ||
            normalized.includes("ne démarre plus") ||
            normalized.includes("ne redémarre plus") ||
            normalized.includes("no arranca") ||
            normalized.includes("non parte") ||
            normalized.includes("start niet") ||
            normalized.includes("startet nicht")
        )
    ) {

        detected.add("no_start");

    }


    return [...detected];

}

============================================================ */

function getItemText(item) {

    const values = [];

    if (item.title) {

        if (
            typeof item.title === "string"
        ) {

            values.push(
                item.title
            );

        } else {

            values.push(
                ...Object.values(
                    item.title
                )
            );

        }

    }

    if (item.description) {

        if (
            typeof item.description === "string"
        ) {

            values.push(
                item.description
            );

        } else {

            values.push(
                ...Object.values(
                    item.description
                )
            );

        }

    }

    for (
        const field of [
            "keywords",
            "symptoms",
            "possible_causes",
            "diagnostic_steps",
            "system",
            "category"
        ]
    ) {

        if (
            Array.isArray(item[field])
        ) {

            values.push(
                ...item[field]
            );

        } else if (
            item[field]
        ) {

            values.push(
                item[field]
            );

        }

    }

    return normalizeText(
        values.join(" ")
    );

}


/* ============================================================
   VEHICLE MATCH
============================================================ */

function valueMatches(
    value,
    selected
) {

    if (
        value === undefined ||
        value === null
    ) {

        return true;

    }

    if (
        value === "all" ||
        value === "*" ||
        value === "ALL"
    ) {

        return true;

    }

    if (Array.isArray(value)) {

        if (!value.length) {
            return true;
        }

        return value.some(
            item =>
                normalizeText(item) ===
                normalizeText(selected)
        );

    }

    return (
        normalizeText(value) ===
        normalizeText(selected)
    );

}


function calculateVehicleMatch(
    item,
    vehicle
) {

    const itemVehicle =
        item.vehicle || {};

    if (
        itemVehicle.manufacturer &&
        !valueMatches(
            itemVehicle.manufacturer,
            vehicle.manufacturer
        )
    ) {

        return 0;

    }

    if (
        itemVehicle.models &&
        !valueMatches(
            itemVehicle.models,
            vehicle.model
        )
    ) {

        return 0;

    }

    if (
        itemVehicle.generations &&
        !valueMatches(
            itemVehicle.generations,
            vehicle.generation
        )
    ) {

        return 0;

    }

    if (
        itemVehicle.engines &&
        !valueMatches(
            itemVehicle.engines,
            vehicle.engine
        )
    ) {

        return 0;

    }

    return 100;

}


/* ============================================================
   YEAR MATCH
============================================================ */

function calculateYearMatch(
    item,
    year
) {

    const production =
        item.vehicle?.production ||
        item.production ||
        null;

    if (!production) {
        return 100;
    }

    const from =
        Number(
            production.from || 0
        );

    const to =
        Number(
            production.to || 9999
        );

    return (
        year >= from &&
        year <= to
    )
        ? 100
        : 0;

}


/* ============================================================
   DTC EXTRACTION
============================================================ */

function extractDTCs(problem) {

    const matches =
        String(problem || "")
            .toUpperCase()
            .match(
                /\b[PCBU]\d{4}\b/g
            );

    return [
        ...new Set(
            matches || []
        )
    ];

}

============================================================ */

function calculateDTCMatch(
    item,
    dtcs
) {

    if (!dtcs.length) {
        return 0;
    }

    const related =
        Array.isArray(
            item.related_dtcs
        )
            ? item.related_dtcs
            : [];

    const keywords =
        Array.isArray(
            item.keywords
        )
            ? item.keywords
            : [];

    let matches = 0;

    for (const dtc of dtcs) {

        if (
            related.some(
                value =>
                    String(value)
                        .toUpperCase()
                        .trim() === dtc
            )
        ) {

            matches++;

        }

        if (
            keywords.some(
                value =>
                    String(value)
                        .toUpperCase()
                        .trim() === dtc
            )
        ) {

            matches++;

        }

    }

    if (!matches) {
        return 0;
    }

    return Math.min(
        100,
        75 + matches * 15
    );

}

============================================================ */

function getSystemGroups(item) {

    const system =
        normalizeSymptomId(
            item.system
        );

    return (
        systemMap[system] ||
        []
    );

}


/* ============================================================
   NEGATIVE SYSTEM RELEVANCE
============================================================ */

function calculateSystemRelevance(
    item,
    userSymptoms
) {

    const system =
        normalizeSymptomId(
            item.system
        );

    const groups =
        getSystemGroups(item);

    if (!system) {
        return 0;
    }

    let positive = 0;

    for (const group of groups) {

        if (
            userSymptoms.includes(group)
        ) {

            positive += 50;

        }

    }

    return Math.min(
        100,
        positive
    );

}


/* ============================================================
   SEMANTIC ITEM MATCH
============================================================ */

function calculateSemanticSymptomScore(
    item,
    problem,
    userSymptoms
) {

    const itemSymptoms =
        getItemSymptoms(item);

    const normalizedProblem =
        normalizeText(problem);

    let score = 0;


    /*
        Strong semantic matches.
    */

    for (
        const userSymptom
        of userSymptoms
    ) {

        if (
            itemSymptoms.includes(
                userSymptom
            )
        ) {

            const weights = {

                crank_no_start: 40,
                engine_stall: 38,
                no_start: 30,

                fuel_pressure: 32,
                rail_pressure: 30,

                crankshaft: 30,
                camshaft: 28,
                synchronization: 28,

                limp_mode: 25,
                poor_power: 24,
                low_rpm_power_loss: 24,

                turbo: 24,
                dpf: 24,
                scr: 24,

                rough_idle: 22,
                misfire: 24,
                hard_start: 22,

                overheating: 25,
                coolant: 20,
                coolant_temperature: 22,

                oil_pressure: 25,
                battery: 18,
                alternator: 20,
                starter: 30,

                immobilizer: 32,
                pats: 35,

                can_bus: 24,
                lin_bus: 22,

                abs: 22,
                ac: 18,
                hvac: 18,

                transmission: 24,

                central_locking: 18,
                window: 16,
                wiper: 16,
                lighting: 16,

                parking_sensor: 18,
                camera: 18,
                radar: 20,
                lane_assist: 18,

                bluetooth: 14,
                carplay: 14,
                navigation: 14,

                default: 18

            };

            score +=
                weights[userSymptom] ||
                weights.default;

        }

    }


    /*
        Keyword matches.

        These remain weaker than semantic matches because
        literal keyword overlap must never dominate the
        actual symptom interpretation.
    */

    const keywords =
        Array.isArray(item.keywords)
            ? item.keywords
            : [];

    let keywordMatches = 0;

    for (
        const keyword
        of keywords
    ) {

        const normalizedKeyword =
            normalizeText(keyword);

        if (
            !normalizedKeyword ||
            normalizedKeyword.length < 3
        ) {
            continue;
        }

        if (
            normalizedProblem.includes(
                normalizedKeyword
            )
        ) {

            keywordMatches++;

            score +=
                normalizedKeyword.length >= 5
                    ? 6
                    : 3;

        }

    }


    /*
        Semantic high-value phrase bonuses.

        These are deliberately language-independent after
        normalization.
    */

    const highValuePhrases = [

        {
            phrases: [

                /* RO */
                "s a oprit in mers",
                "s a oprit masina in mers",
                "motorul s a oprit in mers",

                /* FR */
                "moteur s arrete en roulant",
                "moteur cale en roulant",

                /* ES */
                "motor se para en marcha",
                "motor se paro en marcha",

                /* IT */
                "motore si spegne durante la marcia",
                "motore si e spento durante la marcia",

                /* NL */
                "motor valt uit tijdens het rijden",
                "motor slaat af tijdens het rijden"

            ],

            groups: [
                "engine_stall"
            ],

            weight: 25

        },

        {
            phrases: [

                /* RO */
                "nu mai porneste",
                "nu porneste",

                /* EN */
                "won't start",
                "wont start",
                "does not start",

                /* DE */
                "startet nicht",
                "springt nicht an",

                /* FR */
                "ne demarre pas",
                "ne demarre plus",
                "ne redemarre pas",
                "ne redemarre plus",

                /* ES */
                "no arranca",
                "ya no arranca",

                /* IT */
                "non parte",
                "non parte piu",

                /* NL */
                "start niet",
                "start niet meer"

            ],

            groups: [
                "no_start"
            ],

            weight: 18

        },

        {
            phrases: [

                /* RO */
                "invarte la automat",
                "invarteste la automat",
                "invarte dar nu porneste",

                /* EN */
                "cranks but does not start",
                "cranks but wont start",
                "crank no start",

                /* DE */
                "motor dreht aber startet nicht",
                "dreht aber startet nicht",

                /* FR */
                "moteur tourne mais ne demarre pas",
                "tourne mais ne demarre pas",

                /* ES */
                "motor gira pero no arranca",
                "gira pero no arranca",

                /* IT */
                "motore gira ma non parte",
                "gira ma non parte",

                /* NL */
                "motor draait maar start niet",
                "draait maar start niet"

            ],

            groups: [
                "crank_no_start"
            ],

            weight: 30

        },

        {
            phrases: [

                /* RO */
                "presiune combustibil insuficienta",
                "presiune combustibil insuficientă",
                "presiune combustibil scazuta",
                "presiune combustibil scăzută",

                /* EN */
                "low fuel pressure",
                "insufficient fuel pressure",
                "fuel pressure too low",

                /* DE */
                "kraftstoffdruck zu niedrig",
                "niedriger kraftstoffdruck",
                "unzureichender kraftstoffdruck",

                /* FR */
                "pression carburant insuffisante",
                "pression de carburant insuffisante",
                "pression carburant trop faible",
                "pression de carburant trop faible",

                /* ES */
                "presion de combustible insuficiente",
                "presion de combustible baja",

                /* IT */
                "pressione carburante insufficiente",
                "pressione carburante bassa",

                /* NL */
                "onvoldoende brandstofdruk",
                "brandstofdruk te laag",
                "lage brandstofdruk"

            ],

            groups: [
                "fuel_pressure"
            ],

            weight: 28

        },

        {
            phrases: [

                /* RO */
                "senzor arbore cotit",
                "senzor pozitie arbore cotit",

                /* EN */
                "crankshaft position sensor",
                "crankshaft sensor",

                /* DE */
                "kurbelwellensensor",
                "kurbelwellenpositionssensor",

                /* FR */
                "capteur vilebrequin",
                "capteur position vilebrequin",

                /* ES */
                "sensor ciguenal",
                "sensor posicion del ciguenal",

                /* IT */
                "sensore albero motore",
                "sensore posizione albero motore",

                /* NL */
                "krukassensor",
                "krukas positiesensor"

            ],

            groups: [
                "crankshaft"
            ],

            weight: 26

        }

    ];


    for (
        const phraseRule
        of highValuePhrases
    ) {

        const found =
            phraseRule.phrases.some(
                phrase =>
                    normalizedProblem.includes(
                        normalizeText(phrase)
                    )
            );

        if (!found) {
            continue;
        }

        const relevant =
            phraseRule.groups.some(
                group =>
                    itemSymptoms.includes(
                        group
                    )
            );

        if (relevant) {

            score +=
                phraseRule.weight;

        }

    }


    /*
        Relationship bonuses.
    */

    for (
        const relationship
        of symptomRelationships
    ) {

        const userHasAll =
            relationship.required.every(
                symptom =>
                    userSymptoms.includes(
                        symptom
                    )
            );

        if (!userHasAll) {
            continue;
        }

        const itemExplainsAll =
            relationship.required.every(
                symptom =>
                    itemSymptoms.includes(
                        symptom
                    )
            );

        if (itemExplainsAll) {

            score +=
                relationship.bonus;

        }

    }


    return Math.min(
        100,
        score
    );

}


/* ============================================================
   SYMPTOM COVERAGE
============================================================ */

function calculateSymptomCoverage(
    item,
    userSymptoms
) {

    if (!userSymptoms.length) {
        return 0;
    }

    const itemSymptoms =
        getItemSymptoms(item);

    let matches = 0;

    for (
        const symptom
        of userSymptoms
    ) {

        if (
            itemSymptoms.includes(
                symptom
            )
        ) {

            matches++;

        }

    }

    return Math.round(
        (matches /
            userSymptoms.length) *
        100
    );

}


/* ============================================================
   FINAL RANKING
============================================================ */

function calculateFinalScore(data) {

    const {

        vehicleMatch,
        yearMatch,
        semanticScore,
        coverage,
        dtcMatch,
        systemMatch,
        userSymptoms,
        item

    } = data;


    /*
        Explicit DTC evidence remains dominant.
    */

    if (dtcMatch > 0) {

        return Math.min(
            100,
            Math.round(

                vehicleMatch * 0.20 +

                yearMatch * 0.05 +

                semanticScore * 0.25 +

                coverage * 0.10 +

                dtcMatch * 0.35 +

                systemMatch * 0.05

            )
        );

    }


    /*
        Normal semantic search.
    */

    let score =

        vehicleMatch * 0.20 +

        yearMatch * 0.05 +

        semanticScore * 0.45 +

        coverage * 0.20 +

        systemMatch * 0.10;


    /*
        Strong evidence for a dedicated no-start/stall
        diagnosis.
    */

    const itemSymptoms =
        getItemSymptoms(item);

    const hasStall =
        userSymptoms.includes(
            "engine_stall"
        );

    const hasCrankNoStart =
        userSymptoms.includes(
            "crank_no_start"
        );

    const itemHasStall =
        itemSymptoms.includes(
            "engine_stall"
        );

    const itemHasCrankNoStart =
        itemSymptoms.includes(
            "crank_no_start"
        );

    if (
        hasStall &&
        hasCrankNoStart &&
        itemHasStall &&
        itemHasCrankNoStart
    ) {

        score += 20;

    }


    /*
        No-start context protection.

        Generic SCR/AdBlue, turbo, A/C, DPF etc. records
        are strongly penalized unless they actually explain
        the starting/stalling condition.
    */

    const noStartContext =
        userSymptoms.includes(
            "no_start"
        ) ||
        userSymptoms.includes(
            "crank_no_start"
        ) ||
        userSymptoms.includes(
            "engine_stall"
        );


    if (noStartContext) {

        const systemGroups =
            getSystemGroups(item);

        const explainsStartProblem =
            systemGroups.includes(
                "no_start"
            ) ||
            systemGroups.includes(
                "crank_no_start"
            ) ||
            systemGroups.includes(
                "engine_stall"
            ) ||
            systemGroups.includes(
                "fuel_pressure"
            ) ||
            systemGroups.includes(
                "crankshaft"
            ) ||
            systemGroups.includes(
                "camshaft"
            ) ||
            systemGroups.includes(
                "synchronization"
            ) ||
            systemGroups.includes(
                "starter"
            ) ||
            systemGroups.includes(
                "immobilizer"
            ) ||
            systemGroups.includes(
                "pats"
            ) ||
            itemSymptoms.includes(
                "no_start"
            ) ||
            itemSymptoms.includes(
                "crank_no_start"
            ) ||
            itemSymptoms.includes(
                "engine_stall"
            ) ||
            itemSymptoms.includes(
                "fuel_pressure"
            ) ||
            itemSymptoms.includes(
                "crankshaft"
            ) ||
            itemSymptoms.includes(
                "camshaft"
            ) ||
            itemSymptoms.includes(
                "synchronization"
            ) ||
            itemSymptoms.includes(
                "starter"
            ) ||
            itemSymptoms.includes(
                "immobilizer"
            ) ||
            itemSymptoms.includes(
                "pats"
            );

        if (!explainsStartProblem) {

            score -= 35;

        }

    }


    /*
        System-specific results receive no positive bonus
        when the user has not mentioned that system.
    */

    if (
        systemMatch === 0 &&
        item.system
    ) {

        score -= 5;

    }


    return Math.max(
        0,
        Math.min(
            100,
            Math.round(score)
        )
    );

}


/* ============================================================
   SEARCH
============================================================ */

function performSearch() {

    resultsElement.hidden = false;

    if (!vehicleIsReady()) {

        setStatus(
            t("complete_vehicle"),
            "error"
        );

        return;

    }

    const problem =
        problemInput.value.trim();

    if (!problem) {

        setStatus(
            t("describe_problem"),
            "error"
        );

        return;

    }

    if (
        !technicalDatabase.length
    ) {

        setStatus(
            t("technical_error"),
            "error"
        );

        renderResults([]);

        return;

    }


    setStatus(
        t("searching")
    );


    const vehicle =
        getSelectedVehicle();


    /*
        Language-independent semantic detection.
    */

    const userSymptoms =
        detectUserSymptoms(
            problem
        );


    /*
        DTC extraction remains language-independent.
    */

    const dtcs =
        extractDTCs(
            problem
        );


    console.log(
        "Detected symptoms:",
        userSymptoms
    );

    console.log(
        "Detected DTCs:",
        dtcs
    );


    const results = [];


    for (
        const item
        of technicalDatabase
    ) {

        const vehicleMatch =
            calculateVehicleMatch(
                item,
                vehicle
            );

        if (
            vehicleMatch === 0
        ) {
            continue;
        }


        const yearMatch =
            calculateYearMatch(
                item,
                vehicle.year
            );

        if (
            yearMatch === 0
        ) {
            continue;
        }


        const semanticScore =
            calculateSemanticSymptomScore(
                item,
                problem,
                userSymptoms
            );


        const coverage =
            calculateSymptomCoverage(
                item,
                userSymptoms
            );


        const dtcMatch =
            calculateDTCMatch(
                item,
                dtcs
            );


        const systemMatch =
            calculateSystemRelevance(
                item,
                userSymptoms
            );


        const finalScore =
            calculateFinalScore({

                vehicleMatch,

                yearMatch,

                semanticScore,

                coverage,

                dtcMatch,

                systemMatch,

                userSymptoms,

                item

            });


        /*
            Actual evidence is required.
        */

        const hasEvidence =
            semanticScore > 0 ||
            coverage > 0 ||
            dtcMatch > 0 ||
            systemMatch > 0;


        if (!hasEvidence) {
            continue;
        }


        /*
            Very weak results are discarded.
        */

        if (
            finalScore < 10
        ) {
            continue;
        }


        results.push({

            item,

            score:
                finalScore,

            vehicleMatch,

            yearMatch,

            semanticScore,

            coverage,

            dtcMatch,

            systemMatch

        });

    }


    /* ========================================================
       SORT
    ======================================================== */

    results.sort(
        (a, b) => {

            /*
                1. Exact DTC match.
            */

            if (
                a.dtcMatch > 0 &&
                b.dtcMatch === 0
            ) {

                return -1;

            }

            if (
                a.dtcMatch === 0 &&
                b.dtcMatch > 0
            ) {

                return 1;

            }


            /*
                2. Symptom coverage.
            */

            if (
                b.coverage !==
                a.coverage
            ) {

                return (
                    b.coverage -
                    a.coverage
                );

            }


            /*
                3. Semantic evidence.
            */

            if (
                b.semanticScore !==
                a.semanticScore
            ) {

                return (
                    b.semanticScore -
                    a.semanticScore
                );

            }


            /*
                4. Final score.
            */

            return (
                b.score -
                a.score
            );

        }
    );


    /*
        Display top 10.
    */

    renderResults(
        results.slice(0, 10)
    );


    if (results.length) {

        setStatus(
            t("technical_ready"),
            "success"
        );

    } else {

        setStatus(
            t("no_results")
        );

    }

    findButton.disabled = false;

}

        if (
            Array.isArray(
                item.related_dtcs
            ) &&
            item.related_dtcs.length
        ) {

            card.appendChild(
                createListSection(
                    t("related_dtcs"),
                    item.related_dtcs
                )
            );

        }


        /*
            Difficulty.
        */

        if (
            item.difficulty
        ) {

            const section =
                document.createElement(
                    "div"
                );

            section.className =
                "result-section";

            const heading =
                document.createElement(
                    "h4"
                );

            heading.textContent =
                t("difficulty");

            const value =
                document.createElement(
                    "div"
                );

            value.textContent =
                item.difficulty;

            value.style.color =
                "#aeb9c6";

            value.style.fontSize =
                "13px";

            section.appendChild(
                heading
            );

            section.appendChild(
                value
            );

            card.appendChild(
                section
            );

        }


        resultList.appendChild(
            card
        );

    }

}


/* ============================================================
   RESULT HELPERS
============================================================ */

function addTag(
    container,
    text
) {

    const tag =
        document.createElement(
            "span"
        );

    tag.className =
        "match-tag";

    tag.textContent =
        text;

    container.appendChild(
        tag
    );

}


function createListSection(
    headingText,
    items
) {

    const section =
        document.createElement(
            "div"
        );

    section.className =
        "result-section";


    const heading =
        document.createElement(
            "h4"
        );

    heading.textContent =
        headingText;


    const list =
        document.createElement(
            "ul"
        );


    for (
        const value
        of items
    ) {

        const li =
            document.createElement(
                "li"
            );

        li.textContent =
            getLocalizedValue(
                value
            );

        list.appendChild(
            li
        );

    }


    section.appendChild(
        heading
    );

    section.appendChild(
        list
    );

    return section;

}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   INITIALIZATION
============================================================ */

document.getElementById(
    "yearFooter"
).textContent =
    new Date().getFullYear();


localizePage();

loadManufacturers();


/* ============================================================
   SEARCH BUTTON
============================================================ */

findButton.addEventListener(
    "click",
    performSearch
);


/*
    Also allow Ctrl+Enter / Cmd+Enter.
*/

problemInput.addEventListener(
    "keydown",
    event => {

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key === "Enter"
        ) {

            event.preventDefault();

            if (
                !findButton.disabled
            ) {

                performSearch();

            }

        }

    }
);

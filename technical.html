let L=localStorage.getItem('autodecode_lang')||'en';
let makers=[],vdb=null,tdb=[],loaded='';

const $=x=>document.getElementById(x);

const N=s=>String(s??'')
.toLowerCase()
.normalize('NFD')
.replace(/[\u0300-\u036f]/g,'')
.replace(/[^\p{L}\p{N} ]+/gu,' ')
.replace(/\s+/g,' ')
.trim();

const C=s=>N(s).replace(/ /g,'_');

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));

function textValue(x){
if(x==null)return '';
if(typeof x==='string'||typeof x==='number')return String(x);
if(Array.isArray(x))return x.map(textValue).join(' ');
if(typeof x==='object')return Object.values(x).map(textValue).join(' ');
return '';
}

function localizedValue(x){
if(x==null)return '';
if(typeof x==='string'||typeof x==='number')return String(x);
if(Array.isArray(x))return x.map(localizedValue).join(' ');
if(typeof x==='object'){
return x[L]??x.en??x.ro??Object.values(x)[0]??'';
}
return '';
}

function localizedArray(x){
if(!Array.isArray(x))return x? [localizedValue(x)]:[];
return x.map(localizedValue).filter(Boolean);
}

function txt(r){
return N([
r.id,
r.title,
r.name,
r.description,
r.system,
r.category,
r.subcategory,
r.symptoms,
r.keywords,
r.possible_causes,
r.diagnostic_steps,
r.related_dtcs
].map(textValue).join(' '));
}

function has(t,a){
return a.some(x=>t.includes(N(x)));
}

function conceptHits(q){
const n=N(q),out=[];
for(const [c,a] of Object.entries(A)){
let best=0,phrase='';
for(const p of a){
const x=N(p);
if(!x)continue;
if(n.includes(x)&&x.length>best){
best=x.length;
phrase=x;
}
}
if(best)out.push({c,phrase,len:best});
}
return out.sort((a,b)=>b.len-a.len);
}

function concepts(q){
return [...new Set(conceptHits(q).map(x=>x.c))];
}

function expanded(p){
return [...new Set([...p,...p.flatMap(c=>E[c]||[])])];
}

function analyzeQuery(q){
const raw=String(q||'').trim();
const n=N(raw);
const hits=conceptHits(raw);
const canonical=[...new Set(hits.map(x=>x.c))];
const dtcs=[...new Set((raw.match(/\b(?:P|U|B|C)\d{4,5}\b/gi)||[]).map(x=>x.toUpperCase()))];
const tokens=n.split(' ').filter(x=>x.length>1);
return{
raw,
normalized:n,
concepts:canonical,
hits,
dtcs,
tokens,
expanded:expanded(canonical)
};
}

function similarity(a,b){
a=N(a);b=N(b);
if(!a||!b)return 0;
if(a===b)return 1;
if(a.length>=4&&(a.includes(b)||b.includes(a)))return .9;
const A=a.split(' ').filter(Boolean);
const B=b.split(' ').filter(Boolean);
const sa=new Set(A),sb=new Set(B);
let common=0;
for(const x of sa)if(sb.has(x))common++;
if(!common)return 0;
return(2*common)/(sa.size+sb.size);
}

function fuzzyFieldScore(query,text){
const q=N(query),t=N(text);
if(!q||!t)return 0;
if(t.includes(q))return 1;
let best=0;
for(const phrase of q.split(/[,.!?;]+/)){
const p=phrase.trim();
if(p.length<3)continue;
if(t.includes(p))best=Math.max(best,.95);
}
const qt=q.split(' ').filter(x=>x.length>2);
for(const token of qt){
if(t.includes(token)){
best=Math.max(best,.72);
continue;
}
for(const word of t.split(' ')){
if(word.length<3)continue;
const s=similarity(token,word);
if(s>best)best=s;
}
}
return best;
}

function title(r){
return localizedValue(r.title)||localizedValue(r.name)||r.id||'';
}

function systemName(r){
return localizedValue(r.system)||localizedValue(r.category)||'diagnostics';
}

function matchesValue(selected,value){
if(value==null)return true;
const arr=Array.isArray(value)?value:[value];
const n=N(selected);
return arr.some(v=>{
if(v==null)return false;
if(typeof v==='object')return matchesValue(v.id||v.name,selected);
const x=N(v);
if(!x||x==='all'||x==='*'||x===n)return true;
const parts=x.split(' ');
return parts.includes(n);
});
}

function vehicleMatch(r,v){
const x=r.vehicle||r.applicable||{};
return matchesValue(v.m?.id,x.models??x.model)&&
matchesValue(v.g?.id,x.generations??x.generation)&&
matchesValue(v.e?.id,x.engines??x.engine);
}

function score(r,analysis){
const q=analysis.normalized,p=analysis.concepts,t=txt(r);
const titleText=N([
r.id,localizedValue(r.title),localizedValue(r.name)
].map(textValue).join(' '));
const systemText=N([
systemName(r),localizedValue(r.category),localizedValue(r.subcategory)
].map(textValue).join(' '));
const symptomText=N(localizedArray(r.symptoms).join(' '));
const keywordText=N(localizedArray(r.keywords).join(' '));
const descriptionText=N(localizedValue(r.description));
const causeText=N(localizedArray(r.possible_causes).join(' '));
const dtcText=N(localizedArray(r.related_dtcs).join(' '));

let z=0,matched=[],evidence=0;

for(const c of p){
const aliases=A[c]||[c.replaceAll('_',' ')];
let bestSym=0,bestKey=0,bestTitle=0,bestDesc=0,bestCause=0,bestSystem=0;

for(const a of aliases){
const x=N(a);
if(symptomText.includes(x))bestSym=Math.max(bestSym,1);
else bestSym=Math.max(bestSym,fuzzyFieldScore(x,symptomText));

if(keywordText.includes(x))bestKey=Math.max(bestKey,1);
else bestKey=Math.max(bestKey,fuzzyFieldScore(x,keywordText));

if(titleText.includes(x))bestTitle=Math.max(bestTitle,1);
else bestTitle=Math.max(bestTitle,fuzzyFieldScore(x,titleText));

if(descriptionText.includes(x))bestDesc=Math.max(bestDesc,1);
else bestDesc=Math.max(bestDesc,fuzzyFieldScore(x,descriptionText));

if(causeText.includes(x))bestCause=Math.max(bestCause,1);
else bestCause=Math.max(bestCause,fuzzyFieldScore(x,causeText));

if(systemText.includes(x))bestSystem=Math.max(bestSystem,1);
else bestSystem=Math.max(bestSystem,fuzzyFieldScore(x,systemText));
}

const w=W[c]||20;

if(bestTitle>.55){
z+=w*1.55*bestTitle;matched.push(c);evidence++;
}else if(bestSym>.55){
z+=w*1.45*bestSym;matched.push(c);evidence++;
}else if(bestKey>.55){
z+=w*1.25*bestKey;matched.push(c);evidence++;
}else if(bestSystem>.55){
z+=w*1.15*bestSystem;matched.push(c);evidence++;
}else if(bestDesc>.55){
z+=w*.95*bestDesc;matched.push(c);
}else if(bestCause>.55){
z+=w*.75*bestCause;matched.push(c);
}
}

for(const c of analysis.expanded){
if(p.includes(c))continue;
const aliases=A[c]||[c.replaceAll('_',' ')];
let hit=0;
for(const a of aliases){
const x=N(a);
hit=Math.max(hit,t.includes(x)?1:fuzzyFieldScore(x,t));
}
if(hit>.7)z+=(W[c]||12)*.16;
}

for(const dtc of analysis.dtcs){
const d=N(dtc);
if(dtcText.includes(d)||N(r.id).includes(d)||t.includes(d)){
z+=42;
matched.push(dtc.toLowerCase());
evidence+=2;
}
}

if(p.length>=2&&p.every(c=>{
const aliases=A[c]||[c.replaceAll('_',' ')];
return aliases.some(a=>t.includes(N(a)));
}))z+=22;

if(analysis.tokens.length>=3&&evidence>=2)z+=12;

const spec=N([
r.id,r.system,r.keywords,r.related_dtcs,r.description
].map(textValue).join(' '));

if(p.includes('low_rpm_power_loss')&&has(spec,['p0299','underboost','turbo','boost']))z+=24;

if(p.includes('limp_mode')&&has(spec,['underboost','overboost','turbo','egr','dpf','fuel pressure']))z+=16;

if(p.includes('poor_power')&&p.includes('limp_mode')&&has(spec,['injector circuit','coolant','coolant temperature','system voltage']))z-=20;

const directQuery=fuzzyFieldScore(q,t);
if(directQuery>.9)z+=18;
else if(directQuery>.75)z+=10;
else if(directQuery>.6)z+=5;

return{r,s:Math.max(0,Math.min(100,z)),m:[...new Set(matched)]};
}

function dedupe(rows){
const seen=new Set();
return rows.filter(x=>{
const r=x.r;
const key=N([
title(r),systemName(r),
localizedArray(r.symptoms).join(' '),
localizedArray(r.possible_causes).join(' '),
localizedArray(r.diagnostic_steps).join(' '),
localizedArray(r.related_dtcs).join(' ')
].join(' '));
if(seen.has(key))return false;
seen.add(key);
return true;
});
}

function setLang(){
const x=I[L]||I.en;
[
['home','home'],['intro','intro'],['lm','make'],['lmodel','model'],
['lg','generation'],['ly','year'],['le','engine'],['lp','problem'],
['find','find'],['rh','rh']
].forEach(([id,k])=>$(id).textContent=x[k]);

$('problem').placeholder=x.ph;

$('langbtn').textContent={
en:'🇬🇧 EN',de:'🇩🇪 DE',ro:'🇷🇴 RO',fr:'🇫🇷 FR',

function reset(id,k,off=true){
$(id).innerHTML='<option value="">'+(I[L]||I.en)[k]+'</option>';
$(id).disabled=off;
}

function fill(id,a,k){
reset(id,k,false);
a.forEach(x=>$(id).add(new Option(x.name??x,x.id??x)));
}

function current(){
let m=vdb?.models?.find(x=>x.id===$('model').value);
let g=m?.generations?.find(x=>x.id===$('generation').value);
let e=g?.engines?.find(x=>x.id===$('engine').value);
let mk=makers.find(x=>x.id===$('make').value);
return{mk,m,g,e,y:$('year').value};
}

async function yaml(u){
let r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{
cache:'no-store',
headers:{Accept:'text/yaml,text/plain,application/x-yaml,*/*'}
});
if(!r.ok)throw Error('HTTP '+r.status);
return jsyaml.load(await r.text());
}

function years(g){
let a=Number(g?.production?.from)||0;
let b=Number(g?.production?.to)||new Date().getFullYear();
return Array.from({length:Math.max(0,b-a+1)},(_,i)=>String(a+i));
}

function showVehicle(){
let v=current();
if(!v.mk||!v.m||!v.g||!v.e||!v.y){
$('vehicle').hidden=true;
$('find').disabled=true;
return;
}
$('vehicle').hidden=false;
$('vehicle').innerHTML='<strong>'+(I[L]||I.en).vehicle+':</strong> '+
esc(v.mk.name)+' '+esc(v.m.name)+' '+esc(v.g.name)+' · '+esc(v.y)+' · '+esc(v.e.name)+
(v.e.engine_codes?.length?' · '+esc(v.e.engine_codes.join(', ')):'');
$('find').disabled=false;
}

async function loadTech(id){
if(loaded===id&&tdb.length)return;
const url='data/technical/diagnostics/'+encodeURIComponent(id)+'.yaml';
let r=await fetch(url+'?v='+Date.now(),{
cache:'no-store',
headers:{Accept:'text/yaml,text/plain,application/x-yaml,*/*'}
});
if(!r.ok)throw Error('HTTP '+r.status+' while loading '+url);
let d=jsyaml.load(await r.text());
if(!Array.isArray(d?.technical_data))throw Error('Invalid technical_data structure in '+url);
tdb=d.technical_data;
loaded=id;
}

$('find').onclick=async()=>{
let v=current(),q=$('problem').value.trim(),u=I[L]||I.en;

if(!v.mk||!v.m||!v.g||!v.e||!v.y){
$('status').textContent=u.complete;
$('status').className='status error';
return;
}

if(!q){
$('status').textContent=u.describe;
$('status').className='status error';
return;
}

$('find').disabled=true;
$('status').textContent=u.search;
$('status').className='status';

try{
await loadTech(v.mk.id);

const analysis=analyzeQuery(q);
const vehicleRows=tdb.filter(r=>vehicleMatch(r,v));

let rows=vehicleRows
.map(r=>score(r,analysis))
.filter(x=>x.s>=7)
.sort((a,b)=>b.s-a.s);

rows=dedupe(rows).slice(0,20);

$('results').hidden=false;
$('count').textContent=rows.length===1?u.one:u.many.replace('{n}',rows.length);

$('debug-status').textContent=
`${tdb.length} technical entries loaded · `+
`${vehicleRows.length} compatible · `+
`${analysis.concepts.length} concepts detected · `+
`${analysis.dtcs.length} DTCs detected · `+
`${rows.length} unique relevant`;

$('list').innerHTML=rows.length?rows.map(x=>{
let r=x.r;
return `<article class="card">
<div class="top">
<div>
<h3 class="title">${esc(title(r))}</h3>
<div class="system">${esc(systemName(r))}</div>
${r.description?`<p class="desc">${esc(localizedValue(r.description))}</p>`:''}
<div class="tags">
${x.m.map(a=>`<span class="tag">${esc(a.replaceAll('_',' '))}</span>`).join('')}
${(r.related_dtcs||[]).map(a=>`<span class="tag">${esc(localizedValue(a))}</span>`).join('')}
</div>
</div>
<div class="score">${u.rel}: ${Math.round(x.s)}</div>
</div>
${r.possible_causes?.length?`<div class="section"><h4>${u.causes}</h4><ul>${localizedArray(r.possible_causes).map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
${r.diagnostic_steps?.length?`<div class="section"><h4>${u.steps}</h4><ul>${localizedArray(r.diagnostic_steps).map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
${r.related_dtcs?.length?`<div class="section"><h4>${u.dtcs}</h4><ul>${localizedArray(r.related_dtcs).map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
</article>`;
}).join(''):`<div class="empty">${u.none}</div>`;

$('status').textContent=u.ready;
$('status').className='status success';

}catch(e){
console.error('Diagnostic search error:',e);
$('status').textContent=u.error;
$('status').className='status error';
}
$('find').disabled=false;
showVehicle();
};

/* =========================================================
   NORMALIZATION
   ========================================================= */

function N(value){

    return String(value??'')

        .toLowerCase()

        .replace(/doesn['’]?t\b/g,'does not')
        .replace(/doesnt\b/g,'does not')
        .replace(/isn['’]?t\b/g,'is not')
        .replace(/isnt\b/g,'is not')
        .replace(/aren['’]?t\b/g,'are not')
        .replace(/arent\b/g,'are not')
        .replace(/wasn['’]?t\b/g,'was not')
        .replace(/wasnt\b/g,'was not')
        .replace(/weren['’]?t\b/g,'were not')
        .replace(/werent\b/g,'were not')
        .replace(/won['’]?t\b/g,'will not')
        .replace(/wont\b/g,'will not')
        .replace(/can['’]?t\b/g,'cannot')
        .replace(/cant\b/g,'cannot')
        .replace(/couldn['’]?t\b/g,'could not')
        .replace(/couldnt\b/g,'could not')
        .replace(/wouldn['’]?t\b/g,'would not')
        .replace(/wouldnt\b/g,'would not')
        .replace(/shouldn['’]?t\b/g,'should not')
        .replace(/shouldnt\b/g,'should not')
        .replace(/didn['’]?t\b/g,'did not')
        .replace(/didnt\b/g,'did not')
        .replace(/don['’]?t\b/g,'do not')
        .replace(/dont\b/g,'do not')

        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')

        .replace(/[^a-z0-9]+/g,' ')
        .replace(/\s+/g,' ')
        .trim();
}


/* =========================================================
   TEXT EXTRACTION
   ========================================================= */

function localizedValue(value){

    if(value==null){
        return '';
    }

    if(
        typeof value==='string' ||
        typeof value==='number' ||
        typeof value==='boolean'
    ){
        return String(value);
    }

    if(Array.isArray(value)){

        return value
            .map(localizedValue)
            .filter(Boolean)
            .join(', ');
    }

    if(typeof value==='object'){

        const selected=
            value[L] ??
            value.en ??
            value.ro ??
            value.de ??
            value.fr ??
            value.es ??
            value.it ??
            value.nl;

        if(selected!=null){

            if(Array.isArray(selected)){
                return selected
                    .map(localizedValue)
                    .filter(Boolean)
                    .join(', ');
            }

            if(typeof selected==='object'){
                return localizedValue(selected);
            }

            return String(selected);
        }

        for(const v of Object.values(value)){

            const result=
                localizedValue(v);

            if(result){
                return result;
            }
        }
    }

    return '';
}


function valueArray(value){

    if(value==null){
        return [];
    }

    if(Array.isArray(value)){

        return value
            .map(localizedValue)
            .filter(Boolean);
    }

    if(typeof value==='object'){

        const selected=
            value[L] ??
            value.en ??
            value.ro ??
            value.de ??
            value.fr ??
            value.es ??
            value.it ??
            value.nl;

        return valueArray(selected);
    }

    return [String(value)];
}


function cleanText(value){

    if(value==null){
        return '';
    }

    if(Array.isArray(value)){

        return value
            .map(cleanText)
            .filter(Boolean)
            .join(' ');
    }

    if(typeof value==='object'){

        return Object.values(value)
            .map(cleanText)
            .filter(Boolean)
            .join(' ');
    }

    return String(value);
}


function diagnosticText(r){

    return cleanText([

        r.id,
        r.category,
        r.system,
        r.subsystem,

        r.title,
        r.name,
        r.description,

        r.problem,
        r.issue,
        r.symptom,

        r.symptoms,
        r.keywords,

        r.possible_causes,
        r.causes,

        r.diagnostic_steps,
        r.steps,

        r.related_dtcs,
        r.dtcs,
        r.dtc,
        r.codes,

        r.conditions,
        r.notes,
        r.references

    ]);
}

/* =========================================================
   CONCEPT DETECTION
   ========================================================= */

function phraseMatch(text,phrase){

    const t=N(text);
    const p=N(phrase);

    if(!t || !p){
        return false;
    }

    if(
        t===p ||
        t.includes(` ${p} `) ||
        t.startsWith(`${p} `) ||
        t.endsWith(` ${p}`)
    ){
        return true;
    }

    /*
     * Conservative stem matching for single words.
     * We intentionally do NOT compare arbitrary first
     * five characters because that generated false matches.
     */

    const pw=p.split(' ');

    if(pw.length!==1){
        return false;
    }

    if(p.length<6){
        return false;
    }

    return t
        .split(' ')
        .some(w=>
            w.length>=6 &&
            (
                w===p ||
                w.startsWith(p.slice(0,6)) ||
                p.startsWith(w.slice(0,6))
            )
        );
}


function detectConcepts(q){

    const result=[];

    for(
        const [concept,data]
        of Object.entries(SEM)
    ){

        if(
            data.phrases.some(
                phrase=>phraseMatch(q,phrase)
            )
        ){
            result.push(concept);
        }
    }

    return [...new Set(result)];
}


/* =========================================================
   INPUT PROFILE
   ========================================================= */

function analyseInput(q){

    const detected=
        detectConcepts(q);

    const domains=
        new Set();

    let specificity=0;

    for(const concept of detected){

        const data=SEM[concept];

        if(data?.domain){
            domains.add(data.domain);
        }

        specificity+=
            Number(data?.weight||0);
    }

    /*
     * Strong smoke classification automatically places
     * the problem in engine/exhaust territory.
     */

    if(
        detected.includes('black_smoke') ||
        detected.includes('white_smoke') ||
        detected.includes('blue_smoke')
    ){

        domains.add('engine');
        domains.add('exhaust');
    }

    return{
        concepts:detected,
        domains:[...domains],
        specificity
    };
}


/* =========================================================
   RESULT DOMAIN DETECTION
   ========================================================= */

function resultProfile(r){

    const text=
        diagnosticText(r);

    const n=
        N(text);

    const concepts=
        detectConcepts(n);

    const domains=
        new Set();

    for(const c of concepts){

        const d=
            SEM[c]?.domain;

        if(d){
            domains.add(d);
        }
    }

    /*
     * Explicit YAML system/category is highly useful.
     */

    const system=
        N(
            cleanText([
                r.system,
                r.subsystem,
                r.category
            ])
        );

    if(
        system.includes('engine') ||
        system.includes('combust')
    ){
        domains.add('engine');
    }

    if(
        system.includes('exhaust') ||
        system.includes('emission')
    ){
        domains.add('exhaust');
    }

    if(
        system.includes('electrical') ||
        system.includes('charging') ||
        system.includes('battery')
    ){
        domains.add('electrical');
    }

    if(
        system.includes('cooling')
    ){
        domains.add('cooling');
    }

    if(
        system.includes('fuel') ||
        system.includes('injection')
    ){
        domains.add('fuel');
    }

    if(
        system.includes('brake') ||
        system.includes('abs') ||
        system.includes('esp') ||
        system.includes('stability') ||
        system.includes('traction')
    ){
        domains.add('chassis');
    }

    /*
     * Component-specific words in the YAML.
     */

    for(
        const [domain,terms]
        of Object.entries(COMPONENTS)
    ){

        if(
            terms.some(
                term=>phraseMatch(n,term)
            )
        ){
            domains.add(domain);
        }
    }

    return{
        concepts,
        domains:[...domains],
        text:n
    };
}


/* =========================================================
   DOMAIN COMPATIBILITY
   ========================================================= */

function domainCompatibility(input,result){

    const idomains=
        new Set(input.domains);

    const rdomains=
        new Set(result.domains);

    if(!idomains.size){
        return 0;
    }

    if(!rdomains.size){
        return -8;
    }

    /*
     * Strongly incompatible domains.
     *
     * This is what prevents an ESP/ABS result from
     * outranking a black-smoke engine result.
     */

    const chassis=
        rdomains.has('chassis');

    const engineProblem=
        idomains.has('engine') ||
        idomains.has('exhaust') ||
        idomains.has('fuel') ||
        idomains.has('air');

    if(chassis && engineProblem){

        /*
         * Only allow chassis records if they explicitly
         * contain an engine-domain concept matching the
         * input.
         */

        const overlap=
            [...idomains]
                .some(x=>rdomains.has(x));

        if(!overlap){
            return -100;
        }
    }

    let overlap=0;

    for(const d of idomains){

        if(rdomains.has(d)){
            overlap++;
        }
    }

    if(overlap){
        return 35*overlap;
    }

    /*
     * No domain overlap means weak evidence only.
     */

    return -12;
}


/* =========================================================
   WORD TOKENIZATION
   ========================================================= */

function meaningfulWords(text){

    const stop=new Set([

        'the','a','an','and','or','but','when','while',
        'with','from','into','then','after','before',
        'has','have','had','is','are','was','were',
        'does','did','will','not','doesnt',
        'car','vehicle','engine','problem',

        'si','un','o','cu','din','cand','este',
        'masina','masinii','problema'

    ]);

    return new Set(
        N(text)
            .split(' ')
            .filter(
                w=>
                    w.length>=3 &&
                    !stop.has(w)
            )
    );
}


/* =========================================================
   LEXICAL MATCHING
   ========================================================= */

function lexicalScore(input,text){

    const a=
        meaningfulWords(input);

    const b=
        meaningfulWords(text);

    if(!a.size || !b.size){
        return 0;
    }

    let score=0;

    for(const word of a){

        if(b.has(word)){

            score+=4;
            continue;
        }

        /*
         * Conservative morphological similarity.
         */

        if(word.length>=7){

            let found=false;

            for(const candidate of b){

                if(candidate.length<7){
                    continue;
                }

                const prefixLength=
                    Math.min(
                        word.length,
                        candidate.length
                    )>=9
                        ? 7
                        : 6;

                if(
                    word.slice(0,prefixLength)===
                    candidate.slice(0,prefixLength)
                ){

                    score+=1.5;
                    found=true;
                    break;
                }
            }

            if(found){
                continue;
            }
        }
    }

    return Math.min(
        30,
        score
    );
}


/* =========================================================
   EXACT / PHRASE MATCHING
   ========================================================= */

function semanticScore(input,r,result){

    let score=0;

    for(const concept of input.concepts){

        const data=
            SEM[concept];

        if(!data){
            continue;
        }

        /*
         * Search the actual YAML text for the semantic
         * family rather than requiring the exact user phrase.
         */

        const hit=
            data.phrases.some(
                phrase=>
                    phraseMatch(
                        result.text,
                        phrase
                    )
            );

        if(hit){

            score+=
                Math.min(
                    42,
                    data.weight*.55
                );
        }
    }

    /*
     * Specific symptom gets an additional strong boost.
     */

    if(
        input.concepts.includes('black_smoke') &&
        (
            result.concepts.includes('black_smoke') ||
            result.text.includes('black smoke') ||
            result.text.includes('black exhaust') ||
            result.text.includes('soot') ||
            result.text.includes('rich mixture') ||
            result.text.includes('overfuel')
        )
    ){
        score+=55;
    }

    if(
        input.concepts.includes('white_smoke') &&
        (
            result.concepts.includes('white_smoke') ||
            result.text.includes('white smoke') ||
            result.text.includes('steam')
        )
    ){
        score+=55;
    }

    if(
        input.concepts.includes('blue_smoke') &&
        (
            result.concepts.includes('blue_smoke') ||
            result.text.includes('blue smoke') ||
            result.text.includes('oil')
        )
    ){
        score+=55;
    }

    return score;
}


/* =========================================================
   CONTEXT SCORE
   ========================================================= */

function contextScore(input,r,result){

    let score=0;

    const text=result.text;

    if(
        input.concepts.includes('acceleration')
    ){

        if(
            text.includes('accelerat') ||
            text.includes('throttle') ||
            text.includes('load')
        ){
            score+=18;
        }
    }

    if(
        input.concepts.includes('low_rpm')
    ){

        if(
            text.includes('low rpm') ||
            text.includes('low rev') ||
            text.includes('low engine speed')
        ){
            score+=20;
        }
    }

    if(
        input.concepts.includes('idle')
    ){

        if(
            text.includes('idle') ||
            text.includes('ralanti')
        ){
            score+=20;
        }
    }

    return score;
}


/* =========================================================
   DTC MATCH
   ========================================================= */

function extractDTCs(q){

    return[
        ...new Set(
            String(q)
                .toUpperCase()
                .match(
                    /\b[PCBU][0-9]{4}\b/g
                )||[]
        )
    ];
}


function dtcScore(q,r){

    const codes=
        extractDTCs(q);

    if(!codes.length){
        return 0;
    }

    const text=
        cleanText([
            r.id,
            r.related_dtcs,
            r.dtcs,
            r.dtc,
            r.codes
        ]).toUpperCase();

    let score=0;

    for(const code of codes){

        if(text.includes(code)){
            score+=100;
        }
    }

    return score;
}


/* =========================================================
   FINAL SCORE
   ========================================================= */

function score(r,input){

    const result=
        resultProfile(r);

    /*
     * Hard rejection for incompatible domains.
     */

    const compatibility=
        domainCompatibility(
            input,
            result
        );

    if(compatibility<=-100){

        return{
            r,
            s:-999,
            rejected:true
        };
    }

    let s=0;

    s+=compatibility;

    s+=semanticScore(
        input,
        r,
        result
    );

    s+=lexicalScore(
        input.raw,
        result.text
    );

    s+=contextScore(
        input,
        r,
        result
    );

    s+=dtcScore(
        input.raw,
        r
    );

    /*
     * Penalize pure chassis results when the user is
     * clearly describing an engine/exhaust problem.
     */

    if(
        (
            input.domains.includes('engine') ||
            input.domains.includes('exhaust')
        ) &&
        result.domains.includes('chassis') &&
        !result.concepts.some(
            c=>input.concepts.includes(c)
        )
    ){

        s-=100;
    }

    /*
     * Specific symptom must dominate generic matches.
     */

    if(
        input.concepts.includes('black_smoke') &&
        !(
            result.concepts.includes('black_smoke') ||
            result.text.includes('black smoke') ||
            result.text.includes('black exhaust') ||
            result.text.includes('soot') ||
            result.text.includes('overfuel') ||
            result.text.includes('rich mixture') ||
            result.text.includes('fuel mixture')
        )
    ){

        s-=45;
    }

    if(
        input.concepts.includes('white_smoke') &&
        !(
            result.concepts.includes('white_smoke') ||
            result.text.includes('white smoke') ||
            result.text.includes('steam')
        )
    ){

        s-=40;
    }

    if(
        input.concepts.includes('blue_smoke') &&
        !(
            result.concepts.includes('blue_smoke') ||
            result.text.includes('blue smoke') ||
            result.text.includes('oil')
        )
    ){

        s-=40;
    }

    return{
        r,
        s:Math.round(s),
        rejected:false
    };
}


/* =========================================================
   VEHICLE MATCH
   ========================================================= */

function idValue(value){

    if(value==null){
        return '';
    }

    if(typeof value==='string'){
        return value;
    }

    if(typeof value==='object'){

        return String(
            value.id ??
            value.name ??
            ''
        );
    }

    return String(value);
}


function matchesValue(selected,value){

    if(value==null){
        return true;
    }

    if(value==='all'){
        return true;
    }

    if(Array.isArray(value)){

        if(!value.length){
            return true;
        }

        return value.some(
            x=>
                N(idValue(x))===
                    N(selected.id)
                ||
                N(idValue(x))===
                    N(selected.name)
        );
    }

    return(
        N(idValue(value))===
            N(selected.id)
        ||
        N(idValue(value))===
            N(selected.name)
    );
}


function vehicleMatch(r,v){

    const x=
        r.vehicle &&
        typeof r.vehicle==='object'
            ? r.vehicle
            : r;

    return(

        matchesValue(
            v.m,
            x.models
        )

        &&

        matchesValue(
            v.g,
            x.generations
        )

        &&

        matchesValue(
            v.e,
            x.engines
        )

    );
}


/* =========================================================
   TITLE
   ========================================================= */

function title(r){

    const value=

        localizedValue(r.title) ||

        localizedValue(r.name) ||

        localizedValue(r.description) ||

        localizedValue(r.symptom) ||

        localizedValue(r.problem) ||

        localizedValue(r.issue);

    if(value){
        return value;
    }

    if(r.id){

        return String(r.id)

            .replace(/^ford_/i,'')

            .replace(/[_-]+/g,' ')

            .replace(/\s+/g,' ')

            .trim()

            .replace(
                /\b\w/g,
                c=>c.toUpperCase()
            );
    }

    return 'Diagnostic information';
}


/* =========================================================
   YAML LOADER
   ========================================================= */

async function yaml(path){

    const response=
        await fetch(
            path,
            {
                cache:'no-store'
            }
        );

    if(!response.ok){

        throw new Error(
            `${path}: HTTP ${response.status}`
        );
    }

    const text=
        await response.text();

    return jsyaml.load(text);
}


/* =========================================================
   SELECT HELPERS
   ========================================================= */

function resetSelect(
    id,
    placeholder,
    disabled=true
){

    const el=$(id);

    el.innerHTML='';

    const o=
        document.createElement('option');

    o.value='';
    o.textContent=placeholder;

    el.appendChild(o);

    el.disabled=disabled;
}


function option(id,name){

    const o=
        document.createElement('option');

    o.value=id;
    o.textContent=name;

    return o;
}


function manufacturerName(m){

    return(
        localizedValue(m.name) ||
        m.id
    );
}


/* =========================================================
   VEHICLE UI
   ========================================================= */

function setVehicle(){

    const m=
        makers.find(
            x=>x.id===$('make').value
        );

    if(!m){

        $('vehicle').hidden=true;
        return;
    }

    const model=
        (vehicles?.models||[])
            .find(
                x=>x.id===$('model').value
            );

    const generation=
        model?.generations
            ?.find(
                x=>x.id===$('generation').value
            );

    const engine=
        generation?.engines
            ?.find(
                x=>String(x.id)===$('engine').value
            );

    if(
        !model ||
        !generation ||
        !engine
    ){

        $('vehicle').hidden=true;
        return;
    }

    $('vehicle').hidden=false;

    $('vehicle').textContent=
        `${I[L].vehicle}: `+
        `${manufacturerName(m)} · `+
        `${localizedValue(model.name)} · `+
        `${localizedValue(generation.name)} · `+
        `${localizedValue(engine.name)}`;
}


function updateFind(){

    $('find').disabled=!(
        $('make').value &&
        $('model').value &&
        $('generation').value &&
        $('engine').value
    );
}


/* =========================================================
   MODELS
   ========================================================= */

function loadModels(){

    resetSelect(
        'model',
        I[L].smod,
        true
    );

    resetSelect(
        'generation',
        I[L].sg,
        true
    );

    resetSelect(
        'year',
        I[L].sy,
        true
    );

    resetSelect(
        'engine',
        I[L].se,
        true
    );

    currentManufacturer=
        makers.find(
            x=>x.id===$('make').value
        )||null;

    if(!currentManufacturer){
        return;
    }

    const models=
        Array.isArray(vehicles?.models)
            ? vehicles.models
            : [];

    for(const model of models){

        $('model').appendChild(
            option(
                model.id,
                localizedValue(model.name)||
                model.id
            )
        );
    }

    $('model').disabled=
        !models.length;

    setVehicle();
    updateFind();
}


/* =========================================================
   GENERATIONS
   ========================================================= */

function loadGenerations(){

    resetSelect(
        'generation',
        I[L].sg,
        true
    );

    resetSelect(
        'year',
        I[L].sy,
        true
    );

    resetSelect(
        'engine',
        I[L].se,
        true
    );

    const model=
        (vehicles?.models||[])
            .find(
                x=>x.id===$('model').value
            );

    const generations=
        Array.isArray(model?.generations)
            ? model.generations
            : [];

    for(
        const generation
        of generations
    ){

        $('generation').appendChild(
            option(
                generation.id,
                localizedValue(generation.name)||
                generation.id
            )
        );
    }

    $('generation').disabled=
        !generations.length;

    setVehicle();
    updateFind();
}


/* =========================================================
   YEAR + ENGINE
   ========================================================= */

function loadYearsAndEngines(){

    resetSelect(
        'year',
        I[L].sy,
        true
    );

    resetSelect(
        'engine',
        I[L].se,
        true
    );

    const model=
        (vehicles?.models||[])
            .find(
                x=>x.id===$('model').value
            );

    const generation=
        model?.generations
            ?.find(
                x=>x.id===$('generation').value
            );

    if(!generation){

        updateFind();
        return;
    }

    const from=
        Number(
            generation.production?.from
        );

    const to=
        Number(
            generation.production?.to
        );

    if(
        Number.isFinite(from) &&
        Number.isFinite(to)
    ){

        for(
            let y=from;
            y<=to;
            y++
        ){

            $('year').appendChild(
                option(
                    String(y),
                    String(y)
                )
            );
        }

        $('year').disabled=false;
    }

    const engines=
        Array.isArray(generation.engines)
            ? generation.engines
            : [];

    for(
        const engine
        of engines
    ){

        let name=
            localizedValue(engine.name)||
            engine.id;

        if(engine.fuel){
            name+=` · ${engine.fuel}`;
        }

        $('engine').appendChild(
            option(
                String(engine.id),
                name
            )
        );
    }

    $('engine').disabled=
        !engines.length;

    setVehicle();
    updateFind();
}


/* =========================================================
   TECHNICAL DATABASE
   ========================================================= */

async function loadTech(){

    const makeId=
        $('make').value;

    if(!makeId){

        tdb=[];
        return;
    }

    const d=
        await yaml(
            `data/technical/diagnostics/${makeId}.yaml`
        );

    if(
        d &&
        Array.isArray(
            d.technical_data
        )
    ){

        tdb=
            d.technical_data
                .filter(Boolean);

    }else{

        tdb=[];
    }
}


/* =========================================================
   LANGUAGE
   ========================================================= */

function setLang(lang){

    if(!I[lang]){
        lang='en';
    }

    L=lang;

    localStorage.setItem(
        'autodecode_language',
        L
    );

    const T=I[L];

    $('home').textContent=T.home;
    $('intro').textContent=T.intro;

    $('lm').textContent=T.make;
    $('lmodel').textContent=T.model;
    $('lg').textContent=T.generation;
    $('ly').textContent=T.year;
    $('le').textContent=T.engine;
    $('lp').textContent=T.problem;

    $('find').textContent=T.find;
    $('rh').textContent=T.rh;

    $('problem').placeholder=T.ph;

    $('langbtn').textContent=
        ({
            en:'🇬🇧 EN ▾',
            de:'🇩🇪 DE ▾',
            ro:'🇷🇴 RO ▾',
            fr:'🇫🇷 FR ▾',
            es:'🇪🇸 ES ▾',
            it:'🇮🇹 IT ▾',
            nl:'🇳🇱 NL ▾'
        })[L];

    resetSelect(
        'make',
        T.sm,
        false
    );

    for(
        const maker
        of makers
    ){

        $('make').appendChild(
            option(
                maker.id,
                manufacturerName(maker)
            )
        );
    }

    resetSelect(
        'model',
        T.smod,
        true
    );

    resetSelect(
        'generation',
        T.sg,
        true
    );

    resetSelect(
        'year',
        T.sy,
        true
    );

    resetSelect(
        'engine',
        T.se,
        true
    );

    $('find').disabled=true;

    setVehicle();
}


/* =========================================================
   RENDER
   ========================================================= */

function section(heading,items){

    const div=
        document.createElement('div');

    div.className='section';

    const h=
        document.createElement('h4');

    h.textContent=heading;

    const ul=
        document.createElement('ul');

    for(
        const item
        of items
    ){

        const li=
            document.createElement('li');

        li.textContent=item;

        ul.appendChild(li);
    }

    div.appendChild(h);
    div.appendChild(ul);

    return div;
}


function renderList(rows){

    $('results').hidden=false;

    $('list').innerHTML='';

    if(!rows.length){

        $('count').textContent='';

        $('list').innerHTML=
            `<div class="empty">${I[L].none}</div>`;

        return;
    }

    $('count').textContent=
        rows.length===1
            ? I[L].one
            : I[L].many.replace(
                '{n}',
                rows.length
            );

    for(
        const item
        of rows
    ){

        const r=item.r;

        const card=
            document.createElement('article');

        card.className='card';

        const top=
            document.createElement('div');

        top.className='top';

        const left=
            document.createElement('div');

        const h=
            document.createElement('h3');

        h.className='title';

        h.textContent=
            title(r);

        left.appendChild(h);

        if(
            r.system ||
            r.category
        ){

            const system=
                document.createElement('div');

            system.className='system';

            system.textContent=
                [
                    localizedValue(r.system),
                    localizedValue(r.category)
                ]
                .filter(Boolean)
                .join(' · ');

            left.appendChild(system);
        }

        const description=
            localizedValue(
                r.description ||
                r.problem ||
                r.issue
            );

        if(description){

            const p=
                document.createElement('p');

            p.className='desc';

            p.textContent=
                description;

            left.appendChild(p);
        }

        const symptoms=
            valueArray(r.symptoms);

        if(symptoms.length){

            const tags=
                document.createElement('div');

            tags.className='tags';

            for(
                const symptom
                of symptoms.slice(0,12)
            ){

                const tag=
                    document.createElement('span');

                tag.className='tag';

                tag.textContent=
                    symptom;

                tags.appendChild(tag);
            }

            left.appendChild(tags);
        }

        const score=
            document.createElement('div');

        score.className='score';

        score.textContent=
            `${I[L].rel}: ${item.s}`;

        top.appendChild(left);
        top.appendChild(score);

        card.appendChild(top);

        const causes=
            valueArray(
                r.possible_causes ??
                r.causes
            );

        if(causes.length){

            card.appendChild(
                section(
                    I[L].causes,
                    causes
                )
            );
        }

        const steps=
            valueArray(
                r.diagnostic_steps ??
                r.steps
            );

        if(steps.length){

            card.appendChild(
                section(
                    I[L].steps,
                    steps
                )
            );
        }

        const dtcs=
            valueArray(
                r.related_dtcs ??
                r.dtcs ??
                r.dtc
            );

        if(dtcs.length){

            card.appendChild(
                section(
                    I[L].dtcs,
                    dtcs
                )
            );
        }

        $('list').appendChild(card);
    }
}


/* =========================================================
   SEARCH
   ========================================================= */

async function search(){

    const q=
        $('problem').value.trim();

    if(
        !$('make').value ||
        !$('model').value ||
        !$('generation').value ||
        !$('engine').value
    ){

        $('status').textContent=
            I[L].complete;

        $('status').className=
            'status error';

        return;
    }

    if(!q){

        $('status').textContent=
            I[L].describe;

        $('status').className=
            'status error';

        return;
    }

    $('status').textContent=
        I[L].search;

    $('status').className=
        'status';

    $('results').hidden=true;

    try{

        await loadTech();

        const model=
            (vehicles?.models||[])
                .find(
                    x=>x.id===$('model').value
                );

        const generation=
            model?.generations
                ?.find(
                    x=>x.id===$('generation').value
                );

        const engine=
            generation?.engines
                ?.find(
                    x=>String(x.id)===$('engine').value
                );

        if(
            !model ||
            !generation ||
            !engine
        ){

            throw new Error(
                'Incomplete vehicle selection'
            );
        }

        const v={

            m:{
                id:$('make').value,
                name:currentManufacturer?.name
            },

            g:{
                id:generation.id,
                name:generation.name
            },

            e:{
                id:engine.id,
                name:engine.name
            }

        };

        /*
         * Create the complete semantic profile.
         */

        const input=
            analyseInput(q);

        input.raw=q;

        /*
         * Only vehicle-compatible records enter
         * the diagnostic ranking.
         */

        const vehicleRows=
            tdb.filter(
                r=>vehicleMatch(r,v)
            );

        /*
         * Score every compatible YAML entry.
         * No requirement exists for a recognized
         * symptom. This preserves the YAML fallback.
         */

        let scored=
            vehicleRows
                .map(
                    r=>score(r,input)
                )
                .filter(
                    x=>!x.rejected
                )
                .sort(
                    (a,b)=>b.s-a.s
                );

        /*
         * Strong relevance threshold.
         *
         * If semantic understanding exists, weak generic
         * records are removed.
         */

        let rows;

        if(input.concepts.length){

            rows=
                scored
                    .filter(
                        x=>x.s>=15
                    )
                    .slice(0,20);

        }else{

            /*
             * Unknown natural-language problem:
             * use conservative lexical fallback.
             */

            rows=
                scored
                    .filter(
                        x=>x.s>=8
                    )
                    .slice(0,20);
        }

        /*
         * Absolute fallback: if the user describes
         * something completely new and the vehicle has
         * technical entries, return the best lexical
         * candidates rather than showing unrelated
         * domains such as ESP for an engine problem.
         */

        if(
            !rows.length &&
            vehicleRows.length
        ){

            const fallback=
                vehicleRows
                    .map(
                        r=>{

                            const result=
                                resultProfile(r);

                            return{
                                r,
                                s:
                                    lexicalScore(
                                        q,
                                        result.text
                                    )
                            };
                        }
                    )
                    .sort(
                        (a,b)=>b.s-a.s
                    )
                    .filter(
                        x=>x.s>0
                    )
                    .slice(0,10);

            rows=fallback;
        }

        renderList(rows);

        $('status').textContent=
            I[L].ready;

        $('status').className=
            'status success';

        /*
         * Console diagnostics are intentionally kept
         * available for development without exposing
         * them in the UI.
         */

        console.log(
            'AutoDecode diagnostic profile:',
            input
        );

        console.log(
            'AutoDecode ranked results:',
            rows.map(
                x=>({
                    id:x.r.id,
                    score:x.s
                })
            )
        );

    }catch(error){

        console.error(error);

        $('status').textContent=
            I[L].error;

        $('status').className=
            'status error';

        $('results').hidden=false;

        $('count').textContent='';

        $('list').innerHTML=
            `<div class="empty">${I[L].error}</div>`;
    }
}


/* =========================================================
   INITIALIZATION
   ========================================================= */

async function init(){

    $('fy').textContent=
        new Date().getFullYear();

    $('langbtn').addEventListener(
        'click',
        ()=>{
            $('langmenu')
                .classList.toggle('open');
        }
    );

    document
        .querySelectorAll('[data-l]')
        .forEach(
            el=>{

                el.addEventListener(
                    'click',
                    ()=>{

                        setLang(
                            el.dataset.l
                        );

                        $('langmenu')
                            .classList.remove('open');
                    }
                );
            }
        );

    document.addEventListener(
        'click',
        event=>{

            if(
                !event.target.closest('.langs')
            ){

                $('langmenu')
                    .classList.remove('open');
            }
        }
    );


    /*
     * LOAD MANUFACTURERS
     */

    try{

        const d=
            await yaml(
                'data/vehicles/manufacturers.yaml'
            );

        if(
            !d ||
            !Array.isArray(
                d.manufacturers
            )
        ){

            throw new Error(
                'Invalid manufacturers database structure'
            );
        }

        makers=
            d.manufacturers.filter(Boolean);

        setLang(L);

        $('status').textContent=
            I[L].ready;

        $('status').className=
            'status success';

    }catch(error){

        console.error(error);

        setLang(L);

        $('status').textContent=
            I[L].error;

        $('status').className=
            'status error';
    }


    /*
     * MAKE
     */

    $('make').addEventListener(
        'change',
        async ()=>{

            const id=
                $('make').value;

            vehicles=null;

            if(!id){

                updateFind();
                return;
            }

            $('status').textContent=
                I[L].loading;

            $('status').className=
                'status';

            try{

                vehicles=
                    await yaml(
                        `data/vehicles/${id}.yaml`
                    );

                loadModels();

                /*
                 * Preload technical data so the first
                 * search is instant.
                 */

                await loadTech();

                $('status').textContent=
                    I[L].ready;

                $('status').className=
                    'status success';

            }catch(error){

                console.error(error);

                $('status').textContent=
                    I[L].error;

                $('status').className=
                    'status error';
            }
        }
    );


    /*
     * MODEL
     */

    $('model').addEventListener(
        'change',
        loadGenerations
    );


    /*
     * GENERATION
     */

    $('generation').addEventListener(
        'change',
        loadYearsAndEngines
    );


    /*
     * YEAR
     */

    $('year').addEventListener(
        'change',
        ()=>{
            setVehicle();
            updateFind();
        }
    );


    /*
     * ENGINE
     */

    $('engine').addEventListener(
        'change',
        ()=>{
            setVehicle();
            updateFind();
        }
    );


    /*
     * PROBLEM
     */

    $('problem').addEventListener(
        'input',
        ()=>{
            $('results').hidden=true;
        }
    );


    /*
     * SEARCH
     */

    $('find').addEventListener(
        'click',
        search
    );
}


init();

</script>

/* ============================================================
   TEXT NORMALIZATION
============================================================ */

function normalizeText(v){

return String(v??"")
.toLowerCase()
.replace(/[’‘`´]/g,"'")
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g," ")
.replace(/\s+/g," ")
.trim()

}

function tokenize(v){

return new Set(
normalizeText(v)
.split(" ")
.filter(Boolean)
)

}

function escapeRegex(v){

return String(v)
.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")

}

function phraseMatches(text,phrase){

const a=normalizeText(text);
const p=normalizeText(phrase);

if(!a||!p)return false;

return (` ${a} `).includes(` ${p} `)

}

function tokenWindowMatches(text,phrase){

const a=normalizeText(text).split(" ").filter(Boolean);
const p=normalizeText(phrase).split(" ").filter(Boolean);

if(p.length<2||p.length>7)return false;

for(let i=0;i<a.length;i++){

let pos=i;
let ok=true;

for(const word of p){

let found=-1;

for(
let j=pos;
j<Math.min(a.length,pos+6);
j++
){

if(a[j]===word){

found=j;
break

}

}

if(found<0){

ok=false;
break

}

pos=found+1

}

if(ok)return true

}

return false

}

function fuzzyTokenMatch(text,alias){

const a=normalizeText(text).split(" ").filter(Boolean);
const p=normalizeText(alias).split(" ").filter(Boolean);

if(p.length!==1||p[0].length<6)return false;

const target=p[0];

return a.some(w=>
w===target||
w.startsWith(target)||
(target.startsWith(w)&&w.length>=5)
)

}

function matchesAlias(text,alias){

return phraseMatches(text,alias)||
tokenWindowMatches(text,alias)||
fuzzyTokenMatch(text,alias)

}

/* ============================================================
   SEMANTIC DICTIONARY HELPERS
============================================================ */

function mergeUniqueArray(target,values){

if(!Array.isArray(target))target=[];
if(!Array.isArray(values))values=[values];

for(const value of values){

if(value==null)continue;

if(typeof value==="string"&&!target.includes(value)){
target.push(value)
}

}

return target

}

function flattenSemanticAliases(value){

const out=[];

function walk(v){

if(v==null)return;

if(typeof v==="string"){

out.push(v);
return

}

if(Array.isArray(v)){

for(const x of v)walk(x);
return

}

if(typeof v==="object"){

for(const x of Object.values(v))walk(x)

}

}

walk(value);

return[
...new Set(
out.filter(Boolean)
)
]

}

/* ============================================================
   CANONICALIZATION
============================================================ */

function canonical(id){

let current=String(id??"").trim();

if(!current)return"";

const visited=new Set();

while(current&&!visited.has(current)){

visited.add(current);

const next=
externalCanonicalAlias[current]||
canonicalAlias[current]||
current;

if(next===current)break;

current=next

}

return current

}

/* ============================================================
   BUILD EXTERNAL SEMANTIC INDEX
============================================================ */

function buildSemanticIndex(data){

semanticDictionary=data;

semanticConcepts={};
semanticRelationships=[];
semanticPriority={};
externalCanonicalAlias={};

/*
   First load external canonical aliases.
*/

if(
data?.canonical_alias&&
typeof data.canonical_alias==="object"
){

for(
const [key,value]
of Object.entries(data.canonical_alias)
){

if(Array.isArray(value)){

for(const alias of value){

const n=normalizeText(alias);

if(n){
externalCanonicalAlias[n.replace(/ /g,"_")]=key
}

}

}else if(typeof value==="string"){

const n=normalizeText(key);

if(n){
externalCanonicalAlias[n.replace(/ /g,"_")]=value
}

}

}

}

/*
   Load concepts.
   IMPORTANT:
   aliases can be either:
   - an array
   - an object keyed by language
*/

if(
data?.concepts&&
typeof data.concepts==="object"
){

for(
const [id,concept]
of Object.entries(data.concepts)
){

const canonicalId=
externalCanonicalAlias[id]||
id;

const aliases=
flattenSemanticAliases(
concept?.aliases||
concept?.terms||
concept?.phrases||
concept?.keywords||
concept?.translations||
[]
);

semanticConcepts[canonicalId]={
id:canonicalId,
aliases,
system:concept?.system||null,
category:concept?.category||null,
priority:Number(concept?.priority)||0
};

if(!symptomAliases[canonicalId]){
symptomAliases[canonicalId]=[]
}

symptomAliases[canonicalId]=
mergeUniqueArray(
symptomAliases[canonicalId],
aliases
)

}

}

/*
   Load external relationships.
*/

const relationshipSource=
data?.relationships;

if(Array.isArray(relationshipSource)){

for(const relation of relationshipSource){

if(!relation||typeof relation!=="object")continue;

let required=
Array.isArray(relation.required)
?relation.required
:Array.isArray(relation.concepts)
?relation.concepts
:[];

required=
required
.map(x=>canonical(x))
.filter(Boolean);

if(required.length>=2){

semanticRelationships.push({
required,
bonus:Number(relation.bonus)||0
})

}

}

}else if(
relationshipSource&&
typeof relationshipSource==="object"
){

for(
const [source,value]
of Object.entries(relationshipSource)
){

const sourceCanonical=
canonical(source);

const targets=
Array.isArray(value)
?value
:value?.concepts||
value?.related||
[];

for(const target of targets){

const targetCanonical=
canonical(target);

if(
sourceCanonical&&
targetCanonical&&
sourceCanonical!==targetCanonical
){

semanticRelationships.push({
required:[
sourceCanonical,
targetCanonical
],
bonus:Number(value?.bonus)||0
})

}

}

}

}

/*
   External priorities.
*/

if(
data?.priority&&
typeof data.priority==="object"
){

for(
const [id,value]
of Object.entries(data.priority)
){

semanticPriority[
canonical(id)
]=Number(value)||0

}

}

/*
   Remove invalid relationship targets.
*/

semanticRelationships=
semanticRelationships.filter(rel=>
Array.isArray(rel.required)&&
rel.required.every(id=>
Boolean(id)&&
(
semanticConcepts[id]||
symptomAliases[id]||
Object.prototype.hasOwnProperty.call(
canonicalAlias,
id
)||
Object.prototype.hasOwnProperty.call(
externalCanonicalAlias,
id
)
)
)
);

/*
   Merge external aliases into canonicalAlias.

   IMPORTANT:
   external aliases are stored normalized with underscores.
*/

for(
const [source,target]
of Object.entries(externalCanonicalAlias)
){

canonicalAlias[source]=target

}

console.log(
"AutoDecode semantic dictionary loaded:",
Object.keys(semanticConcepts).length,
"concepts"
)

}

/*
   Generic phrases such as "not working" are NOT allowed
   to create a semantic concept by themselves.

   A specific component phrase must be present.
*/

const genericSymptomPhrases=new Set([

"not working",
"does not work",
"doesn't work",
"doesnt work",
"won't work",
"wont work",
"will not work",
"not function",
"not functioning",
"not available",

"ne fonctionne pas",
"ne marche pas",
"ne fonctionne plus",
"ne marche plus",

"no funciona",
"no funciona correctamente",

"non funziona",
"non funziona più",

"werkt niet",
"werkt niet meer",

"funktioniert nicht",
"funktioniert nicht mehr",

"nu functioneaza",
"nu funcționează",
"nu mai functioneaza",
"nu mai funcționează",

"nu merge",
"nu mai merge"

]);

function isGenericAlias(alias){

const n=
normalizeText(alias);

return genericSymptomPhrases.has(n)

}

function detectUserSymptoms(problem){

const text=
normalizeText(problem);

const found=
new Set();

const evidence=
new Map();

for(
const [id,aliases]
of Object.entries(symptomAliases)
){

if(!Array.isArray(aliases))continue;

for(const alias of aliases){

if(isGenericAlias(alias))
continue;

if(matchesAlias(text,alias)){

const c=
canonical(id);

if(!c)continue;

found.add(c);

const previous=
evidence.get(c)||0;

const normalizedAlias=
normalizeText(alias);

let strength=1;

if(
normalizedAlias.length>=25
)strength+=4;
else if(
normalizedAlias.length>=15
)strength+=3;
else if(
normalizedAlias.length>=8
)strength+=2;

if(
phraseMatches(text,alias)
)strength+=5;

evidence.set(
c,
previous+strength
);

}

}

}

/*
   Contextual inference for starting problems.
*/

if(found.has("crank_no_start")){
found.add("no_start")
}

if(
found.has("engine_stall")&&
found.has("crank_no_start")
){

found.add("no_start")

}

/*
   Preserve the concepts with strongest evidence first.
*/

return[
...found
].sort(
(a,b)=>
(evidence.get(b)||0)-
(evidence.get(a)||0)
)

}

/* ============================================================
   ITEM TEXT
============================================================ */

function getItemText(item){

if(itemTextCache.has(item))
return itemTextCache.get(item);

const parts=[];

for(
const key of [
"id",
"system",
"category",
"title",
"description",
"symptoms",
"keywords",
"possible_causes",
"diagnostic_steps",
"related_dtcs"
]
){

const v=item?.[key];

if(v==null)continue;

if(typeof v==="object"){

parts.push(
JSON.stringify(v)
)

}else{

parts.push(
String(v)
)

}

}

const text=
parts.join(" ");

itemTextCache.set(
item,
text
);

return text

}

/* ============================================================
   CONCEPT EXPANSION
============================================================ */

function getRelevantConcepts(userSymptoms){

const set=
new Set(
userSymptoms.map(canonical)
);

/*
   Only expand from the primary user concepts.
   This is important: generic secondary concepts must
   not become equally strong as the actual symptom.
*/

for(const s of userSymptoms){

for(
const x of conceptExpansion[s]||[]
){

const c=
canonical(x);

if(c)set.add(c)

}

}

/*
   External relationships are deliberately limited.
   A relation only expands when all of its required
   concepts are already present, avoiding broad
   cross-system pollution.
*/

for(
const relation of semanticRelationships
){

const required=
relation.required||[];

if(
required.length>=2&&
required.every(
id=>set.has(canonical(id))
)
){

for(const id of required){

set.add(
canonical(id)
)

}

}

}

return[...set]

}

/* ============================================================
   ITEM SEMANTIC EXTRACTION
============================================================ */

function getItemSymptoms(
item,
relevantConcepts=null
){

if(!item||typeof item!=="object")
return[];

if(
!relevantConcepts&&
itemSemanticCache.has(item)
){

return itemSemanticCache.get(item)

}

const out=
new Set();

/*
   1. Explicit symptoms from database.
*/

const raw=
item?.symptoms||[];

for(
const s of Array.isArray(raw)
?raw
:[raw]
){

const id=
normalizeSymptomId(
typeof s==="string"
?s
:s?.id
);

if(id)out.add(id)

}

/*
   2. Explicit system concept.
*/

const system=
normalizeSymptomId(
item?.system||""
);

if(system)out.add(system);

/*
   3. Match only relevant concepts against the
      complete technical record.

   This is where exact multilingual aliases are used.
*/

if(
relevantConcepts&&
relevantConcepts.length
){

const text=
getItemText(item);

for(
const id of relevantConcepts
){

const aliases=
symptomAliases[id]||[];

if(
aliases.some(alias=>
!isGenericAlias(alias)&&
matchesAlias(text,alias)
)
){

out.add(
canonical(id)
)

}

}

}else if(!relevantConcepts){

const text=
getItemText(item);

for(
const [id,aliases]
of Object.entries(symptomAliases)
){

if(
Array.isArray(aliases)&&
aliases.some(alias=>
!isGenericAlias(alias)&&
matchesAlias(text,alias)
)
){

out.add(
canonical(id)
)

}

}

const result=
[...out];

itemSemanticCache.set(
item,
result
);

return result

}

return[...out]

}

async function loadTechnicalDatabase(id){
  setStatus(t("technical_loading"));
  technicalDatabase = [];

  try {
    const databaseUrl = new URL(
      `data/technical/diagnostics/${encodeURIComponent(id)}.yaml`,
      document.baseURI
    ).href;

    console.log("[AutoDecode] Technical database URL:", databaseUrl);

    const r = await fetch(
      `${databaseUrl}${databaseUrl.includes("?") ? "&" : "?"}v=${Date.now()}`,
      {
        cache: "no-store",
        headers: {
          "Accept": "text/yaml,text/plain,application/x-yaml,*/*"
        }
      }
    );

    console.log(
      "[AutoDecode] Technical database HTTP:",
      r.status,
      r.statusText,
      r.url
    );

    if(!r.ok){
      throw Error(
        `Technical database HTTP ${r.status} ${r.statusText} — ${r.url}`
      );
    }

    const raw = await r.text();

    console.log(
      "[AutoDecode] Technical database bytes:",
      raw.length
    );

    if(!raw.trim()){
      throw Error("Technical database response is empty.");
    }

    let d;

    /* ============================================================
       1. FIRST TRY: NORMAL YAML
       ============================================================ */

    try{
      d = jsyaml.load(raw);

      console.log(
        "[AutoDecode] YAML parsed normally."
      );

    }catch(parseError){

      console.warn(
        "[AutoDecode] Normal YAML parsing failed. Starting structural repair...",
        parseError
      );

      /* ==========================================================
         2. STRUCTURAL YAML REPAIR
         ========================================================== */

      const repaired = repairTechnicalYaml(raw);

      console.log(
        "[AutoDecode] Repaired YAML size:",
        repaired.length
      );

      try{

        d = jsyaml.load(repaired);

        console.log(
          "[AutoDecode] Repaired YAML parsed successfully."
        );

      }catch(repairedError){

        console.error(
          "[AutoDecode] Repaired YAML still invalid:",
          repairedError
        );

        const mark =
          repairedError?.mark ||
          parseError?.mark ||
          null;

        const line =
          Number.isInteger(mark?.line)
            ? mark.line + 1
            : null;

        const column =
          Number.isInteger(mark?.column)
            ? mark.column + 1
            : null;

        let context = "";

        if(line){
          const lines = repaired.split(/\r?\n/);
          const from = Math.max(0, line - 4);
          const to = Math.min(lines.length, line + 3);

          context = "\n\nYAML context:\n";

          for(let i = from; i < to; i++){
            context +=
              `${String(i + 1).padStart(6," ")} | ${lines[i]}\n`;
          }
        }

        throw Error(
          `YAML parse error at line ${
            line || "unknown"
          }${
            column ? `, column ${column}` : ""
          }: ${
            repairedError.message || repairedError
          }${context}`
        );
      }
    }

    /* ============================================================
       3. EXTRACT DATABASE
       ============================================================ */

    technicalDatabase =
      Array.isArray(d?.technical_data)
        ? d.technical_data
        : Array.isArray(d)
          ? d
          : [];

    if(!Array.isArray(technicalDatabase)){
      technicalDatabase = [];
    }

    if(!technicalDatabase.length){
      throw Error(
        "Invalid technical database structure: 'technical_data' is missing or empty."
      );
    }

    console.log(
      "[AutoDecode] Loaded technical records:",
      technicalDatabase.length
    );

    console.log(
      "[AutoDecode] Technical database root keys:",
      d &&
      typeof d === "object" &&
      !Array.isArray(d)
        ? Object.keys(d)
        : "array"
    );

    setStatus(
      t("technical_ready"),
      "success"
    );

    return true;

  }catch(e){

    console.error(
      "[AutoDecode] Technical database load failed:",
      e
    );

    technicalDatabase = [];

    const detail =
      String(e?.message || e);

    setStatus(
      `${t("technical_error")} ${detail}`,
      "error"
    );

    return false;
  }
}


/* ================================================================
   AUTO-DECODE STRUCTURAL YAML REPAIR
   ================================================================ */

function repairTechnicalYaml(source){

  const lines = source.replace(/\r\n/g,"\n").split("\n");

  const output = [];

  let insideTechnicalData = false;
  let currentRecord = false;

  /*
   * Keys which contain YAML arrays.
   *
   * Their "-" children must always be indented one level deeper.
   */
  const arrayKeys = new Set([
    "models",
    "systems",
    "symptoms",
    "causes",
    "checks",
    "solutions",
    "related_dtcs",
    "dtcs",
    "keywords",
    "aliases",
    "components",
    "engines",
    "years",
    "variants",
    "modules",
    "tests",
    "steps",
    "possible_causes",
    "possible_solutions",
    "affected_systems",
    "supported_models",
    "references"
  ]);

  /*
   * Keys which normally contain nested objects.
   */
  const objectKeys = new Set([
    "vehicle",
    "title",
    "description",
    "diagnosis",
    "diagnostic",
    "repair",
    "procedure",
    "condition",
    "requirements",
    "engine",
    "transmission",
    "system",
    "metadata"
  ]);

  /*
   * Technical record keys.
   *
   * These MUST sit directly under:
   *
   * technical_data:
   *
   * at indentation level 2.
   */
  const recordKeys = new Set([
    "id",
    "vehicle",
    "title",
    "description",
    "symptoms",
    "causes",
    "checks",
    "solutions",
    "models",
    "systems",
    "related_dtcs",
    "difficulty",
    "keywords",
    "aliases",
    "components",
    "engines",
    "years",
    "variants",
    "modules",
    "tests",
    "steps",
    "possible_causes",
    "possible_solutions",
    "affected_systems",
    "supported_models",
    "references"
  ]);

  /*
   * Remove comments only when they are not inside quotes.
   * We deliberately keep the original text otherwise.
   */
  function getKey(text){

    const m = text.match(/^([A-Za-z0-9_]+):(?:\s|$)/);

    return m ? m[1] : null;
  }

  function isListItem(text){
    return /^-\s/.test(text.trim()) || text.trim() === "-";
  }

  function isRecordStart(text){
    return /^-\s+id\s*:/.test(text.trim());
  }

  function isTechnicalRoot(text){
    return /^technical_data\s*:/.test(text.trim());
  }

  /*
   * Determine whether this is clearly a technical record key.
   */
  function isRecordKey(text){

    const key = getKey(text.trim());

    return !!key && recordKeys.has(key);
  }

  /*
   * Find nearest previous non-empty line.
   */
  function previousMeaningful(index){

    for(let i=index-1;i>=0;i--){

      if(lines[i].trim() !== ""){
        return {
          index:i,
          text:lines[i]
        };
      }
    }

    return null;
  }

  /*
   * Find next non-empty line.
   */
  function nextMeaningful(index){

    for(let i=index+1;i<lines.length;i++){

      if(lines[i].trim() !== ""){
        return {
          index:i,
          text:lines[i]
        };
      }
    }

    return null;
  }

  /*
   * Track the currently active YAML hierarchy.
   *
   * Each entry:
   *
   * {
   *   key,
   *   indent
   * }
   */
  const stack = [];

  function cleanStack(indent){

    while(
      stack.length &&
      indent <= stack[stack.length - 1].indent
    ){
      stack.pop();
    }
  }

  for(let i=0;i<lines.length;i++){

    const original = lines[i];

    if(original.trim() === ""){
      output.push("");
      continue;
    }

    const trimmed = original.trim();

    /*
     * Preserve YAML document markers.
     */
    if(trimmed === "---" || trimmed === "..."){
      output.push(trimmed);
      continue;
    }

    /*
     * Detect technical_data root.
     */
    if(isTechnicalRoot(original)){
      insideTechnicalData = true;
      currentRecord = false;
      stack.length = 0;

      output.push("technical_data:");
      continue;
    }

    /*
     * Before technical_data we preserve the original indentation,
     * because manufacturer metadata is already valid.
     */
    if(!insideTechnicalData){

      output.push(original);
      continue;
    }

    /* ============================================================
       TECHNICAL RECORD START
       ============================================================ */

    if(isRecordStart(original)){

      currentRecord = true;

      stack.length = 0;

      /*
       * EVERY technical record starts at exactly 2 spaces.
       */
      output.push(
        "  " + trimmed
      );

      /*
       * id is now the first key inside the record.
       */
      stack.push({
        key:"__record__",
        indent:2
      });

      continue;
    }

    /*
     * If we encounter another top-level YAML section after the
     * technical database, stop applying technical normalization.
     */
    if(
      currentRecord &&
      trimmed.endsWith(":") &&
      !isRecordKey(original) &&
      original.search(/\S/) === 0
    ){

      /*
       * Usually this means a new root-level section.
       */
      if(
        trimmed !== "models:" &&
        trimmed !== "systems:" &&
        trimmed !== "symptoms:"
      ){
        currentRecord = false;
        insideTechnicalData = false;

        output.push(original);
        continue;
      }
    }

    /* ============================================================
       NORMALIZE RECORD KEYS
       ============================================================ */

    const key = getKey(trimmed);

    if(key && recordKeys.has(key)){

      /*
       * All direct record keys are exactly 4 spaces.
       */
      const indent = 4;

      output.push(
        " ".repeat(indent) + trimmed
      );

      /*
       * Remove hierarchy deeper than record level.
       */
      while(
        stack.length &&
        stack[stack.length - 1].indent >= indent
      ){
        stack.pop();
      }

      stack.push({
        key,
        indent
      });

      continue;
    }

    /* ============================================================
       LIST ITEMS
       ============================================================ */

    if(isListItem(original)){

      /*
       * Determine parent from stack.
       */
      const parent =
        stack.length
          ? stack[stack.length - 1]
          : null;

      let indent = 6;

      if(parent){

        /*
         * Array values must be one level deeper than their key.
         */
        indent = parent.indent + 2;
      }

      /*
       * If the previous meaningful line is a key such as models:
       * force the list under it.
       */
      const prev = previousMeaningful(i);

      if(prev){

        const prevKey = getKey(prev.text.trim());

        if(prevKey && arrayKeys.has(prevKey)){

          const prevIndent =
            prev.text.search(/\S/);

          indent = prevIndent + 2;

          /*
           * If the parent key itself was repaired to 4 spaces,
           * list must therefore be 6.
           */
          if(prevIndent < 4){
            indent = 6;
          }
        }
      }

      /*
       * Never allow technical list items to become root-level.
       */
      if(indent < 6){
        indent = 6;
      }

      output.push(
        " ".repeat(indent) + trimmed
      );

      continue;
    }

    /* ============================================================
       NESTED KEYS
       ============================================================ */

    if(key){

      /*
       * Find parent context.
       */
      const parent =
        stack.length
          ? stack[stack.length - 1]
          : null;

      let indent = 6;

      if(parent){

        /*
         * Nested keys are always two spaces deeper.
         */
        indent = parent.indent + 2;

        /*
         * But never let a nested key escape the record.
         */
        if(indent > 12){
          indent = 8;
        }
      }

      /*
       * Special handling for title translations:
       *
       * title:
       *   en:
       *   ro:
       *   ...
       */
      if(parent && parent.key === "title"){
        indent = 6;
      }

      /*
       * Special handling for vehicle:
       *
       * vehicle:
       *   manufacturer:
       *   model:
       *   year:
       */
      if(parent && parent.key === "vehicle"){
        indent = 6;
      }

      output.push(
        " ".repeat(indent) + trimmed
      );

      cleanStack(indent);

      stack.push({
        key,
        indent
      });

      continue;
    }

    /* ============================================================
       SCALAR / MULTILINE CONTENT
       ============================================================ */

    /*
     * Preserve multiline scalar lines but ensure they remain
     * inside the current record.
     */
    let indent = 6;

    if(stack.length){
      indent =
        Math.min(
          stack[stack.length - 1].indent + 2,
          10
        );
    }

    output.push(
      " ".repeat(indent) + trimmed
    );
  }

  return output.join("\n");
}
    /*
     * ============================================================
     * EXTRACT TECHNICAL DATABASE
     * ============================================================
     */

    technicalDatabase =
      Array.isArray(d?.technical_data)
        ? d.technical_data
        : Array.isArray(d)
          ? d
          : [];

    if (!Array.isArray(technicalDatabase)) {
      technicalDatabase = [];
    }

    if (!technicalDatabase.length) {
      throw new Error(
        "Invalid technical database structure: 'technical_data' is missing or empty."
      );
    }

    console.log(
      "[AutoDecode] Loaded technical records:",
      technicalDatabase.length
    );

    console.log(
      "[AutoDecode] Technical database root keys:",
      d &&
      typeof d === "object" &&
      !Array.isArray(d)
        ? Object.keys(d)
        : "array"
    );

    setStatus(
      t("technical_ready"),
      "success"
    );

    return true;

  } catch (e) {

    console.error(
      "[AutoDecode] Technical database load failed:",
      e
    );

    technicalDatabase = [];

    const detail =
      String(e?.message || e);

    setStatus(
      `${t("technical_error")} ${detail}`,
      "error"
    );

    return false;
  }
}

/* ============================================================
   VEHICLE MATCH
============================================================ */

function valueMatches(values,target){

if(values==null)return true;

const arr=
Array.isArray(values)
?values
:[values];

if(!arr.length)return true;

const nt=
normalizeText(target);

return arr.some(v=>{

if(v==null)return false;

if(typeof v==="object"){

return valueMatches(
v.id||v.name,
target
)

}

const x=
normalizeText(v);

return(
x==="all"||
x==="*"||
x===nt||
nt===x
)

})

}

function calculateVehicleMatch(item,v){

const iv=
item.vehicle||item;

const score=100;

if(
iv.manufacturer&&
!valueMatches(
iv.manufacturer,
v.manufacturer
)&&
!valueMatches(
iv.manufacturer_id,
v.manufacturer
)
)return 0;

if(
iv.make&&
!valueMatches(
iv.make,
v.manufacturer
)
)return 0;

if(
iv.models&&
!valueMatches(
iv.models,
v.model
)&&
!valueMatches(
iv.model,
v.model
)
)return 0;

if(
iv.model&&
!valueMatches(
iv.model,
v.model
)
)return 0;

if(
iv.generations&&
!valueMatches(
iv.generations,
v.generation
)
)return 0;

if(
iv.generation&&
!valueMatches(
iv.generation,
v.generation
)
)return 0;

if(
iv.engines&&
!valueMatches(
iv.engines,
v.engine
)&&
!valueMatches(
iv.engines,
v.engineCodes
)
)return 0;

if(
iv.engine&&
!valueMatches(
iv.engine,
v.engine
)
)return 0;

return score

}

function calculateYearMatch(item,year){

const p=
item.vehicle?.production||
item.production;

if(!p)return 100;

const from=
Number(p.from||0);

const to=
Number(p.to||9999);

return year>=from&&year<=to
?100
:0

}

/* ============================================================
   DTC
============================================================ */

function extractDTCs(problem){

return[
...new Set(
String(problem||"")
.toUpperCase()
.match(/\b[PCBU]\d{4}\b/g)||[]
)
]

}

function calculateDTCMatch(item,dtcs){

if(!dtcs.length)return 0;

const related=
Array.isArray(item.related_dtcs)
?item.related_dtcs
:[];

const keywords=
Array.isArray(item.keywords)
?item.keywords
:[];

let matches=0;

for(const d of dtcs){

if(
related.some(
v=>
String(v)
.toUpperCase()
.trim()===d
)
){

matches++

}

if(
keywords.some(
v=>
String(v)
.toUpperCase()
.trim()===d
)
){

matches++

}

}

return matches
?Math.min(
100,
75+matches*15
)
:0

}

for(

return false

function getMergedRelationships(){

const merged=[
...relationships
];

for(
const rel of semanticRelationships
){

if(
!Array.isArray(rel.required)||
rel.required.length<2
)continue;

const exists=
merged.some(
existing=>
existing.required.length===
rel.required.length&&
existing.required.every(
x=>rel.required.includes(x)
)
);

if(!exists){
merged.push(rel)
}

}

return merged

}

/* ============================================================
   EXACT SEMANTIC EVIDENCE
============================================================ */

function calculateExactConceptEvidence(
item,
problem,
userSymptoms,
itemSymptoms
){

const text=
normalizeText(problem);

let exact=0;
let component=0;

const evidence=[];

for(const concept of userSymptoms){

const aliases=
symptomAliases[concept]||[];

let bestAliasLength=0;
let matched=false;

for(const alias of aliases){

if(isGenericAlias(alias))
continue;

if(
phraseMatches(
text,
alias
)
){

matched=true;

bestAliasLength=
Math.max(
bestAliasLength,
normalizeText(alias).length
)

}

}

if(!matched)
continue;

if(itemSymptoms.includes(concept)){

exact+=
100+
Math.min(
40,
bestAliasLength
);

evidence.push({
concept,
type:"exact"
})

}

}

/*
   Component-level evidence:
   If a specific user concept and item concept belong
   to the same technical domain, give a smaller bonus.
*/

const userDomains=
getSemanticDomains(
userSymptoms
);

const itemDomains=
getSemanticDomains(
itemSymptoms
);

for(const domain of userDomains){

if(itemDomains.includes(domain)){

component+=25

}

}

return{
exact,
component,
evidence
}

}

/* ============================================================
   CALCULATE SEMANTIC SCORE
============================================================ */

function calculateSemanticSymptomScore(
item,
problem,
userSymptoms,
itemSymptoms
){

itemSymptoms=
itemSymptoms||
getItemSymptoms(
item,
getRelevantConcepts(userSymptoms)
);

let score=0;

const exactEvidence=
calculateExactConceptEvidence(
item,
problem,
userSymptoms,
itemSymptoms
);

/*
   EXACT concept match is deliberately dominant.
*/

score+=
Math.min(
180,
exactEvidence.exact
);

/*
   Standard concept scoring.
*/

for(const s of userSymptoms){

if(
itemSymptoms.includes(s)
){

score+=
symptomWeights[s]||
semanticPriority[s]||
symptomWeights.default

}

}

/*
   Relationship bonuses.
*/

for(
const rel of getMergedRelationships()
){

if(
rel.required.every(
s=>userSymptoms.includes(s)
)&&
rel.required.every(
s=>itemSymptoms.includes(s)
)
){

score+=
rel.bonus

}

}

/*
   Keyword evidence.

   Only exact/strong phrase matches are counted.
*/

const keywords=
Array.isArray(item.keywords)
?item.keywords
:[];

const problemText=
normalizeText(problem);

let km=0;

for(const k of keywords){

const nk=
normalizeText(k);

if(
nk.length>=4&&
!isGenericAlias(nk)&&
matchesAlias(
problemText,
nk
)
){

km++

}

}

score+=
Math.min(
18,
km*5
);

/*
   External semantic priority.
*/

for(const concept of userSymptoms){

if(
itemSymptoms.includes(concept)&&
semanticPriority[concept]
){

score+=
Math.min(
20,
semanticPriority[concept]
)

}

}

return Math.min(
180,
score
)

}

/* ============================================================
   SYMPTOM COVERAGE
============================================================ */

function calculateSymptomCoverage(
item,
userSymptoms,
itemSymptoms
){

if(!userSymptoms.length)
return 0;

const is=
itemSymptoms||
getItemSymptoms(
item,
getRelevantConcepts(userSymptoms)
);

let m=0;

for(const s of userSymptoms){

if(is.includes(s))
m++

}

return Math.round(
m/userSymptoms.length*100
)

}

/* ============================================================
   TEXT FALLBACK
============================================================ */

function calculateTextFallback(
item,
problem
){

const text=
normalizeText(problem);

const it=
normalizeText(
getItemText(item)
);

if(!text||!it)
return 0;

const tokens=[
...tokenize(text)
].filter(
x=>
x.length>=4&&
!/^(this|that|with|from|does|have|very|mais|plus|avec|para|pero|della|delle|naar|de|het|der|die|das|si|nu|mai|este|un|une|the|and|not|are|was|wir|ist|nicht|pas|les|des|une)$/.test(x)
);

let hits=0;

for(const w of tokens){

if(
(` ${it} `).includes(
` ${w} `
)
){

hits++

}

}

return tokens.length
?Math.min(
25,
Math.round(
hits/tokens.length*25
)
)
:0

}

/* ============================================================
   SEMANTIC CONFLICT PENALTY
============================================================ */

/*
   This is the critical fix for:

   "mânerul ușii nu funcționează"
                    ↓
   USB media connection

   A specific body/door concept must not be outranked
   by a generic infotainment record.
*/

function calculateSemanticConflict(
item,
userSymptoms,
itemSymptoms,
exactEvidence
){

if(!userSymptoms.length)
return 0;

const primary=
getPrimaryUserConcepts(
userSymptoms
);

if(!primary.length)
return 0;

const primaryDomains=
getSemanticDomains(
primary
);

const itemDomains=
getSemanticDomains(
itemSymptoms
);

let penalty=0;

/*
   If an exact primary concept exists in the item,
   there is no conflict.
*/

const exactPrimary=
primary.some(
c=>itemSymptoms.includes(c)
);

if(exactPrimary)
return 0;

/*
   If the item has a different strong technical domain,
   apply a large penalty.
*/

if(
primaryDomains.length&&
itemDomains.length
){

const sameDomain=
primaryDomains.some(
d=>itemDomains.includes(d)
);

if(!sameDomain){

penalty-=110

}

}

/*
   Even without explicit domain metadata, a known
   component concept that conflicts with the user query
   gets penalized.
*/

const unrelatedSpecific=
itemSymptoms.some(
c=>
!primary.includes(c)&&
symptomWeights[c]&&
symptomWeights[c]>=18&&
!conceptsShareDomain(
c,
primary[0]
)
);

if(unrelatedSpecific){

penalty-=45

}

/*
   If the user query contains a highly specific component
   and the result has no matching concept at all,
   make the result effectively noncompetitive.
*/

if(
exactEvidence?.exact===0&&
primary.some(
c=>
[
"door_handle_not_working",
"door_handle_hard_to_open",
"door_handle_loose",
"door_handle_broken",
"door_wont_open_inside",
"door_wont_open_outside",
"door_lock_not_working",
"door_lock_actuator_fault",
"door_latch_fault",
"door_cable_broken",
"usb",
"bluetooth",
"carplay",
"android_auto",
"navigation",
"gps",
"camera",
"radar",
"parking_sensor"
].includes(c)
)
){

penalty-=60

}

return penalty

}

/* ============================================================
   FINAL SCORE
============================================================ */

function calculateFinalScore({

vehicleMatch,
yearMatch,
semanticScore,
coverage,
dtcMatch,
systemMatch,
userSymptoms,
item,
itemSymptoms,
exactEvidence

}){

if(dtcMatch>0){

return Math.max(
0,
Math.min(
100,
Math.round(
vehicleMatch*.15+
yearMatch*.05+
semanticScore*.45+
coverage*.1+
dtcMatch*.2+
systemMatch*.05+
calculateSemanticConflict(
item,
userSymptoms,
itemSymptoms,
exactEvidence
)
)
)
)

}

let score=
vehicleMatch*.15+
yearMatch*.05+
semanticScore*.55+
coverage*.15+
systemMatch*.15;

score+=
calculateSemanticConflict(
item,
userSymptoms,
itemSymptoms,
exactEvidence
);

/*
   Exact concept matches get a final independent boost.
*/

if(
exactEvidence?.exact>0
){

score+=
Math.min(
25,
exactEvidence.exact*.12
)

}

/*
   Multi-symptom engine-start context remains strong.
*/

const is=
itemSymptoms||
getItemSymptoms(
item,
getRelevantConcepts(userSymptoms)
);

if(
userSymptoms.includes("engine_stall")&&
userSymptoms.includes("crank_no_start")&&
is.includes("engine_stall")&&
is.includes("crank_no_start")
){

score+=20

}

const noStart=
userSymptoms.includes("no_start")||
userSymptoms.includes("crank_no_start")||
userSymptoms.includes("engine_stall");

if(
noStart&&
!is.includes("no_start")&&
!is.includes("crank_no_start")&&
!is.includes("engine_stall")
){

const sys=
getSystemGroups(item);

if(
!sys.some(
s=>
[
"no_start",
"crank_no_start",
"engine_stall",
"starter",
"fuel_pressure",
"crankshaft",
"camshaft",
"immobilizer",
"pats"
].includes(s)
)
){

score-=35

}

}

/*
   A result with no system relevance should not receive
   artificial points simply because it contains generic
   words.
*/

if(
systemMatch===0&&
item.system
){

score-=5

}

return Math.max(
0,
Math.min(
100,
Math.round(score)
)
)

}

async function performSearch(){

resultsElement.hidden=false;

if(!vehicleIsReady()){

setStatus(
t("complete_vehicle"),
"error"
);

return

}

const problem=
problemInput.value.trim();

if(!problem){

setStatus(
t("describe_problem"),
"error"
);

return

}

if(!technicalDatabase.length){

setStatus(
t("technical_error"),
"error"
);

renderResults([]);

return

}

setStatus(
t("searching")
);

/*
   Ensure dictionary is available.
   Built-in aliases remain functional if it fails.
*/

await loadSemanticDictionary();

const vehicle=
getSelectedVehicle();

const userSymptoms=
detectUserSymptoms(problem);

const dtcs=
extractDTCs(problem);

const relevantConcepts=
getRelevantConcepts(
userSymptoms
);

console.log(
"Detected semantic concepts:",
userSymptoms
);

console.log(
"Relevant semantic concepts:",
relevantConcepts
);

console.log(
"Detected DTCs:",
dtcs
);

console.log(
"External semantic dictionary:",
semanticDictionaryReady
);

const results=[];

for(
const item of technicalDatabase
){

const vehicleMatch=
calculateVehicleMatch(
item,
vehicle
);

if(!vehicleMatch)
continue;

const yearMatch=
calculateYearMatch(
item,
vehicle.year
);

if(!yearMatch)
continue;

const itemSymptoms=
getItemSymptoms(
item,
relevantConcepts
);

const exactEvidence=
calculateExactConceptEvidence(
item,
problem,
userSymptoms,
itemSymptoms
);

let semanticScore=
calculateSemanticSymptomScore(
item,
problem,
userSymptoms,
itemSymptoms
);

const coverage=
calculateSymptomCoverage(
item,
userSymptoms,
itemSymptoms
);

const dtcMatch=
calculateDTCMatch(
item,
dtcs
);

const systemMatch=
calculateSystemRelevance(
item,
userSymptoms
);

/*
   If no semantic concepts were detected, use original
   text search as fallback.
*/

if(!userSymptoms.length){

semanticScore=
Math.max(
semanticScore,
calculateTextFallback(
item,
problem
)
);

}else if(
semanticScore===0&&
coverage===0&&
dtcMatch===0
){

semanticScore=
calculateTextFallback(
item,
problem
)*.6

}

/*
   Calculate conflict before final ranking.
*/

const conflict=
calculateSemanticConflict(
item,
userSymptoms,
itemSymptoms,
exactEvidence
);

const score=
calculateFinalScore({
vehicleMatch,
yearMatch,
semanticScore,
coverage,
dtcMatch,
systemMatch,
userSymptoms,
item,
itemSymptoms,
exactEvidence
});

/*
   Evidence must be real.

   A result from an unrelated system with only a generic
   text similarity must not survive.
*/

const hasExactConcept=
exactEvidence.exact>0;

const hasSemanticMatch=
semanticScore>0;

const hasCoverage=
coverage>0;

const hasDTC=
dtcMatch>0;

const hasSystemMatch=
systemMatch>0;

const hasStrongNegativeConflict=
conflict<=-80;

if(
hasStrongNegativeConflict&&
!hasExactConcept&&
!hasDTC
){

continue

}

const evidence=
hasSemanticMatch||
hasCoverage||
hasDTC||
hasSystemMatch||
hasExactConcept;

if(!evidence)
continue;

/*
   Minimum relevance threshold.
*/

if(score<10)
continue;

results.push({

item,
score,
vehicleMatch,
yearMatch,
semanticScore,
coverage,
dtcMatch,
systemMatch,
exactEvidence,
conflict

})

}

/* ============================================================
   RANKING
============================================================ */

results.sort(
(a,b)=>{

/*
   1. Exact DTC
*/

if(
a.dtcMatch>0&&
b.dtcMatch===0
)return-1;

if(
a.dtcMatch===0&&
b.dtcMatch>0
)return 1;

/*
   2. Exact semantic concept evidence
*/

if(
a.exactEvidence.exact!==
b.exactEvidence.exact
){

return(
b.exactEvidence.exact-
a.exactEvidence.exact
)

}

/*
   3. Symptom coverage
*/

if(
b.coverage!==a.coverage
){

return(
b.coverage-
a.coverage
)

}

/*
   4. Semantic score
*/

if(
b.semanticScore!==
a.semanticScore
){

return(
b.semanticScore-
a.semanticScore
)

}

/*
   5. System relevance
*/

if(
b.systemMatch!==
a.systemMatch
){

return(
b.systemMatch-
a.systemMatch
)

}

/*
   6. Final score
*/

return(
b.score-
a.score
)

}
);

console.log(
"Final ranked results:",
results.slice(0,10).map(r=>({
title:getLocalizedValue(r.item.title),
score:r.score,
semantic:r.semanticScore,
coverage:r.coverage,
exact:r.exactEvidence.exact,
system:r.systemMatch,
conflict:r.conflict
}))
);

renderResults(
results.slice(0,10)
);

setStatus(
results.length
?""
:"",
results.length
?"success"
:""
)

}

findButton.addEventListener(

performSearch
);

problemInput.addEventListener(
"keydown",
e=>{

if(
(e.ctrlKey||e.metaKey)&&
e.key==="Enter"

performSearch()

}

}
);

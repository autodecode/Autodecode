  # ============================================================
  # ENGINE / POWER / AIR INTAKE
  # ============================================================

  - id: audi_engine_p0299_underboost
    vehicle:
      manufacturer: audi
      models:
        - a1
        - a3
        - a4
        - a5
        - a6
        - a7
        - q3
        - q5
        - q7
      generations: all
      engines: all

    category: diagnostics
    system: turbocharger

    title:
      en: Turbocharger Underboost Diagnosis
      ro: Diagnosticare presiune turbo insuficientă
      de: Diagnose von zu niedrigem Ladedruck

    symptoms:
      - poor_power
      - low_rpm_power_loss
      - limp_mode
      - slow_acceleration
      - intermittent_power_loss

    keywords:
      - p0299
      - underboost
      - low boost
      - turbo
      - boost pressure
      - limp mode
      - no power
      - low power
      - pierde putere
      - turbo presiune

    possible_causes:
      - charge_air_leak
      - boost_control_fault
      - vacuum_leak
      - turbocharger_fault
      - actuator_fault
      - wastegate_fault
      - variable_vane_sticking
      - diverter_valve_fault

    diagnostic_steps:
      - Read all stored, pending and intermittent DTCs.
      - Save freeze-frame information before clearing faults.
      - Compare requested and actual boost pressure under load.
      - Inspect charge-air hoses, intercooler and connections.
      - Check boost-control actuator operation.
      - Check vacuum supply where applicable.
      - Inspect turbocharger mechanical operation.
      - Verify the repair with a controlled road test.

    related_dtcs:
      - P0299

    difficulty: medium


  - id: audi_engine_p0234_overboost
    vehicle:
      manufacturer: audi
      models: all
      generations: all
      engines: all

    category: diagnostics
    system: turbocharger

    title:
      en: Turbocharger Overboost Diagnosis
      ro: Diagnosticare suprapresiune turbo
      de: Diagnose von Ladedrucküberschreitung

    symptoms:
      - limp_mode
      - power_loss
      - intermittent_power_loss
      - engine_warning

    keywords:
      - p0234
      - overboost
      - turbo pressure too high
      - limp mode
      - turbo stuck

    possible_causes:
      - variable_vane_sticking
      - wastegate_control_fault
      - boost_control_solenoid_fault
      - actuator_fault
      - boost_sensor_error
      - control_hose_fault

    diagnostic_steps:
      - Record requested and actual boost pressure.
      - Check the boost pressure sensor plausibility.
      - Inspect the actuator and its movement.
      - Check control hoses and solenoid operation.
      - Inspect variable geometry or wastegate mechanism.
      - Perform a controlled loaded test.

    related_dtcs:
      - P0234

    difficulty: medium


  - id: audi_engine_boost_leak
    vehicle:
      manufacturer: audi
      models: all
      generations: all
      engines: all

    category: diagnostics
    system: charge_air

    title:
      en: Charge-Air System Leak Diagnosis
      ro: Diagnosticarea pierderilor pe circuitul de supraalimentare
      de: Diagnose von Ladeluftsystem-Leckagen

    symptoms:
      - poor_power
      - hissing_noise
      - black_smoke
      - underboost
      - slow_acceleration

    keywords:
      - boost leak
      - charge air leak
      - intercooler leak
      - hose leak
      - p0299
      - hiss
      - whistle

    possible_causes:
      - split_charge_air_hose
      - loose_clamp
      - intercooler_leak
      - damaged_seal
      - cracked_charge_pipe

    diagnostic_steps:
      - Inspect all charge-air pipes visually.
      - Look for oil residue around joints.
      - Inspect clamps and locking connectors.
      - Perform a suitable leak or pressure test.
      - Repair the leak and repeat the boost test.

    related_dtcs:
      - P0299

    difficulty: medium


  - id: audi_engine_maf_low_airflow
    vehicle:
      manufacturer: audi
      models: all
      generations: all
      engines: all

    category: diagnostics
    system: air_metering

    title:
      en: Mass Air Flow Sensor Diagnosis
      ro: Diagnosticare senzor debitmetru MAF
      de: Diagnose des Luftmassenmessers

    symptoms:
      - poor_power
      - hesitation
      - rough_running
      - increased_fuel_consumption
      - limp_mode

    keywords:
      - maf
      - mass air flow
      - airflow sensor
      - low airflow
      - high airflow
      - p0101
      - p0102
      - p0103

    possible_causes:
      - contaminated_maf
      - faulty_maf
      - intake_leak
      - wiring_fault
      - connector_fault
      - air_filter_restriction
      - egr_flow_issue
      - turbocharger_issue

    diagnostic_steps:
      - Check MAF-related DTCs.
      - Inspect the intake system for leaks.
      - Inspect the MAF connector and wiring.
      - Compare measured airflow with the appropriate expected value.
      - Compare MAF behavior with EGR operation where applicable.
      - Do not replace the MAF solely because a power-loss symptom exists.

    related_dtcs:
      - P0101
      - P0102
      - P0103

    difficulty: medium


  - id: audi_engine_map_sensor
    vehicle:

      engines: all

    category: diagnostics
    system: boost_pressure

    title:
      en: MAP / Boost Pressure Sensor Diagnosis
      ro: Diagnosticare senzor MAP / presiune turbo
      de: Diagnose des Ladedrucksensors

    symptoms:
      - poor_power
      - limp_mode
      - boost_deviation
      - intermittent_power_loss

    keywords:
      - map sensor
      - boost sensor
      - manifold pressure
      - p0236
      - p0237
      - p0238

    possible_causes:
      - faulty_sensor
      - wiring_fault
      - connector_fault
      - pressure_port_blockage
      - boost_system_fault

    diagnostic_steps:
      - Read the related DTCs.
      - Check sensor plausibility with ignition on.
      - Inspect connector and wiring.
      - Inspect the sensor port for contamination.
      - Compare pressure readings against another reliable pressure reference.
      - Check the boost system before condemning the sensor.

    related_dtcs:
      - P0236
      - P0237
      - P0238

    difficulty: medium



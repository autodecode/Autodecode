    ro: Ambreiaj care patinează
    de: Kupplung rutscht
    fr: Embrayage qui patine
    es: Embrague que patina
    it: Frizione che slitta
    nl: Slippende koppeling
  symptoms:
    - en: Engine speed rises without a matching increase in vehicle speed.
      ro: Turația motorului crește fără o creștere corespunzătoare a vitezei.
      de: Motordrehzahl steigt ohne entsprechende Fahrzeugbeschleunigung.
      fr: Le régime moteur augmente sans accélération correspondante.
      es: El régimen aumenta sin una aceleración equivalente.
      it: Il regime aumenta senza un'accelerazione equivalente.
      nl: Het motortoerental stijgt zonder overeenkomstige acceleratie.
    - en: Burning clutch smell may occur after heavy load.
      ro: Poate apărea miros de ambreiaj încins după sarcină mare.
      de: Nach hoher Belastung kann Kupplungsgeruch auftreten.
      fr: Une odeur de garniture brûlée peut apparaître après forte charge.
      es: Puede aparecer olor a embrague quemado tras una carga elevada.
      it: Può comparire odore di frizione bruciata dopo un carico elevato.
      nl: Na zware belasting kan een verbrande koppelingsgeur optreden.
  possible_causes:
    - en: Worn clutch friction disc.
      ro: Disc de ambreiaj uzat.
      de: Verschlissene Kupplungsscheibe.
      fr: Disque d'embrayage usé.
      es: Disco de embrague desgastado.
      it: Disco frizione usurato.
      nl: Versleten koppelingsplaat.
    - en: Weak pressure plate or incorrect clutch adjustment.
      ro: Placă de presiune slăbită sau reglaj incorect.
      de: Schwache Druckplatte oder falsche Kupplungseinstellung.
      fr: Mécanisme de pression usé ou mauvais réglage.
      es: Plato de presión débil o ajuste incorrecto.
      it: Spingidisco usurato o regolazione errata.
      nl: Zwakke drukgroep of verkeerde afstelling.
  diagnostic_steps:
    - en: Check clutch free play and operating mechanism.
      ro: Verifică jocul liber și mecanismul de acționare.
      de: Kupplungsspiel und Betätigungsmechanismus prüfen.
      fr: Contrôler la garde et le mécanisme de commande.
      es: Comprobar el juego libre y el mecanismo de accionamiento.
      it: Controllare il gioco e il meccanismo di comando.
      nl: Controleer de vrije slag en het bedieningsmechanisme.
    - en: Perform a controlled load test and inspect the clutch if slipping is confirmed.
      ro: Efectuează un test controlat sub sarcină și inspectează ambreiajul dacă patinarea este confirmată.
      de: Kontrollierten Lasttest durchführen und Kupplung bei bestätigtem Rutschen prüfen.
      fr: Effectuer un essai sous charge et contrôler l'embrayage si le patinage est confirmé.
      es: Realizar una prueba bajo carga e inspeccionar el embrague si se confirma el deslizamiento.
      it: Eseguire una prova sotto carico e controllare la frizione se lo slittamento è confermato.
      nl: Voer een gecontroleerde belastingstest uit en inspecteer de koppeling bij bevestigde slip.

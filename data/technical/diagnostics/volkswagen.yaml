    en: Loose Flywheel
    ro: Volant motor slăbit
    de: Lockeres Schwungrad
    fr: Volant moteur desserré
    es: Volante motor flojo
    it: Volano motore allentato
    nl: Los vliegwiel
  symptoms:
    - en: Knocking or metallic noise from the rear of the engine.
      ro: Zgomot de lovire sau metalic din partea din spate a motorului.
      de: Klopfende oder metallische Geräusche vom hinteren Motorbereich.
      fr: Bruit de cognement ou métallique provenant de l'arrière du moteur.
      es: Golpeteo o ruido metálico desde la parte trasera del motor.
      it: Rumore di battito o metallico dalla parte posteriore del motore.
      nl: Kloppend of metaalachtig geluid aan de achterzijde van de motor.
    - en: Engine vibration may increase with engine speed.
      ro: Vibrațiile motorului pot crește odată cu turația.
      de: Motorvibrationen können mit steigender Drehzahl zunehmen.
      fr: Les vibrations moteur peuvent augmenter avec le régime.
      es: Las vibraciones del motor pueden aumentar con las revoluciones.
      it: Le vibrazioni del motore possono aumentare con il regime.
      nl: Motortrillingen kunnen toenemen met het toerental.
  possible_causes:
    - en: Flywheel retaining hardware has loosened.
      ro: Elementele de fixare ale volantului s-au slăbit.
      de: Die Befestigung des Schwungrads hat sich gelöst.
      fr: La fixation du volant moteur s'est desserrée.
      es: La fijación del volante se ha aflojado.
      it: Il fissaggio del volano si è allentato.
      nl: De bevestiging van het vliegwiel is losgeraakt.
    - en: Incorrect tightening procedure or damaged mating surfaces.
      ro: Procedură de strângere incorectă sau suprafețe de contact deteriorate.
      de: Falsches Anzugsverfahren oder beschädigte Kontaktflächen.
      fr: Procédure de serrage incorrecte ou surfaces de contact endommagées.
      es: Procedimiento de apriete incorrecto o superficies de contacto dañadas.
      it: Procedura di serraggio errata o superfici di contatto danneggiate.
      nl: Verkeerde aanhaalprocedure of beschadigde contactvlakken.
  diagnostic_steps:
    - en: Inspect flywheel retaining hardware and check for abnormal movement.
      ro: Inspectează elementele de fixare și verifică existența unei mișcări anormale.
      de: Befestigung prüfen und auf ungewöhnliche Bewegung achten.
      fr: Inspecter la fixation et rechercher un mouvement anormal.
      es: Inspeccionar la fijación y comprobar si existe movimiento anormal.
      it: Controllare il fissaggio e verificare eventuali movimenti anomali.
      nl: Controleer de bevestiging en controleer op abnormale beweging.
    - en: Inspect the crankshaft and flywheel mating surfaces if movement is found.
      ro: Dacă există joc, inspectează suprafețele de contact ale arborelui cotit și volantului.
      de: Bei festgestelltem Spiel Kontaktflächen von Kurbelwelle und Schwungrad prüfen.
      fr: En cas de jeu, contrôler les surfaces de contact du vilebrequin et du volant.
      es: Si existe juego, inspeccionar las superficies de contacto del cigüeñal y volante.
      it: In presenza di gioco, controllare le superfici di contatto dell'albero e del volano.
      nl: Controleer bij speling de contactvlakken van krukas en vliegwiel.

      ro: Mașina nu rulează liber după frânare.
      de: Das Fahrzeug rollt nach dem Bremsen nicht frei.
      fr: Le véhicule ne roule pas librement après un freinage.
      es: El vehículo no rueda libremente después de frenar.
      it: Il veicolo non scorre liberamente dopo la frenata.
      nl: Het voertuig rolt na het remmen niet vrij.
    - en: Wheel or brake component becomes excessively hot.
      ro: Roata sau componenta de frână se încălzește excesiv.
      de: Rad oder Bremskomponente wird übermäßig heiß.
      fr: La roue ou le frein chauffe excessivement.
      es: La rueda o el freno se calienta excesivamente.
      it: La ruota o il freno si surriscalda.
      nl: Het wiel of de rem wordt extreem heet.

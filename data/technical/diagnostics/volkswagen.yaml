schema_version: 1

manufacturer:
  id: volkswagen
  name: Volkswagen

technical_data:

  # ============================================================
  # 1. OLD CARBURETED PETROL ENGINE - NO ECU ASSUMPTION
  # ============================================================

  - id: vw_carbureted_petrol_engine_hard_start
    vehicle:
      manufacturer: volkswagen
      models:
        - volkswagen_beetle
        - volkswagen_golf
        - volkswagen_passat
      generations:
        - volkswagen_beetle_classic
        - volkswagen_golf_i
        - volkswagen_golf_ii
        - volkswagen_passat_b1
        - volkswagen_passat_b2
      engines: all
    category: diagnostics
    system: engine
    title:
      en: Carbureted Petrol Engine Hard Starting
      ro: Pornire grea la motorul pe benzină cu carburator
      de: Schlechter Kalt- oder Warmstart bei Vergasermotor
      fr: Démarrage difficile sur moteur essence à carburateur
      es: Arranque difícil en motor de gasolina con carburador
      it: Avviamento difficoltoso su motore a benzina con carburatore
      nl: Moeilijk starten van een benzinemotor met carburateur

    symptoms:
      - en: Engine requires repeated cranking before starting
        ro: Motorul necesită acționări repetate ale demarorului înainte de pornire
        de: Der Motor benötigt mehrere Startversuche
        fr: Le moteur nécessite plusieurs tentatives de démarrage
        es: El motor necesita varios intentos para arrancar
        it: Il motore richiede diversi tentativi di avviamento
        nl: De motor heeft meerdere startpogingen nodig

      - en: Engine starts and stalls shortly afterward
        ro: Motorul pornește și se oprește imediat sau după scurt timp
        de: Der Motor startet und geht kurz danach aus
        fr: Le moteur démarre puis cale peu après
        es: El motor arranca y se cala poco después
        it: Il motore si avvia e si spegne poco dopo
        nl: De motor start en valt kort daarna uit

      - en: Difficult cold starting
        ro: Pornire dificilă la rece
        de: Schwieriger Kaltstart
        fr: Démarrage difficile à froid
        es: Arranque difícil en frío
        it: Avviamento difficoltoso a freddo
        nl: Moeilijk starten bij koude motor

      - en: Difficult hot starting
        ro: Pornire dificilă la cald
        de: Schwieriger Warmstart
        fr: Démarrage difficile à chaud
        es: Arranque difícil en caliente
        it: Avviamento difficoltoso a caldo
        nl: Moeilijk starten bij warme motor

    possible_causes:
      - en: Incorrect choke operation
        ro: Funcționare incorectă a șocului
        de: Fehlerhafte Funktion der Kaltstarteinrichtung
        fr: Fonctionnement incorrect du starter
        es: Funcionamiento incorrecto del estárter
        it: Funzionamento errato dello starter
        nl: Onjuiste werking van de choke

      - en: Carburetor adjustment out of specification
        ro: Reglaj incorect al carburatorului
        de: Vergasereinstellung außerhalb der Vorgaben
        fr: Réglage du carburateur incorrect
        es: Ajuste incorrecto del carburador
        it: Regolazione errata del carburatore
        nl: Verkeerde afstelling van de carburateur

      - en: Fuel delivery restriction
        ro: Restricție în alimentarea cu combustibil
        de: Einschränkung der Kraftstoffversorgung
        fr: Restriction de l'alimentation en carburant
        es: Restricción del suministro de combustible
        it: Limitazione dell'alimentazione del carburante
        nl: Beperking van de brandstoftoevoer

      - en: Ignition system fault
        ro: Defecțiune a sistemului de aprindere
        de: Fehler im Zündsystem
        fr: Défaut du système d'allumage
        es: Fallo del sistema de encendido
        it: Guasto del sistema di accensione
        nl: Storing in het ontstekingssysteem

      - en: Vacuum leak
        ro: Pierdere de vacuum
        de: Unterdruckleck
        fr: Fuite de dépression
        es: Fuga de vacío
        it: Perdita di depressione
        nl: Vacuümlek

    diagnostic_steps:
      - en: Check fuel supply to the carburetor
        ro: Verifică alimentarea cu combustibil a carburatorului
        de: Kraftstoffversorgung des Vergasers prüfen
        fr: Vérifier l'alimentation en carburant du carburateur
        es: Comprobar el suministro de combustible al carburador
        it: Controllare l'alimentazione del carburatore
        nl: Controleer de brandstoftoevoer naar de carburateur

      - en: Inspect choke operation and adjustment
        ro: Verifică funcționarea și reglajul șocului
        de: Funktion und Einstellung der Kaltstarteinrichtung prüfen
        fr: Vérifier le fonctionnement et le réglage du starter
        es: Comprobar el funcionamiento y ajuste del estárter
        it: Controllare il funzionamento e la regolazione dello starter
        nl: Controleer de werking en afstelling van de choke

      - en: Check ignition spark and ignition timing
        ro: Verifică scânteia și momentul aprinderii
        de: Zündfunken und Zündzeitpunkt prüfen
        fr: Vérifier l'étincelle et le calage de l'allumage
        es: Comprobar la chispa y el avance de encendido
        it: Controllare la scintilla e l'anticipo di accensione
        nl: Controleer de vonk en het ontstekingstijdstip

      - en: Inspect the intake system for vacuum leaks
        ro: Verifică sistemul de admisie pentru pierderi de vacuum
        de: Ansaugsystem auf Unterdrucklecks prüfen
        fr: Vérifier le système d'admission à la recherche de fuites de dépression
        es: Comprobar el sistema de admisión en busca de fugas de vacío
        it: Controllare il sistema di aspirazione per perdite di depressione
        nl: Controleer het inlaatsysteem op vacuümlekken

    keywords:
      - carburetor
      - carburator
      - Vergaser
      - carburateur
      - carburador
      - carburatore
      - carburateur
      - hard starting
      - pornire grea
    related_dtcs: []
    difficulty: basic


  # ============================================================
  # 2. OLD DIESEL - MECHANICAL FUEL SYSTEM
  # ============================================================

  - id: vw_old_diesel_engine_hard_start
    vehicle:
      manufacturer: volkswagen
      models:
        - volkswagen_golf
        - volkswagen_passat
      generations:
        - volkswagen_golf_i
        - volkswagen_golf_ii
        - volkswagen_golf_iii
        - volkswagen_passat_b1
        - volkswagen_passat_b2
      engines:
        - 16d
        - 16td
        - 19d
        - 19td
    category: diagnostics
    system: engine
    title:
      en: Hard Starting on Older Mechanical Diesel Engine
      ro: Pornire grea la motor diesel mecanic mai vechi
      de: Schwieriger Start bei älterem mechanischem Dieselmotor
      fr: Démarrage difficile sur ancien moteur diesel mécanique
      es: Arranque difícil en motor diésel mecánico antiguo
      it: Avviamento difficoltoso su vecchio motore diesel meccanico
      nl: Moeilijk starten van oudere mechanische dieselmotor

    symptoms:
      - en: Extended cranking before the engine starts
        ro: Acționare îndelungată a demarorului înainte de pornire
        de: Langes Betätigen des Anlassers vor dem Start
        fr: Long entraînement du démarreur avant le démarrage
        es: Accionamiento prolongado del motor de arranque
        it: Azionamento prolungato del motorino di avviamento
        nl: Lang starten voordat de motor aanslaat

      - en: Poor cold starting
        ro: Pornire dificilă la rece
        de: Schlechter Kaltstart
        fr: Démarrage difficile à froid
        es: Arranque difícil en frío
        it: Avviamento difficoltoso a freddo
        nl: Moeilijk starten bij koude motor

      - en: White or grey smoke during starting
        ro: Fum alb sau gri în timpul pornirii
        de: Weißer oder grauer Rauch beim Start
        fr: Fumée blanche ou grise au démarrage
        es: Humo blanco o gris durante el arranque
        it: Fumo bianco o grigio durante l'avviamento
        nl: Witte of grijze rook tijdens het starten

    possible_causes:
      - en: Glow plug system fault
        ro: Defecțiune a sistemului de bujii incandescente
        de: Fehler im Glühsystem
        fr: Défaut du système de préchauffage
        es: Fallo del sistema de precalentamiento
        it: Guasto del sistema di preriscaldamento
        nl: Storing in het voorgloeisysteem

      - en: Fuel entering the system slowly after shutdown
        ro: Combustibilul intră lent în sistem după oprirea motorului
        de: Kraftstoffversorgung baut sich nach dem Abstellen langsam ab
        fr: L'alimentation en carburant se rétablit lentement après l'arrêt
        es: La alimentación de combustible se recupera lentamente después de apagar
        it: L'alimentazione del carburante si ripristina lentamente dopo lo spegnimento
        nl: De brandstoftoevoer herstelt langzaam na het uitschakelen

      - en: Air entering the fuel system
        ro: Aer care pătrunde în sistemul de combustibil
        de: Lufteintritt in das Kraftstoffsystem
        fr: Entrée d'air dans le circuit de carburant
        es: Entrada de aire en el sistema de combustible
        it: Ingresso di aria nel circuito del carburante
        nl: Lucht in het brandstofsysteem

      - en: Weak battery or starter speed
        ro: Baterie slabă sau turație insuficientă a demarorului
        de: Schwache Batterie oder zu niedrige Anlasserdrehzahl
        fr: Batterie faible ou vitesse de lancement insuffisante
        es: Batería débil o velocidad de arranque insuficiente
        it: Batteria debole o velocità di avviamento insufficiente
        nl: Zwakke accu of te lage startsnelheid

      - en: Injection timing incorrect
        ro: Moment de injecție incorect
        de: Falscher Einspritzzeitpunkt
        fr: Calage de l'injection incorrect
        es: Reglaje incorrecto del momento de inyección
        it: Fasatura dell'iniezione errata
        nl: Onjuist inspuittijdstip

    diagnostic_steps:
      - en: Check battery voltage and cranking speed
        ro: Verifică tensiunea bateriei și turația în timpul pornirii
        de: Batteriespannung und Anlasserdrehzahl prüfen
        fr: Vérifier la tension de batterie et la vitesse de lancement
        es: Comprobar la tensión de batería y la velocidad de arranque
        it: Controllare la tensione della batteria e la velocità di avviamento
        nl: Controleer accuspanning en startsnelheid

      - en: Test the glow plug system where fitted
        ro: Testează sistemul de preîncălzire acolo unde este prevăzut
        de: Glühsystem prüfen, sofern vorhanden
        fr: Tester le système de préchauffage lorsqu'il est présent
        es: Comprobar el sistema de precalentamiento cuando esté equipado
        it: Testare il sistema di preriscaldamento quando presente
        nl: Controleer het voorgloeisysteem indien aanwezig

      - en: Inspect fuel lines and connections for air ingress
        ro: Verifică conductele și conexiunile de combustibil pentru pătrunderea aerului
        de: Kraftstoffleitungen und Anschlüsse auf Lufteintritt prüfen
        fr: Vérifier les conduites et raccords de carburant pour détecter une entrée d'air
        es: Comprobar las líneas y conexiones de combustible en busca de entrada de aire
        it: Controllare tubazioni e raccordi del carburante per infiltrazioni d'aria
        nl: Controleer brandstofleidingen en aansluitingen op luchtinlaat

      - en: Verify injection timing according to the engine specification
        ro: Verifică momentul injecției conform specificației motorului
        de: Einspritzzeitpunkt gemäß Motorspezifikation prüfen
        fr: Vérifier le calage de l'injection selon les spécifications du moteur
        es: Verificar el momento de inyección según las especificaciones del motor
        it: Verificare la fasatura dell'iniezione secondo le specifiche del motore
        nl: Controleer het inspuittijdstip volgens de motorspecificatie

    keywords:
      - old diesel
      - diesel mecanic
      - mechanical diesel
      - hard start
      - glow plugs
      - bujii incandescente
    related_dtcs: []
    difficulty: intermediate


  # ============================================================
  # 3. GOLF VI 1.2 TSI - COLD START TIMING CHAIN NOISE
  # ============================================================

  - id: vw_golf_vi_12tsi_cold_start_chain_noise
    vehicle:
      manufacturer: volkswagen
      models:
        - volkswagen_golf
      generations:
        - volkswagen_golf_vi
      engines:
        - 12tsi
    category: diagnostics
    system: engine
    title:
      en: 1.2 TSI Cold Start Timing Chain Noise
      ro: Zgomot al lanțului de distribuție la pornirea la rece la 1.2 TSI
      de: Steuerkettengeräusch beim Kaltstart des 1.2 TSI
      fr: Bruit de chaîne de distribution au démarrage à froid du 1.2 TSI
      es: Ruido de cadena de distribución en arranque en frío del 1.2 TSI
      it: Rumore della catena di distribuzione all'avviamento a freddo del 1.2 TSI
      nl: Distributiekettinggeluid bij koude start van de 1.2 TSI

    symptoms:
      - en: Brief rattling noise immediately after cold start
        ro: Zgomot scurt de zdrăngănit imediat după pornirea la rece
        de: Kurzes Rasseln direkt nach dem Kaltstart
        fr: Bref bruit de cliquetis immédiatement après le démarrage à froid
        es: Ruido breve de traqueteo justo después del arranque en frío
        it: Breve rumore di sferragliamento subito dopo l'avviamento a freddo
        nl: Kort ratelend geluid direct na koude start

      - en: Noise is strongest after the vehicle has been parked
        ro: Zgomotul este mai pronunțat după ce mașina a stat parcată
        de: Das Geräusch ist nach längerer Standzeit stärker
        fr: Le bruit est plus important après une longue immobilisation
        es: El ruido es más fuerte después de permanecer estacionado
        it: Il rumore è più forte dopo una lunga sosta
        nl: Het geluid is sterker na langere stilstand

      - en: Engine may run normally after starting
        ro: Motorul poate funcționa normal după pornire
        de: Der Motor kann nach dem Start normal laufen
        fr: Le moteur peut fonctionner normalement après le démarrage
        es: El motor puede funcionar normalmente después del arranque
        it: Il motore può funzionare normalmente dopo l'avviamento
        nl: De motor kan na het starten normaal lopen

    possible_causes:
      - en: Timing chain tensioning problem
        ro: Problemă la tensionarea lanțului de distribuție
        de: Problem mit der Steuerkettenspannung
        fr: Problème de tension de la chaîne de distribution
        es: Problema de tensión de la cadena de distribución
        it: Problema di tensionamento della catena di distribuzione
        nl: Probleem met de spanning van de distributieketting

      - en: Chain or guide wear
        ro: Uzura lanțului sau a ghidajelor
        de: Verschleiß der Kette oder Führungsschienen
        fr: Usure de la chaîne ou des guides
        es: Desgaste de la cadena o de las guías
        it: Usura della catena o delle guide
        nl: Slijtage van ketting of geleiders

      - en: Oil pressure or oil supply problem affecting the tensioner
        ro: Problemă de presiune sau alimentare cu ulei care afectează întinzătorul
        de: Ölversorgungs- oder Öldruckproblem am Kettenspanner
        fr: Problème de pression ou d'alimentation en huile du tendeur
        es: Problema de presión o suministro de aceite al tensor
        it: Problema di pressione o alimentazione dell'olio al tenditore
        nl: Probleem met oliedruk of olietoevoer naar de spanner

    diagnostic_steps:
      - en: Confirm that the noise occurs specifically during cold starting
        ro: Confirmă că zgomotul apare în special la pornirea la rece
        de: Prüfen, ob das Geräusch speziell beim Kaltstart auftritt
        fr: Confirmer que le bruit apparaît spécifiquement au démarrage à froid
        es: Confirmar que el ruido aparece específicamente en el arranque en frío
        it: Verificare che il rumore compaia specificamente a freddo
        nl: Controleer of het geluid specifiek bij koude start optreedt

      - en: Check engine oil level and correct specification
        ro: Verifică nivelul și specificația uleiului de motor
        de: Motorölstand und Ölspezifikation prüfen
        fr: Vérifier le niveau et la spécification de l'huile moteur
        es: Comprobar el nivel y la especificación del aceite
        it: Controllare il livello e la specifica dell'olio motore
        nl: Controleer oliepeil en oliespecificatie

      - en: Inspect the timing drive and tensioning system if noise is confirmed
        ro: Inspectează distribuția și sistemul de tensionare dacă zgomotul este confirmat
        de: Steuertrieb und Spannsystem prüfen, wenn das Geräusch bestätigt wird
        fr: Inspecter la distribution et le système de tension si le bruit est confirmé
        es: Inspeccionar la distribución y el sistema tensor si se confirma el ruido
        it: Ispezionare la distribuzione e il sistema di tensionamento se il rumore è confermato
        nl: Inspecteer de distributie en het spansysteem als het geluid bevestigd is

    keywords:
      - 1.2 TSI
      - timing chain
      - lanț distribuție
      - Steuerkette
      - chaîne de distribution
    related_dtcs: []
    difficulty: advanced


  # ============================================================
  # 4. GOLF VI 1.6 TDI - EGR / AIRFLOW ISSUE
  # ============================================================

  - id: vw_golf_vi_16tdi_rough_idle_egr
    vehicle:
      manufacturer: volkswagen
      models:
        - volkswagen_golf
      generations:
        - volkswagen_golf_vi
      engines:
        - 16tdi
    category: diagnostics
    system: engine
    title:
      en: 1.6 TDI Rough Idle and Unstable Airflow
      ro: Relanti instabil și debit de aer neregulat la 1.6 TDI
      de: Unruhiger Leerlauf und instabiler Luftstrom beim 1.6 TDI
      fr: Ralenti instable et débit d'air irrégulier sur 1.6 TDI
      es: Ralentí inestable y flujo de aire irregular en 1.6 TDI
      it: Minimo irregolare e flusso d'aria instabile sul 1.6 TDI
      nl: Onrustig stationair draaien en onstabiele luchtstroom bij 1.6 TDI

    symptoms:
      - en: Uneven idle
        ro: Relanti neregulat
        de: Unruhiger Leerlauf
        fr: Ralenti irrégulier
        es: Ralentí irregular
        it: Minimo irregolare
        nl: Onrustig stationair toerental

      - en: Hesitation during low-load operation
        ro: Ezitare la sarcină redusă
        de: Ruckeln bei geringer Last
        fr: Hésitation à faible charge
        es: Vacilación con poca carga
        it: Esitazione a basso carico
        nl: Aarzeling bij lage belasting

      - en: Possible increased smoke or exhaust odor
        ro: Posibil fum crescut sau miros accentuat al gazelor
        de: Möglicherweise erhöhte Rauchentwicklung oder Abgasgeruch
        fr: Fumée ou odeur d'échappement éventuellement augmentée
        es: Posible aumento del humo u olor de escape
        it: Possibile aumento del fumo o dell'odore di scarico
        nl: Mogelijk meer rook of uitlaatgeur

    possible_causes:
      - en: EGR valve contamination or sticking
        ro: Supapă EGR murdară sau blocată
        de: Verschmutztes oder schwergängiges AGR-Ventil
        fr: Vanne EGR encrassée ou grippée
        es: Válvula EGR sucia o atascada
        it: Valvola EGR sporca o bloccata
        nl: Vervuilde of vastzittende EGR-klep

      - en: Intake contamination
        ro: Depuneri în admisie
        de: Verschmutzung im Ansaugsystem
        fr: Encrassement de l'admission
        es: Suciedad en la admisión
        it: Depositi nell'aspirazione
        nl: Vervuiling in het inlaatsysteem

      - en: Airflow measurement problem
        ro: Problemă de măsurare a debitului de aer
        de: Problem bei der Luftmengenmessung
        fr: Problème de mesure du débit d'air
        es: Problema de medición del flujo de aire
        it: Problema nella misurazione del flusso d'aria
        nl: Probleem met de luchtmassameting

    diagnostic_steps:
      - en: Read engine control unit fault memory
        ro: Citește memoria de erori a calculatorului motor
        de: Fehlerspeicher des Motorsteuergeräts auslesen
        fr: Lire la mémoire des défauts du calculateur moteur
        es: Leer la memoria de averías de la unidad de motor
        it: Leggere la memoria guasti della centralina motore
        nl: Lees het foutgeheugen van de motorregelunit

      - en: Compare commanded and measured EGR operation
        ro: Compară funcționarea comandată și măsurată a EGR
        de: Soll- und Istwerte der AGR-Funktion vergleichen
        fr: Comparer la commande EGR avec la valeur mesurée
        es: Comparar el funcionamiento EGR solicitado y medido
        it: Confrontare il funzionamento EGR richiesto e misurato
        nl: Vergelijk gewenste en gemeten EGR-werking

      - en: Inspect the intake tract for excessive deposits
        ro: Verifică admisia pentru depuneri excesive
        de: Ansaugtrakt auf starke Ablagerungen prüfen
        fr: Vérifier l'admission pour détecter des dépôts importants
        es: Inspeccionar la admisión en busca de depósitos excesivos
        it: Ispezionare l'aspirazione per depositi eccessivi
        nl: Controleer het inlaatsysteem op overmatige vervuiling

    keywords:
      - 1.6 TDI
      - EGR
      - rough idle
      - relanti instabil
      - AGR
      - débit d'air
    related_dtcs: []
    difficulty: intermediate


  # ============================================================
  # 5. MODERN 2.0 TDI - DPF REGENERATION
  # ============================================================

  - id: vw_20tdi_frequent_dpf_regeneration
    vehicle:
      manufacturer: volkswagen
      models:
        - volkswagen_golf
        - volkswagen_passat
        - volkswagen_tiguan
      generations: all
      engines:
        - 20tdi
    category: diagnostics
    system: exhaust
    title:
      en: Frequent DPF Regeneration on 2.0 TDI
      ro: Regenerări DPF frecvente la 2.0 TDI
      de: Häufige DPF-Regeneration beim 2.0 TDI
      fr: Régénérations fréquentes du FAP sur 2.0 TDI
      es: Regeneraciones frecuentes del DPF en 2.0 TDI
      it: Rigenerazioni frequenti del DPF sul 2.0 TDI
      nl: Frequente DPF-regeneraties bij 2.0 TDI

    symptoms:
      - en: DPF regeneration occurs unusually often
        ro: Regenerarea DPF apare neobișnuit de des
        de: DPF-Regenerationen treten ungewöhnlich häufig auf
        fr: Les régénérations du FAP sont anormalement fréquentes
        es: Las regeneraciones del DPF son demasiado frecuentes
        it: Le rigenerazioni del DPF sono insolitamente frequenti
        nl: DPF-regeneraties vinden ongewoon vaak plaats

      - en: Increased fuel consumption
        ro: Consum crescut de combustibil
        de: Erhöhter Kraftstoffverbrauch
        fr: Consommation de carburant accrue
        es: Aumento del consumo de combustible
        it: Aumento del consumo di carburante
        nl: Verhoogd brandstofverbruik

      - en: Cooling fan may continue running after shutdown
        ro: Ventilatorul poate continua să funcționeze după oprirea motorului
        de: Der Kühlerlüfter kann nach dem Abstellen weiterlaufen
        fr: Le ventilateur peut continuer à fonctionner après l'arrêt
        es: El ventilador puede seguir funcionando después de apagar el motor
        it: La ventola può continuare a funzionare dopo lo spegnimento
        nl: De koelventilator kan na uitschakelen blijven draaien

    possible_causes:
      - en: High soot loading
        ro: Încărcare mare cu funingine
        de: Hohe Rußbeladung
        fr: Forte charge en suie
        es: Alta carga de hollín
        it: Elevato carico di fuliggine
        nl: Hoge roetbelasting

      - en: DPF differential pressure measurement problem
        ro: Problemă la măsurarea presiunii diferențiale DPF
        de: Problem bei der Differenzdruckmessung des DPF
        fr: Problème de mesure de pression différentielle du FAP
        es: Problema en la medición de presión diferencial del DPF
        it: Problema nella misurazione della pressione differenziale del DPF
        nl: Probleem met de differentieeldrukmeting van het DPF

      - en: Exhaust temperature measurement problem
        ro: Problemă la măsurarea temperaturii gazelor de evacuare
        de: Problem bei der Abgastemperaturmessung
        fr: Problème de mesure de température des gaz d'échappement
        es: Problema de medición de temperatura de gases de escape
        it: Problema nella misurazione della temperatura dei gas di scarico
        nl: Probleem met de uitlaatgastemperatuurmeting

      - en: EGR or combustion problem increasing soot production
        ro: Problemă EGR sau de ardere care crește producția de funingine

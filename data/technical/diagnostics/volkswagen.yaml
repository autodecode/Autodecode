        ro: Pierdere de putere și răspuns slab la accelerație
        de: Leistungsverlust und schlechte Gasannahme
        fr: Perte de puissance et mauvaise réponse à l'accélérateur
        es: Pérdida de potencia y mala respuesta al acelerador
        it: Perdita di potenza e risposta scarsa all'acceleratore
        nl: Vermogensverlies en slechte gasrespons

    possible_causes:
      - en: Worn or fouled spark plugs
        ro: Bujii uzate sau murdare
        de: Verschlissene oder verschmutzte Zündkerzen
        fr: Bougies usées ou encrassées
        es: Bujías desgastadas o sucias
        it: Candele usurate o sporche
        nl: Versleten of vervuilde bougies
      - en: Damaged ignition leads
        ro: Cabluri de aprindere deteriorate
        de: Beschädigte Zündkabel
        fr: Fils d'allumage endommagés
        es: Cables de encendido dañados
        it: Cavi di accensione danneggiati
        nl: Beschadigde ontstekingskabels
      - en: Distributor cap or rotor fault
        ro: Defecțiune a capacului sau rotorului distribuitorului
        de: Fehler an Verteilerkappe oder Verteilerfinger
        fr: Défaut de la tête ou du doigt d'allumeur
        es: Fallo de la tapa o rotor del distribuidor
        it: Guasto alla calotta o al rotore dello spinterogeno
        nl: Defecte verdelerkap of rotor
      - en: Weak ignition coil
        ro: Bobină de aprindere slabă
        de: Schwache Zündspule
        fr: Bobine d'allumage faible
        es: Bobina de encendido débil
        it: Bobina di accensione debole
        nl: Zwakke ontstekingsbobine

    diagnostic_steps:
      - en: Inspect spark plugs and compare their condition between cylinders
        ro: Inspectează bujiile și compară starea lor între cilindri
        de: Zündkerzen prüfen und Zustand zwischen den Zylindern vergleichen
        fr: Inspecter les bougies et comparer leur état entre les cylindres
        es: Inspeccionar las bujías y comparar su estado entre cilindros
        it: Ispezionare le candele e confrontarne lo stato tra i cilindri
        nl: Controleer de bougies en vergelijk hun toestand tussen cilinders
      - en: Inspect ignition leads for cracks, corrosion and poor connections
        ro: Inspectează cablurile pentru fisuri, coroziune și conexiuni slabe
        de: Zündkabel auf Risse, Korrosion und schlechte Verbindungen prüfen
        fr: Vérifier les fils d'allumage pour fissures, corrosion et mauvais contacts
        es: Inspeccionar los cables por grietas, corrosión y malas conexiones
        it: Controllare i cavi per crepe, corrosione e collegamenti difettosi
        nl: Controleer ontstekingskabels op scheuren, corrosie en slechte verbindingen
      - en: Inspect distributor cap, rotor and ignition coil
        ro: Inspectează capacul distribuitorului, rotorul și bobina de aprindere
        de: Verteilerkappe, Verteilerfinger und Zündspule prüfen
        fr: Inspecter la tête d'allumeur, le doigt et la bobine
        es: Inspeccionar tapa, rotor y bobina de encendido
        it: Ispezionare calotta, rotore e bobina di accensione
        nl: Controleer verdelerkap, rotor en ontstekingsbobine


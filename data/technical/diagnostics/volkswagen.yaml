      en: Hard hot starting
      ro: Pornire dificilă la cald
      de: Schwieriger Warmstart
      fr: Démarrage difficile à chaud
      es: Arranque difícil en caliente
      it: Avviamento difficile a caldo
      nl: Moeilijk warm starten

    symptoms:
      - en: Engine is difficult to restart after reaching operating temperature
        ro: Motorul pornește greu după ce ajunge la temperatura de funcționare
        de: Der Motor lässt sich nach Erreichen der Betriebstemperatur schwer wieder starten
        fr: Le moteur redémarre difficilement à chaud
        es: El motor vuelve a arrancar con dificultad cuando está caliente
        it: Il motore si riavvia con difficoltà quando è caldo
        nl: De motor start moeilijk opnieuw wanneer hij warm is
      - en: Starter cranks normally but the engine takes a long time to fire
        ro: Demarorul învârte normal dar motorul pornește după mult timp
        de: Der Anlasser dreht normal, aber der Motor braucht lange zum Anspringen
        fr: Le démarreur entraîne normalement mais le moteur met du temps à démarrer
        es: El motor de arranque gira normalmente pero el motor tarda en arrancar
        it: Il motorino gira normalmente ma il motore impiega molto ad avviarsi
        nl: De startmotor draait normaal maar de motor slaat pas laat aan

    possible_causes:
      - en: Fuel vaporization or fuel boiling after shutdown
        ro: Vaporizarea sau fierberea combustibilului după oprire
        de: Kraftstoffverdampfung oder Kraftstoffsieden nach dem Abstellen
        fr: Vaporisation ou ébullition du carburant après l'arrêt
        es: Vaporización o ebullición del combustible después de apagar el motor
        it: Vaporizzazione o ebollizione del carburante dopo lo spegnimento
        nl: Brandstofverdamping of koken van brandstof na uitschakelen
      - en: Excessively rich mixture
        ro: Amestec excesiv de bogat
        de: Zu fettes Gemisch
        fr: Mélange trop riche
        es: Mezcla demasiado rica
        it: Miscela troppo ricca
        nl: Te rijk mengsel
      - en: Weak ignition when components are hot
        ro: Aprindere slabă când componentele sunt fierbinți
        de: Schwache Zündung bei warmen Bauteilen
        fr: Allumage faible lorsque les composants sont chauds
        es: Encendido débil cuando los componentes están calientes
        it: Accensione debole a caldo
        nl: Zwakke ontsteking wanneer componenten warm zijn

    diagnostic_steps:
      - en: Check whether fuel is present at the carburetor or injection system immediately after the hot-start failure
        ro: Verifică dacă există combustibil la carburator sau sistemul de injecție imediat după apariția problemei
        de: Prüfen, ob unmittelbar nach dem Warmstartfehler Kraftstoff am Vergaser oder der Einspritzanlage vorhanden ist
        fr: Vérifier la présence de carburant au carburateur ou au système d'injection après la panne à chaud
        es: Comprobar la presencia de combustible en el carburador o sistema de inyección después del fallo en caliente
        it: Controllare la presenza di carburante al carburatore o al sistema di iniezione dopo il mancato avviamento a caldo
        nl: Controleer of er direct na de warme startstoring brandstof aanwezig is bij de carburateur of injectie
      - en: Test ignition spark with the engine hot
        ro: Testează scânteia de aprindere cu motorul cald
        de: Zündfunken bei warmem Motor prüfen
        fr: Tester l'étincelle moteur chaud
        es: Probar la chispa con el motor caliente
        it: Provare la scintilla a motore caldo
        nl: Test de ontstekingsvonk met warme motor
      - en: Inspect fuel lines for excessive heat exposure
        ro: Inspectează conductele de combustibil pentru expunere excesivă la căldură
        de: Kraftstoffleitungen auf übermäßige Hitzeeinwirkung prüfen
        fr: Inspecter les conduites de carburant exposées à une chaleur excessive
        es: Inspeccionar las líneas de combustible expuestas a calor excesivo
        it: Controllare le tubazioni del carburante esposte a calore eccessivo
        nl: Controleer brandstofleidingen op overmatige hitte

    keywords:

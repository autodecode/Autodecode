      fr: La température moteur fluctue ou augmente anormalement.
      es: La temperatura del motor fluctúa o aumenta de forma anormal.
      it: La temperatura del motore oscilla o aumenta in modo anomalo.
      nl: De motortemperatuur schommelt of loopt abnormaal op.
    - en: Coolant circulation may be inconsistent after cooling-system service.
      ro: Circulația lichidului de răcire poate fi neuniformă după intervenții asupra sistemului.

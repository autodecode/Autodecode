      ro: Compară comportamentul la pornire după staționări scurte și lungi.
      de: Kaltstartverhalten nach kurzer und langer Standzeit vergleichen.
      fr: Comparer le comportement au démarrage après une courte et une longue immobilisation.
      es: Comparar el comportamiento de arranque después de paradas cortas y largas.
      it: Confrontare il comportamento all'avviamento dopo soste brevi e lunghe.
      nl: Vergelijk het startgedrag na korte en lange stilstand.
    - en: Check the carburetor fuel level and bowl vent for abnormal conditions.
      ro: Verifică nivelul combustibilului și aerisirea camerei carburatorului.
      de: Kraftstoffstand und Entlüftung der Schwimmerkammer prüfen.
      fr: Vérifier le niveau de carburant et la mise à l'air de la cuve.
      es: Comprobar el nivel de combustible y la ventilación de la cuba.

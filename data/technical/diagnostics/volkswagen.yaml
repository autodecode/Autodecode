      fr: Le moteur nécessite un long lancement après plusieurs heures d'arrêt.
      es: El motor necesita mucho tiempo de arranque después de varias horas parado.
      it: Il motore richiede un avviamento prolungato dopo diverse ore di sosta.
      nl: De motor moet na enkele uren stilstand lang worden rondgedraaid.
    - en: Starting improves after manually restoring fuel to the carburetor.
      ro: Pornirea se îmbunătățește după restabilirea manuală a alimentării carburatorului.

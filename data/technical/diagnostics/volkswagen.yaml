        nl: Controleer inlaatslangen, pakkingen en vacuümaansluitingen op lekkage
      - en: Check spark plugs, ignition leads and distributor components
        ro: Verifică bujiile, cablurile de aprindere și componentele distribuitorului
        de: Zündkerzen, Zündleitungen und Verteilerbauteile prüfen
        fr: Vérifier les bougies, câbles d'allumage et éléments du distributeur

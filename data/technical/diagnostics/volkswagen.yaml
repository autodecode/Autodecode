      it: Perdita dalla guarnizione di montaggio del carburatore
      nl: Lekkage bij de carburateurmontagepakking
  diagnostic_steps:
    - en: Inspect all vacuum hoses and connections
      ro: Inspectați toate furtunurile și conexiunile de vacuum
      de: Alle Unterdruckschläuche und Anschlüsse prüfen

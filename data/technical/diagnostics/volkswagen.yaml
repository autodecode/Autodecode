      - "1588_gtd_70"
      - "1588_gtd_80"
      - "1588_td"
      - "1588_td_60"
      - "1588_td_70"
      - "1588_td_80"

  category: diagnostics
  system: engine

  title:
    en: Glow plug or preheating system fault
    ro: Defecțiune a bujiilor incandescente sau a sistemului de preîncălzire
    de: Fehler an Glühkerzen oder Vorglühsystem
    fr: Défaut des bougies de préchauffage ou du système de préchauffage
    es: Fallo de las bujías de incandescencia o del sistema de precalentamiento
    it: Guasto delle candelette o del sistema di preriscaldamento
    nl: Storing van gloeibougies of voorgloeisysteem

  symptoms:
    - en: Very difficult cold starting
      ro: Pornire foarte dificilă la rece
      de: Sehr schwieriger Kaltstart
      fr: Démarrage à froid très difficile
      es: Arranque en frío muy difícil
      it: Avviamento a freddo molto difficoltoso
      nl: Zeer moeilijk starten bij koude motor
    - en: Extended cranking followed by rough running
      ro: Pornire prelungită urmată de funcționare neregulată
      de: Langes Anlassen mit anschließendem unrundem Motorlauf
      fr: Long lancement suivi d'un fonctionnement irrégulier
      es: Arranque prolongado seguido de funcionamiento irregular
      it: Avviamento prolungato seguito da funzionamento irregolare
      nl: Lang starten gevolgd door onregelmatig lopen
    - en: White or grey smoke immediately after cold start
      ro: Fum alb sau gri imediat după pornirea la rece
      de: Weißer oder grauer Rauch unmittelbar nach dem Kaltstart
      fr: Fumée blanche ou grise immédiatement après un démarrage à froid
      es: Humo blanco o gris inmediatamente después del arranque en frío
      it: Fumo bianco o grigio subito dopo l'avviamento a freddo
      nl: Witte of grijze rook direct na een koude start

  possible_causes:
    - en: One or more open-circuit glow plugs
      ro: Una sau mai multe bujii incandescente întrerupte
      de: Eine oder mehrere unterbrochene Glühkerzen
      fr: Une ou plusieurs bougies de préchauffage coupées
      es: Una o varias bujías de incandescencia con circuito abierto
      it: Una o più candelette interrotte
      nl: Een of meer gloeibougies met een onderbreking
    - en: High resistance in glow plug wiring
      ro: Rezistență mare în cablajul bujiilor incandescente
      de: Hoher Widerstand in der Verkabelung der Glühkerzen
      fr: Résistance élevée dans le câblage des bougies
      es: Resistencia elevada en el cableado de las bujías
      it: Elevata resistenza nel cablaggio delle candelette
      nl: Hoge weerstand in de bedrading van de gloeibougies
    - en: Faulty glow plug relay or control circuit
      ro: Releu sau circuit de comandă al preîncălzirii defect
      de: Defektes Glührelais oder fehlerhafter Steuerkreis
      fr: Relais de préchauffage ou circuit de commande défectueux
      es: Relé de precalentamiento o circuito de control defectuoso
      it: Relè di preriscaldamento o circuito di comando guasto
      nl: Defect voorgloeirelais of defecte stuurkring
    - en: Poor electrical connection at the glow plug busbar
      ro: Contact electric slab la bara de alimentare a bujiilor
      de: Schlechter elektrischer Kontakt an der Glühkerzen-Sammelschiene
      fr: Mauvais contact électrique sur la barre d'alimentation des bougies
      es: Mala conexión eléctrica en la barra de alimentación de las bujías
      it: Cattivo collegamento elettrico sulla barra delle candelette
      nl: Slechte elektrische verbinding aan de voedingsrail van de gloeibougies

  diagnostic_steps:
    - en: Measure the resistance of each glow plug individually
      ro: Măsurați individual rezistența fiecărei bujii incandescente
      de: Widerstand jeder Glühkerze einzeln messen
      fr: Mesurer individuellement la résistance de chaque bougie
      es: Medir individualmente la resistencia de cada bujía
      it: Misurare individualmente la resistenza di ogni candeletta
      nl: Meet de weerstand van elke gloeibougie afzonderlijk
    - en: Check supply voltage at the glow plug busbar during preheating
      ro: Verificați tensiunea de alimentare la bara bujiilor în timpul preîncălzirii
      de: Versorgungsspannung an der Glühkerzenleiste während des Vorglühens prüfen
      fr: Contrôler la tension d'alimentation sur la barre pendant le préchauffage
      es: Comprobar la tensión de alimentación en la barra durante el precalentamiento
      it: Controllare la tensione di alimentazione sulla barra durante il preriscaldamento
      nl: Controleer de voedingsspanning op de gloeibougie-rail tijdens het voorgloeien
    - en: Inspect the glow plug relay and its control circuit
      ro: Verificați releul bujiilor incandescente și circuitul său de comandă
      de: Glührelais und Steuerkreis prüfen
      fr: Contrôler le relais de préchauffage et son circuit de commande
      es: Comprobar el relé de precalentamiento y su circuito de control
      it: Controllare il relè di preriscaldamento e il relativo circuito di comando
      nl: Controleer het voorgloeirelais en de stuurkring

  keywords:
    - glow plugs
    - preheating
    - cold start
    - bujii incandescente
    - preîncălzire
    - Glühkerzen
    - bougies de préchauffage
    - bujías
    - candelette
    - gloeibougies

  related_dtcs: []
  difficulty: basic


- id: vw_mechanical_diesel_air_in_fuel_system
  vehicle:
    manufacturer: volkswagen
    models:
      - golf
      - jetta
      - passat
    generations:
      - golf_mk1
      - golf_mk2
      - jetta_1
      - jetta_2
      - passat_b1
      - passat_b2
    engines:
      - "1471_diesel"
      - "1588_d_54"
      - "1588_gtd_70"
      - "1588_gtd_80"
      - "1588_td"
      - "1588_td_60"
      - "1588_td_70"
      - "1588_td_80"

  category: diagnostics
  system: fuel

  title:
    en: Air ingress into the diesel fuel system
    ro: Pătrunderea aerului în sistemul de alimentare cu motorină
    de: Lufteintritt in das Diesel-Kraftstoffsystem
    fr: Entrée d'air dans le circuit de carburant diesel
    es: Entrada de aire en el sistema de combustible diésel
    it: Ingresso di aria nel circuito del carburante diesel
    nl: Luchtinlaat in het dieselsysteem

  symptoms:
    - en: Extended cranking after the vehicle has been parked
      ro: Pornire prelungită după ce vehiculul a stat parcat
      de: Langes Anlassen nach längerer Standzeit
      fr: Long lancement après une période de stationnement
      es: Arranque prolongado después de estar estacionado
      it: Avviamento prolungato dopo una sosta
      nl: Lang starten nadat de auto heeft stilgestaan
    - en: Transparent or visibly aerated fuel in the supply line
      ro: Motorină cu bule de aer vizibile pe conducta de alimentare
      de: Sichtbare Luftblasen in der Kraftstoffleitung
      fr: Bulles d'air visibles dans la conduite de carburant
      es: Burbujas de aire visibles en la línea de combustible
      it: Bolle d'aria visibili nel tubo del carburante
      nl: Zichtbare luchtbellen in de brandstofleiding
    - en: Engine may start and then stall
      ro: Motorul poate porni și apoi se poate opri
      de: Der Motor kann starten und anschließend absterben
      fr: Le moteur peut démarrer puis caler
      es: El motor puede arrancar y después calarse
      it: Il motore può avviarsi e poi spegnersi
      nl: De motor kan starten en daarna afslaan

  possible_causes:
    - en: Cracked or hardened fuel hoses
      ro: Furtunuri de motorină crăpate sau întărite
      de: Gerissene oder verhärtete Kraftstoffschläuche
      fr: Durites de carburant fissurées ou durcies
      es: Manguitos de combustible agrietados o endurecidos
      it: Tubi del carburante crepati o induriti
      nl: Gebarsten of verharde brandstofslangen
    - en: Leaking fuel filter seal
      ro: Garnitură neetanșă la filtrul de motorină
      de: Undichte Dichtung am Kraftstofffilter
      fr: Joint non étanche du filtre à carburant
      es: Junta del filtro de combustible con fugas
      it: Guarnizione del filtro carburante non a tenuta
      nl: Lekkende afdichting van het brandstoffilter
    - en: Loose hose connections
      ro: Racorduri sau coliere slăbite pe conductele de combustibil
      de: Lose Schlauchverbindungen
      fr: Raccords ou colliers de durites desserrés
      es: Conexiones o abrazaderas de combustible flojas
      it: Collegamenti o fascette dei tubi del carburante allentati
      nl: Losse aansluitingen of slangklemmen
    - en: Leakage at the injection pump shaft seal or other pump seals
      ro: Pierderi la simeringul axului sau la alte etanșări ale pompei de injecție
      de: Undichtigkeit an der Wellendichtung oder anderen Dichtungen der Einspritzpumpe
      fr: Fuite au joint d'arbre ou à d'autres joints de la pompe d'injection
      es: Fuga en el retén del eje u otras juntas de la bomba de inyección
      it: Perdita dal paraolio dell'albero o da altre guarnizioni della pompa di iniezione
      nl: Lekkage aan de asafdichting of andere afdichtingen van de injectiepomp

  diagnostic_steps:
    - en: Inspect the complete fuel supply line from tank to injection pump
      ro: Verificați întreaga conductă de alimentare de la rezervor până la pompa de injecție
      de: Die komplette Kraftstoffleitung vom Tank bis zur Einspritzpumpe prüfen
      fr: Contrôler toute la conduite de carburant du réservoir à la pompe d'injection
      es: Inspeccionar toda la línea de combustible desde el depósito hasta la bomba
      it: Ispezionare l'intera linea del carburante dal serbatoio alla pompa
      nl: Inspecteer de volledige brandstofleiding van tank tot injectiepomp
    - en: Check the fuel filter housing and all seals
      ro: Verificați carcasa filtrului de motorină și toate garniturile
      de: Kraftstofffiltergehäuse und alle Dichtungen prüfen
      fr: Contrôler le boîtier du filtre à carburant et tous les joints
      es: Comprobar la carcasa del filtro de combustible y todas las juntas
      it: Controllare il corpo del filtro carburante e tutte le guarnizioni
      nl: Controleer het brandstoffilterhuis en alle afdichtingen
    - en: Prime the system and observe whether air returns after the engine is stopped
      ro: Amorsați sistemul și observați dacă aerul reapare după oprirea motorului
      de: Kraftstoffsystem entlüften und prüfen, ob nach dem Abstellen erneut Luft eintritt
      fr: Amorcer le circuit et vérifier si de l'air réapparaît après l'arrêt du moteur
      es: Cebar el sistema y comprobar si vuelve a entrar aire después de apagar el motor
      it: Adescare il circuito e verificare se l'aria ricompare dopo lo spegnimento
      nl: Ontlucht het systeem en controleer of er na het uitschakelen opnieuw lucht verschijnt

  keywords:
    - air in fuel
    - air ingress
    - fuel leak
    - diesel fuel system
    - aer pe motorină
    - prise d'air
    - Luft im Kraftstoff
    - aire en combustible
    - aria nel carburante
    - lucht in brandstof

  related_dtcs: []
  difficulty: intermediate


- id: vw_mechanical_diesel_fuel_drainback
  vehicle:
    manufacturer: volkswagen
    models:
      - golf
      - jetta
      - passat
    generations:
      - golf_mk1
      - golf_mk2
      - jetta_1
      - jetta_2
      - passat_b1
      - passat_b2
    engines:
      - "1471_diesel"
      - "1588_d_54"
      - "1588_gtd_70"
      - "1588_gtd_80"
      - "1588_td"
      - "1588_td_60"
      - "1588_td_70"
      - "1588_td_80"

  category: diagnostics
  system: fuel

  title:
    en: Diesel fuel drain-back after shutdown
    ro: Retragerea motorinei spre rezervor după oprirea motorului
    de: Kraftstoffrücklauf nach dem Abstellen
    fr: Retour du carburant vers le réservoir après l'arrêt
    es: Retorno del combustible hacia el depósito después de apagar el motor
    it: Riflusso del carburante verso il serbatoio dopo lo spegnimento
    nl: Teruglopen van dieselbrandstof na uitschakelen

  symptoms:
    - en: Long cranking after several hours of parking
      ro: Pornire lungă după câteva ore de staționare
      de: Langes Anlassen nach mehreren Stunden Standzeit
      fr: Long lancement après plusieurs heures de stationnement
      es: Arranque prolongado después de varias horas estacionado
      it: Avviamento prolungato dopo diverse ore di sosta
      nl: Lang starten na enkele uren stilstand
    - en: Engine starts more easily after manual priming
      ro: Motorul pornește mai ușor după amorsarea manuală a sistemului
      de: Der Motor startet nach manueller Kraftstoffvorförderung leichter
      fr: Le moteur démarre plus facilement après amorçage manuel
      es: El motor arranca más fácilmente después de cebar manualmente el sistema
      it: Il motore si avvia più facilmente dopo l'adescamento manuale
      nl: De motor start gemakkelijker na handmatig ontluchten of voorpompen
    - en: Starting difficulty increases with longer parking periods
      ro: Dificultatea la pornire crește odată cu durata staționării
      de: Die Startprobleme nehmen mit längerer Standzeit zu
      fr: La difficulté de démarrage augmente avec la durée du stationnement
      es: La dificultad de arranque aumenta cuanto más tiempo permanece estacionado
      it: La difficoltà di avviamento aumenta con la durata della sosta
      nl: Het startprobleem neemt toe naarmate de auto langer stilstaat

  possible_causes:
    - en: Faulty anti-drainback valve
      ro: Supapă anti-retur defectă
      de: Defektes Rückschlagventil
      fr: Clapet anti-retour défectueux
      es: Válvula antirretorno defectuosa
      it: Valvola di non ritorno difettosa
      nl: Defecte terugslagklep
    - en: Air leak on the suction side
      ro: Pierdere de etanșeitate pe partea de aspirație
      de: Undichtigkeit auf der Saugseite
      fr: Prise d'air sur le côté aspiration
      es: Entrada de aire en el lado de aspiración
      it: Ingresso di aria sul lato aspirazione
      nl: Luchtlekkage aan de aanzuigzijde
    - en: Leaking fuel filter housing or connections
      ro: Carcasă sau racorduri ale filtrului de motorină neetanșe
      de: Undichtes Kraftstofffiltergehäuse oder undichte Anschlüsse
      fr: Boîtier ou raccords du filtre à carburant non étanches
      es: Carcasa o conexiones del filtro de combustible con fugas
      it: Corpo o raccordi del filtro carburante non a tenuta
      nl: Lekkend brandstoffilterhuis of lekkende aansluitingen

  diagnostic_steps:
    - en: Prime the fuel system before starting and compare starting time
      ro: Amorsați sistemul de alimentare înainte de pornire și comparați timpul de pornire
      de: Kraftstoffsystem vor dem Start vorfüllen und Startzeit vergleichen
      fr: Amorcer le circuit avant le démarrage et comparer le temps de lancement
      es: Cebar el sistema antes de arrancar y comparar el tiempo de arranque
      it: Adescare il circuito prima dell'avviamento e confrontare il tempo necessario
      nl: Ontlucht of vul het brandstofsysteem vóór het starten en vergelijk de starttijd
    - en: Inspect the suction-side hoses and filter connections
      ro: Verificați furtunurile de aspirație și racordurile filtrului
      de: Saugseitige Schläuche und Filteranschlüsse prüfen
      fr: Contrôler les durites d'aspiration et les raccords du filtre
      es: Comprobar los manguitos de aspiración y las conexiones del filtro
      it: Controllare i tubi di aspirazione e i raccordi del filtro
      nl: Controleer de aanzuigslangen en filteraansluitingen

  keywords:

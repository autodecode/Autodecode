      ro: Etrier, cilindru de roată sau mecanism gripat.
      de: Festsitzender Bremssattel, Radbremszylinder oder Mechanismus.
      fr: Étrier, cylindre ou mécanisme grippé.
      es: Pinza, cilindro o mecanismo agarrotado.
      it: Pinza, cilindretto o meccanismo grippato.
      nl: Vastzittende remklauw, wielcilinder of mechanisme.
    - en: Restricted flexible brake hose or incorrect adjustment.
      ro: Furtun de frână obturat sau reglaj incorect.
      de: Eingeschränkter Bremsschlauch oder falsche Einstellung.
      fr: Flexible de frein obstrué ou mauvais réglage.
      es: Latiguillo restringido o ajuste incorrecto.
      it: Tubo flessibile ostruito o regolazione errata.
      nl: Beperkte remslang of verkeerde afstelling.
  diagnostic_steps:

      ro: Demontează și inspectează jiclorul de ralanti conform procedurii de service a carburatorului.
      de: Leerlaufdüse gemäß Vergaser-Wartungsverfahren ausbauen und prüfen.
      fr: Déposer et contrôler le gicleur de ralenti selon la procédure d'entretien du carburateur.
      es: Retirar e inspeccionar el chiclé de ralentí según el procedimiento de servicio del carburador.
      it: Rimuovere e controllare il getto del minimo secondo la procedura di manutenzione del carburatore.
      nl: Verwijder en controleer de stationaire sproeier volgens de onderhoudsprocedure van de carburateur.

  title:
    en: Excessive Engine Oil Consumption on a Mechanical Diesel
    ro: Consum excesiv de ulei la un diesel mecanic
    de: Erhöhter Ölverbrauch bei einem mechanischen Diesel
    fr: Consommation excessive d'huile sur un diesel mécanique
    es: Consumo excesivo de aceite en un diésel mecánico
    it: Consumo eccessivo di olio su un diesel meccanico
    nl: Overmatig olieverbruik bij een mechanische diesel
  symptoms:
    - en: Oil level drops noticeably between service intervals.
      ro: Nivelul uleiului scade vizibil între schimburile de ulei.
      de: Der Ölstand sinkt zwischen den Wartungsintervallen deutlich.
      fr: Le niveau d'huile baisse nettement entre les vidanges.
      es: El nivel de aceite baja notablemente entre servicios.
      it: Il livello dell'olio diminuisce sensibilmente tra i tagliandi.
      nl: Het oliepeil daalt merkbaar tussen onderhoudsbeurten.
    - en: Blue or blue-grey exhaust smoke.
      ro: Fum albastru sau albastru-gri la evacuare.
      de: Blauer oder blau-grauer Abgasrauch.
      fr: Fumée d'échappement bleue ou bleu-gris.
      es: Humo azul o azul grisáceo por el escape.
      it: Fumo blu o grigio-bluastro allo scarico.
      nl: Blauwe of blauwgrijze uitlaatrook.
  possible_causes:
    - en: Worn piston rings or cylinder bores.
      ro: Segmenți uzați sau cilindri uzați.
      de: Verschlissene Kolbenringe oder Zylinderlaufbahnen.
      fr: Segments ou cylindres usés.
      es: Segmentos o cilindros desgastados.
      it: Fasce o cilindri usurati.
      nl: Versleten zuigerveren of cilinderwanden.
    - en: Valve guide or valve seal wear.
      ro: Uzura ghidurilor sau simeringurilor supapelor.
      de: Verschleiß von Ventilführungen oder Ventilschaftdichtungen.
      fr: Usure des guides ou joints de soupape.
      es: Desgaste de guías o retenes de válvula.
      it: Usura delle guide o dei paraoli valvola.
      nl: Slijtage van klepgeleiders of klepsteelafdichtingen.
    - en: Turbocharger oil leakage on turbocharged engines.
      ro: Pierdere de ulei prin turbocompresor la motoarele turbo.
      de: Ölleckage am Turbolader bei Turbomotoren.
      fr: Fuite d'huile du turbocompresseur sur les moteurs turbo.
      es: Fuga de aceite del turbocompresor en motores turbo.
      it: Perdita d'olio dal turbocompressore sui motori turbo.
      nl: Olielekkage via de turbo bij turbomotoren.
  diagnostic_steps:
    - en: Check for external oil leaks first.
      ro: Verifică mai întâi pierderile externe de ulei.
      de: Zuerst auf äußere Ölleckagen prüfen.
      fr: Vérifier d'abord les fuites d'huile externes.
      es: Comprobar primero las fugas externas de aceite.
      it: Controllare prima le perdite esterne di olio.
      nl: Controleer eerst op externe olielekkages.
    - en: Inspect intake and exhaust systems for oil contamination on turbocharged engines.
      ro: Inspectează admisia și evacuarea pentru urme de ulei la motoarele turbo.
      de: Ansaug- und Abgassystem bei Turbomotoren auf Ölspuren prüfen.
      fr: Contrôler l'admission et l'échappement pour détecter des traces d'huile sur les moteurs turbo.
      es: Revisar admisión y escape en busca de aceite en motores turbo.
      it: Controllare aspirazione e scarico per tracce d'olio sui motori turbo.
      nl: Controleer inlaat en uitlaat op oliesporen bij turbomotoren.
    - en: Perform compression testing if internal engine wear is suspected.
      ro: Efectuează un test de compresie dacă suspectezi uzură internă.
      de: Bei Verdacht auf inneren Verschleiß einen Kompressionstest durchführen.
      fr: Effectuer un test de compression en cas de suspicion d'usure interne.
      es: Realizar una prueba de compresión si se sospecha desgaste interno.
      it: Eseguire un test di compressione se si sospetta usura interna.
      nl: Voer een compressietest uit bij vermoedelijke interne slijtage.
  keywords:
    - oil consumption
    - blue smoke
    - piston rings
    - consum ulei
  related_dtcs: []
  difficulty: intermediate


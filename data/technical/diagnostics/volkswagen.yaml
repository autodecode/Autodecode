      fr: Vérifier le régime de ralenti avec le moteur complètement chaud.
      es: Comprobar el régimen de ralentí con el motor completamente caliente.
      it: Controllare il regime minimo con il motore completamente caldo.
      nl: Controleer het stationaire toerental met volledig warme motor.
    - en: Check that the throttle linkage and plate return completely to the idle position.
      ro: Verifică revenirea completă a mecanismului și clapetei de accelerație în poziția de ralanti.
      de: Prüfen, ob Gestänge und Drosselklappe vollständig in die Leerlaufstellung zurückkehren.
      fr: Vérifier que la tringlerie et le papillon reviennent complètement en position de ralenti.

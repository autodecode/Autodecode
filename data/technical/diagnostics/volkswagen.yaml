  title:
    en: Air in the Mechanical Diesel Fuel System
    ro: Aer în sistemul de alimentare al dieselului mecanic
    de: Luft im Kraftstoffsystem eines mechanischen Diesels
    fr: Air dans le circuit de carburant d'un diesel mécanique
    es: Aire en el sistema de combustible de un diésel mecánico
    it: Aria nel circuito del carburante di un diesel meccanico
    nl: Lucht in het brandstofsysteem van een mechanische diesel
  symptoms:
    - en: Hard starting after parking.
      ro: Pornire grea după staționare.
      de: Schwerer Start nach dem Abstellen.
      fr: Démarrage difficile après immobilisation.
      es: Arranque difícil después de estar estacionado.
      it: Avviamento difficile dopo la sosta.
      nl: Moeilijk starten na stilstand.
    - en: Engine may stall shortly after starting.
      ro: Motorul se poate opri la scurt timp după pornire.
      de: Der Motor kann kurz nach dem Start absterben.
      fr: Le moteur peut caler peu après le démarrage.
      es: El motor puede calarse poco después del arranque.
      it: Il motore può spegnersi poco dopo l'avviamento.
      nl: De motor kan kort na het starten afslaan.
  possible_causes:
    - en: Cracked or porous fuel hose.
      ro: Furtun de combustibil fisurat sau poros.
      de: Rissiger oder poröser Kraftstoffschlauch.
      fr: Durite de carburant fissurée ou poreuse.
      es: Manguito de combustible agrietado o poroso.
      it: Tubo carburante crepato o poroso.
      nl: Gebarsten of poreuze brandstofslang.
    - en: Leaking filter housing or seal.
      ro: Carcasă sau garnitură de filtru neetanșă.
      de: Undichtes Filtergehäuse oder Dichtung.
      fr: Boîtier ou joint de filtre non étanche.
      es: Carcasa o junta del filtro con fugas.
      it: Corpo o guarnizione del filtro non a tenuta.
      nl: Lekkend filterhuis of afdichting.
    - en: Air leak around the injection pump or fuel connections.
      ro: Pierdere de aer la pompa de injecție sau racordurile de combustibil.
      de: Lufteintritt an Einspritzpumpe oder Kraftstoffanschlüssen.
      fr: Entrée d'air autour de la pompe ou des raccords.
      es: Entrada de aire en la bomba o conexiones.
      it: Ingresso di aria presso la pompa o i raccordi.
      nl: Luchtinlaat bij inspuitpomp of brandstofaansluitingen.
  diagnostic_steps:
    - en: Inspect the complete fuel supply circuit.
      ro: Inspectează întregul circuit de alimentare.
      de: Den gesamten Kraftstoffzulauf prüfen.
      fr: Contrôler tout le circuit d'alimentation.
      es: Revisar todo el circuito de alimentación.
      it: Controllare l'intero circuito di alimentazione.
      nl: Controleer het volledige brandstoftoevoercircuit.
    - en: Check for air bubbles before the injection pump.
      ro: Verifică bulele de aer înaintea pompei de injecție.
      de: Auf Luftblasen vor der Einspritzpumpe prüfen.
      fr: Rechercher les bulles avant la pompe d'injection.
      es: Buscar burbujas antes de la bomba.
      it: Cercare bolle prima della pompa.
      nl: Controleer op luchtbellen vóór de inspuitpomp.
  keywords:

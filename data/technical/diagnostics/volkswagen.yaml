      ro: Canale de aer sau combustibil restricționate în circuitul principal.
      de: Eingeschränkte Luft- oder Kraftstoffkanäle im Hauptkreislauf.
      fr: Passages d'air ou de carburant obstrués dans le circuit principal.
      es: Conductos de aire o combustible restringidos en el circuito principal.
      it: Passaggi dell'aria o del carburante ostruiti nel circuito principale.
      nl: Beperkte lucht- of brandstofdoorgangen in het hoofdcircuit.
  diagnostic_steps:

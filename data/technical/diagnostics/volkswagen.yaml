      fr: Rechercher les fuites et contrôler le niveau de liquide.
      es: Comprobar fugas y nivel del líquido.
      it: Controllare perdite e livello del liquido.
      nl: Controleer op lekkages en controleer het remvloeistofniveau.
    - en: Bleed the system and inspect pads, shoes, discs or drums as applicable.
      ro: Aerisește sistemul și inspectează plăcuțele, saboții, discurile sau tamburii.

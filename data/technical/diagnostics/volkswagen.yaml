  title:
    en: Fuel Vapor Lock
    ro: Blocaj de vapori în sistemul de alimentare
    de: Dampfblasenbildung im Kraftstoffsystem
    fr: Vaporisation du carburant dans le circuit
    es: Bloqueo por vapores de combustible
    it: Vapor lock nel sistema di alimentazione
    nl: Dampbelvorming in het brandstofsysteem
  symptoms:
    - en: Engine stalls after becoming hot and is difficult to restart.
      ro: Motorul se oprește după încălzire și pornește greu la cald.
      de: Der Motor geht nach dem Warmwerden aus und lässt sich heiß schwer starten.
      fr: Le moteur cale à chaud et redémarre difficilement.
      es: El motor se cala en caliente y cuesta volver a arrancarlo.
      it: Il motore si spegne a caldo e si riavvia con difficoltà.
      nl: De motor slaat warm af en start daarna moeilijk.
    - en: Fuel delivery temporarily becomes insufficient.
      ro: Alimentarea cu combustibil devine temporar insuficientă.
      de: Die Kraftstoffversorgung wird vorübergehend unzureichend.
      fr: L'alimentation en carburant devient temporairement insuffisante.
      es: El suministro de combustible se vuelve temporalmente insuficiente.
      it: L'alimentazione del carburante diventa temporaneamente insufficiente.
      nl: De brandstoftoevoer wordt tijdelijk onvoldoende.
  possible_causes:
    - en: Excessive heat around the fuel line or mechanical fuel pump.
      ro: Căldură excesivă în zona conductei de combustibil sau a pompei mecanice.
      de: Übermäßige Hitze an der Kraftstoffleitung oder der mechanischen Kraftstoffpumpe.
      fr: Chaleur excessive autour de la conduite ou de la pompe mécanique.
      es: Calor excesivo alrededor de la línea o de la bomba mecánica de combustible.
      it: Calore eccessivo intorno al tubo o alla pompa meccanica del carburante.
      nl: Overmatige warmte rond de brandstofleiding of mechanische brandstofpomp.
    - en: Incorrect fuel-line routing or insufficient heat shielding.
      ro: Traseu incorect al conductei de combustibil sau protecție termică insuficientă.
      de: Falsche Verlegung der Kraftstoffleitung oder unzureichende Hitzeschutzmaßnahmen.
      fr: Mauvais cheminement de la conduite ou protection thermique insuffisante.
      es: Enrutamiento incorrecto de la línea o protección térmica insuficiente.
      it: Percorso errato del tubo o protezione termica insufficiente.
      nl: Verkeerde routing van de brandstofleiding of onvoldoende hitteschild.
  diagnostic_steps:
    - en: Check whether the fault occurs only after prolonged heat soak.
      ro: Verifică dacă defectul apare numai după încălzirea prelungită a motorului.
      de: Prüfen, ob der Fehler nur nach längerer Wärmeeinwirkung auftritt.
      fr: Vérifier si le défaut apparaît uniquement après une longue montée en température.
      es: Comprobar si el fallo aparece solo después de una exposición prolongada al calor.
      it: Verificare se il difetto compare solo dopo un lungo periodo a caldo.
      nl: Controleer of de storing alleen optreedt na langdurige warmte-inwerking.
    - en: Inspect fuel-line routing and heat shielding near hot engine components.
      ro: Inspectează traseul conductei și protecția termică din apropierea componentelor fierbinți.
      de: Kraftstoffleitungsverlegung und Hitzeschutz in der Nähe heißer Motorteile prüfen.
      fr: Inspecter le cheminement et la protection thermique près des composants chauds.
      es: Inspeccionar el recorrido y la protección térmica cerca de componentes calientes.
      it: Controllare il percorso e la protezione termica vicino ai componenti caldi.
      nl: Controleer de leidingloop en hittescherming bij hete motoronderdelen.
  keywords:
    - vapor lock
    - fuel vaporization
    - hot restart
    - vapour lock

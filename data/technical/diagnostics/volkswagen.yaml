  category: diagnostics
  system: engine
  title:
    en: Low Compression on a Mechanical Diesel Engine
    ro: Compresie scăzută la un motor diesel cu injecție mecanică
    de: Niedrige Kompression bei einem mechanischen Dieselmotor
    fr: Faible compression sur un moteur diesel à injection mécanique
    es: Compresión baja en un motor diésel de inyección mecánica
    it: Bassa compressione su un motore diesel a iniezione meccanica
    nl: Lage compressie bij een mechanische dieselmotor
  symptoms:
    - en: Difficult starting, especially when cold.
      ro: Pornire dificilă, în special la rece.
      de: Schwieriger Start, besonders bei kaltem Motor.
      fr: Démarrage difficile, surtout à froid.
      es: Arranque difícil, especialmente en frío.
      it: Avviamento difficile, soprattutto a freddo.
      nl: Moeilijk starten, vooral bij koude motor.
    - en: Uneven idle and reduced engine power.
      ro: Relanti neregulat și putere redusă.
      de: Unruhiger Leerlauf und reduzierte Motorleistung.
      fr: Ralenti irrégulier et puissance réduite.
      es: Ralentí irregular y potencia reducida.
      it: Minimo irregolare e potenza ridotta.
      nl: Onrustig stationair draaien en verminderd vermogen.
    - en: Increased crankcase pressure or visible blow-by.
      ro: Presiune crescută în carter sau blow-by vizibil.
      de: Erhöhter Kurbelgehäusedruck oder sichtbarer Blow-by.
      fr: Pression élevée dans le carter ou blow-by important.
      es: Presión elevada en el cárter o blow-by visible.
      it: Pressione elevata nel basamento o blow-by evidente.
      nl: Verhoogde carterdruk of duidelijke blow-by.
  possible_causes:
    - en: Worn piston rings.
      ro: Segmenți de piston uzați.
      de: Verschlissene Kolbenringe.
      fr: Segments de piston usés.
      es: Segmentos de pistón desgastados.
      it: Fasce elastiche usurate.
      nl: Versleten zuigerveren.
    - en: Worn cylinder bores.
      ro: Uzura cilindrilor.
      de: Verschlissene Zylinderlaufbahnen.
      fr: Usure des cylindres.
      es: Desgaste de los cilindros.
      it: Usura delle canne cilindro.
      nl: Versleten cilinderwanden.
    - en: Valve sealing problems.
      ro: Probleme de etanșare ale supapelor.
      de: Probleme mit der Ventilabdichtung.
      fr: Problèmes d'étanchéité des soupapes.
      es: Problemas de estanqueidad de las válvulas.
      it: Problemi di tenuta delle valvole.
      nl: Problemen met klepafdichting.
  diagnostic_steps:
    - en: Check cranking speed and battery condition before compression testing.
      ro: Verifică viteza de antrenare și bateria înaintea testului de compresie.
      de: Vor der Kompressionsprüfung Anlasserdrehzahl und Batterie prüfen.
      fr: Vérifier la vitesse de lancement et la batterie avant le test de compression.
      es: Comprobar la velocidad de arranque y la batería antes de medir la compresión.
      it: Controllare la velocità di avviamento e la batteria prima del test di compressione.
      nl: Controleer startsnelheid en accu vóór de compressietest.
    - en: Measure compression in all cylinders using a suitable diesel compression tester.
      ro: Măsoară compresia în toți cilindrii cu un tester adecvat pentru diesel.
      de: Kompression in allen Zylindern mit einem geeigneten Diesel-Kompressionstester messen.
      fr: Mesurer la compression de tous les cylindres avec un compressiomètre diesel adapté.
      es: Medir la compresión en todos los cilindros con un comprobador diésel adecuado.
      it: Misurare la compressione di tutti i cilindri con un tester diesel adatto.
      nl: Meet de compressie in alle cilinders met een geschikte dieselcompressietester.
    - en: Compare cylinder-to-cylinder variation.
      ro: Compară diferențele de compresie dintre cilindri.
      de: Kompressionsunterschiede zwischen den Zylindern vergleichen.
      fr: Comparer les écarts de compression entre les cylindres.
      es: Comparar las diferencias de compresión entre cilindros.
      it: Confrontare le differenze di compressione tra i cilindri.
      nl: Vergelijk de compressiewaarden tussen de cilinders.
  keywords:
    - low compression
    - diesel compression
    - blow-by
    - compresie scazuta

    it: Vibrazioni durante la frenata
    nl: Trillingen tijdens het remmen
  symptoms:
    - en: Steering wheel or vehicle vibrates during braking.
      ro: Volanul sau mașina vibrează la frânare.
      de: Lenkrad oder Fahrzeug vibrieren beim Bremsen.
      fr: Le volant ou le véhicule vibre au freinage.
      es: El volante o el vehículo vibran al frenar.
      it: Il volante o il veicolo vibrano durante la frenata.
      nl: Het stuur of voertuig trilt tijdens het remmen.

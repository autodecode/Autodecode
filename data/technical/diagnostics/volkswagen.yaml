- id: vw_mechanical_diesel_hard_start
  vehicle:
    manufacturer: volkswagen
    models:
      - golf
      - jetta
      - passat
    generations:
      - golf_mk1
      - golf_mk2
      - jetta_1
      - jetta_2
      - passat_b1
      - passat_b2
    engines:
      - "1471_diesel"
      - "1588_d_54"
      - "1588_gtd_70"
      - "1588_gtd_80"
      - "1588_td"
      - "1588_td_60"
      - "1588_td_70"
      - "1588_td_80"

  category: diagnostics
  system: engine

  title:
    en: Mechanical diesel engine hard starting
    ro: Pornire grea a motorului diesel cu injecție mecanică
    de: Schwerer Start eines Dieselmotors mit mechanischer Einspritzung
    fr: Démarrage difficile d'un moteur diesel à injection mécanique
    es: Arranque difícil de un motor diésel con inyección mecánica
    it: Avviamento difficoltoso di un motore diesel a iniezione meccanica
    nl: Moeilijk starten van een dieselmotor met mechanische inspuiting

  symptoms:
    - en: Engine requires extended cranking before starting
      ro: Motorul necesită o perioadă lungă de pornire înainte să pornească
      de: Der Motor benötigt eine lange Anlasszeit, bevor er startet
      fr: Le moteur nécessite une longue phase de lancement avant de démarrer
      es: El motor necesita un tiempo prolongado de arranque antes de ponerse en marcha
      it: Il motore richiede un lungo azionamento del motorino prima di avviarsi
      nl: De motor heeft lang starten nodig voordat hij aanslaat
    - en: Poor starting is more noticeable when the engine is cold
      ro: Pornirea dificilă este mai evidentă când motorul este rece
      de: Das Startproblem ist bei kaltem Motor stärker ausgeprägt
      fr: Le problème de démarrage est plus marqué lorsque le moteur est froid
      es: El problema de arranque es más evidente con el motor frío
      it: Il problema di avviamento è più evidente a motore freddo
      nl: Het startprobleem is duidelijker bij een koude motor
    - en: White or grey smoke may appear during cranking and immediately after starting
      ro: Poate apărea fum alb sau gri în timpul pornirii și imediat după pornire
      de: Während des Anlassens und unmittelbar nach dem Start kann weißer oder grauer Rauch auftreten
      fr: Une fumée blanche ou grise peut apparaître pendant le lancement et juste après le démarrage
      es: Puede aparecer humo blanco o gris durante el arranque y justo después de arrancar
      it: Durante l'avviamento e subito dopo può comparire fumo bianco o grigio
      nl: Tijdens het starten en direct daarna kan witte of grijze rook verschijnen

  possible_causes:
    - en: Faulty glow plugs or preheating system
      ro: Bujii incandescente defecte sau sistem de preîncălzire defect
      de: Defekte Glühkerzen oder fehlerhaftes Vorglühsystem
      fr: Bougies de préchauffage défectueuses ou système de préchauffage défaillant
      es: Bujías de incandescencia defectuosas o sistema de precalentamiento averiado
      it: Candelette difettose o sistema di preriscaldamento guasto
      nl: Defecte gloeibougies of defect voorgloeisysteem
    - en: Air entering the fuel system
      ro: Pătrunderea aerului în sistemul de alimentare cu motorină
      de: Lufteintritt in das Kraftstoffsystem
      fr: Entrée d'air dans le circuit de carburant
      es: Entrada de aire en el sistema de combustible
      it: Ingresso di aria nel circuito del carburante
      nl: Luchtinlaat in het brandstofsysteem
    - en: Fuel draining back toward the tank after shutdown
      ro: Motorina se retrage spre rezervor după oprirea motorului
      de: Kraftstoff läuft nach dem Abstellen zum Tank zurück
      fr: Le carburant retourne vers le réservoir après l'arrêt
      es: El combustible retorna hacia el depósito después de apagar el motor
      it: Il carburante rifluisce verso il serbatoio dopo lo spegnimento
      nl: Brandstof loopt na het uitschakelen terug naar de tank
    - en: Insufficient cranking speed
      ro: Turație insuficientă la pornire
      de: Unzureichende Anlassdrehzahl
      fr: Vitesse de lancement insuffisante
      es: Velocidad de giro insuficiente durante el arranque
      it: Regime di avviamento insufficiente
      nl: Onvoldoende startsnelheid
    - en: Incorrect injection timing
      ro: Avansul injecției este reglat incorect
      de: Falsch eingestellter Einspritzzeitpunkt
      fr: Calage incorrect de l'injection
      es: Reglaje incorrecto del avance de inyección
      it: Fasatura dell'iniezione errata
      nl: Verkeerd inspuittijdstip
    - en: Low engine compression
      ro: Compresie scăzută a motorului
      de: Niedrige Motorkompression
      fr: Compression moteur insuffisante
      es: Compresión del motor insuficiente
      it: Compressione del motore insufficiente
      nl: Te lage motorcompressie

  diagnostic_steps:
    - en: Check battery voltage and measure cranking speed during starting
      ro: Verificați tensiunea bateriei și măsurați turația motorului în timpul pornirii
      de: Batteriespannung prüfen und Anlassdrehzahl während des Startvorgangs messen
      fr: Contrôler la tension de batterie et mesurer le régime pendant le lancement
      es: Comprobar la tensión de la batería y medir el régimen durante el arranque
      it: Controllare la tensione della batteria e misurare il regime durante l'avviamento
      nl: Controleer de accuspanning en meet het toerental tijdens het starten
    - en: Inspect the glow plugs and preheating circuit
      ro: Verificați bujiile incandescente și circuitul de preîncălzire
      de: Glühkerzen und Vorglühkreis prüfen
      fr: Contrôler les bougies de préchauffage et le circuit de préchauffage
      es: Comprobar las bujías de incandescencia y el circuito de precalentamiento
      it: Controllare le candelette e il circuito di preriscaldamento
      nl: Controleer de gloeibougies en het voorgloeicircuit
    - en: Check the fuel lines and filter for air ingress
      ro: Verificați conductele de motorină și filtrul pentru pătrunderea aerului
      de: Kraftstoffleitungen und Filter auf Lufteintritt prüfen
      fr: Contrôler les conduites de carburant et le filtre pour détecter une entrée d'air
      es: Comprobar las líneas de combustible y el filtro para detectar entrada de aire
      it: Controllare i tubi del carburante e il filtro per eventuali ingressi d'aria
      nl: Controleer brandstofleidingen en filter op luchtinlaat
    - en: Verify injection pump timing according to the engine specification
      ro: Verificați avansul pompei de injecție conform specificației motorului
      de: Einspritzpumpenzeitpunkt gemäß Motorspezifikation prüfen
      fr: Vérifier le calage de la pompe d'injection selon les spécifications du moteur
      es: Verificar el calado de la bomba de inyección según las especificaciones del motor
      it: Verificare la fasatura della pompa di iniezione secondo le specifiche del motore
      nl: Controleer de timing van de injectiepomp volgens de motorspecificatie
    - en: Perform a compression test if fuel and preheating systems are satisfactory
      ro: Efectuați un test de compresie dacă sistemele de alimentare și preîncălzire sunt în regulă
      de: Kompressionsprüfung durchführen, wenn Kraftstoff- und Vorglühsystem in Ordnung sind
      fr: Effectuer un test de compression si les systèmes de carburant et de préchauffage sont corrects
      es: Realizar una prueba de compresión si los sistemas de combustible y precalentamiento funcionan correctamente
      it: Eseguire una prova di compressione se i sistemi carburante e preriscaldamento sono efficienti
      nl: Voer een compressietest uit als brandstof- en voorgloeisysteem in orde zijn

  keywords:
    - hard start
    - difficult starting
    - diesel
    - mechanical injection
    - cold start
    - pornire grea
    - diesel mecanic
    - démarrage difficile
    - schwieriger Start
    - arranque difícil
    - avviamento difficile
    - moeilijk starten

  related_dtcs: []
  difficulty: intermediate



  title:
    en: Restricted Mechanical Diesel Fuel Filter
    ro: Filtru de motorină colmatat sau restricționat
    de: Eingeschränkter Kraftstofffilter bei mechanischem Diesel
    fr: Filtre à carburant diesel mécanique obstrué
    es: Filtro de combustible diésel mecánico restringido
    it: Filtro carburante del diesel meccanico ostruito
    nl: Beperkte brandstoftoevoer door verstopt dieselfilter
  symptoms:
    - en: Loss of engine power under load.
      ro: Pierdere de putere sub sarcină.
      de: Leistungsverlust unter Last.
      fr: Perte de puissance sous charge.
      es: Pérdida de potencia bajo carga.
      it: Perdita di potenza sotto carico.
      nl: Vermogensverlies onder belasting.
    - en: Engine may stall at high fuel demand.
      ro: Motorul se poate opri la cerere mare de combustibil.
      de: Der Motor kann bei hohem Kraftstoffbedarf absterben.
      fr: Le moteur peut caler à forte demande de carburant.
      es: El motor puede calarse con alta demanda.
      it: Il motore può spegnersi con elevata richiesta.
      nl: De motor kan afslaan bij hoge brandstofvraag.
  possible_causes:
    - en: Clogged fuel filter.
      ro: Filtru de motorină colmatat.
      de: Verstopfter Kraftstofffilter.
      fr: Filtre à carburant colmaté.
      es: Filtro de combustible obstruido.
      it: Filtro carburante intasato.
      nl: Verstopt brandstoffilter.
    - en: Contaminated fuel.
      ro: Combustibil contaminat.
      de: Verunreinigter Kraftstoff.
      fr: Carburant contaminé.
      es: Combustible contaminado.
      it: Carburante contaminato.
      nl: Vervuilde brandstof.
  diagnostic_steps:
    - en: Check filter condition and service history.
      ro: Verifică starea filtrului și istoricul de service.
      de: Filterzustand und Wartungshistorie prüfen.
      fr: Vérifier l'état et l'historique du filtre.
      es: Comprobar el estado y el historial del filtro.
      it: Controllare lo stato e la manutenzione del filtro.
      nl: Controleer staat en onderhoudshistorie van het filter.
    - en: Verify fuel flow before the injection pump.
      ro: Verifică debitul de combustibil înaintea pompei de injecție.
      de: Kraftstoffdurchfluss vor der Einspritzpumpe prüfen.
      fr: Contrôler le débit avant la pompe d'injection.
      es: Comprobar el caudal antes de la bomba.
      it: Controllare il flusso prima della pompa.
      nl: Controleer de brandstofdoorstroming vóór de inspuitpomp.
  keywords:
    - fuel filter
    - clogged filter
    - diesel restriction
    - filtru motorina
  related_dtcs: []
  difficulty: basic


  title:
    en: Hard Starting on a Mechanical Diesel Engine
    ro: Pornire dificilă la un motor diesel cu injecție mecanică
    de: Schweres Starten bei einem mechanischen Dieselmotor
    fr: Démarrage difficile d'un moteur diesel à injection mécanique
    es: Arranque difícil en un motor diésel de inyección mecánica
    it: Avviamento difficile di un motore diesel a iniezione meccanica
    nl: Moeilijk starten van een mechanische dieselmotor
  symptoms:
    - en: Engine cranks normally but takes a long time to start.
      ro: Motorul se învârte normal, dar pornește greu.
      de: Der Motor dreht normal durch, startet aber nur schwer.
      fr: Le moteur tourne normalement mais démarre difficilement.
      es: El motor gira normalmente pero arranca con dificultad.
      it: Il motore gira normalmente ma si avvia con difficoltà.
      nl: De motor draait normaal rond maar start moeilijk.
    - en: Hard starting is often worse when the engine is cold.
      ro: Pornirea dificilă este de obicei mai accentuată când motorul este rece.
      de: Der schwierige Start ist bei kaltem Motor häufig stärker ausgeprägt.
      fr: Le démarrage difficile est souvent plus marqué à froid.
      es: El arranque difícil suele ser más acusado en frío.
      it: L'avviamento difficoltoso è spesso più evidente a freddo.
      nl: Moeilijk starten is vaak erger bij een koude motor.
  possible_causes:
    - en: Weak glow-plug preheating.
      ro: Preîncălzire slabă prin bujiile incandescente.
      de: Schwache Vorglühanlage.
      fr: Préchauffage insuffisant.
      es: Precalentamiento insuficiente.
      it: Preriscaldamento insufficiente.
      nl: Onvoldoende voorgloeien.
    - en: Air entering the fuel system.
      ro: Pătrundere de aer în sistemul de alimentare.
      de: Lufteintritt in das Kraftstoffsystem.
      fr: Entrée d'air dans le circuit de carburant.
      es: Entrada de aire en el sistema de combustible.
      it: Ingresso di aria nel circuito del carburante.
      nl: Luchtinlaat in het brandstofsysteem.
    - en: Incorrect injection timing.
      ro: Avansul injecției este incorect.
      de: Falscher Einspritzzeitpunkt.
      fr: Calage d'injection incorrect.
      es: Reglaje incorrecto del avance de inyección.
      it: Fasatura errata dell'iniezione.
      nl: Verkeerd inspuittijdstip.
    - en: Low compression.
      ro: Compresie scăzută.
      de: Niedrige Kompression.
      fr: Compression insuffisante.
      es: Compresión baja.
      it: Compressione insufficiente.
      nl: Lage compressie.
  diagnostic_steps:
    - en: Check battery voltage and cranking speed.
      ro: Verifică tensiunea bateriei și viteza de antrenare la pornire.
      de: Batteriespannung und Anlasserdrehzahl prüfen.
      fr: Vérifier la tension de batterie et la vitesse de lancement.
      es: Comprobar la tensión de batería y la velocidad de arranque.
      it: Controllare la tensione della batteria e la velocità di avviamento.
      nl: Controleer accuspanning en startsnelheid.
    - en: Check the glow-plug system.
      ro: Verifică sistemul de bujii incandescente.
      de: Vorglühsystem prüfen.
      fr: Contrôler le système de préchauffage.
      es: Comprobar el sistema de precalentamiento.
      it: Controllare il sistema di preriscaldamento.
      nl: Controleer het voorgloeisysteem.
    - en: Check the fuel circuit for air ingress.
      ro: Verifică circuitul de combustibil pentru pătrunderea aerului.
      de: Kraftstoffsystem auf Lufteintritt prüfen.
      fr: Vérifier le circuit de carburant à la recherche d'air.
      es: Comprobar la entrada de aire en el circuito.
      it: Controllare l'ingresso di aria nel circuito.
      nl: Controleer het brandstofsysteem op luchtinlaat.
    - en: Check injection timing and compression if the basic checks pass.
      ro: Verifică avansul injecției și compresia dacă verificările de bază sunt bune.
      de: Einspritzzeitpunkt und Kompression prüfen, wenn die Grundprüfungen unauffällig sind.
      fr: Contrôler le calage et la compression si les contrôles de base sont corrects.
      es: Comprobar avance y compresión si las comprobaciones básicas son correctas.
      it: Controllare fasatura e compressione se i controlli di base sono corretti.
      nl: Controleer inspuittijdstip en compressie als de basiscontroles goed zijn.
  keywords:
    - hard start
    - difficult starting
    - cold start
    - pornire grea
    - diesel mecanic
  related_dtcs: []
  difficulty: basic


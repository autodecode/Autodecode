      de: Die Drosselklappe schließt nicht vollständig.
      fr: Le papillon des gaz ne se ferme pas complètement.
      es: La mariposa de aceleración no se cierra completamente.
      it: La farfalla non si chiude completamente.
      nl: De gasklep sluit niet volledig.
    - en: Choke mechanism remains partially engaged.
      ro: Mecanismul șocului rămâne parțial activat.
      de: Die Chokeeinrichtung bleibt teilweise aktiviert.
      fr: Le mécanisme de starter reste partiellement engagé.
      es: El mecanismo del estárter permanece parcialmente activado.
      it: Il meccanismo dello starter rimane parzialmente inserito.
      nl: Het chokemechanisme blijft gedeeltelijk ingeschakeld.

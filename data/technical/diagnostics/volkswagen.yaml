      ro: Vibrațiile devin mai puternice de la viteze mai mari.
      de: Die Vibrationen werden bei höherer Geschwindigkeit stärker.
      fr: Les vibrations augmentent à vitesse élevée.
      es: Las vibraciones aumentan a velocidades elevadas.

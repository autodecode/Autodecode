    ro: Presiune excesivă în carter la un diesel mecanic
    de: Überhöhter Kurbelgehäusedruck bei einem mechanischen Diesel
    fr: Pression excessive dans le carter d'un diesel mécanique
    es: Presión excesiva en el cárter de un diésel mecánico
    it: Pressione eccessiva nel basamento di un diesel meccanico
    nl: Overmatige carterdruk bij een mechanische diesel
  symptoms:
    - en: Strong blow-by from the crankcase ventilation system.
      ro: Blow-by puternic prin sistemul de ventilare al carterului.
      de: Starker Blow-by aus der Kurbelgehäuseentlüftung.
      fr: Blow-by important par le système de ventilation du carter.
      es: Blow-by elevado a través de la ventilación del cárter.
      it: Blow-by elevato attraverso la ventilazione del basamento.
      nl: Sterke blow-by via de carterventilatie.
    - en: Oil mist around the engine.
      ro: Vapori sau ceață de ulei în jurul motorului.
      de: Ölnebel im Motorbereich.
      fr: Brouillard d'huile autour du moteur.
      es: Niebla de aceite alrededor del motor.
      it: Nebbia d'olio intorno al motore.
      nl: Olienevel rond de motor.
    - en: Oil leaks from seals or gaskets.
      ro: Pierderi de ulei pe la simeringuri sau garnituri.
      de: Ölleckagen an Dichtungen oder Wellendichtringen.
      fr: Fuites d'huile au niveau des joints.
      es: Fugas de aceite por juntas o retenes.
      it: Perdite d'olio da guarnizioni o paraoli.
      nl: Olielekkage langs afdichtingen.
  possible_causes:
    - en: Excessive piston-ring blow-by.
      ro: Blow-by excesiv pe lângă segmenții de piston.
      de: Übermäßiger Blow-by an den Kolbenringen.
      fr: Blow-by excessif au niveau des segments.
      es: Blow-by excesivo por los segmentos.
      it: Blow-by eccessivo attraverso le fasce.
      nl: Overmatige blow-by langs de zuigerveren.
    - en: Worn cylinder bores.
      ro: Uzura cilindrilor.
      de: Verschlissene Zylinderlaufbahnen.
      fr: Usure des cylindres.
      es: Desgaste de los cilindros.
      it: Usura delle canne cilindro.
      nl: Versleten cilinderwanden.
  diagnostic_steps:
    - en: Inspect the crankcase ventilation system.
      ro: Inspectează sistemul de ventilare al carterului.
      de: Kurbelgehäuseentlüftung prüfen.
      fr: Contrôler la ventilation du carter.
      es: Revisar la ventilación del cárter.
      it: Controllare la ventilazione del basamento.
      nl: Controleer de carterventilatie.
    - en: Check for abnormal crankcase pressure.
      ro: Verifică dacă presiunea în carter este anormală.
      de: Kurbelgehäusedruck auf Auffälligkeiten prüfen.
      fr: Vérifier si la pression du carter est anormale.
      es: Comprobar si la presión del cárter es anormal.
      it: Verificare eventuale pressione anomala nel basamento.
      nl: Controleer op abnormale carterdruk.
    - en: Perform a compression test if excessive blow-by is confirmed.
      ro: Efectuează un test de compresie dacă blow-by-ul este excesiv.
      de: Bei starkem Blow-by einen Kompressionstest durchführen.
      fr: Effectuer un test de compression si le blow-by est important.
      es: Realizar una prueba de compresión si se confirma un blow-by elevado.
      it: Eseguire un test di compressione se il blow-by è eccessivo.
      nl: Voer een compressietest uit bij overmatige blow-by.
  keywords:
    - crankcase pressure
    - blow-by
    - piston rings
    - carter pressure
  related_dtcs: []
  difficulty: intermediate



      ro: Măsoară bătaia discului sau tamburului, după caz.
      de: Rundlauf von Scheibe oder Trommel messen.
      fr: Mesurer le voile du disque ou du tambour.
      es: Medir el alabeo del disco o tambor.
      it: Misurare l'eccentricità del disco o tamburo.
      nl: Meet de slingering van schijf of trommel.
    - en: Inspect wheel bearings, suspension and steering for play.
      ro: Verifică jocurile din rulmenți, suspensie și direcție.
      de: Radlager, Fahrwerk und Lenkung auf Spiel prüfen.
      fr: Contrôler les jeux des roulements, de la suspension et de la direction.

    title:
      en: Hard cold starting
      ro: Pornire dificilă la rece
      de: Schwieriger Kaltstart
      fr: Démarrage difficile à froid
      es: Arranque difícil en frío
      it: Avviamento difficile a freddo
      nl: Moeilijk koud starten

    symptoms:
      - en: Engine requires extended cranking when cold
        ro: Motorul necesită acționarea îndelungată a demarorului când este rece
        de: Der Motor benötigt bei Kälte längeres Durchdrehen
        fr: Le moteur nécessite un long entraînement à froid
        es: El motor necesita mucho tiempo de arranque en frío
        it: Il motore richiede un avviamento prolungato a freddo
        nl: De motor heeft bij koude toestand lang starten nodig
      - en: Engine starts only after several attempts
        ro: Motorul pornește numai după mai multe încercări
        de: Der Motor startet erst nach mehreren Versuchen
        fr: Le moteur ne démarre qu'après plusieurs tentatives
        es: El motor solo arranca después de varios intentos
        it: Il motore si avvia solo dopo diversi tentativi
        nl: De motor start pas na meerdere pogingen

    possible_causes:
      - en: Choke or cold-start enrichment system not operating correctly
        ro: Șocul sau sistemul de îmbogățire la rece nu funcționează corect
        de: Kaltstarteinrichtung oder Choke arbeitet nicht korrekt
        fr: Le starter ou le système d'enrichissement à froid fonctionne mal
        es: El estárter o sistema de enriquecimiento en frío no funciona correctamente
        it: Lo starter o il sistema di arricchimento a freddo non funziona correttamente
        nl: De choke of koudstartverrijking werkt niet correct
      - en: Weak ignition spark
        ro: Scânteie de aprindere slabă
        de: Schwacher Zündfunke
        fr: Étincelle d'allumage faible
        es: Chispa de encendido débil
        it: Scintilla di accensione debole
        nl: Zwakke ontstekingsvonk
      - en: Fuel supply restriction
        ro: Restricție în alimentarea cu combustibil
        de: Einschränkung der Kraftstoffversorgung
        fr: Restriction de l'alimentation en carburant
        es: Restricción en el suministro de combustible
        it: Restrizione nell'alimentazione del carburante
        nl: Beperking van de brandstoftoevoer
      - en: Vacuum leak affecting mixture during cold operation
        ro: Pierdere de vacuum care afectează amestecul la rece
        de: Falschluft beeinflusst das Gemisch im Kaltbetrieb
        fr: Prise d'air perturbant le mélange à froid
        es: Entrada de aire que altera la mezcla en frío
        it: Aspirazione di aria falsa che altera la miscela a freddo
        nl: Vacuümlek dat het mengsel bij koude werking beïnvloedt

    diagnostic_steps:
      - en: Inspect the cold-start enrichment or choke mechanism
        ro: Inspectează mecanismul de îmbogățire la rece sau șocul
        de: Kaltstarteinrichtung bzw. Choke prüfen
        fr: Inspecter le système d'enrichissement à froid ou le starter
        es: Inspeccionar el sistema de enriquecimiento en frío o el estárter
        it: Ispezionare il sistema di arricchimento a freddo o lo starter
        nl: Controleer de koudstartverrijking of choke
      - en: Check ignition spark quality while the engine is cold
        ro: Verifică intensitatea scânteii când motorul este rece
        de: Zündfunkenqualität bei kaltem Motor prüfen
        fr: Vérifier la qualité de l'étincelle moteur froid
        es: Comprobar la calidad de la chispa con el motor frío
        it: Controllare la qualità della scintilla a motore freddo
        nl: Controleer de vonksterkte bij koude motor
      - en: Check fuel delivery and fuel filter condition
        ro: Verifică alimentarea cu combustibil și starea filtrului de combustibil
        de: Kraftstoffversorgung und Kraftstofffilter prüfen
        fr: Vérifier l'alimentation et le filtre à carburant
        es: Comprobar el suministro y el filtro de combustible
        it: Controllare l'alimentazione e il filtro del carburante
        nl: Controleer de brandstoftoevoer en het brandstoffilter

    keywords:

      ro: Mașina deviază stânga sau dreapta la frânare.
      de: Das Fahrzeug zieht beim Bremsen nach links oder rechts.
      fr: Le véhicule dévie à gauche ou à droite au freinage.
      es: El vehículo se desvía al frenar.
      it: Il veicolo devia durante la frenata.
      nl: Het voertuig wijkt tijdens het remmen naar links of rechts af.

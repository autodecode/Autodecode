      ro: Compară temperaturile frânelor de pe ambele părți după o frânare controlată.
      de: Bremstemperaturen beider Seiten nach kontrolliertem Bremsen vergleichen.
      fr: Comparer les températures des freins après un freinage contrôlé.
      es: Comparar las temperaturas de ambos lados después de una frenada controlada.
      it: Confrontare le temperature dei freni dopo una frenata controllata.
      nl: Vergelijk de remtemperaturen aan beide zijden na gecontroleerd remmen.
    - en: Inspect the brake mechanisms and hydraulic components on the affected axle.
      ro: Inspectează mecanismele și componentele hidraulice de pe puntea afectată.
      de: Bremsmechanismen und Hydraulik der betroffenen Achse prüfen.
      fr: Contrôler les mécanismes et éléments hydrauliques de l'essieu concerné.
      es: Inspeccionar los mecanismos y componentes hidráulicos del eje afectado.
      it: Controllare meccanismi e componenti idraulici dell'asse interessato.

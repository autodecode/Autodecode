      fr: Relais ou câblage de préchauffage défectueux.
      es: Relé o cableado de precalentamiento defectuoso.
      it: Relè o cablaggio delle candelette difettoso.
      nl: Defect relais of bedrading van het voorgloeisysteem.
  diagnostic_steps:

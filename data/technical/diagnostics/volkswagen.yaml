      - en: Ignition misfire
        ro: Rateu de aprindere
        de: Zündaussetzer
        fr: Raté d'allumage
        es: Fallo de encendido
        it: Mancata accensione
        nl: Ontstekingsmisfire
      - en: Unequal cylinder compression
        ro: Compresie neuniformă între cilindri
        de: Ungleichmäßige Zylinderkompression
        fr: Compression inégale entre les cylindres
        es: Compresión desigual entre cilindros
        it: Compressione non uniforme tra i cilindri
        nl: Ongelijke cilindercompressie

    diagnostic_steps:
      - en: Inspect intake hoses, gaskets and vacuum connections for leaks
        ro: Inspectează furtunurile de admisie, garniturile și conexiunile de vacuum pentru pierderi
        de: Ansaugschläuche, Dichtungen und Unterdruckanschlüsse auf Lecks prüfen
        fr: Inspecter les durites d'admission, joints et raccords de dépression
        es: Inspeccionar manguitos de admisión, juntas y conexiones de vacío
        it: Ispezionare manicotti di aspirazione, guarnizioni e raccordi del vuoto
        nl: Controleer inlaatslangen, pakkingen en vacuümaansluitingen op lekkage
      - en: Check spark plugs, ignition leads and distributor components
        ro: Verifică bujiile, cablurile de aprindere și componentele distribuitorului
        de: Zündkerzen, Zündleitungen und Verteilerbauteile prüfen
        fr: Vérifier les bougies, câbles d'allumage et éléments du distributeur
        es: Comprobar bujías, cables de encendido y componentes del distribuidor
        it: Controllare candele, cavi di accensione e componenti dello spinterogeno
        nl: Controleer bougies, ontstekingskabels en verdelercomponenten
      - en: Check idle mixture and idle-speed adjustment
        ro: Verifică reglajul amestecului și al turației de ralanti
        de: Leerlaufgemisch und Leerlaufdrehzahl prüfen

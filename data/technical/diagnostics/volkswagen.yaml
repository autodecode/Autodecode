      fr: Voile du disque ou surface de friction irrégulière.
      es: Alabeo del disco o superficie de fricción irregular.
      it: Eccentricità del disco o superficie d'attrito irregolare.
      nl: Slingering van de remschijf of ongelijk frictieoppervlak.
    - en: Worn suspension, wheel bearing or steering components.
      ro: Componente de suspensie, rulment sau direcție uzate.
      de: Verschlissene Fahrwerks-, Radlager- oder Lenkungsteile.
      fr: Éléments de suspension, roulement ou direction usés.
      es: Componentes de suspensión, rodamiento o dirección desgastados.
      it: Componenti sospensione, cuscinetto o sterzo usurati.
      nl: Versleten ophangings-, wiellager- of stuurdelen.

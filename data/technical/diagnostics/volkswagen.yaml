      ro: Verifică nivelul lichidului și inspectează sistemul pentru scurgeri.
      de: Kühlmittelstand prüfen und System auf Leckagen kontrollieren.
      fr: Vérifier le niveau et rechercher des fuites.
      es: Comprobar el nivel y buscar fugas.
      it: Controllare il livello e cercare perdite.

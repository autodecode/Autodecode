  possible_causes:
    - en: Main jet has been replaced with an incorrect size.
      ro: Jiclorul principal a fost înlocuit cu unul de dimensiune incorectă.
      de: Die Hauptdüse wurde durch eine falsche Größe ersetzt.
      fr: Le gicleur principal a été remplacé par une taille incorrecte.
      es: El chiclé principal ha sido sustituido por uno de tamaño incorrecto.
      it: Il getto principale è stato sostituito con una misura errata.
      nl: De hoofdsproeier is vervangen door een verkeerde maat.
    - en: Previous carburetor tuning or modification changed the required jet size.
      ro: Reglajele sau modificările anterioare ale carburatorului au schimbat dimensiunea necesară a jiclorului.
      de: Frühere Vergaserabstimmungen oder Änderungen haben die erforderliche Düsengröße verändert.
      fr: Des modifications ou réglages antérieurs ont changé la taille de gicleur nécessaire.
      es: Ajustes o modificaciones anteriores han cambiado el tamaño de chiclé necesario.
      it: Regolazioni o modifiche precedenti hanno cambiato la misura necessaria del getto.
      nl: Eerdere afstellingen of modificaties hebben de benodigde sproeiermaat veranderd.

  category: diagnostics
  system: cooling
  title:
    en: Cooling System Leak
    ro: Pierdere de lichid de răcire
    de: Leck im Kühlsystem
    fr: Fuite du circuit de refroidissement
    es: Fuga en el sistema de refrigeración
    it: Perdita nel sistema di raffreddamento
    nl: Lekkage in het koelsysteem
  symptoms:
    - en: Coolant level repeatedly decreases.
      ro: Nivelul lichidului de răcire scade repetat.
      de: Der Kühlmittelstand sinkt wiederholt.
      fr: Le niveau de liquide baisse régulièrement.
      es: El nivel de refrigerante disminuye repetidamente.
      it: Il livello del refrigerante diminuisce ripetutamente.
      nl: Het koelvloeistofniveau daalt steeds.
    - en: Coolant may be visible around hoses, radiator or engine components.
      ro: Lichidul poate fi vizibil în jurul furtunurilor, radiatorului sau motorului.
      de: Kühlmittel kann an Schläuchen, Kühler oder Motorteilen sichtbar sein.
      fr: Du liquide peut être visible autour des durites, du radiateur ou du moteur.
      es: Puede verse refrigerante en manguitos, radiador o motor.
      it: Il refrigerante può essere visibile su tubi, radiatore o motore.
      nl: Koelvloeistof kan zichtbaar zijn bij slangen, radiator of motoronderdelen.
  possible_causes:
    - en: Cracked hose, radiator, water pump seal or connection.
      ro: Furtun, radiator, etanșare pompă de apă sau conexiune fisurată.
      de: Gerissener Schlauch, Kühler, Wasserpumpendichtung oder Anschluss.
      fr: Durite, radiateur, joint de pompe à eau ou raccord fissuré.
      es: Manguito, radiador, junta de bomba o conexión dañada.
      it: Tubo, radiatore, tenuta della pompa o raccordo danneggiato.
      nl: Gescheurde slang, radiator, waterpompafdichting of aansluiting.
    - en: Corrosion or damaged sealing surfaces.
      ro: Coroziune sau suprafețe de etanșare deteriorate.
      de: Korrosion oder beschädigte Dichtflächen.
      fr: Corrosion ou surfaces d'étanchéité endommagées.
      es: Corrosión o superficies de sellado dañadas.
      it: Corrosione o superfici di tenuta danneggiate.
      nl: Corrosie of beschadigde afdichtingsvlakken.
  diagnostic_steps:
    - en: Inspect the complete cooling system for visible traces of coolant.
      ro: Inspectează întregul sistem pentru urme vizibile de lichid.
      de: Gesamtes Kühlsystem auf sichtbare Kühlmittelspuren prüfen.
      fr: Inspecter tout le circuit à la recherche de traces.
      es: Inspeccionar todo el sistema buscando rastros.
      it: Ispezionare l'intero circuito per tracce di liquido.
      nl: Inspecteer het volledige koelsysteem op zichtbare sporen.
    - en: Pressure-test the system when the leak is not immediately visible.
      ro: Testează sistemul sub presiune dacă scurgerea nu este vizibilă.
      de: Kühlsystem abdrücken, wenn die Leckage nicht sichtbar ist.
      fr: Mettre le circuit sous pression si la fuite n'est pas visible.
      es: Presurizar el sistema si la fuga no es visible.
      it: Pressurizzare il circuito se la perdita non è visibile.
      nl: Zet het systeem onder druk als de lekkage niet zichtbaar is.
  keywords:
    - coolant leak
    - cooling system
    - radiator leak
  related_dtcs: []
  difficulty: basic


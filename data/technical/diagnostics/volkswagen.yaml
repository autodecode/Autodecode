      nl: De koelvloeistofcirculatie kan na werkzaamheden aan het systeem onregelmatig zijn.
  possible_causes:
    - en: Cooling system was not correctly filled or bled.
      ro: Sistemul nu a fost umplut sau aerisit corect.
      de: Das Kühlsystem wurde nicht korrekt befüllt oder entlüftet.
      fr: Le circuit n'a pas été correctement rempli ou purgé.
      es: El sistema no se llenó o purgó correctamente.
      it: Il circuito non è stato riempito o spurgato correttamente.
      nl: Het koelsysteem is niet correct gevuld of ontlucht.
    - en: Coolant loss allowed air to enter the system.

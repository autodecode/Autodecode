      ro: Identifică jiclorul montat și compară-l cu specificația carburatorului exact.
      de: Eingebaute Hauptdüse identifizieren und mit der Spezifikation des genauen Vergasers vergleichen.
      fr: Identifier le gicleur monté et le comparer à la spécification du carburateur concerné.
      es: Identificar el chiclé instalado y compararlo con la especificación del carburador exacto.
      it: Identificare il getto montato e confrontarlo con la specifica del carburatore esatto.
      nl: Identificeer de gemonteerde hoofdsproeier en vergelijk deze met de specificatie van de exacte carburateur.

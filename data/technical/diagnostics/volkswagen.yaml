  title:
    en: Excessive Crankshaft Endplay
    ro: Joc axial excesiv al arborelui cotit
    de: Übermäßiges Axialspiel der Kurbelwelle
    fr: Jeu axial excessif du vilebrequin
    es: Juego axial excesivo del cigüeñal
    it: Gioco assiale eccessivo dell'albero motore
    nl: Overmatige axiale speling van de krukas
  symptoms:
    - en: Clutch engagement or disengagement may produce abnormal movement or noise.
      ro: Acționarea ambreiajului poate produce mișcare sau zgomot anormal.
      de: Beim Betätigen der Kupplung können ungewöhnliche Bewegungen oder Geräusche auftreten.
      fr: L'actionnement de l'embrayage peut provoquer un mouvement ou un bruit anormal.
      es: El accionamiento del embrague puede provocar movimientos o ruidos anormales.
      it: L'azionamento della frizione può provocare movimenti o rumori anomali.
      nl: Bij het bedienen van de koppeling kunnen abnormale bewegingen of geluiden optreden.
    - en: Engine may develop unstable idle or abnormal vibration.
      ro: Motorul poate prezenta ralanti instabil sau vibrații anormale.
      de: Der Motor kann einen instabilen Leerlauf oder ungewöhnliche Vibrationen entwickeln.
      fr: Le moteur peut présenter un ralenti instable ou des vibrations anormales.
      es: El motor puede presentar un ralentí inestable o vibraciones anormales.
      it: Il motore può presentare un minimo instabile o vibrazioni anomale.
      nl: De motor kan een onstabiel stationair toerental of abnormale trillingen vertonen.
  possible_causes:
    - en: Worn crankshaft thrust bearing surfaces.
      ro: Suprafețe de reazem axial ale arborelui cotit uzate.
      de: Verschlissene Axiallagerflächen der Kurbelwelle.
      fr: Surfaces de butée du vilebrequin usées.
      es: Superficies de apoyo axial del cigüeñal desgastadas.
      it: Superfici di spinta dell'albero motore usurate.
      nl: Versleten axiale lageroppervlakken van de krukas.
    - en: Excessive clutch loading or prolonged incorrect clutch adjustment.
      ro: Solicitare excesivă a lagărului axial prin ambreiaj sau reglaj incorect prelungit.
      de: Übermäßige Belastung durch die Kupplung oder dauerhaft falsche Kupplungseinstellung.
      fr: Charge excessive du palier axial ou mauvais réglage prolongé de l'embrayage.
      es: Carga excesiva del apoyo axial o ajuste incorrecto prolongado del embrague.
      it: Eccessivo carico sul supporto assiale o regolazione errata prolungata della frizione.
      nl: Overmatige belasting van het axiale lager of langdurige verkeerde koppelingafstelling.
  diagnostic_steps:
    - en: Measure crankshaft endplay with a dial indicator.
      ro: Măsoară jocul axial al arborelui cotit cu un comparator.
      de: Kurbelwellen-Axialspiel mit einer Messuhr messen.
      fr: Mesurer le jeu axial du vilebrequin avec un comparateur.
      es: Medir el juego axial del cigüeñal con un comparador.
      it: Misurare il gioco assiale dell'albero motore con un comparatore.
      nl: Meet de axiale speling van de krukas met een meetklok.
    - en: Compare the measurement with the specification for the exact engine.
      ro: Compară măsurătoarea cu specificația motorului respectiv.
      de: Messwert mit der Spezifikation des jeweiligen Motors vergleichen.
      fr: Comparer la mesure à la spécification du moteur concerné.
      es: Comparar la medición con la especificación del motor correspondiente.
      it: Confrontare la misura con la specifica del motore interessato.
      nl: Vergelijk de meting met de specificatie van de betreffende motor.

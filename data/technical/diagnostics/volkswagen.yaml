  category: diagnostics
  system: fuel
  title:
    en: Incorrect Injection Timing on a Mechanical Diesel
    ro: Avans incorect al injecției la un diesel mecanic
    de: Falscher Einspritzzeitpunkt bei einem mechanischen Diesel
    fr: Calage d'injection incorrect sur un diesel mécanique
    es: Reglaje incorrecto del avance de inyección en un diésel mecánico
    it: Fasatura errata dell'iniezione su un diesel meccanico
    nl: Verkeerd inspuittijdstip bij een mechanische diesel
  symptoms:
    - en: Difficult starting.
      ro: Pornire dificilă.
      de: Schwieriger Start.
      fr: Démarrage difficile.
      es: Arranque difícil.
      it: Avviamento difficoltoso.
      nl: Moeilijk starten.
    - en: Poor low-speed response.
      ro: Răspuns slab la turații joase.
      de: Schwache Reaktion bei niedrigen Drehzahlen.
      fr: Mauvaise réponse à bas régime.
      es: Mala respuesta a bajo régimen.
      it: Risposta debole ai bassi regimi.
      nl: Zwakke respons bij lage toerentallen.
    - en: Excessive smoke or combustion noise.
      ro: Fum excesiv sau zgomot anormal de combustie.
      de: Starke Rauchentwicklung oder hartes Verbrennungsgeräusch.
      fr: Fumée excessive ou bruit de combustion anormal.
      es: Humo excesivo o ruido anormal de combustión.
      it: Fumo eccessivo o rumore anomalo di combustione.
      nl: Overmatige rook of abnormaal verbrandingsgeluid.
  possible_causes:
    - en: Injection pump timing incorrectly adjusted.
      ro: Avansul pompei de injecție este reglat incorect.
      de: Einspritzpumpenzeitpunkt falsch eingestellt.
      fr: Calage de la pompe d'injection incorrect.
      es: Reglaje incorrecto de la bomba de inyección.
      it: Fasatura errata della pompa d'iniezione.
      nl: Verkeerd afgesteld inspuittijdstip van de pomp.
    - en: Timing belt or pump timing shifted.
      ro: Distribuția sau sincronizarea pompei s-a deplasat.
      de: Zahnriemen- oder Pumpensteuerung verstellt.
      fr: Décalage de la distribution ou de la pompe.
      es: Desfase de la distribución o de la bomba.
      it: Fasatura della distribuzione o della pompa spostata.
      nl: Versprongen distributie- of pomptiming.
  diagnostic_steps:
    - en: Verify mechanical engine timing.
      ro: Verifică sincronizarea mecanică a motorului.
      de: Mechanische Motorsteuerung prüfen.
      fr: Vérifier le calage mécanique du moteur.
      es: Comprobar la distribución mecánica del motor.
      it: Verificare la fasatura meccanica del motore.
      nl: Controleer de mechanische motortiming.
    - en: Verify injection pump timing according to the engine procedure.
      ro: Verifică avansul pompei de injecție conform procedurii motorului.
      de: Einspritzpumpenzeitpunkt gemäß Motorspezifikation prüfen.
      fr: Contrôler le calage de la pompe selon la procédure moteur.
      es: Comprobar el avance de la bomba según el procedimiento del motor.
      it: Controllare la fasatura della pompa secondo la procedura del motore.
      nl: Controleer de pomptiming volgens de motorprocedure.
  keywords:
    - injection timing
    - pump timing
    - diesel advance
    - avans injectie
  related_dtcs: []
  difficulty: advanced



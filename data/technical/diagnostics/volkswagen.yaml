      fr: Le démarrage s'améliore après avoir rétabli manuellement l'alimentation du carburateur.
      es: El arranque mejora después de restablecer manualmente el suministro al carburador.
      it: L'avviamento migliora dopo aver ripristinato manualmente l'alimentazione del carburatore.
      nl: Het starten verbetert nadat de brandstoftoevoer naar de carburateur handmatig is hersteld.
  possible_causes:

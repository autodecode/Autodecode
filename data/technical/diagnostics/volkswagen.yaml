    generations:
      - volkswagen_passat_b1
      - volkswagen_passat_b2
      - volkswagen_golf_mk1
      - volkswagen_golf_mk2
      - volkswagen_golf_mk3
      - volkswagen_jetta_mk1
      - volkswagen_jetta_mk2
      - volkswagen_santana_b2
      - volkswagen_polo_mk2
      - volkswagen_polo_mk3
      - volkswagen_caddy_9k
      - volkswagen_vento_mk3
    engines:
      - "15_d"
      - "16_d"
      - "16_td"
      - "19_d"
      - "19_td"
      - "14_d"
  category: diagnostics
  system: fuel
  title:
    en: Sticking Mechanical Diesel Injector
    ro: Injector diesel mecanic gripat
    de: Schwergängige Einspritzdüse bei einem mechanischen Diesel
    fr: Injecteur diesel mécanique grippé
    es: Inyector diésel mecánico agarrotado
    it: Iniettore diesel meccanico bloccato
    nl: Vastzittende mechanische dieselinjector
  symptoms:
    - en: Rough or uneven idle.
      ro: Relanti neregulat sau instabil.
      de: Unruhiger oder ungleichmäßiger Leerlauf.
      fr: Ralenti irrégulier ou instable.
      es: Ralentí irregular o inestable.
      it: Minimo irregolare o instabile.
      nl: Onrustig of ongelijk stationair draaien.
    - en: Misfire-like combustion noise.
      ro: Zgomot de combustie asemănător unei rateuri.
      de: Verbrennungsgeräusch ähnlich einem Fehlzünden.
      fr: Bruit de combustion ressemblant à un raté.
      es: Ruido de combustión parecido a un fallo.
      it: Rumore di combustione simile a una mancata accensione.
      nl: Verbrandingsgeluid dat op een misfire lijkt.
    - en: Increased smoke from the exhaust.
      ro: Fum crescut la evacuare.
      de: Erhöhte Rauchentwicklung.
      fr: Fumée accrue à l'échappement.
      es: Mayor cantidad de humo.
      it: Aumento del fumo allo scarico.
      nl: Meer rook uit de uitlaat.
  possible_causes:
    - en: Contaminated fuel.
      ro: Combustibil contaminat.
      de: Verunreinigter Kraftstoff.
      fr: Carburant contaminé.
      es: Combustible contaminado.
      it: Carburante contaminato.
      nl: Vervuilde brandstof.
    - en: Internal injector wear.
      ro: Uzură internă a injectorului.
      de: Interner Verschleiß der Einspritzdüse.
      fr: Usure interne de l'injecteur.
      es: Desgaste interno del inyector.
      it: Usura interna dell'iniettore.
      nl: Interne slijtage van de injector.
  diagnostic_steps:
    - en: Compare engine behavior with individual injector tests where applicable.
      ro: Compară comportamentul motorului prin testarea individuală a injectoarelor, unde este posibil.
      de: Motorverhalten durch Einzelprüfung der Einspritzdüsen vergleichen, sofern möglich.
      fr: Comparer le comportement du moteur par test individuel des injecteurs lorsque possible.
      es: Comparar el comportamiento mediante pruebas individuales cuando sea posible.
      it: Confrontare il comportamento tramite test individuali quando possibile.
      nl: Vergelijk het motorgedrag via individuele injectortests indien mogelijk.
    - en: Remove and test suspect injectors on a calibrated test bench.
      ro: Demontează și testează injectoarele suspecte pe un banc calibrat.
      de: Verdächtige Einspritzdüsen ausbauen und auf einem Prüfstand prüfen.
      fr: Déposer et tester les injecteurs suspects sur banc calibré.
      es: Desmontar y probar los inyectores sospechosos en banco calibrado.
      it: Smontare e testare gli iniettori sospetti su banco calibrato.
      nl: Verwijder verdachte injectoren en test ze op een gekalibreerde testbank.
  keywords:
    - sticking injector
    - diesel injector
    - injector fault
    - injector gripat
  related_dtcs: []
  difficulty: intermediate


- id: vw_mechanical_diesel_excessive_crankcase_pressure
  vehicle:
    manufacturer: volkswagen
    models:
      - volkswagen_passat
      - volkswagen_golf
      - volkswagen_jetta
      - volkswagen_santana
      - volkswagen_polo
      - volkswagen_caddy
      - volkswagen_vento
    generations:
      - volkswagen_passat_b1
      - volkswagen_passat_b2
      - volkswagen_golf_mk1
      - volkswagen_golf_mk2
      - volkswagen_golf_mk3
      - volkswagen_jetta_mk1
      - volkswagen_jetta_mk2
      - volkswagen_santana_b2
      - volkswagen_polo_mk2
      - volkswagen_polo_mk3
      - volkswagen_caddy_9k
      - volkswagen_vento_mk3
    engines:
      - "15_d"
      - "16_d"
      - "16_td"
      - "19_d"
      - "19_td"
      - "14_d"
  category: diagnostics
  system: engine
  title:
    en: Excessive Crankcase Pressure on a Mechanical Diesel
    ro: Presiune excesivă în carter la un diesel mecanic
    de: Überhöhter Kurbelgehäusedruck bei einem mechanischen Diesel
    fr: Pression excessive dans le carter d'un diesel mécanique
    es: Presión excesiva en el cárter de un diésel mecánico
    it: Pressione eccessiva nel basamento di un diesel meccanico
    nl: Overmatige carterdruk bij een mechanische diesel
  symptoms:
    - en: Strong blow-by from the crankcase ventilation system.
      ro: Blow-by puternic prin sistemul de ventilare al carterului.
      de: Starker Blow-by aus der Kurbelgehäuseentlüftung.
      fr: Blow-by important par le système de ventilation du carter.
      es: Blow-by elevado a través de la ventilación del cárter.
      it: Blow-by elevato attraverso la ventilazione del basamento.
      nl: Sterke blow-by via de carterventilatie.
    - en: Oil mist around the engine.
      ro: Vapori sau ceață de ulei în jurul motorului.
      de: Ölnebel im Motorbereich.
      fr: Brouillard d'huile autour du moteur.
      es: Niebla de aceite alrededor del motor.
      it: Nebbia d'olio intorno al motore.
      nl: Olienevel rond de motor.
    - en: Oil leaks from seals or gaskets.
      ro: Pierderi de ulei pe la simeringuri sau garnituri.
      de: Ölleckagen an Dichtungen oder Wellendichtringen.
      fr: Fuites d'huile au niveau des joints.
      es: Fugas de aceite por juntas o retenes.
      it: Perdite d'olio da guarnizioni o paraoli.
      nl: Olielekkage langs afdichtingen.
  possible_causes:
    - en: Excessive piston-ring blow-by.
      ro: Blow-by excesiv pe lângă segmenții de piston.
      de: Übermäßiger Blow-by an den Kolbenringen.
      fr: Blow-by excessif au niveau des segments.
      es: Blow-by excesivo por los segmentos.
      it: Blow-by eccessivo attraverso le fasce.
      nl: Overmatige blow-by langs de zuigerveren.
    - en: Worn cylinder bores.
      ro: Uzura cilindrilor.
      de: Verschlissene Zylinderlaufbahnen.
      fr: Usure des cylindres.
      es: Desgaste de los cilindros.
      it: Usura delle canne cilindro.
      nl: Versleten cilinderwanden.
  diagnostic_steps:
    - en: Inspect the crankcase ventilation system.
      ro: Inspectează sistemul de ventilare al carterului.
      de: Kurbelgehäuseentlüftung prüfen.
      fr: Contrôler la ventilation du carter.
      es: Revisar la ventilación del cárter.
      it: Controllare la ventilazione del basamento.
      nl: Controleer de carterventilatie.
    - en: Check for abnormal crankcase pressure.
      ro: Verifică dacă presiunea în carter este anormală.
      de: Kurbelgehäusedruck auf Auffälligkeiten prüfen.
      fr: Vérifier si la pression du carter est anormale.
      es: Comprobar si la presión del cárter es anormal.
      it: Verificare eventuale pressione anomala nel basamento.
      nl: Controleer op abnormale carterdruk.
    - en: Perform a compression test if excessive blow-by is confirmed.
      ro: Efectuează un test de compresie dacă blow-by-ul este excesiv.
      de: Bei starkem Blow-by einen Kompressionstest durchführen.
      fr: Effectuer un test de compression si le blow-by est important.
      es: Realizar una prueba de compresión si se confirma un blow-by elevado.
      it: Eseguire un test di compressione se il blow-by è eccessivo.
      nl: Voer een compressietest uit bij overmatige blow-by.
  keywords:
    - crankcase pressure
    - blow-by
    - piston rings
    - carter pressure
  related_dtcs: []
  difficulty: intermediate



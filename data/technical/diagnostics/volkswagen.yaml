  title:
    en: Mechanical Diesel Glow Plug or Preheating Fault
    ro: Defecțiune a bujiilor incandescente sau a preîncălzirii la diesel mecanic
    de: Fehler an Glühkerzen oder Vorglühsystem eines mechanischen Diesels
    fr: Défaut des bougies ou du système de préchauffage diesel mécanique
    es: Fallo de bujías o precalentamiento en diésel mecánico
    it: Guasto alle candelette o al preriscaldamento del diesel meccanico
    nl: Storing van gloeibougies of voorgloeisysteem bij mechanische diesel
  symptoms:
    - en: Difficult cold starting.
      ro: Pornire dificilă la rece.
      de: Schwieriger Kaltstart.
      fr: Démarrage difficile à froid.
      es: Arranque difícil en frío.
      it: Avviamento difficoltoso a freddo.
      nl: Moeilijk starten bij koude motor.
    - en: White or grey smoke immediately after starting.
      ro: Fum alb sau gri imediat după pornire.
      de: Weißer oder grauer Rauch unmittelbar nach dem Start.
      fr: Fumée blanche ou grise juste après le démarrage.
      es: Humo blanco o gris inmediatamente después del arranque.
      it: Fumo bianco o grigio subito dopo l'avviamento.
      nl: Witte of grijze rook direct na het starten.
  possible_causes:
    - en: One or more failed glow plugs.
      ro: Una sau mai multe bujii incandescente defecte.
      de: Eine oder mehrere defekte Glühkerzen.
      fr: Une ou plusieurs bougies de préchauffage défectueuses.
      es: Una o varias bujías de precalentamiento defectuosas.
      it: Una o più candelette difettose.
      nl: Een of meer defecte gloeibougies.
    - en: Faulty glow-plug relay or wiring.
      ro: Releu sau cablaj al bujiilor defect.

    - en: Unequal brake friction or contaminated friction material.
      ro: Frânare neuniformă sau material de fricțiune contaminat.
      de: Ungleichmäßige Bremswirkung oder verunreinigtes Reibmaterial.
      fr: Freinage inégal ou matériau de friction contaminé.
      es: Frenado desigual o material de fricción contaminado.
      it: Frenata irregolare o materiale d'attrito contaminato.
      nl: Ongelijke remwerking of vervuild frictiemateriaal.
  diagnostic_steps:

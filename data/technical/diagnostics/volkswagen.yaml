    category: diagnostics
    system: engine
    title:
      en: Engine cranks but does not start
      ro: Motorul învârte dar nu pornește
      de: Motor dreht durch, startet aber nicht
      fr: Le moteur entraîne mais ne démarre pas
      es: El motor gira pero no arranca
      it: Il motore gira ma non si avvia
      nl: De motor draait rond maar start niet

    symptoms:
      - en: Starter cranks the engine normally but the engine does not start
        ro: Demarorul învârte normal motorul dar acesta nu pornește
        de: Der Anlasser dreht den Motor normal durch, aber der Motor startet nicht
        fr: Le démarreur entraîne normalement le moteur mais celui-ci ne démarre pas
        es: El motor de arranque gira normalmente pero el motor no arranca
        it: Il motorino d'avviamento fa girare normalmente il motore ma il motore non si avvia
        nl: De startmotor draait de motor normaal rond maar de motor start niet
      - en: Engine may briefly fire and then stall
        ro: Motorul poate porni pentru scurt timp și apoi se poate opri
        de: Der Motor kann kurz anspringen und anschließend wieder ausgehen
        fr: Le moteur peut démarrer brièvement puis caler
        es: El motor puede arrancar brevemente y después calarse
        it: Il motore può avviarsi brevemente e poi spegnersi
        nl: De motor kan kort aanslaan en daarna weer afslaan

    possible_causes:
      - en: No ignition spark
        ro: Lipsă scânteie de aprindere
        de: Kein Zündfunke
        fr: Absence d'étincelle d'allumage
        es: Falta de chispa de encendido
        it: Assenza di scintilla di accensione
        nl: Geen ontstekingsvonk
      - en: Incorrect ignition timing
        ro: Avansul aprinderii este incorect
        de: Falscher Zündzeitpunkt
        fr: Calage de l'allumage incorrect
        es: Reglaje incorrecto del encendido
        it: Fasatura dell'accensione errata
        nl: Onjuist ontstekingstijdstip
      - en: Insufficient fuel delivery
        ro: Alimentare insuficientă cu combustibil
        de: Unzureichende Kraftstoffversorgung
        fr: Alimentation en carburant insuffisante
        es: Suministro insuficiente de combustible
        it: Alimentazione insufficiente di carburante
        nl: Onvoldoende brandstoftoevoer
      - en: Flooded engine or excessively rich mixture
        ro: Motor înecat sau amestec excesiv de bogat
        de: Abgesoffener Motor oder zu fettes Gemisch
        fr: Moteur noyé ou mélange trop riche
        es: Motor ahogado o mezcla demasiado rica
        it: Motore ingolfato o miscela troppo ricca
        nl: Verzopen motor of te rijk mengsel
      - en: Low compression
        ro: Compresie scăzută
        de: Zu niedrige Kompression
        fr: Compression insuffisante
        es: Compresión baja
        it: Compressione insufficiente
        nl: Te lage compressie

    diagnostic_steps:
      - en: Check for a strong ignition spark at the spark plugs
        ro: Verifică existența unei scântei puternice la bujii
        de: Zündfunken an den Zündkerzen auf ausreichende Stärke prüfen
        fr: Vérifier la présence d'une étincelle forte aux bougies
        es: Comprobar que exista una chispa fuerte en las bujías
        it: Controllare la presenza di una scintilla forte alle candele
        nl: Controleer op een sterke ontstekingsvonk bij de bougies
      - en: Check whether fuel reaches the carburetor or injection system
        ro: Verifică dacă combustibilul ajunge la carburator sau la sistemul de injecție
        de: Prüfen, ob Kraftstoff den Vergaser oder die Einspritzanlage erreicht
        fr: Vérifier si le carburant arrive au carburateur ou au système d'injection
        es: Comprobar si el combustible llega al carburador o al sistema de inyección
        it: Controllare se il carburante raggiunge il carburatore o il sistema di iniezione
        nl: Controleer of brandstof de carburateur of het injectiesysteem bereikt
      - en: Verify ignition timing and distributor position where applicable
        ro: Verifică avansul aprinderii și poziția distribuitorului, unde este cazul
        de: Zündzeitpunkt und Stellung des Verteilers prüfen, sofern vorhanden
        fr: Vérifier le calage de l'allumage et la position du distributeur si présent
        es: Comprobar el avance de encendido y la posición del distribuidor cuando corresponda
        it: Controllare la fasatura dell'accensione e la posizione dello spinterogeno, se presente
        nl: Controleer het ontstekingstijdstip en de positie van de verdeler indien aanwezig
      - en: Perform a compression test if ignition and fuel supply are present
        ro: Efectuează un test de compresie dacă aprinderea și alimentarea cu combustibil sunt prezente
        de: Kompression prüfen, wenn Zündung und Kraftstoffversorgung vorhanden sind
        fr: Effectuer un test de compression si l'allumage et l'alimentation sont présents
        es: Realizar una prueba de compresión si hay encendido y suministro de combustible
        it: Eseguire una prova di compressione se accensione e alimentazione sono presenti
        nl: Voer een compressietest uit als ontsteking en brandstoftoevoer aanwezig zijn

    keywords:
      - no start
      - hard starting
      - crank no start
      - engine will not start
      - classic petrol
      - motor nu porneste
      - moteur ne démarre pas
      - Motor startet nicht
      - motor no arranca

    related_dtcs: []
    difficulty: basic



      ro: Verifică dacă roata afectată se rotește liber cu frâna eliberată.
      de: Prüfen, ob sich das betroffene Rad bei gelöster Bremse frei dreht.
      fr: Vérifier que la roue tourne librement frein desserré.
      es: Comprobar si la rueda gira libremente con el freno liberado.
      it: Verificare che la ruota giri liberamente a freno rilasciato.
      nl: Controleer of het betreffende wiel vrij draait met de rem los.
    - en: Inspect the hydraulic and mechanical release mechanisms.
      ro: Inspectează mecanismele hidraulice și mecanice de eliberare.
      de: Hydraulische und mechanische Lösemechanismen prüfen.
      fr: Contrôler les mécanismes hydrauliques et mécaniques de desserrage.
      es: Inspeccionar los mecanismos hidráulicos y mecánicos de liberación.
      it: Controllare i meccanismi idraulici e meccanici di rilascio.
      nl: Controleer de hydraulische en mechanische vrijgave.

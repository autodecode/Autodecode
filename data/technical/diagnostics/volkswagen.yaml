    ro: Pulverizare slabă a injectoarelor la diesel mecanic
    de: Schlechtes Spritzbild der mechanischen Dieseleinspritzdüsen
    fr: Mauvais jet des injecteurs diesel mécaniques
    es: Patrón de pulverización deficiente de los inyectores diésel mecánicos
    it: Cattiva polverizzazione degli iniettori diesel meccanici
    nl: Slecht sproeibeeld van mechanische dieselinjectoren
  symptoms:
    - en: Rough idle or uneven combustion.
      ro: Relanti instabil sau ardere neuniformă.
      de: Unruhiger Leerlauf oder ungleichmäßige Verbrennung.
      fr: Ralenti irrégulier ou combustion inégale.
      es: Ralentí irregular o combustión desigual.
      it: Minimo irregolare o combustione non uniforme.
      nl: Onrustig stationair draaien of ongelijkmatige verbranding.
    - en: Difficult starting and increased smoke.
      ro: Pornire dificilă și fum crescut.
      de: Schweres Starten und erhöhte Rauchentwicklung.
      fr: Démarrage difficile et fumée accrue.
      es: Arranque difícil y aumento del humo.
      it: Avviamento difficile e aumento del fumo.
      nl: Moeilijk starten en meer rook.
  possible_causes:
    - en: Injector nozzle wear.
      ro: Uzura duzei injectorului.
      de: Verschleiß der Einspritzdüse.
      fr: Usure de la buse d'injecteur.
      es: Desgaste de la tobera del inyector.
      it: Usura dell'ugello dell'iniettore.
      nl: Slijtage van de verstuivertip.
    - en: Incorrect injector opening pressure.
      ro: Presiune de deschidere incorectă a injectorului.
      de: Falscher Öffnungsdruck der Einspritzdüse.
      fr: Pression d'ouverture incorrecte.
      es: Presión de apertura incorrecta.
      it: Pressione di apertura errata.
      nl: Verkeerde openingsdruk van de injector.
  diagnostic_steps:
    - en: Remove and test the injectors on a calibrated test bench.
      ro: Demontează și testează injectoarele pe un banc calibrat.
      de: Einspritzdüsen ausbauen und auf einem Prüfstand testen.
      fr: Déposer et tester les injecteurs sur banc calibré.
      es: Desmontar y probar los inyectores en banco calibrado.
      it: Smontare e testare gli iniettori su banco calibrato.
      nl: Verwijder en test de injectoren op een gekalibreerde testbank.
    - en: Check spray pattern and opening pressure.
      ro: Verifică forma jetului și presiunea de deschidere.
      de: Spritzbild und Öffnungsdruck prüfen.
      fr: Contrôler le jet et la pression d'ouverture.
      es: Comprobar el patrón de pulverización y la presión.
      it: Controllare il getto e la pressione di apertura.
      nl: Controleer sproeibeeld en openingsdruk.
  keywords:

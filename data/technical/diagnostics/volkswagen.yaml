      ro: Combustibilul se evaporă din camera carburatorului în timpul staționării prelungite.
      de: Kraftstoff verdunstet während längerer Standzeit aus der Schwimmerkammer.
      fr: Le carburant s'évapore de la cuve pendant une longue immobilisation.
      es: El combustible se evapora de la cuba durante una parada prolongada.
      it: Il carburante evapora dalla vaschetta durante una lunga sosta.
      nl: Brandstof verdampt tijdens langdurige stilstand uit de vlotterkamer.
    - en: Excessive engine-compartment temperature accelerates evaporation.
      ro: Temperatura excesivă din compartimentul motor accelerează evaporarea.
      de: Eine hohe Temperatur im Motorraum beschleunigt die Verdunstung.
      fr: Une température élevée dans le compartiment moteur accélère l'évaporation.
      es: Una temperatura elevada en el vano motor acelera la evaporación.
      it: Una temperatura elevata nel vano motore accelera l'evaporazione.
      nl: Een hoge temperatuur in de motorruimte versnelt de verdamping.
  diagnostic_steps:

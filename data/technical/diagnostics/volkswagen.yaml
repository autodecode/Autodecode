  symptoms:
    - en: Engine runs too lean or too rich under sustained load.
      ro: Motorul funcționează prea sărac sau prea bogat la sarcină susținută.
      de: Der Motor läuft unter längerer Last zu mager oder zu fett.
      fr: Le moteur fonctionne trop pauvre ou trop riche sous charge prolongée.
      es: El motor funciona demasiado pobre o rico bajo carga sostenida.
      it: Il motore funziona troppo magro o troppo ricco sotto carico prolungato.

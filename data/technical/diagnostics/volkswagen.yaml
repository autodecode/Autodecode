      de: Der Motor kann bei geringer Last normal laufen, aber bei steigendem Luftdurchsatz Leistung verlieren.
      fr: Le moteur peut fonctionner normalement à faible charge mais perdre de la puissance lorsque le débit d'air augmente.
      es: El motor puede funcionar normalmente con poca carga pero perder potencia cuando aumenta el flujo de aire.
      it: Il motore può funzionare normalmente a basso carico ma perdere potenza aumentando il flusso d'aria.
      nl: De motor kan bij lichte belasting normaal lopen maar vermogen verliezen wanneer de luchtstroom toeneemt.
  possible_causes:
    - en: Deposits inside the emulsion tube.
      ro: Depuneri în interiorul tubului de emulsie.
      de: Ablagerungen im Mischrohr.
      fr: Dépôts à l'intérieur du tube d'émulsion.
      es: Depósitos dentro del tubo de emulsión.
      it: Depositi all'interno del tubo emulsionatore.
      nl: Afzettingen in de emulsiebuis.

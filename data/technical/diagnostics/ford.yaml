        - lire les codes du module ABS
        - comparer les vitesses de roue en temps réel
        - contrôler le câblage et le connecteur
        - contrôler le roulement et l'encodeur magnétique
        - remplacer le composant défectueux et effacer les défauts
      es:
        - leer los códigos del módulo ABS
        - comparar las velocidades de rueda en tiempo real
        - revisar el cableado y el conector
        - revisar el rodamiento y el codificador magnético
        - sustituir el componente defectuoso y borrar los códigos

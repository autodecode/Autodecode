<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBD Decoder — AutoDecode</title>

<meta
    name="description"
    content="Decode OBD-II diagnostic trouble codes with AutoDecode."
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d10;
    color: #f2f4f7;
    min-height: 100vh;
}

header {
    height: 72px;
    border-bottom: 1px solid #20242a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #4da3ff;
}

header a {
    color: #9da5b0;
    text-decoration: none;
    font-size: 14px;
}

header a:hover {
    color: white;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 60px 20px 90px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 35px;
}

input {
    flex: 1;
    height: 60px;
    background: #14181d;
    border: 1px solid #303842;
    border-radius: 10px;
    color: white;
    padding: 0 18px;
    font-size: 18px;
    outline: none;
}

input:focus {
    border-color: #4da3ff;
}

button {
    border: none;
    background: #4da3ff;
    padding: 0 28px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #78baff;
}

.result-header {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 30px;
    margin-bottom: 15px;
}

.code {
    color: #4da3ff;
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 12px;
}

.description {
    color: #d1d7de;
    font-size: 20px;
    line-height: 1.55;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}

.badge,
.severity {
    background: #1b222a;
    border: 1px solid #303842;
    color: #aeb7c2;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.severity {
    font-weight: bold;
    text-transform: uppercase;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.info-card {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 25px;
}

.info-card.full {
    grid-column: 1 / -1;
}

.info-card h3 {
    font-size: 15px;
    margin-bottom: 15px;
    color: #ffffff;
}

.info-card p {
    color: #9da7b2;
    font-size: 14px;
    line-height: 1.7;
}

.info-card ul {
    padding-left: 20px;
    color: #9da7b2;
}

.info-card li {
    margin-bottom: 9px;
    font-size: 14px;
    line-height: 1.5;
}

.error {
    text-align: center;
    color: #8b949e;
    padding: 40px;
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
}

.error h2 {
    color: #f2f4f7;
    margin-bottom: 10px;
}

.loading {
    text-align: center;
    color: #8b949e;
    padding: 40px;
}

@media(max-width:650px) {

    .container {
        padding-top: 40px;
    }

    .search {
        flex-direction: column;
    }

    button {
        height: 52px;
    }

    .code {
        font-size: 38px;
    }

    .description {
        font-size: 17px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

    .info-card.full {
        grid-column: auto;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a href="index.html">
        ← Home
    </a>

</header>


<div class="container">


    <div class="search">

        <input
            id="codeInput"
            type="text"
            placeholder="Enter OBD-II code (e.g. P0420)"
            autocomplete="off"
        >

        <button id="decodeButton">
            Decode
        </button>

    </div>


    <div id="result">

        <div class="loading">
            Loading OBD database...
        </div>

    </div>


</div>


<script>

/* =========================================================
   DATABASE
========================================================= */

let codesDatabase = null;

let diagnosticDatabase = null;

let databaseReady = false;


/* =========================================================
   LOAD CODES.JSON
========================================================= */

async function loadCodes() {

    try {

        const response =
            await fetch(
                "./Database/Codes.json"
            );


        if (!response.ok) {

            console.warn(
                "Codes.json could not be loaded:",
                response.status
            );

            return null;

        }


        return await response.json();

    }

    catch(error) {

        console.warn(
            "Codes.json error:",
            error
        );

        return null;

    }

}


/* =========================================================
   LOAD DIAGNOSTIC.JSON
========================================================= */

async function loadDiagnostic() {

    try {

        const response =
            await fetch(
                "./Database/Diagnostic.json"
            );


        if (!response.ok) {

            throw new Error(
                "Diagnostic.json HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            typeof data !== "object" ||
            Array.isArray(data)
        ) {

            throw new Error(
                "Diagnostic.json has an invalid structure."
            );

        }


        return data;

    }

    catch(error) {

        console.error(
            "Diagnostic.json ERROR:",
            error
        );

        throw error;

    }

}


/* =========================================================
   LOAD DATABASES
========================================================= */

async function loadDatabase() {

    const result =
        document.getElementById(
            "result"
        );


    /*
     * Diagnostic.json is the important database.
     */

    try {

        diagnosticDatabase =
            await loadDiagnostic();


        /*
         * Codes.json is optional.
         * It supplies descriptions.
         */

        codesDatabase =
            await loadCodes();


        databaseReady = true;


        console.log(
            "Diagnostic database loaded."
        );


        console.log(
            "Number of diagnostic codes:",
            Object.keys(
                diagnosticDatabase
            ).length
        );


        console.log(
            "P0001:",
            diagnosticDatabase["P0001"]
        );


        result.innerHTML = `

            <div class="loading">

                OBD database loaded.
                Enter a code above.

            </div>

        `;


        /*
         * Read code from URL WITHOUT URLSearchParams.
         *
         * This keeps the page extremely simple.
         */

        const query =
            window.location.search;


        if (
            query &&
            query.indexOf("?") === 0
        ) {

            const parts =
                query
                    .substring(1)
                    .split("&");


            for (
                let i = 0;
                i < parts.length;
                i++
            ) {

                const pair =
                    parts[i].split("=");


                if (
                    pair[0] === "code"
                ) {

                    const urlCode =
                        decodeURIComponent(
                            pair
                                .slice(1)
                                .join("=")
                        );


                    document
                        .getElementById(
                            "codeInput"
                        )
                        .value =
                        urlCode;


                    decodeCode();


                    break;

                }

            }

        }

    }

    catch(error) {

        console.error(
            "DATABASE LOAD FAILED:",
            error
        );


        result.innerHTML = `

            <div class="error">

                <h2>
                    Database unavailable
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =========================================================
   NORMALIZE CODE
========================================================= */

function normalizeCode(value) {

    if (!value) {

        return "";

    }


    let code =
        String(value)
            .trim()
            .toUpperCase();


    /*
     * Remove spaces
     */

    code =
        code.replace(
            /\s+/g,
            ""
        );


    /*
     * Remove hyphens
     */

    code =
        code.replace(
            /-/g,
            ""
        );


    /*
     * P0001
     */

    if (
        /^[PBCU][0-9]{4}$/.test(
            code
        )
    ) {

        return code;

    }


    /*
     * P001 → P0001
     */

    if (
        /^[PBCU][0-9]{1,3}$/.test(
            code
        )
    ) {

        return (
            code.charAt(0) +
            code
                .substring(1)
                .padStart(
                    4,
                    "0"
                )
        );

    }


    /*
     * 0001 → P0001
     */

    if (
        /^[0-9]{1,4}$/.test(
            code
        )
    ) {

        return (
            "P" +
            code.padStart(
                4,
                "0"
            )
        );

    }


    return code;

}


/* =========================================================
   FIND DIAGNOSTIC
========================================================= */

function getDiagnosticData(code) {

    if (
        !diagnosticDatabase
    ) {

        return null;

    }


    /*
     * Direct lookup
     */

    if (
        Object.prototype.hasOwnProperty.call(
            diagnosticDatabase,
            code
        )
    ) {

        return diagnosticDatabase[code];

    }


    /*
     * Case-insensitive fallback
     */

    const normalized =
        normalizeCode(code);


    const keys =
        Object.keys(
            diagnosticDatabase
        );


    for (
        let i = 0;
        i < keys.length;
        i++
    ) {

        if (
            normalizeCode(
                keys[i]
            ) === normalized
        ) {

            return diagnosticDatabase[
                keys[i]
            ];

        }

    }


    return null;

}


/* =========================================================
   FIND DESCRIPTION
========================================================= */

function getDescription(code) {

    if (
        !codesDatabase
    ) {

        return "Diagnostic trouble code";

    }


    const normalized =
        normalizeCode(code);


    /*
     * Array database
     */

    if (
        Array.isArray(
            codesDatabase
        )
    ) {

        for (
            let i = 0;
            i < codesDatabase.length;
            i++
        ) {

            const item =
                codesDatabase[i];


            if (
                !item ||
                typeof item !== "object"
            ) {

                continue;

            }


            const itemCode =
                item.Code ||
                item.code ||
                item.DTC ||
                item.dtc;


            if (
                normalizeCode(
                    itemCode
                ) === normalized
            ) {

                return (
                    item.Description ||
                    item.description ||
                    item.DescriptionText ||
                    item.name ||
                    "Diagnostic trouble code"
                );

            }

        }

    }


    /*
     * Object database
     */

    if (
        typeof codesDatabase === "object"
    ) {

        const keys =
            Object.keys(
                codesDatabase
            );


        for (
            let i = 0;
            i < keys.length;
            i++
        ) {

            if (
                normalizeCode(
                    keys[i]
                ) === normalized
            ) {

                const item =
                    codesDatabase[
                        keys[i]
                    ];


                if (
                    typeof item === "string"
                ) {

                    return item;

                }


                if (
                    item &&
                    typeof item === "object"
                ) {

                    return (
                        item.Description ||
                        item.description ||
                        item.name ||
                        "Diagnostic trouble code"
                    );

                }

            }

        }

    }


    return "Diagnostic trouble code";

}


/* =========================================================
   SYSTEM
========================================================= */

function getSystem(code) {

    const prefix =
        code.charAt(0);


    if (
        prefix === "P"
    ) {

        return "Powertrain";

    }


    if (
        prefix === "B"
    ) {

        return "Body / Comfort / Safety";

    }


    if (
        prefix === "C"
    ) {

        return "Chassis / ABS / Steering";

    }


    if (
        prefix === "U"
    ) {

        return "Network / Communication";

    }


    return "Vehicle Diagnostic System";

}


/* =========================================================
   GENERIC FALLBACK
========================================================= */

function getGenericInfo(code) {

    return {

        system:
            getSystem(code),

        severity:
            "Medium",

        symptoms: [

            "Check Engine or warning indicator may be illuminated",

            "Vehicle symptoms depend on the affected system",

            "Performance or fuel economy may be affected"

        ],

        causes: [

            "Sensor or actuator fault",

            "Damaged wiring or connector",

            "Electrical supply problem",

            "Mechanical problem",

            "Underlying fault in a related system"

        ],

        checks: [

            "Read all stored and pending fault codes",

            "Inspect related wiring and connectors",

            "Check relevant live data",

            "Check electrical power and grounds",

            "Verify the fault before replacing components"

        ],

        repairs: [

            "Repair or replace the faulty component after confirmation",

            "Repair damaged wiring or connectors",

            "Correct any underlying mechanical or electrical fault"

        ],

        tip:
            "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone."

    };

}


/* =========================================================
   ARRAY HELPER
========================================================= */

function toArray(value) {

    if (
        Array.isArray(value)
    ) {

        return value.map(
            item => String(item)
        );

    }


    if (
        typeof value === "string" &&
        value.trim()
    ) {

        return [
            value
        ];

    }


    return [];

}


/* =========================================================
   DECODE
========================================================= */

function decodeCode() {

    const input =
        document.getElementById(
            "codeInput"
        );


    const result =
        document.getElementById(
            "result"
        );


    const raw =
        input.value.trim();


    if (!raw) {

        result.innerHTML = `

            <div class="error">

                <h2>
                    Enter an OBD-II code
                </h2>

                <p>
                    Example: P0420
                </p>

            </div>

        `;

        return;

    }


    if (!databaseReady) {

        result.innerHTML = `

            <div class="loading">

                Loading diagnostic database...

            </div>

        `;

        return;

    }


    /*
     * Normalize input
     */

    const code =
        normalizeCode(raw);


    input.value =
        code;


    /*
     * -----------------------------------------
     * GET SPECIFIC DIAGNOSTIC DATA
     * -----------------------------------------
     */

    const diagnostic =
        getDiagnosticData(
            code
        );


    /*
     * -----------------------------------------
     * GET DESCRIPTION
     * -----------------------------------------
     */

    const description =
        getDescription(
            code
        );


    let info;


    /*
     * =====================================================
     *
     * THIS IS THE IMPORTANT PART.
     *
     * If Diagnostic.json contains the code,
     * its data is used directly.
     *
     * =====================================================
     */

    if (
        diagnostic
    ) {

        console.log(
            "SPECIFIC DATA FOUND FOR:",
            code
        );


        info = {

            system:
                diagnostic.system ||
                getSystem(code),

            severity:
                diagnostic.severity ||
                "Medium",

            symptoms:
                toArray(
                    diagnostic.symptoms
                ),

            causes:
                toArray(
                    diagnostic.causes
                ),

            checks:
                toArray(
                    diagnostic.diagnostic
                ),

            repairs:
                toArray(
                    diagnostic.repairs
                ),

            tip:
                diagnostic.tip ||
                "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone."

        };

    }


    /*
     * Generic fallback ONLY when
     * Diagnostic.json has no such code.
     */

    else {

        console.log(
            "NO SPECIFIC DATA FOR:",
            code
        );


        info =
            getGenericInfo(
                code
            );

    }


    /*
     * -----------------------------------------
     * BUILD HTML
     * -----------------------------------------
     */

    const symptomsHTML =
        info.symptoms
            .map(
                item =>
                    "<li>" +
                    escapeHTML(item) +
                    "</li>"
            )
            .join("");


    const causesHTML =
        info.causes
            .map(
                item =>
                    "<li>" +
                    escapeHTML(item) +
                    "</li>"
            )
            .join("");


    const checksHTML =
        info.checks
            .map(
                item =>
                    "<li>" +
                    escapeHTML(item) +
                    "</li>"
            )
            .join("");


    const repairsHTML =
        info.repairs
            .map(
                item =>
                    "<li>" +
                    escapeHTML(item) +
                    "</li>"
            )
            .join("");


    /*
     * -----------------------------------------
     * DISPLAY
     * -----------------------------------------
     */

    result.innerHTML = `

        <div class="result-header">

            <div class="code">

                ${escapeHTML(code)}

            </div>

            <div class="description">

                ${escapeHTML(description)}

            </div>


            <div class="badges">

                <div class="badge">

                    ${escapeHTML(
                        info.system
                    )}

                </div>


                <div class="severity">

                    Severity:
                    ${escapeHTML(
                        info.severity
                    )}

                </div>

            </div>

        </div>


        <div class="info-grid">


            <div class="info-card">

                <h3>
                    ⚠️ Common Symptoms
                </h3>

                <ul>

                    ${symptomsHTML}

                </ul>

            </div>


            <div class="info-card">

                <h3>
                    🔍 Possible Causes
                </h3>

                <ul>

                    ${causesHTML}

                </ul>

            </div>


            <div class="info-card">

                <h3>
                    🛠️ Recommended Checks
                </h3>

                <ul>

                    ${checksHTML}

                </ul>

            </div>


            <div class="info-card">

                <h3>
                    🔧 Recommended Repairs
                </h3>

                <ul>

                    ${repairsHTML}

                </ul>

            </div>


            <div class="info-card full">

                <h3>
                    💡 Diagnostic Tip
                </h3>

                <p>

                    ${escapeHTML(
                        info.tip
                    )}

                </p>

            </div>


        </div>

    `;

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   BUTTON
========================================================= */

document
    .getElementById(
        "decodeButton"
    )
    .addEventListener(
        "click",
        decodeCode
    );


/* =========================================================
   ENTER
========================================================= */

document
    .getElementById(
        "codeInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                decodeCode();

            }

        }
    );


/* =========================================================
   START
========================================================= */

loadDatabase();

</script>

</body>

</html>

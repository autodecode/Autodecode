<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBD Decoder — AutoDecode</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0d10;
    color: #f2f4f7;
}

header {
    height: 72px;
    border-bottom: 1px solid #20242a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #4da3ff;
}

header a {
    color: #9da5b0;
    text-decoration: none;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 60px 20px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

input {
    flex: 1;
    height: 60px;
    background: #14181d;
    border: 1px solid #303842;
    border-radius: 10px;
    color: white;
    padding: 0 18px;
    font-size: 18px;
    outline: none;
}

button {
    background: #4da3ff;
    border: 0;
    border-radius: 10px;
    padding: 0 28px;
    font-weight: bold;
    cursor: pointer;
}

.result-header,
.card {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 15px;
}

.code {
    color: #4da3ff;
    font-size: 46px;
    font-weight: bold;
}

.description {
    font-size: 20px;
    color: #d1d7de;
    margin-top: 10px;
}

.badges {
    margin-top: 15px;
}

.badge {
    display: inline-block;
    background: #1b222a;
    border: 1px solid #303842;
    border-radius: 20px;
    padding: 7px 12px;
    margin-right: 5px;
    font-size: 12px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card h3 {
    margin-bottom: 15px;
}

.card ul {
    padding-left: 20px;
}

.card li {
    color: #9da7b2;
    margin-bottom: 8px;
    line-height: 1.5;
}

.card p {
    color: #9da7b2;
    line-height: 1.6;
}

.full {
    grid-column: 1 / -1;
}

.error,
.loading {
    text-align: center;
    padding: 40px;
    background: #12161b;
    border-radius: 14px;
}

@media(max-width:650px) {

    .search {
        flex-direction: column;
    }

    button {
        height: 52px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a href="index.html">
        ← Home
    </a>

</header>


<div class="container">


    <div class="search">

        <input
            id="codeInput"
            placeholder="Enter OBD-II code (e.g. P0420)"
            autocomplete="off"
        >

        <button onclick="decode()">
            Decode
        </button>

    </div>


    <div id="result">

        <div class="loading">
            Loading database...
        </div>

    </div>


</div>


<script>

/* =========================================
   DATABASE
========================================= */

let codes = null;
let diagnostic = null;


/* =========================================
   LOAD DATABASE
========================================= */

Promise.all([

    fetch("./Database/Codes.json")
        .then(r => r.json()),

    fetch("./Database/Diagnostic.json")
        .then(r => r.json())

])

.then(data => {

    codes = data[0];
    diagnostic = data[1];

    console.log("Codes loaded:", codes);
    console.log("Diagnostic loaded:", diagnostic);
    console.log("P0001:", diagnostic["P0001"]);

    document.getElementById("result").innerHTML = `
        <div class="loading">
            OBD database loaded. Enter a code above.
        </div>
    `;

    /*
     * If index.html sent a code:
     *
     * obd.html?code=P0001
     */

    let match =
        window.location.search.match(
            /[?&]code=([^&]+)/
        );

    if (match) {

        document.getElementById("codeInput").value =
            match[1];

        decode();

    }

})

.catch(error => {

    console.error(error);

    document.getElementById("result").innerHTML = `
        <div class="error">

            <h2>Database unavailable</h2>

            <p>
                ${error.message}
            </p>

        </div>
    `;

});


/* =========================================
   NORMALIZE CODE
========================================= */

function normalize(value) {

    let code =
        value
            .trim()
            .toUpperCase()
            .replace(/[\s-]/g, "");


    /*
     * P0001
     */

    if (/^[PBCU]\d{4}$/.test(code))
        return code;


    /*
     * P1 / P01 / P001 / P0001
     */

    if (/^[PBCU]\d{1,4}$/.test(code)) {

        return (
            code[0] +
            code.substring(1).padStart(4, "0")
        );

    }


    /*
     * 1 / 01 / 001 / 0001
     *
     * Assumed P-code
     */

    if (/^\d{1,4}$/.test(code)) {

        return (
            "P" +
            code.padStart(4, "0")
        );

    }


    return code;

}


/* =========================================
   FIND DIAGNOSTIC DATA
========================================= */

function findDiagnostic(code) {

    if (!diagnostic)
        return null;


    /*
     * Exact match
     */

    if (diagnostic[code])
        return diagnostic[code];


    /*
     * Case-insensitive fallback
     */

    let key =
        Object.keys(diagnostic).find(
            k =>
                normalize(k) === code
        );


    return key
        ? diagnostic[key]
        : null;

}


/* =========================================
   FIND DESCRIPTION
========================================= */

function findDescription(code) {

    if (!codes)
        return "Diagnostic trouble code";


    /*
     * Codes.json is an array
     */

    if (Array.isArray(codes)) {

        let item =
            codes.find(x =>
                x.Code &&
                normalize(x.Code) === code
            );


        if (item)
            return item.Description || "Diagnostic trouble code";

    }


    /*
     * Codes.json is an object
     */

    if (typeof codes === "object") {

        let key =
            Object.keys(codes).find(
                k =>
                    normalize(k) === code
            );


        if (key) {

            let item = codes[key];

            if (typeof item === "string")
                return item;

            if (item.Description)
                return item.Description;

        }

    }


    return "Diagnostic trouble code";

}


/* =========================================
   DECODE
========================================= */

function decode() {

    let raw =
        document
            .getElementById("codeInput")
            .value;


    let code =
        normalize(raw);


    if (!code) {

        return;

    }


    document
        .getElementById("codeInput")
        .value = code;


    /*
     * IMPORTANT:
     *
     * Diagnostic.json has priority.
     */

    let data =
        findDiagnostic(code);


    /*
     * No specific data
     */

    if (!data) {

        document.getElementById("result").innerHTML = `

            <div class="error">

                <h2>${code}</h2>

                <p>
                    This code is not yet available
                    in Diagnostic.json.
                </p>

            </div>

        `;

        return;

    }


    let description =
        findDescription(code);


    let symptoms =
        data.symptoms || [];


    let causes =
        data.causes || [];


    let checks =
        data.diagnostic || [];


    let repairs =
        data.repairs || [];


    let severity =
        data.severity || "Medium";


    let tip =
        data.tip ||
        "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone.";


    document.getElementById("result").innerHTML = `

        <div class="result-header">

            <div class="code">
                ${escapeHTML(code)}
            </div>

            <div class="description">
                ${escapeHTML(description)}
            </div>

            <div class="badges">

                <span class="badge">
                    Severity: ${escapeHTML(severity)}
                </span>

            </div>

        </div>


        <div class="grid">


            <div class="card">

                <h3>
                    ⚠️ Common Symptoms
                </h3>

                <ul>

                    ${list(symptoms)}

                </ul>

            </div>


            <div class="card">

                <h3>
                    🔍 Possible Causes
                </h3>

                <ul>

                    ${list(causes)}

                </ul>

            </div>


            <div class="card">

                <h3>
                    🛠️ Recommended Checks
                </h3>

                <ul>

                    ${list(checks)}

                </ul>

            </div>


            <div class="card">

                <h3>
                    🔧 Recommended Repairs
                </h3>

                <ul>

                    ${list(repairs)}

                </ul>

            </div>


            <div class="card full">

                <h3>
                    💡 Diagnostic Tip
                </h3>

                <p>
                    ${escapeHTML(tip)}
                </p>

            </div>


        </div>

    `;

}


/* =========================================
   LIST
========================================= */

function list(items) {

    if (!Array.isArray(items))
        items = [items];


    return items
        .map(
            item =>
                `<li>${escapeHTML(item)}</li>`
        )
        .join("");

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================
   ENTER
========================================= */

document
    .getElementById("codeInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter")
                decode();

        }
    );

</script>

</body>

</html>

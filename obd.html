<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBD Decoder — AutoDecode</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d10;
    color: #f2f4f7;
    min-height: 100vh;
}

header {
    height: 72px;
    border-bottom: 1px solid #20242a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.logo span {
    color: #4da3ff;
}

header a {
    color: #9da5b0;
    text-decoration: none;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 65px 20px 90px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
}

input {
    flex: 1;
    height: 60px;
    background: #14181d;
    border: 1px solid #303842;
    border-radius: 10px;
    color: white;
    padding: 0 18px;
    font-size: 18px;
    outline: none;
}

input:focus {
    border-color: #4da3ff;
}

button {
    border: none;
    background: #4da3ff;
    padding: 0 28px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #78baff;
}

.result {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 12px;
    padding: 30px;
}

.code {
    color: #4da3ff;
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 15px;
}

.description {
    color: #c4cbd3;
    font-size: 20px;
    line-height: 1.6;
}

.error {
    text-align: center;
    color: #8b949e;
    padding: 30px;
}

.loading {
    text-align: center;
    color: #8b949e;
    padding: 30px;
}

@media(max-width:600px) {
    .search {
        flex-direction: column;
    }

    button {
        height: 50px;
    }

    .code {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a href="index.html">← Home</a>

</header>

<div class="container">

    <div class="search">

        <input
            id="codeInput"
            type="text"
            placeholder="Enter OBD-II code (e.g. P0420)"
            autocomplete="off"
        >

        <button onclick="decodeCode()">
            Decode
        </button>

    </div>

    <div id="result">

        <div class="loading">
            Loading OBD database...
        </div>

    </div>

</div>

<script>

let obdDatabase = [];


/*
Load our local JSON database
*/

async function loadDatabase() {

    try {

        const response =
            await fetch("database/codes.json");

        if (!response.ok) {
            throw new Error("Database not found");
        }

        obdDatabase =
            await response.json();

        document.getElementById("result").innerHTML = `
            <div class="loading">
                OBD database loaded successfully.
                Enter a code above.
            </div>
        `;

    } catch (error) {

        console.error(error);

        document.getElementById("result").innerHTML = `
            <div class="error">
                <h2>Database unavailable</h2>
                <p>
                    Could not load database/codes.json
                </p>
            </div>
        `;
    }
}


/*
Decode OBD code
*/

function decodeCode() {

    const input =
        document
        .getElementById("codeInput")
        .value
        .trim()
        .toUpperCase();

    const result =
        document.getElementById("result");


    if (!input) {

        result.innerHTML = `
            <div class="error">
                Enter an OBD-II code.
            </div>
        `;

        return;
    }


    const found =
        obdDatabase.find(item =>
            item.Code &&
            item.Code.toUpperCase() === input
        );


    if (!found) {

        result.innerHTML = `
            <div class="error">

                <h2>${input}</h2>

                <p>
                    Code not found in the database.
                </p>

            </div>
        `;

        return;
    }


    result.innerHTML = `

        <div class="result">

            <div class="code">
                ${found.Code}
            </div>

            <div class="description">
                ${found.Description}
            </div>

        </div>

    `;
}


/*
Enter key
*/

document
.getElementById("codeInput")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        decodeCode();
    }

});


loadDatabase();

</script>

</body>
</html>

<header>

</header>


<div class="container">

<script>


/* ==================================================
   DATABASE VARIABLES
================================================== */

let obdDatabase = [];

let diagnosticDatabase = {};

let databaseReady = false;



/* ==================================================
   LOAD DATABASES
================================================== */

async function loadDatabase() {

    const result =
        document.getElementById("result");


    /*
     * Codes.json
     */

    try {

        const response =
            await fetch(
                "Database/Codes.json"
            );


        if (response.ok) {

            obdDatabase =
                await response.json();

        } else {

            console.warn(
                "Codes.json HTTP error:",
                response.status
            );

            obdDatabase = [];

        }

    } catch(error) {

        console.warn(
            "Codes.json could not be loaded:",
            error
        );

        obdDatabase = [];

    }


    /*
     * Diagnostic.json
     *
     * IMPORTANT:
     * Capital D
     */

    try {

        const diagnosticResponse =
            await fetch(
                "Database/Diagnostic.json"
            );


        if (diagnosticResponse.ok) {

            diagnosticDatabase =
                await diagnosticResponse.json();


            console.log(
                "Diagnostic.json loaded:",
                Object.keys(diagnosticDatabase).length,
                "entries"
            );

        } else {

            console.warn(
                "Diagnostic.json HTTP error:",
                diagnosticResponse.status
            );

            diagnosticDatabase = {};

        }

    } catch(error) {

        console.warn(
            "Diagnostic.json could not be loaded:",
            error
        );

        diagnosticDatabase = {};

    }


    /*
     * Database ready
     */

    databaseReady = true;


    console.log(
        "Codes.json loaded:",
        Array.isArray(obdDatabase)
            ? obdDatabase.length
            : 0,
        "entries"
    );


    /*
     * Read code from URL
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlCode =
        params.get("code");


    if (urlCode) {

        document
            .getElementById("codeInput")
            .value =
            urlCode;


        decodeCode();

    } else {

        result.innerHTML = `

            <div class="loading">

                OBD database loaded.
                Enter a code above.

            </div>

        `;

    }

}



/* ==================================================
   FIND CODE IN CODES.JSON
================================================== */

function findCodeInMainDatabase(code) {

    if (!Array.isArray(obdDatabase)) {

        return null;

    }


    const wanted =
        String(code)
            .trim()
            .toUpperCase();


    return obdDatabase.find(

        item => {

            if (
                !item ||
                !item.Code
            ) {

                return false;

            }


            return (

                String(item.Code)
                    .trim()
                    .toUpperCase() === wanted

            );

        }

    ) || null;

}



/* ==================================================
   FIND CODE IN DIAGNOSTIC.JSON
================================================== */

function findCodeInDiagnosticDatabase(code) {

    if (!diagnosticDatabase) {

        return null;

    }


    const wanted =
        String(code)
            .trim()
            .toUpperCase()
            .replace(
                /[\s-]/g,
                ""
            );


    /*
     * FORMAT:
     *
     * {
     *     "P0001": {
     *         ...
     *     }
     * }
     */

    if (
        !Array.isArray(
            diagnosticDatabase
        ) &&
        typeof diagnosticDatabase === "object"
    ) {


        const keys =
            Object.keys(
                diagnosticDatabase
            );


        for (
            const key of keys
        ) {


            const normalizedKey =
                String(key)
                    .trim()
                    .toUpperCase()
                    .replace(
                        /[\s-]/g,
                        ""
                    );


            if (
                normalizedKey === wanted
            ) {

                return diagnosticDatabase[key];

            }

        }

    }


    /*
     * ARRAY FORMAT
     */

    if (
        Array.isArray(
            diagnosticDatabase
        )
    ) {


        const found =
            diagnosticDatabase.find(

                item => {

                    if (!item) {

                        return false;

                    }


                    const itemCode =
                        item.Code ||
                        item.code ||
                        item.codeId ||
                        item.DTC ||
                        item.dtc;


                    if (!itemCode) {

                        return false;

                    }


                    const normalizedItemCode =
                        String(itemCode)
                            .trim()
                            .toUpperCase()
                            .replace(
                                /[\s-]/g,
                                ""
                            );


                    return (
                        normalizedItemCode ===
                        wanted
                    );

                }

            );


        if (found) {

            return found;

        }

    }


    return null;

}



/* ==================================================
   FIND NUMERIC-ONLY CODE
================================================== */

function findBestNumericCode(number) {

    const candidates = [

        "P" + number,
        "B" + number,
        "C" + number,
        "U" + number

    ];


    /*
     * Diagnostic database gets priority
     */

    for (
        const candidate of candidates
    ) {

        if (
            findCodeInDiagnosticDatabase(
                candidate
            )
        ) {

            return candidate;

        }

    }


    /*
     * Codes.json
     */

    for (
        const candidate of candidates
    ) {

        if (
            findCodeInMainDatabase(
                candidate
            )
        ) {

            return candidate;

        }

    }


    /*
     * Default to P
     */

    return "P" + number;

}



/* ==================================================
   NORMALIZE OBD CODE
================================================== */

function normalizeOBDCode(value) {

    if (!value) {

        return null;

    }


    let code =
        String(value)
            .trim()
            .toUpperCase();


    /*
     * Remove spaces and hyphens
     *
     * P 0001
     * P-0001
     */

    code =
        code.replace(
            /[\s-]/g,
            ""
        );


    /*
     * Remove other punctuation
     */

    code =
        code.replace(
            /[^A-Z0-9]/g,
            ""
        );


    /*
     * Normal:
     *
     * P0001
     * B0001
     * C0001
     * U0001
     */

    if (
        /^[PBCU][0-9]{4}$/.test(
            code
        )
    ) {

        return code;

    }


    /*
     * Short code:
     *
     * P001
     * P01
     *
     * becomes:
     *
     * P0001
     */

    if (
        /^[PBCU][0-9]{1,3}$/.test(
            code
        )
    ) {


        const prefix =
            code.charAt(0);


        const number =
            code
                .substring(1)
                .padStart(
                    4,
                    "0"
                );


        return (
            prefix +
            number
        );

    }


    /*
     * Numeric only:
     *
     * 0001
     */

    if (
        /^[0-9]{4}$/.test(
            code
        )
    ) {

        return findBestNumericCode(
            code
        );

    }


    /*
     * Numeric shorter:
     *
     * 1
     * 01
     * 001
     *
     * Treat as P-code
     */

    if (
        /^[0-9]{1,3}$/.test(
            code
        )
    ) {


        const number =
            code.padStart(
                4,
                "0"
            );


        return findBestNumericCode(
            number
        );

    }


    return code;

}



/* ==================================================
   GET SYSTEM
================================================== */

function getSystemFromCode(
    code,
    description
) {


    const prefix =
        code.charAt(0);


    const second =
        parseInt(
            code.charAt(1),
            10
        );


    let system =
        "Vehicle Diagnostic System";


    const text =
        String(
            description || ""
        ).toLowerCase();



    if (
        prefix === "P"
    ) {


        system =
            "Powertrain";


        if (
            second === 0
        ) {

            system =
                "Powertrain — Generic OBD-II";

        }

        else if (
            second === 1
        ) {

            system =
                "Powertrain — Manufacturer Specific";

        }

        else if (
            second === 2
        ) {

            system =
                "Powertrain — Fuel & Air / Injection";

        }

        else if (
            second === 3
        ) {

            system =
                "Powertrain — Ignition / Misfire";

        }

    }


    else if (
        prefix === "B"
    ) {

        system =
            "Body / Comfort / Safety Systems";

    }


    else if (
        prefix === "C"
    ) {

        system =
            "Chassis / ABS / Suspension / Steering";

    }


    else if (
        prefix === "U"
    ) {

        system =
            "Network / Communication System";

    }



    /*
     * Description keywords
     */

    if (
        text.includes("oxygen sensor") ||
        text.includes("o2 sensor")
    ) {

        system =
            "Engine Management — Oxygen Sensor";

    }

    else if (
        text.includes("catalyst") ||
        text.includes("catalytic converter")
    ) {

        system =
            "Emissions — Catalytic Converter";

    }

    else if (
        text.includes("misfire") ||
        text.includes("cylinder")
    ) {

        system =
            "Engine — Ignition / Misfire";

    }

    else if (
        text.includes("temperature") ||
        text.includes("coolant")
    ) {

        system =
            "Engine Cooling System";

    }

    else if (
        text.includes("voltage") ||
        text.includes("battery") ||
        text.includes("charging")
    ) {

        system =
            "Electrical / Charging System";

    }


    return system;

}



/* ==================================================
   GENERIC INFORMATION
================================================== */

function getGenericInfo(
    code,
    description
) {


    let severity =
        "Medium";


    let symptoms = [];


    let causes = [];


    let checks = [];


    let repairs = [];


    let tip =
        "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone.";


    const prefix =
        code.charAt(0);


    const text =
        String(
            description || ""
        ).toLowerCase();



    /*
     * MISFIRE
     */

    if (
        text.includes("misfire") ||
        text.includes("cylinder")
    ) {


        severity =
            "High";


        symptoms = [

            "Rough or unstable engine operation",
            "Loss of power",
            "Engine vibration",
            "Check Engine light",
            "Possible flashing Check Engine light"

        ];


        causes = [

            "Worn or faulty spark plug",
            "Ignition coil problem",
            "Fuel injector problem",
            "Low compression",
            "Vacuum or intake leak",
            "Fuel delivery problem"

        ];


        checks = [

            "Check ignition components",
            "Inspect spark plugs",
            "Check injector operation",
            "Check fuel trims",
            "Perform compression testing if necessary"

        ];


        repairs = [

            "Replace faulty ignition components",
            "Repair fuel delivery problems",
            "Repair vacuum or intake leaks",
            "Repair mechanical faults"

        ];


        tip =
            "A severe or flashing misfire can damage the catalytic converter. Avoid prolonged driving until the cause is identified.";

    }



    /*
     * OXYGEN SENSOR
     */

    else if (
        text.includes("oxygen sensor") ||
        text.includes("o2 sensor")
    ) {


        symptoms = [

            "Check Engine light",
            "Possible increased fuel consumption",
            "Rough running or hesitation",
            "Increased emissions"

        ];


        causes = [

            "Faulty oxygen sensor",
            "Damaged sensor wiring or connector",
            "Exhaust leak",
            "Vacuum or intake leak",
            "Fuel mixture problem"

        ];


        checks = [

            "Inspect sensor wiring and connector",
            "Check for exhaust leaks near the sensor",
            "Compare live O2 sensor readings",
            "Check fuel trims",
            "Verify related intake and fuel-system faults"

        ];


        repairs = [

            "Repair damaged wiring",
            "Repair exhaust leaks",
            "Correct air/fuel mixture problems",
            "Replace faulty oxygen sensor"

        ];


        tip =
            "Do not replace the oxygen sensor automatically. Exhaust leaks, wiring faults and incorrect air/fuel mixture can produce similar codes.";

    }



    /*
     * CATALYST
     */

    else if (
        text.includes("catalyst") ||
        text.includes("catalytic converter")
    ) {


        symptoms = [

            "Check Engine light",
            "Increased emissions",
            "Possible loss of performance",
            "Possible increased fuel consumption"

        ];


        causes = [

            "Aged or damaged catalytic converter",
            "Engine misfire",
            "Incorrect fuel mixture",
            "Faulty oxygen sensor",
            "Exhaust leak"

        ];


        checks = [

            "Check for other engine fault codes first",
            "Inspect for exhaust leaks",
            "Check upstream and downstream O2 readings",
            "Check fuel trims",
            "Verify engine operation"

        ];


        repairs = [

            "Repair exhaust leaks",
            "Repair underlying engine faults",
            "Replace faulty oxygen sensor",
            "Replace catalytic converter if confirmed defective"

        ];


        tip =
            "A catalyst code does not automatically mean the catalytic converter needs replacement. Fix the underlying engine problem first.";

    }



    /*
     * COOLANT
     */

    else if (
        text.includes("temperature") ||
        text.includes("coolant")
    ) {


        severity =
            "High";


        symptoms = [

            "Engine overheating or incorrect temperature",
            "Cooling fan operating abnormally",
            "Check Engine light",
            "Poor fuel economy"

        ];


        causes = [

            "Faulty temperature sensor",
            "Damaged wiring",
            "Low coolant level",
            "Thermostat problem",
            "Cooling system fault"

        ];


        checks = [

            "Check coolant level",
            "Inspect sensor connector and wiring",
            "Compare coolant temperature with live data",
            "Check thermostat operation",
            "Inspect cooling fan operation"

        ];


        repairs = [

            "Repair wiring or connector",
            "Replace faulty temperature sensor",
            "Replace thermostat if defective",
            "Repair cooling system fault"

        ];

    }



    /*
     * BATTERY / VOLTAGE
     */

    else if (
        text.includes("voltage") ||
        text.includes("battery") ||
        text.includes("charging")
    ) {


        severity =
            "High";


        symptoms = [

            "Battery or charging warning",
            "Starting problems",
            "Electrical system instability",
            "Multiple warning lights"

        ];


        causes = [

            "Weak battery",
            "Alternator problem",
            "Poor electrical connection",
            "Damaged wiring",
            "Incorrect system voltage"

        ];


        checks = [

            "Measure battery voltage",
            "Check charging voltage with engine running",
            "Inspect battery terminals",
            "Inspect grounds and power connections",
            "Check related wiring"

        ];


        repairs = [

            "Charge or replace battery if necessary",
            "Repair charging system",
            "Repair wiring and connections",
            "Repair poor grounds"

        ];

    }



    /*
     * U-CODES
     */

    else if (
        prefix === "U"
    ) {


        severity =
            "High";


        symptoms = [

            "Multiple warning lights",
            "Modules unavailable",
            "Intermittent electrical problems",
            "Communication-related faults"

        ];


        causes = [

            "Low system voltage",
            "CAN bus wiring problem",
            "Poor ground or power supply",
            "Faulty module",
            "Communication network fault"

        ];


        checks = [

            "Check battery and charging voltage",
            "Check module power and grounds",
            "Inspect CAN wiring",
            "Scan all control modules",
            "Look for additional communication codes"

        ];


        repairs = [

            "Repair CAN wiring",
            "Repair module power or ground",
            "Correct low-voltage problems",
            "Replace faulty module after proper diagnosis"

        ];


        tip =
            "Network codes should normally be diagnosed together with all other module codes. A single failed module can generate multiple communication faults.";

    }



    /*
     * GENERIC FALLBACK
     */

    if (
        symptoms.length === 0
    ) {

        symptoms = [

            "Check Engine or warning indicator may be illuminated",
            "Vehicle symptoms depend on the affected system",
            "Performance or fuel economy may be affected"

        ];

    }


    if (
        causes.length === 0
    ) {

        causes = [

            "Sensor or actuator fault",
            "Damaged wiring or connector",
            "Electrical supply problem",
            "Mechanical problem",
            "Underlying fault in a related system"

        ];

    }


    if (
        checks.length === 0
    ) {

        checks = [

            "Read all stored and pending fault codes",
            "Inspect related wiring and connectors",
            "Check relevant live data",
            "Check electrical power and grounds",
            "Verify the fault before replacing components"

        ];

    }


    if (
        repairs.length === 0
    ) {

        repairs = [

            "Repair or replace the faulty component after confirmation",
            "Repair damaged wiring or connectors",
            "Correct any underlying mechanical or electrical fault"

        ];

    }


    return {

        system:
            getSystemFromCode(
                code,
                description
            ),

        severity,

        symptoms,

        causes,

        checks,

        repairs,

        tip

    };

}



/* ==================================================
   DECODE
================================================== */

function decodeCode() {


    const rawInput =
        document
            .getElementById("codeInput")
            .value
            .trim();


    const result =
        document
            .getElementById("result");


    if (!rawInput) {


        result.innerHTML = `

            <div class="error">

                <h2>
                    Enter an OBD-II code
                </h2>

                <p>
                    Example: P0420
                </p>

            </div>

        `;


        return;

    }



    if (!databaseReady) {


        result.innerHTML = `

            <div class="loading">

                Loading diagnostic database...

            </div>

        `;


        return;

    }



    /*
     * Normalize
     */

    const input =
        normalizeOBDCode(
            rawInput
        );


    /*
     * Update input with normalized code
     */

    document
        .getElementById("codeInput")
        .value =
        input;



    /*
     * Find in both databases
     */

    const mainCode =
        findCodeInMainDatabase(
            input
        );


    const diagnosticCode =
        findCodeInDiagnosticDatabase(
            input
        );



    console.log(
        "Original input:",
        rawInput
    );

    console.log(
        "Normalized code:",
        input
    );

    console.log(
        "Codes.json result:",
        mainCode
    );

    console.log(
        "Diagnostic.json result:",
        diagnosticCode
    );



    /*
     * Not found
     */

    if (
        !mainCode &&
        !diagnosticCode
    ) {


        result.innerHTML = `

            <div class="error">

                <h2>
                    ${escapeHTML(input)}
                </h2>

                <p>
                    Code not found in the database.
                </p>

            </div>

        `;


        return;

    }



    /*
     * Description
     */

    let description =
        "Diagnostic trouble code";


    if (
        mainCode &&
        mainCode.Description
    ) {

        description =
            mainCode.Description;

    }

    else if (
        diagnosticCode &&
        diagnosticCode.description
    ) {

        description =
            diagnosticCode.description;

    }



    /*
     * Generic fallback
     */

    const genericInfo =
        getGenericInfo(
            input,
            description
        );


    let info = {

        system:
            genericInfo.system,

        severity:
            genericInfo.severity,

        symptoms:
            genericInfo.symptoms,

        causes:
            genericInfo.causes,

        checks:
            genericInfo.checks,

        repairs:
            genericInfo.repairs,

        tip:
            genericInfo.tip

    };



    /*
     * ==========================================
     * DIAGNOSTIC.JSON HAS PRIORITY
     * ==========================================
     */

    if (diagnosticCode) {


        if (
            diagnosticCode.system &&
            typeof diagnosticCode.system ===
            "string"
        ) {

            info.system =
                diagnosticCode.system;

        }


        if (
            diagnosticCode.severity &&
            typeof diagnosticCode.severity ===
            "string"
        ) {

            info.severity =
                diagnosticCode.severity;

        }


        if (
            Array.isArray(
                diagnosticCode.symptoms
            ) &&
            diagnosticCode.symptoms.length > 0
        ) {

            info.symptoms =
                diagnosticCode.symptoms;

        }


        if (
            Array.isArray(
                diagnosticCode.causes
            ) &&
            diagnosticCode.causes.length > 0
        ) {

            info.causes =
                diagnosticCode.causes;

        }


        if (
            Array.isArray(
                diagnosticCode.diagnostic
            ) &&
            diagnosticCode.diagnostic.length > 0
        ) {

            info.checks =
                diagnosticCode.diagnostic;

        }


        if (
            Array.isArray(
                diagnosticCode.repairs
            ) &&
            diagnosticCode.repairs.length > 0
        ) {

            info.repairs =
                diagnosticCode.repairs;

        }


        if (
            diagnosticCode.tip &&
            typeof diagnosticCode.tip ===
            "string"
        ) {

            info.tip =
                diagnosticCode.tip;

        }

    }



    /*
     * Build HTML
     */

    const symptomsHTML =
        info.symptoms
            .map(
                item =>
                    `<li>${escapeHTML(item)}</li>`
            )
            .join("");


    const causesHTML =
        info.causes
            .map(
                item =>
                    `<li>${escapeHTML(item)}</li>`
            )
            .join("");


    const checksHTML =
        info.checks
            .map(
                item =>
                    `<li>${escapeHTML(item)}</li>`
            )
            .join("");


    const repairsHTML =
        info.repairs
            .map(
                item =>
                    `<li>${escapeHTML(item)}</li>`
            )
            .join("");



    /*
     * Display
     */

    result.innerHTML = `

        <div
            class="result-container"
            style="display:block"
        >


            <div class="result-header">


                <div class="code">

                    ${escapeHTML(input)}

                </div>


                <div class="description">

                    ${escapeHTML(description)}

                </div>


                <div class="badges">


                    <div class="badge">

                        ${escapeHTML(info.system)}

                    </div>


                    <div class="severity">

                        Severity:
                        ${escapeHTML(
                            info.severity
                        )}

                    </div>


                </div>


            </div>



            <div class="info-grid">


                <div class="info-card">

                    <h3>
                        ⚠️ Common Symptoms
                    </h3>

                    <ul>

                        ${symptomsHTML}

                    </ul>

                </div>



                <div class="info-card">

                    <h3>
                        🔍 Possible Causes
                    </h3>

                    <ul>

                        ${causesHTML}

                    </ul>

                </div>



                <div class="info-card">

                    <h3>
                        🛠️ Recommended Checks
                    </h3>

                    <ul>

                        ${checksHTML}

                    </ul>

                </div>



                <div class="info-card">

                    <h3>
                        🔧 Recommended Repairs
                    </h3>

                    <ul>

                        ${repairsHTML}

                    </ul>

                </div>



                <div class="info-card full">

                    <h3>
                        💡 Diagnostic Tip
                    </h3>

                    <p>

                        ${escapeHTML(
                            info.tip
                        )}

                    </p>

                </div>


            </div>


        </div>

    `;

}



/* ==================================================
   SECURITY
================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==================================================
   ENTER KEY
================================================== */

document
    .getElementById("codeInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                decodeCode();

            }

        }
    );



/* ==================================================
   START
================================================== */

loadDatabase();


</script>

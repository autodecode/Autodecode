<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBD Decoder — AutoDecode</title>

<meta
    name="description"
    content="Decode OBD-II diagnostic trouble codes with AutoDecode."
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d10;
    color: #f2f4f7;
    min-height: 100vh;
}

header {
    height: 72px;
    border-bottom: 1px solid #20242a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #4da3ff;
}

header a {
    color: #9da5b0;
    text-decoration: none;
    font-size: 14px;
}

header a:hover {
    color: white;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 60px 20px 90px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 35px;
}

input {
    flex: 1;
    height: 60px;
    background: #14181d;
    border: 1px solid #303842;
    border-radius: 10px;
    color: white;
    padding: 0 18px;
    font-size: 18px;
    outline: none;
}

input:focus {
    border-color: #4da3ff;
}

button {
    border: none;
    background: #4da3ff;
    padding: 0 28px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #78baff;
}

/* RESULT */

.result-container {
    display: none;
}

.result-header {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 30px;
    margin-bottom: 15px;
}

.code {
    color: #4da3ff;
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 12px;
}

.description {
    color: #d1d7de;
    font-size: 20px;
    line-height: 1.55;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}

.badge {
    background: #1b222a;
    border: 1px solid #303842;
    color: #aeb7c2;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
}

/* GRID */

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.info-card {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 25px;
}

.info-card.full {
    grid-column: 1 / -1;
}

.info-card h3 {
    font-size: 15px;
    margin-bottom: 15px;
    color: #ffffff;
}

.info-card p {
    color: #9da7b2;
    font-size: 14px;
    line-height: 1.7;
}

.info-card ul {
    padding-left: 20px;
    color: #9da7b2;
}

.info-card li {
    margin-bottom: 9px;
    font-size: 14px;
    line-height: 1.5;
}

/* SEVERITY */

.severity {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    background: #1b222a;
    color: #d0d6dd;
}

/* ERROR */

.error {
    text-align: center;
    color: #8b949e;
    padding: 40px;
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
}

.error h2 {
    color: #f2f4f7;
    margin-bottom: 10px;
}

.loading {
    text-align: center;
    color: #8b949e;
    padding: 40px;
}

/* MOBILE */

@media(max-width:650px) {

    .container {
        padding-top: 40px;
    }

    .search {
        flex-direction: column;
    }

    button {
        height: 52px;
    }

    .code {
        font-size: 38px;
    }

    .description {
        font-size: 17px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

    .info-card.full {
        grid-column: auto;
    }
}

</style>

</head>


<body>


<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a href="index.html">
        ← Home
    </a>

</header>


<div class="container">


    <div class="search">

        <input
            id="codeInput"
            type="text"
            placeholder="Enter OBD-II code (e.g. P0420)"
            autocomplete="off"
        >

        <button onclick="decodeCode()">
            Decode
        </button>

    </div>


    <div id="result">

        <div class="loading">
            Loading OBD database...
        </div>

    </div>


</div>


<script>


/* ==================================================
   DATABASES
================================================== */

let obdDatabase = [];

let diagnosticDatabase = {};


/* ==================================================
   LOAD DATABASES
================================================== */

async function loadDatabase() {

    try {

        /*
         * Load Codes.json
         */

        const codesResponse =
            await fetch(
                "./Database/Codes.json"
            );


        if (!codesResponse.ok) {

            throw new Error(
                "Could not load Database/Codes.json"
            );

        }


        obdDatabase =
            await codesResponse.json();


        /*
         * Load Diagnostic.json
         */

        const diagnosticResponse =
            await fetch(
                "./Database/Diagnostic.json"
            );


        if (!diagnosticResponse.ok) {

            throw new Error(
                "Could not load Database/Diagnostic.json"
            );

        }


        diagnosticDatabase =
            await diagnosticResponse.json();


        /*
         * Database loaded
         */

        console.log(
            "Codes.json loaded."
        );

        console.log(
            "Diagnostic.json loaded."
        );


        /*
         * URL CODE
         */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const urlCode =
            params.get("code");


        if (urlCode) {

            const normalized =
                normalizeCode(urlCode);


            document
                .getElementById("codeInput")
                .value =
                normalized;


            decodeCode();

        } else {

            document
                .getElementById("result")
                .innerHTML = `
                    <div class="loading">
                        OBD database loaded.
                        Enter a code above.
                    </div>
                `;

        }


    } catch(error) {

        console.error(
            "DATABASE ERROR:",
            error
        );


        document
            .getElementById("result")
            .innerHTML = `

                <div class="error">

                    <h2>
                        Database unavailable
                    </h2>

                    <p>
                        ${escapeHTML(
                            error.message
                        )}
                    </p>

                </div>

            `;

    }

}


/* ==================================================
   NORMALIZE CODE
================================================== */

function normalizeCode(value) {

    let code =
        String(value)
            .trim()
            .toUpperCase()
            .replace(/\s+/g, "")
            .replace(/-/g, "");


    /*
     * P0001
     */

    if (
        /^[PBCU][0-9]{4}$/.test(code)
    ) {

        return code;

    }


    /*
     * P1
     * P01
     * P001
     */

    if (
        /^[PBCU][0-9]{1,3}$/.test(code)
    ) {

        return (
            code.charAt(0) +
            code
                .substring(1)
                .padStart(4, "0")
        );

    }


    /*
     * 0001
     *
     * Assume P code
     */

    if (
        /^[0-9]{1,4}$/.test(code)
    ) {

        return (
            "P" +
            code.padStart(4, "0")
        );

    }


    return code;

}


/* ==================================================
   FIND DESCRIPTION
================================================== */

function findDescription(code) {

    if (
        !Array.isArray(
            obdDatabase
        )
    ) {

        return "No description available.";

    }


    const found =
        obdDatabase.find(

            item => {

                if (
                    !item ||
                    !item.Code
                ) {

                    return false;

                }


                return (
                    normalizeCode(
                        item.Code
                    ) === code
                );

            }

        );


    if (
        found &&
        found.Description
    ) {

        return found.Description;

    }


    return "No description available.";

}


/* ==================================================
   FIND DIAGNOSTIC DATA
================================================== */

function findDiagnostic(code) {

    if (
        !diagnosticDatabase ||
        typeof diagnosticDatabase !== "object"
    ) {

        return null;

    }


    /*
     * Direct lookup
     */

    if (
        diagnosticDatabase[code]
    ) {

        return diagnosticDatabase[code];

    }


    /*
     * Case-insensitive /
     * normalized lookup
     */

    const keys =
        Object.keys(
            diagnosticDatabase
        );


    for (
        const key of keys
    ) {

        if (
            normalizeCode(key) === code
        ) {

            return diagnosticDatabase[key];

        }

    }


    return null;

}


/* ==================================================
   GENERIC INFORMATION
================================================== */

function getGenericInfo(
    code,
    description
) {

    const prefix =
        code.charAt(0);


    let system =
        "Vehicle Diagnostic System";


    let severity =
        "Medium";


    let symptoms = [];

    let causes = [];

    let checks = [];

    let repairs = [];


    let tip =
        "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone.";


    if (
        prefix === "P"
    ) {

        system =
            "Powertrain";

    }

    else if (
        prefix === "B"
    ) {

        system =
            "Body / Comfort / Safety Systems";

    }

    else if (
        prefix === "C"
    ) {

        system =
            "Chassis / ABS / Suspension / Steering";

    }

    else if (
        prefix === "U"
    ) {

        system =
            "Network / Communication System";

        severity =
            "High";

    }


    const text =
        description.toLowerCase();


    /*
     * OXYGEN SENSOR
     */

    if (
        text.includes("oxygen sensor") ||
        text.includes("o2 sensor")
    ) {

        system =
            "Engine Management — Oxygen Sensor";


        symptoms = [

            "Check Engine light",

            "Possible increased fuel consumption",

            "Rough running or hesitation",

            "Emissions may increase"

        ];


        causes = [

            "Faulty oxygen sensor",

            "Damaged sensor wiring or connector",

            "Exhaust leak",

            "Vacuum or intake leak",

            "Fuel mixture problem"

        ];


        checks = [

            "Inspect the sensor wiring and connector",

            "Check for exhaust leaks near the sensor",

            "Compare live O2 sensor readings",

            "Check fuel trims",

            "Verify related intake and fuel-system faults"

        ];


        repairs = [

            "Repair damaged wiring or connectors",

            "Repair exhaust leaks",

            "Correct the underlying fuel mixture problem",

            "Replace the oxygen sensor if confirmed faulty"

        ];


        tip =
            "Do not replace the oxygen sensor automatically. Exhaust leaks, wiring faults and incorrect air/fuel mixture can produce similar codes.";

    }


    /*
     * CATALYST
     */

    else if (
        text.includes("catalyst") ||
        text.includes("catalytic converter")
    ) {

        system =
            "Emissions — Catalytic Converter";


        symptoms = [

            "Check Engine light",

            "Increased emissions",

            "Possible loss of performance",

            "Possible increased fuel consumption"

        ];


        causes = [

            "Aged or damaged catalytic converter",

            "Engine misfire",

            "Incorrect fuel mixture",

            "Faulty oxygen sensor",

            "Exhaust leak"

        ];


        checks = [

            "Check for other engine fault codes first",

            "Inspect for exhaust leaks",

            "Check upstream and downstream O2 readings",

            "Check fuel trims",

            "Verify engine is operating correctly"

        ];


        repairs = [

            "Repair exhaust leaks",

            "Correct engine mixture problems",

            "Repair underlying misfire",

            "Replace faulty oxygen sensor if confirmed",

            "Replace catalytic converter if confirmed defective"

        ];


        tip =
            "A catalyst code does not automatically mean the catalytic converter needs replacement. Fixing an underlying misfire or mixture problem may resolve the fault.";

    }


    /*
     * MISFIRE
     */

    else if (
        text.includes("misfire") ||
        text.includes("cylinder")
    ) {

        system =
            "Engine — Ignition / Misfire";


        severity =
            "High";


        symptoms = [

            "Rough or unstable engine operation",

            "Loss of power",

            "Engine vibration",

            "Check Engine light",

            "Possible flashing Check Engine light"

        ];


        causes = [

            "Worn or faulty spark plug",

            "Ignition coil problem",

            "Fuel injector problem",

            "Low compression",

            "Vacuum or intake leak",

            "Fuel delivery problem"

        ];


        checks = [

            "Check ignition components",

            "Inspect spark plugs",

            "Check injector operation",

            "Check fuel trims",

            "Perform compression testing if necessary"

        ];


        repairs = [

            "Replace faulty spark plugs",

            "Repair or replace faulty ignition components",

            "Repair or replace faulty injectors",

            "Repair vacuum or intake leaks",

            "Repair underlying mechanical problems"

        ];


        tip =
            "A severe or flashing misfire can damage the catalytic converter. Avoid prolonged driving until the cause is identified.";

    }


    /*
     * COOLANT / TEMPERATURE
     */

    else if (
        text.includes("temperature") ||
        text.includes("coolant")
    ) {

        system =
            "Engine Cooling System";


        severity =
            "High";


        symptoms = [

            "Engine overheating or incorrect temperature",

            "Cooling fan operating abnormally",

            "Check Engine light",

            "Poor fuel economy"

        ];


        causes = [

            "Faulty temperature sensor",

            "Damaged wiring",

            "Low coolant level",

            "Thermostat problem",

            "Cooling system fault"

        ];


        checks = [

            "Check coolant level",

            "Inspect sensor connector and wiring",

            "Compare coolant temperature with live data",

            "Check thermostat operation",

            "Inspect cooling fan operation"

        ];


        repairs = [

            "Repair damaged wiring or connectors",

            "Replace faulty temperature sensor",

            "Correct coolant level or leaks",

            "Replace faulty thermostat",

            "Repair cooling system faults"

        ];

    }


    /*
     * VOLTAGE / BATTERY
     */

    else if (
        text.includes("voltage") ||
        text.includes("battery") ||
        text.includes("charging")
    ) {

        system =
            "Electrical / Charging System";


        severity =
            "High";


        symptoms = [

            "Battery or charging warning",

            "Starting problems",

            "Electrical system instability",

            "Multiple warning lights"

        ];


        causes = [

            "Weak battery",

            "Alternator problem",

            "Poor electrical connection",

            "Damaged wiring",

            "Incorrect system voltage"

        ];


        checks = [

            "Measure battery voltage",

            "Check charging voltage with engine running",

            "Inspect battery terminals",

            "Inspect grounds and power connections",

            "Check related wiring"

        ];


        repairs = [

            "Charge or replace the battery if necessary",

            "Repair charging-system wiring",

            "Repair or replace faulty alternator",

            "Clean and secure electrical connections",

            "Repair poor grounds"

        ];

    }


    /*
     * U-CODES
     */

    else if (
        prefix === "U"
    ) {

        symptoms = [

            "Multiple warning lights",

            "Modules unavailable",

            "Intermittent electrical problems",

            "Communication-related faults"

        ];


        causes = [

            "Low system voltage",

            "CAN bus wiring problem",

            "Poor ground or power supply",

            "Faulty module",

            "Communication network fault"

        ];


        checks = [

            "Check battery and charging voltage",

            "Check module power and grounds",

            "Inspect CAN wiring",

            "Scan all control modules",

            "Look for additional communication codes"

        ];


        repairs = [

            "Repair CAN bus wiring",

            "Repair module power or ground supply",

            "Correct low system voltage",

            "Repair or replace the faulty module after confirmation"

        ];


        tip =
            "Network codes should normally be diagnosed together with all other module codes. A single failed module can generate multiple communication faults.";

    }


    /*
     * GENERIC FALLBACK
     */

    if (
        symptoms.length === 0
    ) {

        symptoms = [

            "Check Engine or warning indicator may be illuminated",

            "Vehicle symptoms depend on the affected system",

            "Performance or fuel economy may be affected"

        ];

    }


    if (
        causes.length === 0
    ) {

        causes = [

            "Sensor or actuator fault",

            "Damaged wiring or connector",

            "Electrical supply problem",

            "Mechanical problem",

            "Underlying fault in a related system"

        ];

    }


    if (
        checks.length === 0
    ) {

        checks = [

            "Read all stored and pending fault codes",

            "Inspect related wiring and connectors",

            "Check relevant live data",

            "Check electrical power and grounds",

            "Verify the fault before replacing components"

        ];

    }


    if (
        repairs.length === 0
    ) {

        repairs = [

            "Repair damaged wiring or connectors",

            "Repair or replace the confirmed faulty component",

            "Correct any underlying mechanical or electrical fault"

        ];

    }


    return {

        system,

        severity,

        symptoms,

        causes,

        checks,

        repairs,

        tip

    };

}


/* ==================================================
   DECODE
================================================== */

function decodeCode() {

    const rawInput =
        document
            .getElementById("codeInput")
            .value;


    const result =
        document
            .getElementById("result");


    /*
     * Normalize:
     *
     * p0001
     * P0001
     * 0001
     *
     * all become P0001
     */

    const code =
        normalizeCode(
            rawInput
        );


    if (!code) {

        result.innerHTML = `

            <div class="error">

                <h2>
                    Enter an OBD-II code
                </h2>

                <p>
                    Example: P0420
                </p>

            </div>

        `;

        return;

    }


    /*
     * Put normalized code
     * back into search box
     */

    document
        .getElementById("codeInput")
        .value =
        code;


    /*
     * DESCRIPTION
     *
     * Comes from Codes.json
     */

    const description =
        findDescription(
            code
        );


    /*
     * DIAGNOSTIC DATA
     *
     * Diagnostic.json has
     * absolute priority.
     */

    const diagnostic =
        findDiagnostic(
            code
        );


    let info;


    if (diagnostic) {

        /*
         * =========================================
         * SPECIFIC DATA FROM Diagnostic.json
         * =========================================
         */

        info = {

            system:
                diagnostic.system ||
                "Vehicle Diagnostic System",


            severity:
                diagnostic.severity ||
                "Medium",


            symptoms:
                Array.isArray(
                    diagnostic.symptoms
                )
                ?
                diagnostic.symptoms
                :
                [],


            causes:
                Array.isArray(
                    diagnostic.causes
                )
                ?
                diagnostic.causes
                :
                [],


            checks:
                Array.isArray(
                    diagnostic.diagnostic
                )
                ?
                diagnostic.diagnostic
                :
                [],


            repairs:
                Array.isArray(
                    diagnostic.repairs
                )
                ?
                diagnostic.repairs
                :
                [],


            tip:
                diagnostic.tip ||
                "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone."

        };


        console.log(
            "Using Diagnostic.json:",
            code
        );

    }


    else {

        /*
         * =========================================
         * NO SPECIFIC DATA
         *
         * Use existing generic logic.
         * =========================================
         */

        info =
            getGenericInfo(
                code,
                description
            );


        console.log(
            "Using generic information:",
            code
        );

    }


    /*
     * HTML
     */

    const symptomsHTML =
        info.symptoms
            .map(
                item =>
                    `<li>${escapeHTML(item)}</li>`
            )
            .join("");


    const causesHTML =
        info.causes
            .map(
                item =>
                    `<li>${escapeHTML(item)}</li>`
            )
            .join("");


    const checksHTML =
        info.checks
            .map(
                item =>
                    `<li>${escapeHTML(item)}</li>`
            )
            .join("");


    const repairsHTML =
        info.repairs
            .map(
                item =>
                    `<li>${escapeHTML(item)}</li>`
            )
            .join("");


    /*
     * DISPLAY
     */

    result.innerHTML = `

        <div
            class="result-container"
            style="display:block"
        >


            <div class="result-header">

                <div class="code">
                    ${escapeHTML(code)}
                </div>


                <div class="description">
                    ${escapeHTML(
                        description
                    )}
                </div>


                <div class="badges">

                    <div class="badge">
                        ${escapeHTML(
                            info.system
                        )}
                    </div>


                    <div class="severity">
                        Severity:
                        ${escapeHTML(
                            info.severity
                        )}
                    </div>

                </div>

            </div>



            <div class="info-grid">


                <div class="info-card">

                    <h3>
                        ⚠️ Common Symptoms
                    </h3>

                    <ul>
                        ${symptomsHTML}
                    </ul>

                </div>



                <div class="info-card">

                    <h3>
                        🔍 Possible Causes
                    </h3>

                    <ul>
                        ${causesHTML}
                    </ul>

                </div>



                <div class="info-card">

                    <h3>
                        🛠️ Recommended Checks
                    </h3>

                    <ul>
                        ${checksHTML}
                    </ul>

                </div>



                <div class="info-card">

                    <h3>
                        🔧 Recommended Repairs
                    </h3>

                    <ul>
                        ${repairsHTML}
                    </ul>

                </div>



                <div class="info-card full">

                    <h3>
                        💡 Diagnostic Tip
                    </h3>

                    <p>
                        ${escapeHTML(
                            info.tip
                        )}
                    </p>

                </div>


            </div>

        </div>

    `;

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==================================================
   ENTER KEY
================================================== */

document
    .getElementById("codeInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                decodeCode();

            }

        }
    );


/* ==================================================
   START
================================================== */

loadDatabase();


</script>

</body>

</html>

<header>

</header>


<div class="container">

            id="codeInput"
            type="text"
            placeholder="Enter OBD-II code (e.g. P0420)"
            autocomplete="off"
        >

        <button onclick="decodeCode()">
            Decode
        </button>

    </div>


    <div id="result">

        <div class="loading">
            Loading OBD database...
        </div>

    </div>


</div>


<script>


/* ==================================================
   DATABASES
================================================== */

let obdDatabase = [];

let diagnosticDatabase = null;

let databaseReady = false;



/* ==================================================
   LOAD DATABASES
================================================== */

async function loadDatabase() {

    const result =
        document.getElementById("result");


    /*
     * ==============================================
     * LOAD CODES.JSON
     * ==============================================
     */

    try {

        const response =
            await fetch(
                "Database/Codes.json?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (response.ok) {

            obdDatabase =
                await response.json();

        } else {

            console.warn(
                "Codes.json unavailable:",
                response.status
            );

            obdDatabase = [];

        }

    } catch(error) {

        console.warn(
            "Codes.json could not be loaded:",
            error
        );

        obdDatabase = [];

    }



    /*
     * ==============================================
     * LOAD DIAGNOSTIC.JSON
     *
     * CAPITAL D
     * ==============================================
     */

    try {

        const response =
            await fetch(
                "Database/Diagnostic.json?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Diagnostic.json HTTP " +
                response.status
            );

        }


        diagnosticDatabase =
            await response.json();


        console.log(
            "Diagnostic.json loaded successfully."
        );


    } catch(error) {

        console.error(
            "Diagnostic.json could not be loaded:",
            error
        );

        diagnosticDatabase = null;

    }


    databaseReady = true;



    /*
     * ==============================================
     * READ CODE FROM URL
     *
     * Example:
     *
     * obd.html?code=P0001
     * ==============================================
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlCode =
        params.get("code");


    if (urlCode) {

        document
            .getElementById("codeInput")
            .value =
            urlCode;

        decodeCode();

    } else {

        result.innerHTML = `

            <div class="loading">

                OBD database loaded.
                Enter a code above.

            </div>

        `;

    }

}



/* ==================================================
   NORMALIZE INPUT
================================================== */

function normalizeCode(value) {

    if (!value) {

        return null;

    }


    let code =
        String(value)
            .trim()
            .toUpperCase();


    /*
     * Remove spaces
     *
     * P 0001
     */

    code =
        code.replace(
            /\s/g,
            ""
        );


    /*
     * Remove hyphens
     *
     * P-0001
     */

    code =
        code.replace(
            /-/g,
            ""
        );


    /*
     * P0001
     * B0001
     * C0001
     * U0001
     */

    if (
        /^[PBCU][0-9]{4}$/.test(code)
    ) {

        return code;

    }


    /*
     * P001 → P0001
     */

    if (
        /^[PBCU][0-9]{1,3}$/.test(code)
    ) {

        return (
            code.charAt(0) +
            code.substring(1).padStart(4, "0")
        );

    }


    /*
     * 0001 → P0001
     *
     * Only used if the P-code exists.
     */

    if (
        /^[0-9]{1,4}$/.test(code)
    ) {

        const number =
            code.padStart(4, "0");


        const candidates = [
            "P" + number,
            "B" + number,
            "C" + number,
            "U" + number
        ];


        for (
            const candidate of candidates
        ) {

            if (
                findCodeInDiagnosticDatabase(
                    candidate
                )
            ) {

                return candidate;

            }


            if (
                findCodeInMainDatabase(
                    candidate
                )
            ) {

                return candidate;

            }

        }


        return "P" + number;

    }


    return code;

}



/* ==================================================
   NORMALIZE STORED CODE
================================================== */

function normalizeStoredCode(value) {

    if (!value) {

        return "";

    }


    return String(value)
        .trim()
        .toUpperCase()
        .replace(
            /[\s-]/g,
            ""
        );

}



/* ==================================================
   FIND CODE IN CODES.JSON
================================================== */

function findCodeInMainDatabase(code) {

    if (
        !obdDatabase
    ) {

        return null;

    }


    const wanted =
        normalizeStoredCode(
            code
        );


    /*
     * ARRAY DATABASE
     */

    if (
        Array.isArray(
            obdDatabase
        )
    ) {

        return obdDatabase.find(
            item => {

                if (
                    !item ||
                    typeof item !== "object"
                ) {

                    return false;

                }


                const itemCode =
                    item.Code ||
                    item.code ||
                    item.DTC ||
                    item.dtc;


                return (
                    normalizeStoredCode(
                        itemCode
                    ) === wanted
                );

            }
        ) || null;

    }


    /*
     * OBJECT DATABASE
     *
     * {
     *   "P0001": {...}
     * }
     */

    if (
        typeof obdDatabase === "object"
    ) {

        for (
            const key of Object.keys(
                obdDatabase
            )
        ) {

            if (
                normalizeStoredCode(
                    key
                ) === wanted
            ) {

                return {

                    Code: key,

                    ...obdDatabase[key]

                };

            }

        }

    }


    return null;

}



/* ==================================================
   FIND CODE IN DIAGNOSTIC.JSON
================================================== */

function findCodeInDiagnosticDatabase(code) {

    if (
        !diagnosticDatabase
    ) {

        return null;

    }


    const wanted =
        normalizeStoredCode(
            code
        );



    /*
     * ==============================================
     * RECURSIVE SEARCH
     * ==============================================
     */

    function search(value) {

        if (
            !value ||
            typeof value !== "object"
        ) {

            return null;

        }



        /*
         * ==========================================
         * ARRAY
         * ==========================================
         */

        if (
            Array.isArray(value)
        ) {

            for (
                const item of value
            ) {

                const found =
                    search(item);


                if (found) {

                    return found;

                }

            }


            return null;

        }



        /*
         * ==========================================
         * DIRECT KEY
         *
         * "P0001": {...}
         * ==========================================
         */

        for (
            const key of Object.keys(value)
        ) {

            if (
                normalizeStoredCode(
                    key
                ) === wanted
            ) {

                const entry =
                    value[key];


                if (
                    entry &&
                    typeof entry === "object"
                ) {

                    return entry;

                }

            }

        }



        /*
         * ==========================================
         * CODE PROPERTY
         *
         * {
         *    "code": "P0001"
         * }
         * ==========================================
         */

        const possibleCode =
            value.Code ||
            value.code ||
            value.DTC ||
            value.dtc ||
            value.codeId ||
            value.CodeID;


        if (
            possibleCode &&
            normalizeStoredCode(
                possibleCode
            ) === wanted
        ) {

            return value;

        }



        /*
         * ==========================================
         * SEARCH CHILD OBJECTS
         * ==========================================
         */

        for (
            const key of Object.keys(value)
        ) {

            const child =
                value[key];


            if (
                child &&
                typeof child === "object"
            ) {

                const found =
                    search(child);


                if (found) {

                    return found;

                }

            }

        }


        return null;

    }


    return search(
        diagnosticDatabase
    );

}



/* ==================================================
   GET DESCRIPTION
================================================== */

function getDescription(
    mainCode,
    diagnosticCode
) {


    /*
     * Codes.json has priority for description
     */

    if (
        mainCode
    ) {

        const description =
            mainCode.Description ||
            mainCode.description ||
            mainCode.DescriptionText ||
            mainCode.name;


        if (
            description
        ) {

            return description;

        }

    }


    /*
     * Diagnostic.json can also contain description
     */

    if (
        diagnosticCode
    ) {

        const description =
            diagnosticCode.Description ||
            diagnosticCode.description ||
            diagnosticCode.name;


        if (
            description
        ) {

            return description;

        }

    }


    return "Diagnostic trouble code";

}



/* ==================================================
   GENERIC INFORMATION
 *
 * ONLY USED IF DIAGNOSTIC.JSON DOES NOT
 * CONTAIN THE CODE.
================================================== */

function getGenericInfo(
    code,
    description
) {


    const prefix =
        code.charAt(0);


    let severity =
        "Medium";


    let symptoms = [

        "Check Engine or warning indicator may be illuminated",
        "Vehicle symptoms depend on the affected system",
        "Performance or fuel economy may be affected"

    ];


    let causes = [

        "Sensor or actuator fault",
        "Damaged wiring or connector",
        "Electrical supply problem",
        "Mechanical problem",
        "Underlying fault in a related system"

    ];


    let checks = [

        "Read all stored and pending fault codes",
        "Inspect related wiring and connectors",
        "Check relevant live data",
        "Check electrical power and grounds",
        "Verify the fault before replacing components"

    ];


    let repairs = [

        "Repair or replace the faulty component after confirmation",
        "Repair damaged wiring or connectors",
        "Correct any underlying mechanical or electrical fault"

    ];


    let tip =
        "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone.";


    const text =
        String(

        ).toLowerCase();



    /*

     */

    if (
        text.includes("misfire") ||

    ) {

        severity = "High";


        symptoms = [

            "Ignition coil problem",

            "Low compression",

            "Fuel delivery problem"

        ];


        checks = [

            "Check ignition components",

            "Check injector operation",
            "Check fuel trims",
            "Perform compression testing if necessary"

        ];


        repairs = [

            "Replace faulty ignition components",
            "Repair fuel delivery problems",
            "Repair vacuum or intake leaks",
            "Repair mechanical faults"

        ];


        tip =
            "A severe or flashing misfire can damage the catalytic converter. Avoid prolonged driving until the cause is identified.";

    }

     */

    else if (

    ) {


        symptoms = [

            "Check Engine light",
            "Possible increased fuel consumption",
            "Rough running or hesitation",
            "Increased emissions"

        ];


        causes = [

            "Faulty oxygen sensor",
            "Damaged sensor wiring or connector",
            "Exhaust leak",
            "Vacuum or intake leak",
            "Fuel mixture problem"

        ];


        checks = [

            "Inspect sensor wiring and connector",
            "Check for exhaust leaks near the sensor",
            "Compare live O2 sensor readings",
            "Check fuel trims",
            "Verify related intake and fuel-system faults"

        ];


        repairs = [

            "Repair damaged wiring",
            "Repair exhaust leaks",
            "Correct air/fuel mixture problems",
            "Replace faulty oxygen sensor"

        ];


        tip =
            "Do not replace the oxygen sensor automatically. Exhaust leaks, wiring faults and incorrect air/fuel mixture can produce similar codes.";

    }



    /*
     * CATALYST
     */

    else if (
        text.includes("catalyst") ||
        text.includes("catalytic converter")
    ) {


        symptoms = [

            "Check Engine light",
            "Increased emissions",
            "Possible loss of performance",
            "Possible increased fuel consumption"

        ];


        causes = [

            "Aged or damaged catalytic converter",
            "Engine misfire",
            "Incorrect fuel mixture",
            "Faulty oxygen sensor",
            "Exhaust leak"

        ];


        checks = [

            "Check for other engine fault codes first",
            "Inspect for exhaust leaks",
            "Check upstream and downstream O2 readings",
            "Check fuel trims",
            "Verify engine operation"

        ];


        repairs = [

            "Repair exhaust leaks",
            "Repair underlying engine faults",
            "Replace faulty oxygen sensor",
            "Replace catalytic converter if confirmed defective"

        ];


        tip =
            "A catalyst code does not automatically mean the catalytic converter needs replacement. Fix the underlying engine problem first.";

    }



    /*
     * TEMPERATURE / COOLANT
     */

    else if (
        text.includes("temperature") ||
        text.includes("coolant")
    ) {


        severity = "High";


        symptoms = [

            "Engine overheating or incorrect temperature",
            "Cooling fan operating abnormally",
            "Check Engine light",
            "Poor fuel economy"

        ];


        causes = [

            "Faulty temperature sensor",
            "Damaged wiring",
            "Low coolant level",
            "Thermostat problem",
            "Cooling system fault"

        ];

            "Check coolant level",

    /*

     */

    else if (

    ) {

        symptoms = [

        ];


        causes = [

            "Weak battery",
            "Alternator problem",

            "Incorrect system voltage"

        ];


        checks = [

            "Measure battery voltage",
            "Check charging voltage with engine running",
            "Inspect battery terminals",

        ];

    /*
     * U-CODES
     */

    if (
        prefix === "U"
    ) {

        ];

        ];


        checks = [

            "Check module power and grounds",
            "Inspect CAN wiring",
            "Scan all control modules",
            "Look for additional communication codes"

        ];

    }



    return {

        system:
            getSystem(
                code,
                description
            ),

        severity,

        symptoms,

        causes,

        checks,

    };

}



/* ==================================================
   SYSTEM
================================================== */

function getSystem(
    code,
    description
) {


    const prefix =
        code.charAt(0);


    const second =
        parseInt(
            code.charAt(1),
            10
        );


    let system =
        "Vehicle Diagnostic System";


    const text =
        String(
            description || ""
        ).toLowerCase();



    if (
        prefix === "P"
    ) {

        system =
            "Powertrain";

        if (
            second === 0
        ) {

            system =
                "Powertrain — Generic OBD-II";

        }

        else if (
            second === 1
        ) {

            system =
                "Powertrain — Manufacturer Specific";

        }

        else if (
            second === 2
        ) {

            system =
                "Powertrain — Fuel & Air / Injection";

        }

        else if (
            second === 3
        ) {

            system =
                "Powertrain — Ignition / Misfire";

        }

    }


    else if (
        prefix === "B"
    ) {

        system =
            "Body / Comfort / Safety Systems";

    }


    else if (
        prefix === "C"
    ) {

        system =
            "Chassis / ABS / Suspension / Steering";

    }


    else if (
        prefix === "U"
    ) {

        system =
            "Network / Communication System";

    }



    if (
        text.includes("oxygen sensor") ||
        text.includes("o2 sensor")
    ) {

        system =
            "Engine Management — Oxygen Sensor";

    }


    else if (
        text.includes("catalyst") ||
        text.includes("catalytic converter")
    ) {

        system =
            "Emissions — Catalytic Converter";

    }


    else if (
        text.includes("misfire") ||
        text.includes("cylinder")
    ) {

        system =
            "Engine — Ignition / Misfire";

    }


    else if (
        text.includes("temperature") ||
        text.includes("coolant")
    ) {

        system =
            "Engine Cooling System";

    }


    else if (
        text.includes("voltage") ||
        text.includes("battery") ||
        text.includes("charging")
    ) {

        system =
            "Electrical / Charging System";

    }


    return system;

}



/* ==================================================
   NORMALIZE ARRAY
================================================== */

function normalizeArray(value) {

    if (
        Array.isArray(value)
    ) {

        return value
            .filter(
                item =>
                    item !== null &&
                    item !== undefined &&
                    String(item).trim() !== ""
            )
            .map(
                item =>
                    String(item)
            );

    }


    /*
     * Also allow a single string
     */

    if (
        typeof value === "string" &&
        value.trim() !== ""
    ) {

        return [
            value
        ];

    }


    return [];

}



/* ==================================================
   DECODE
================================================== */

function decodeCode() {


    const rawInput =
        document
            .getElementById("codeInput")
            .value
            .trim();


    const result =
        document
            .getElementById("result");


    if (!rawInput) {

        result.innerHTML = `

            <div class="error">

                <h2>
                    Enter an OBD-II code
                </h2>

                <p>
                    Example: P0420
                </p>

            </div>

        `;

        return;

    }



    if (!databaseReady) {

        result.innerHTML = `

            <div class="loading">

                Loading diagnostic database...

            </div>

        `;

        return;

    }



    /*
     * ==============================================
     * NORMALIZE USER INPUT
     * ==============================================
     */

    const input =
        normalizeCode(
            rawInput
        );


    document
        .getElementById("codeInput")
        .value =
        input;



    /*
     * ==============================================
     * FIND DATA
     * ==============================================
     */

    const diagnosticCode =
        findCodeInDiagnosticDatabase(
            input
        );


    const mainCode =
        findCodeInMainDatabase(
            input
        );



    /*
     * ==============================================
     * DESCRIPTION
     * ==============================================
     */

    const description =
        getDescription(
            mainCode,
            diagnosticCode
        );



    /*
     * ==============================================
     * CRITICAL LOGIC
     *
     * IF Diagnostic.json CONTAINS THE CODE:
     *
     * USE ITS DATA.
     *
     * DO NOT USE GENERIC DATA.
     * ==============================================
     */

    let info;


    if (
        diagnosticCode
    ) {


        console.log(
            "Using SPECIFIC Diagnostic.json data for:",
            input
        );


        info = {

            system:
                diagnosticCode.system ||
                getSystem(
                    input,
                    description
                ),


            severity:
                diagnosticCode.severity ||
                "Medium",


            symptoms:
                normalizeArray(
                    diagnosticCode.symptoms
                ),


            causes:
                normalizeArray(
                    diagnosticCode.causes
                ),


            checks:
                normalizeArray(
                    diagnosticCode.diagnostic
                ),


            repairs:
                normalizeArray(
                    diagnosticCode.repairs
                ),


            tip:
                diagnosticCode.tip ||
                "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone."

        };


    } else {


        console.log(
            "No specific Diagnostic.json data for:",
            input
        );


        /*
         * ONLY NOW use generic information.
         */

        info =
            getGenericInfo(
                input,
                description
            );

    }



    /*
     * ==============================================
     * IF SPECIFIC DATA HAS AN EMPTY ARRAY
     *
     * We deliberately DO NOT replace it with
     * generic data.
     *
     * This keeps Diagnostic.json authoritative.
     * ==============================================
     */



    /*
     * ==============================================
     * CREATE HTML
     * ==============================================
     */

    const symptomsHTML =
        info.symptoms.length

            ?

            info.symptoms
                .map(
                    item =>
                        `<li>${escapeHTML(item)}</li>`
                )
                .join("")

            :

            "<li>No specific symptoms available.</li>";


    const causesHTML =
        info.causes.length

            ?

            info.causes
                .map(
                    item =>
                        `<li>${escapeHTML(item)}</li>`
                )
                .join("")

            :

            "<li>No specific causes available.</li>";


    const checksHTML =
        info.checks.length

            ?

            info.checks
                .map(
                    item =>
                        `<li>${escapeHTML(item)}</li>`
                )
                .join("")

            :

            "<li>No specific diagnostic checks available.</li>";


    const repairsHTML =
        info.repairs.length

            ?

            info.repairs
                .map(
                    item =>
                        `<li>${escapeHTML(item)}</li>`
                )
                .join("")

            :

            "<li>No specific repair information available.</li>";



    /*
     * ==============================================
     * DISPLAY
     * ==============================================
     */

    result.innerHTML = `

        <div
            class="result-container"
            style="display:block"
        >


            <div class="result-header">


                <div class="code">

                    ${escapeHTML(input)}

                </div>


                <div class="description">

                    ${escapeHTML(description)}

                </div>


                <div class="badges">


                    <div class="badge">

                        ${escapeHTML(
                            info.system
                        )}

                    </div>


                    <div class="severity">

                        Severity:
                        ${escapeHTML(
                            info.severity
                        )}

                    </div>


                </div>


            </div>



            <div class="info-grid">


                <!-- COMMON SYMPTOMS -->

                <div class="info-card">

                    <h3>
                        ⚠️ Common Symptoms
                    </h3>

                    <ul>

                        ${symptomsHTML}

                    </ul>

                </div>



                <!-- POSSIBLE CAUSES -->

                <div class="info-card">

                    <h3>
                        🔍 Possible Causes
                    </h3>

                    <ul>

                        ${causesHTML}

                    </ul>

                </div>



                <!-- RECOMMENDED CHECKS -->

                <div class="info-card">

                    <h3>
                        🛠️ Recommended Checks
                    </h3>

                    <ul>

                        ${checksHTML}

                    </ul>

                </div>



                <!-- RECOMMENDED REPAIRS -->

                <div class="info-card">

                    <h3>
                        🔧 Recommended Repairs
                    </h3>

                    <ul>

                        ${repairsHTML}

                    </ul>

                </div>



                <!-- DIAGNOSTIC TIP -->

                <div class="info-card full">

                    <h3>
                        💡 Diagnostic Tip
                    </h3>

                    <p>

                        ${escapeHTML(
                            info.tip
                        )}

                    </p>

                </div>


            </div>


        </div>

    `;

}



/* ==================================================
   SECURITY
================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==================================================
   ENTER KEY
================================================== */

document
    .getElementById("codeInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                decodeCode();

            }

        }
    );



/* ==================================================
   START
================================================== */

loadDatabase();


</script>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBD Decoder — AutoDecode</title>

<meta
    name="description"
    content="Decode OBD-II diagnostic trouble codes with AutoDecode."
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d10;
    color: #f2f4f7;
    min-height: 100vh;
}

header {
    height: 72px;
    border-bottom: 1px solid #20242a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #4da3ff;
}

header a {
    color: #9da5b0;
    text-decoration: none;
    font-size: 14px;
}

header a:hover {
    color: white;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 60px 20px 90px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 35px;
}

input {
    flex: 1;
    height: 60px;
    background: #14181d;
    border: 1px solid #303842;
    border-radius: 10px;
    color: white;
    padding: 0 18px;
    font-size: 18px;
    outline: none;
}

input:focus {
    border-color: #4da3ff;
}

button {
    border: none;
    background: #4da3ff;
    padding: 0 28px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #78baff;
}

.result-container {
    display: block;
}

.result-header {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 30px;
    margin-bottom: 15px;
}

.code {
    color: #4da3ff;
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 12px;
}

.description {
    color: #d1d7de;
    font-size: 20px;
    line-height: 1.55;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}

.badge {
    background: #1b222a;
    border: 1px solid #303842;
    color: #aeb7c2;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.severity {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    background: #1b222a;
    color: #d0d6dd;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.info-card {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 25px;
}

.info-card.full {
    grid-column: 1 / -1;
}

.info-card h3 {
    font-size: 15px;
    margin-bottom: 15px;
    color: #ffffff;
}

.info-card p {
    color: #9da7b2;
    font-size: 14px;
    line-height: 1.7;
}

.info-card ul {
    padding-left: 20px;
    color: #9da7b2;
}

.info-card li {
    margin-bottom: 9px;
    font-size: 14px;
    line-height: 1.5;
}

.error {
    text-align: center;
    color: #8b949e;
    padding: 40px;
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
}

.error h2 {
    color: #f2f4f7;
    margin-bottom: 10px;
}

.loading {
    text-align: center;
    color: #8b949e;
    padding: 40px;
}

@media(max-width:650px) {

    .container {
        padding-top: 40px;
    }

    .search {
        flex-direction: column;
    }

    button {
        height: 52px;
    }

    .code {
        font-size: 38px;
    }

    .description {
        font-size: 17px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

    .info-card.full {
        grid-column: auto;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a href="index.html">
        ← Home
    </a>

</header>


<div class="container">


    <div class="search">

        <input
            id="codeInput"
            type="text"
            placeholder="Enter OBD-II code (e.g. P0420)"
            autocomplete="off"
        >

        <button
            id="decodeButton"
            type="button"
        >
            Decode
        </button>

    </div>


    <div id="result">

        <div class="loading">
            Loading OBD database...
        </div>

    </div>


</div>


<script>


/* ==================================================
   DATABASE VARIABLES
================================================== */

let codesDatabase = [];

let diagnosticDatabase = {};


/* ==================================================
   NORMALIZE CODE
================================================== */

function normalizeCode(value) {

    let code = String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/-/g, "");


    /*
     * 0001 -> P0001
     */

    if (/^\d{1,4}$/.test(code)) {

        return "P" + code.padStart(4, "0");

    }


    /*
     * p1 -> P0001
     * p01 -> P0001
     * p001 -> P0001
     */

    if (/^[PBCU]\d{1,3}$/.test(code)) {

        return (
            code.charAt(0) +
            code.substring(1).padStart(4, "0")
        );

    }


    /*
     * P0001
     * B0001
     * C0001
     * U0001
     */

    if (/^[PBCU]\d{4}$/.test(code)) {

        return code;

    }


    return code;

}


/* ==================================================
   LOAD CODES.JSON
================================================== */

async function loadCodes() {

    const response =
        await fetch(
            "./Database/Codes.json",
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "Could not load Codes.json"
        );

    }


    codesDatabase =
        await response.json();

}


/* ==================================================
   LOAD DIAGNOSTIC.JSON
================================================== */

async function loadDiagnostic() {

    const response =
        await fetch(
            "./Database/Diagnostic.json",
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "Could not load Diagnostic.json"
        );

    }


    diagnosticDatabase =
        await response.json();

}


/* ==================================================
   FIND DESCRIPTION
================================================== */

function findDescription(code) {

    /*
     * Codes.json is normally:
     *
     * [
     *   {
     *      "Code": "P0001",
     *      "Description": "..."
     *   }
     * ]
     */


    if (
        Array.isArray(codesDatabase)
    ) {

        const found =
            codesDatabase.find(
                item => {

                    if (
                        !item ||
                        !item.Code
                    ) {

                        return false;

                    }


                    return (
                        normalizeCode(
                            item.Code
                        ) === code
                    );

                }
            );


        if (
            found &&
            found.Description
        ) {

            return found.Description;

        }

    }


    /*
     * Also support object format
     */

    if (
        codesDatabase &&
        typeof codesDatabase === "object" &&
        !Array.isArray(codesDatabase)
    ) {

        for (
            const key of Object.keys(
                codesDatabase
            )
        ) {

            if (
                normalizeCode(key) === code
            ) {

                const item =
                    codesDatabase[key];


                if (
                    typeof item === "string"
                ) {

                    return item;

                }


                if (
                    item &&
                    item.Description
                ) {

                    return item.Description;

                }

            }

        }

    }


    return "No description available.";

}


/* ==================================================
   FIND DIAGNOSTIC
================================================== */

function findDiagnostic(code) {

    /*
     * Diagnostic.json has this exact structure:
     *
     * {
     *   "P0001": {
     *      "causes": [],
     *      "symptoms": [],
     *      "diagnostic": [],
     *      "repairs": [],
     *      "severity": "High"
     *   }
     * }
     */


    if (
        !diagnosticDatabase ||
        typeof diagnosticDatabase !== "object"
    ) {

        return null;

    }


    /*
     * FIRST:
     * exact key
     */

    if (
        Object.prototype.hasOwnProperty.call(
            diagnosticDatabase,
            code
        )
    ) {

        return diagnosticDatabase[code];

    }


    /*
     * SECOND:
     * case-insensitive key
     */

    const wanted =
        String(code)
            .trim()
            .toUpperCase();


    const keys =
        Object.keys(
            diagnosticDatabase
        );


    for (
        const key of keys
    ) {

        if (
            String(key)
                .trim()
                .toUpperCase() === wanted
        ) {

            return diagnosticDatabase[key];

        }

    }


    return null;

}


/* ==================================================
   GENERIC DATA
================================================== */

function genericInfo(code) {

    let system =
        "Vehicle Diagnostic System";

    let severity =
        "Medium";


    if (
        code.startsWith("P")
    ) {

        system =
            "Powertrain";

    }

    else if (
        code.startsWith("B")
    ) {

        system =
            "Body / Comfort / Safety Systems";

    }

    else if (
        code.startsWith("C")
    ) {

        system =
            "Chassis / ABS / Suspension / Steering";

    }

    else if (
        code.startsWith("U")
    ) {

        system =
            "Network / Communication System";

        severity =
            "High";

    }


    return {

        system: system,

        severity: severity,

        symptoms: [

            "Check Engine or warning indicator may be illuminated",

            "Vehicle symptoms depend on the affected system",

            "Performance or fuel economy may be affected"

        ],

        causes: [

            "Sensor or actuator fault",

            "Damaged wiring or connector",

            "Electrical supply problem",

            "Mechanical problem",

            "Underlying fault in a related system"

        ],

        diagnostic: [

            "Read all stored and pending fault codes",

            "Inspect related wiring and connectors",

            "Check relevant live data",

            "Check electrical power and grounds",

            "Verify the fault before replacing components"

        ],

        repairs: [

            "Repair damaged wiring or connectors",

            "Repair or replace the confirmed faulty component",

            "Correct any underlying mechanical or electrical fault"

        ],

        tip:
            "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone."

    };

}


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* ==================================================
   LIST BUILDER
================================================== */

function buildList(items) {

    if (
        !Array.isArray(items) ||
        items.length === 0
    ) {

        return `
            <li>
                No specific information available.
            </li>
        `;

    }


    return items
        .map(
            item =>
                `<li>${escapeHTML(item)}</li>`
        )
        .join("");

}


/* ==================================================
   DECODE CODE
================================================== */

function decodeCode() {

    const input =
        document
            .getElementById(
                "codeInput"
            )
            .value;


    const code =
        normalizeCode(input);


    const result =
        document
            .getElementById(
                "result"
            );


    if (!code) {

        result.innerHTML = `

            <div class="error">

                <h2>
                    Enter an OBD-II code
                </h2>

                <p>
                    Example: P0420
                </p>

            </div>

        `;

        return;

    }


    /*
     * Normalize input
     */

    document
        .getElementById(
            "codeInput"
        )
        .value = code;


    /*
     * Description
     */

    const description =
        findDescription(code);


    /*
     * =================================================
     *
     * DIAGNOSTIC.JSON HAS ABSOLUTE PRIORITY
     *
     * =================================================
     */

    const diagnostic =
        findDiagnostic(code);


    let info;


    if (
        diagnostic
    ) {

        /*
         * SPECIFIC DATABASE ENTRY
         */

        info = {

            system:
                diagnostic.system ||
                "Vehicle Diagnostic System",

            severity:
                diagnostic.severity ||
                "Medium",

            symptoms:
                Array.isArray(
                    diagnostic.symptoms
                )
                    ? diagnostic.symptoms
                    : [],

            causes:
                Array.isArray(
                    diagnostic.causes
                )
                    ? diagnostic.causes
                    : [],

            diagnostic:
                Array.isArray(
                    diagnostic.diagnostic
                )
                    ? diagnostic.diagnostic
                    : [],

            repairs:
                Array.isArray(
                    diagnostic.repairs
                )
                    ? diagnostic.repairs
                    : [],

            tip:
                diagnostic.tip ||
                "Use the fault code together with the vehicle's symptoms and live diagnostic data. Do not replace parts based on the code alone."

        };

    }

    else {

        /*
         * ONLY USE GENERIC DATA
         * IF CODE DOES NOT EXIST
         * IN Diagnostic.json
         */

        info =
            genericInfo(code);

    }


    /*
     * DISPLAY RESULT
     */

    result.innerHTML = `

        <div class="result-container">


            <div class="result-header">


                <div class="code">

                    ${escapeHTML(code)}

                </div>


                <div class="description">

                    ${escapeHTML(
                        description
                    )}

                </div>


                <div class="badges">


                    <div class="badge">

                        ${escapeHTML(
                            info.system
                        )}

                    </div>


                    <div class="severity">

                        Severity:
                        ${escapeHTML(
                            info.severity
                        )}

                    </div>


                </div>


            </div>


            <div class="info-grid">


                <div class="info-card">

                    <h3>
                        ⚠️ Common Symptoms
                    </h3>

                    <ul>

                        ${buildList(
                            info.symptoms
                        )}

                    </ul>

                </div>


                <div class="info-card">

                    <h3>
                        🔍 Possible Causes
                    </h3>

                    <ul>

                        ${buildList(
                            info.causes
                        )}

                    </ul>

                </div>


                <div class="info-card">

                    <h3>
                        🛠️ Recommended Checks
                    </h3>

                    <ul>

                        ${buildList(
                            info.diagnostic
                        )}

                    </ul>

                </div>


                <div class="info-card">

                    <h3>
                        🔧 Recommended Repairs
                    </h3>

                    <ul>

                        ${buildList(
                            info.repairs
                        )}

                    </ul>

                </div>


                <div class="info-card full">

                    <h3>
                        💡 Diagnostic Tip
                    </h3>

                    <p>

                        ${escapeHTML(
                            info.tip
                        )}

                    </p>

                </div>


            </div>


        </div>

    `;

}


/* ==================================================
   INITIALIZATION
================================================== */

async function initialize() {

    const result =
        document.getElementById(
            "result"
        );


    try {

        /*
         * Load both databases.
         */

        await Promise.all([

            loadCodes(),

            loadDiagnostic()

        ]);


        /*
         * Get code from URL.
         *
         * Example:
         * obd.html?code=P0001
         */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const urlCode =
            params.get("code");


        if (
            urlCode
        ) {

            document
                .getElementById(
                    "codeInput"
                )
                .value =
                normalizeCode(
                    urlCode
                );


            decodeCode();

        }

        else {

            result.innerHTML = `

                <div class="loading">

                    OBD database loaded.
                    Enter a code above.

                </div>

            `;

        }

    }

    catch(error) {

        console.error(
            "Database error:",
            error
        );


        result.innerHTML = `

            <div class="error">

                <h2>
                    Database unavailable
                </h2>

                <p>
                    Could not load the OBD database.
                </p>

            </div>

        `;

    }

}


/* ==================================================
   BUTTON
================================================== */

document
    .getElementById(
        "decodeButton"
    )
    .addEventListener(
        "click",
        decodeCode
    );


/* ==================================================
   ENTER KEY
================================================== */

document
    .getElementById(
        "codeInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                decodeCode();

            }

        }
    );


/* ==================================================
   START
================================================== */

initialize();

</script>

</body>

</html>

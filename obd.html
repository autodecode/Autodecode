<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBD Decoder — AutoDecode</title>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d10;
    color: #f2f4f7;
    min-height: 100vh;
}

header {
    height: 72px;
    border-bottom: 1px solid #20242a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.logo span {
    color: #4da3ff;
}

header a {
    color: #9da5b0;
    text-decoration: none;
    font-size: 14px;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 55px 20px 80px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

input {
    flex: 1;
    height: 58px;
    background: #14181d;
    border: 1px solid #303842;
    border-radius: 10px;
    color: white;
    padding: 0 18px;
    font-size: 18px;
    outline: none;
}

input:focus {
    border-color: #4da3ff;
}

button {
    height: 58px;
    border: none;
    background: #4da3ff;
    padding: 0 28px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #78baff;
}

.result-header {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 30px;
    margin-bottom: 15px;
}

.code {
    color: #4da3ff;
    font-size: 44px;
    font-weight: 800;
    margin-bottom: 10px;
}

.description {
    color: #d1d7de;
    font-size: 20px;
    line-height: 1.5;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.badge {
    display: inline-block;
    background: #1b222a;
    border: 1px solid #303842;
    color: #c5ccd4;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 25px;
}

.card.full {
    grid-column: 1 / -1;
}

.card h3 {
    font-size: 15px;
    margin-bottom: 15px;
}

.card p,
.card li {
    color: #9da7b2;
    font-size: 14px;
    line-height: 1.6;
}

.card ul {
    padding-left: 20px;
}

.card li {
    margin-bottom: 9px;
}

.error,
.loading {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 35px;
    text-align: center;
}

.error h2 {
    margin-bottom: 10px;
}

@media(max-width:650px) {

    .container {
        padding-top: 35px;
    }

    .search {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .code {
        font-size: 36px;
    }

    .description {
        font-size: 18px;
    }
}

</style>

</head>


<body>


<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a href="index.html">
        ← Home
    </a>

</header>


<div class="container">


    <div class="search">

        <input
            id="codeInput"
            type="text"
            placeholder="Enter OBD-II code (e.g. P0001)"
            autocomplete="off"
        >

        <button onclick="decodeCode()">
            Decode
        </button>

    </div>


    <div id="result">

        <div class="loading">
            Enter an OBD-II code.
        </div>

    </div>


</div>


<script>


/* =========================================
   NORMALIZE CODE
========================================= */

function normalizeCode(value) {

    let code = String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "");


    /*
       0001 → P0001
       001  → P0001
       p001 → P0001
    */

    if (/^\d+$/.test(code)) {

        code =
            "P" +
            code.padStart(4, "0");

    }


    else if (/^[PBCU]\d+$/.test(code)) {

        code =
            code.charAt(0) +
            code.substring(1).padStart(4, "0");

    }


    return code;

}


/* =========================================
   DETERMINE YAML FILE
========================================= */

function getDatabaseFile(code) {

    const prefix =
        code.charAt(0);

    const firstDigit =
        code.charAt(1);


    return (
        "data/generic/" +
        prefix +
        firstDigit +
        "xxx_enriched.yaml"
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   CONVERT VALUE TO LIST
========================================= */

function toArray(value) {

    if (Array.isArray(value)) {

        return value;

    }

    if (value === undefined || value === null) {

        return [];

    }

    return [value];

}


/* =========================================
   CREATE LIST HTML
========================================= */

function makeList(value) {

    const items =
        toArray(value);


    if (!items.length) {

        return `
            <li>
                No information available.
            </li>
        `;

    }


    return items
        .map(function(item) {

            /*
               YAML can contain objects.
               Convert them safely to text.
            */

            if (
                typeof item === "object"
            ) {

                return `
                    <li>
                        ${escapeHTML(
                            JSON.stringify(item)
                        )}
                    </li>
                `;

            }


            return `
                <li>
                    ${escapeHTML(item)}
                </li>
            `;

        })
        .join("");

}


/* =========================================
   FIND CODE INSIDE YAML
========================================= */

function findCode(data, code) {

    if (!data) {

        return null;

    }


    /*
       Case 1:
       YAML root is an object:

       P0001:
         ...

    */

    if (
        typeof data === "object" &&
        !Array.isArray(data)
    ) {

        if (data[code]) {

            return data[code];

        }


        /*
           Case-insensitive search
        */

        const keys =
            Object.keys(data);


        for (const key of keys) {

            if (
                String(key).toUpperCase() === code
            ) {

                return data[key];

            }

        }

    }


    /*
       Case 2:
       YAML contains an array
       of objects.

    */

    if (Array.isArray(data)) {

        for (const item of data) {

            if (!item) continue;


            if (
                item.code &&
                String(item.code)
                    .toUpperCase() === code
            ) {

                return item;

            }


            if (
                item.Code &&
                String(item.Code)
                    .toUpperCase() === code
            ) {

                return item;

            }

        }

    }


    return null;

}


/* =========================================
   FIND DESCRIPTION
========================================= */

function getDescription(item) {

    if (!item) {

        return "OBD-II Diagnostic Trouble Code";

    }


    return (
        item.description ||
        item.Description ||
        item.name ||
        item.Name ||
        item.title ||
        item.Title ||
        "OBD-II Diagnostic Trouble Code"
    );

}


/* =========================================
   DECODE
========================================= */

async function decodeCode() {

    const input =
        document
            .getElementById("codeInput")
            .value;


    const code =
        normalizeCode(input);


    const result =
        document
            .getElementById("result");


    if (!code) {

        result.innerHTML = `

            <div class="error">

                <h2>
                    Enter an OBD-II code
                </h2>

            </div>

        `;

        return;

    }


    document
        .getElementById("codeInput")
        .value = code;


    const databaseFile =
        getDatabaseFile(code);


    result.innerHTML = `

        <div class="loading">
            Loading ${escapeHTML(code)}...
        </div>

    `;


    try {

        /*
           Load the appropriate YAML file.
        */

        const response =
            await fetch(databaseFile);


        if (!response.ok) {

            throw new Error(
                "Could not load " +
                databaseFile +
                " (" +
                response.status +
                ")"
            );

        }


        const yamlText =
            await response.text();


        /*
           Parse YAML.
        */

        const data =
            jsyaml.load(yamlText);


        /*
           Find exact DTC.
        */

        const item =
            findCode(
                data,
                code
            );


        if (!item) {

            result.innerHTML = `

                <div class="error">

                    <h2>
                        ${escapeHTML(code)}
                    </h2>

                    <p>
                        Code not found in
                        ${escapeHTML(databaseFile)}
                    </p>

                </div>

            `;

            return;

        }


        /*
           Extract fields.
        */

        const description =
            getDescription(item);


        const symptoms =
            item.symptoms ||
            item.Symptoms ||
            item.common_symptoms ||
            [];


        const causes =
            item.causes ||
            item.Causes ||
            [];


        const diagnostic =
            item.diagnostic ||
            item.diagnostics ||
            item.Diagnostic ||
            item.Diagnosis ||
            [];


        const repairs =
            item.repairs ||
            item.repair ||
            item.Repairs ||
            [];


        const severity =
            item.severity ||
            item.Severity ||
            "Not specified";


        const system =
            item.system ||
            item.System ||
            item.category ||
            item.Category ||
            "";


        /*
           DISPLAY
        */

        result.innerHTML = `

            <div class="result-header">

                <div class="code">
                    ${escapeHTML(code)}
                </div>

                <div class="description">
                    ${escapeHTML(description)}
                </div>


                <div class="badges">

                    <span class="badge">
                        Severity:
                        ${escapeHTML(severity)}
                    </span>

                    ${
                        system
                        ?
                        `
                        <span class="badge">
                            ${escapeHTML(system)}
                        </span>
                        `
                        :
                        ""
                    }

                </div>

            </div>


            <div class="grid">


                <div class="card">

                    <h3>
                        ⚠️ Common Symptoms
                    </h3>

                    <ul>
                        ${makeList(symptoms)}
                    </ul>

                </div>


                <div class="card">

                    <h3>
                        🔍 Possible Causes
                    </h3>

                    <ul>
                        ${makeList(causes)}
                    </ul>

                </div>


                <div class="card">

                    <h3>
                        🛠️ Recommended Checks
                    </h3>

                    <ul>
                        ${makeList(diagnostic)}
                    </ul>

                </div>


                <div class="card">

                    <h3>
                        🔧 Recommended Repairs
                    </h3>

                    <ul>
                        ${makeList(repairs)}
                    </ul>

                </div>


            </div>

        `;


    }

    catch(error) {

        console.error(error);


        result.innerHTML = `

            <div class="error">

                <h2>
                    Database error
                </h2>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}


/* =========================================
   ENTER KEY
========================================= */

document
    .getElementById("codeInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                decodeCode();

            }

        }
    );


/* =========================================
   URL CODE
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const urlCode =
    params.get("code");


if (urlCode) {

    document
        .getElementById("codeInput")
        .value =
        normalizeCode(urlCode);

    decodeCode();

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBD Decoder — AutoDecode</title>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d10;
    color: #f2f4f7;
    min-height: 100vh;
}

header {
    height: 72px;
    border-bottom: 1px solid #20242a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.logo span {
    color: #4da3ff;
}

header a {
    color: #9da5b0;
    text-decoration: none;
    font-size: 14px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 45px 20px 80px;
}

.search {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

input {
    flex: 1;
    height: 58px;
    background: #14181d;
    border: 1px solid #303842;
    border-radius: 10px;
    color: white;
    padding: 0 18px;
    font-size: 18px;
    outline: none;
}

input:focus {
    border-color: #4da3ff;
}

button {
    height: 58px;
    border: none;
    background: #4da3ff;
    padding: 0 28px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #78baff;
}

.result-header {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 30px;
    margin-bottom: 15px;
}

.code {
    color: #4da3ff;
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 8px;
}

.title {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.4;
}

.description {
    color: #aeb7c1;
    font-size: 15px;
    line-height: 1.7;
    margin-top: 18px;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.badge {
    background: #1b222a;
    border: 1px solid #303842;
    color: #c5ccd4;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 25px;
}

.card.full {
    grid-column: 1 / -1;
}

.card h3 {
    font-size: 16px;
    margin-bottom: 18px;
}

.card ul {
    padding-left: 20px;
}

.card li {
    color: #aeb7c1;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 10px;
}

.description-box {
    color: #aeb7c1;
    font-size: 14px;
    line-height: 1.7;
}

.cause {
    margin-bottom: 14px;
}

.likelihood {
    display: inline-block;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 5px;
    margin-right: 6px;
    background: #252c34;
}

.cause-label {
    color: #cbd2da;
    font-size: 14px;
}

.component {
    display: inline-block;
    background: #1b222a;
    border: 1px solid #303842;
    color: #cbd2da;
    padding: 7px 10px;
    border-radius: 7px;
    margin: 0 5px 7px 0;
    font-size: 12px;
}

.repair-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.repair-item {
    background: #171c22;
    border-radius: 9px;
    padding: 14px;
}

.repair-label {
    color: #7f8995;
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.repair-value {
    color: #e3e7eb;
    font-size: 14px;
    font-weight: 600;
}

.source {
    color: #8d98a4;
    font-size: 12px;
    word-break: break-all;
    margin-bottom: 7px;
}

.error,
.loading {
    background: #12161b;
    border: 1px solid #252c34;
    border-radius: 14px;
    padding: 35px;
    text-align: center;
}

.error h2 {
    margin-bottom: 10px;
}

@media(max-width:650px) {

    .container {
        padding-top: 30px;
    }

    .search {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .card.full {
        grid-column: auto;
    }

    .code {
        font-size: 36px;
    }

    .title {
        font-size: 19px;
    }

    .repair-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        Auto<span>Decode</span>
    </div>

    <a href="index.html">
        ← Home
    </a>

</header>


<div class="container">


    <div class="search">

        <input
            id="codeInput"
            type="text"
            placeholder="Enter OBD-II code (e.g. P0001)"
            autocomplete="off"
            spellcheck="false"
        >

        <button onclick="decodeCode()">
            Decode
        </button>

    </div>


    <div id="result">

        <div class="loading">
            Enter an OBD-II code.
        </div>

    </div>


</div>


<script>


/* =====================================================
   NORMALIZE CODE
===================================================== */

function normalizeCode(value) {

    let code = String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "");


    /*
       0001 → P0001
       001 → P0001
    */

    if (/^\d+$/.test(code)) {

        code =
            "P" +
            code.padStart(4, "0");

    }


    /*
       p001 → P0001
       b1   → B0001
    */

    else if (/^[PBCU]\d+$/.test(code)) {

        code =
            code.charAt(0) +
            code.substring(1).padStart(4, "0");

    }


    return code;

}


/* =====================================================
   DETERMINE FILE
===================================================== */

function getDatabaseFile(code) {

    const prefix =
        code.charAt(0).toUpperCase();

    const digit =
        code.charAt(1);


    return (
        "data/generic/" +
        prefix +
        digit +
        "xxx_enriched.yaml"
    );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   FIND DTC
===================================================== */

function findDTC(data, code) {

    /*
       OBDex enriched YAML is an ARRAY:

       - code: B0001
         category: body
         title:
           en: ...
    */

    if (!Array.isArray(data)) {

        return null;

    }


    for (const item of data) {

        if (!item) continue;


        if (
            item.code &&
            String(item.code)
                .trim()
                .toUpperCase() === code
        ) {

            return item;

        }

    }


    return null;

}


/* =====================================================
   ARRAY NORMALIZATION
===================================================== */

function asArray(value) {

    if (Array.isArray(value)) {

        return value;

    }

    if (
        value === undefined ||
        value === null
    ) {

        return [];

    }

    return [value];

}


/* =====================================================
   GET ENGLISH TEXT
===================================================== */

function english(value) {

    if (!value) {

        return "";

    }


    if (
        typeof value === "object" &&
        value.en
    ) {

        return value.en;

    }


    return String(value);

}


/* =====================================================
   SYMPTOMS
===================================================== */

function renderSymptoms(symptoms) {

    const list =
        asArray(symptoms);


    if (!list.length) {

        return `
            <li>
                No symptom information available.
            </li>
        `;

    }


    return list
        .map(function(item) {

            return `
                <li>
                    ${escapeHTML(
                        english(item)
                    )}
                </li>
            `;

        })
        .join("");

}


/* =====================================================
   CAUSES
===================================================== */

function renderCauses(causes) {

    const list =
        asArray(causes);


    if (!list.length) {

        return `
            <div class="description-box">
                No cause information available.
            </div>
        `;

    }


    return list
        .map(function(cause) {

            if (
                typeof cause !== "object"
            ) {

                return `
                    <div class="cause">
                        <span class="cause-label">
                            ${escapeHTML(cause)}
                        </span>
                    </div>
                `;

            }


            const likelihood =
                cause.likelihood || "";


            const label =
                cause.label
                ? english(cause.label)
                : "";


            return `
                <div class="cause">

                    ${
                        likelihood
                        ?
                        `
                        <span class="likelihood">
                            ${escapeHTML(likelihood)}
                        </span>
                        `
                        :
                        ""
                    }

                    <span class="cause-label">
                        ${escapeHTML(label)}
                    </span>

                </div>
            `;

        })
        .join("");

}


/* =====================================================
   COMPONENTS
===================================================== */

function renderComponents(components) {

    const list =
        asArray(components);


    if (!list.length) {

        return `
            <div class="description-box">
                No affected components listed.
            </div>
        `;

    }


    return list
        .map(function(component) {

            return `
                <span class="component">
                    ${escapeHTML(
                        String(component)
                            .replace(/_/g, " ")
                    )}
                </span>
            `;

        })
        .join("");

}


/* =====================================================
   REPAIR
===================================================== */

function renderRepair(repair) {

    if (!repair) {

        return `
            <div class="description-box">
                No repair information available.
            </div>
        `;

    }


    let cost = "Not specified";


    if (
        Array.isArray(
            repair.estimated_cost_eur
        )
    ) {

        cost =
            "€" +
            repair.estimated_cost_eur[0] +
            " – €" +
            repair.estimated_cost_eur[1];

    }


    let hours = "Not specified";


    if (
        Array.isArray(
            repair.estimated_hours
        )
    ) {

        hours =
            repair.estimated_hours[0] +
            " – " +
            repair.estimated_hours[1] +
            " hours";

    }


    const diy =
        repair.diy_possible === true
            ? "Yes"
            : repair.diy_possible === false
                ? "No"
                : "Not specified";


    return `

        <div class="repair-grid">

            <div class="repair-item">

                <div class="repair-label">
                    Difficulty
                </div>

                <div class="repair-value">
                    ${escapeHTML(
                        repair.difficulty ||
                        "Not specified"
                    )}
                </div>

            </div>


            <div class="repair-item">

                <div class="repair-label">
                    DIY Possible
                </div>

                <div class="repair-value">
                    ${diy}
                </div>

            </div>


            <div class="repair-item">

                <div class="repair-label">
                    Estimated Cost
                </div>

                <div class="repair-value">
                    ${escapeHTML(cost)}
                </div>

            </div>


            <div class="repair-item">

                <div class="repair-label">
                    Estimated Time
                </div>

                <div class="repair-value">
                    ${escapeHTML(hours)}
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   FLAGS
===================================================== */

function renderFlags(flags) {

    if (!flags) {

        return "";

    }


    let html = "";


    if (
        flags.mil !== undefined
    ) {

        html += `
            <span class="badge">
                MIL:
                ${flags.mil ? "Yes" : "No"}
            </span>
        `;

    }


    if (
        flags.emissions_relevant !== undefined
    ) {

        html += `
            <span class="badge">
                Emissions:
                ${
                    flags.emissions_relevant
                    ? "Relevant"
                    : "Not relevant"
                }
            </span>
        `;

    }


    return html;

}


/* =====================================================
   REFERENCES
===================================================== */

function renderReferences(references) {

    const list =
        asArray(references);


    if (!list.length) {

        return "";

    }


    return `

        <div class="card full">

            <h3>
                📚 References
            </h3>

            <ul>

                ${
                    list
                        .map(function(ref) {

                            return `
                                <li>
                                    ${escapeHTML(ref)}
                                </li>
                            `;

                        })
                        .join("")
                }

            </ul>

        </div>

    `;

}


/* =====================================================
   SOURCES
===================================================== */

function renderSources(sources) {

    const list =
        asArray(sources);


    if (!list.length) {

        return "";

    }


    return `

        <div class="card full">

            <h3>
                🔗 Sources
            </h3>

            ${
                list
                    .map(function(source) {

                        return `
                            <div class="source">
                                ${escapeHTML(source)}
                            </div>
                        `;

                    })
                    .join("")
            }

        </div>

    `;

}


/* =====================================================
   DECODE
===================================================== */

async function decodeCode() {

    const input =
        document
            .getElementById("codeInput")
            .value;


    const code =
        normalizeCode(input);


    const result =
        document
            .getElementById("result");


    if (!code) {

        result.innerHTML = `

            <div class="error">

                <h2>
                    Enter an OBD-II code
                </h2>

            </div>

        `;

        return;

    }


    document
        .getElementById("codeInput")
        .value = code;


    const file =
        getDatabaseFile(code);


    result.innerHTML = `

        <div class="loading">

            Loading
            <strong>
                ${escapeHTML(code)}
            </strong>...

        </div>

    `;


    try {

        /*
           Load OBDex YAML.
        */

        const response =
            await fetch(file);


        if (!response.ok) {

            throw new Error(
                "Could not load " +
                file +
                " (" +
                response.status +
                ")"
            );

        }


        const yamlText =
            await response.text();


        /*
           Parse YAML.
        */

        const data =
            jsyaml.load(yamlText);


        /*
           Find exact code.
        */

        const dtc =
            findDTC(
                data,
                code
            );


        if (!dtc) {

            result.innerHTML = `

                <div class="error">

                    <h2>
                        ${escapeHTML(code)}
                    </h2>

                    <p>
                        This code was not found
                        in ${escapeHTML(file)}.
                    </p>

                </div>

            `;

            return;

        }


        /* =========================================
           DATA EXTRACTION
        ========================================= */

        const title =
            english(dtc.title);


        const description =
            english(dtc.description);


        const category =
            dtc.category || "";


        const symptoms =
            dtc.symptoms || [];


        const causes =
            dtc.common_causes || [];


        const components =
            dtc.affected_components || [];


        const repair =
            dtc.repair || null;


        const flags =
            dtc.flags || null;


        /* =========================================
           DISPLAY
        ========================================= */

        result.innerHTML = `

            <div class="result-header">

                <div class="code">
                    ${escapeHTML(code)}
                </div>


                <div class="title">
                    ${escapeHTML(title)}
                </div>


                ${
                    description
                    ?
                    `
                    <div class="description">
                        ${escapeHTML(description)}
                    </div>
                    `
                    :
                    ""
                }


                <div class="badges">

                    ${
                        category
                        ?
                        `
                        <span class="badge">
                            ${escapeHTML(category)}
                        </span>
                        `
                        :
                        ""
                    }

                    ${renderFlags(flags)}

                </div>

            </div>


            <div class="grid">


                <div class="card">

                    <h3>
                        ⚠️ Common Symptoms
                    </h3>

                    <ul>
                        ${renderSymptoms(symptoms)}
                    </ul>

                </div>


                <div class="card">

                    <h3>
                        🔍 Common Causes
                    </h3>

                    ${renderCauses(causes)}

                </div>


                <div class="card full">

                    <h3>
                        🔧 Affected Components
                    </h3>

                    <div>
                        ${renderComponents(components)}
                    </div>

                </div>


                <div class="card full">

                    <h3>
                        🛠️ Repair Information
                    </h3>

                    ${renderRepair(repair)}

                </div>


                ${renderReferences(
                    dtc.references
                )}

                ${renderSources(
                    dtc.sources
                )}

            </div>

        `;

    }


    catch(error) {

        console.error(error);


        result.innerHTML = `

            <div class="error">

                <h2>
                    Database error
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =====================================================
   ENTER KEY
===================================================== */

document
    .getElementById("codeInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                decodeCode();

            }

        }
    );


/* =====================================================
   URL SEARCH
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const urlCode =
    params.get("code");


if (urlCode) {

    document
        .getElementById("codeInput")
        .value =
        normalizeCode(urlCode);

    decodeCode();

}

</script>

</body>

</html>
